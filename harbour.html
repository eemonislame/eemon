for(let i=0;i<7;i++){const m=new T.Mesh(blob(.28*sc*(.7+R()*.5),[C('#2f4a26'),'#7b9a3c'],.65),foliage);m.position.set(lean*1.3+(R()-.5)*.6*sc,1*sc+(R()-.2)*.18*sc,(R()-.5)*.6*sc);m.castShadow=m.receiveShadow=true;g.add(m)}scene.add(g)}
[[-2,-6.2,1.25],[-5.6,-5.8,1.1],[-6.1,-1.9,1],[-3.6,-6.1,.9],[-2.3,-1.6,.85],[-6.3,.9,.8],[2.7,-4.9,.85],[-5.6,2.8,.75],[-5.9,4.8,.85],[-3.7,-1.7,.65]].forEach(([x,z,s])=>tree(x,z,s));
for(let i=0,n=0;i<700&&n<85;i++){const x=(R()-.5)*P*.95,z=(R()-.5)*P*.95,h=H(x,z);if(h<WL-.45||h>3.3||pads.some(p=>padK(x,z,p)>.15))continue;
const nearShore=Math.abs(h-WL)<.45,big=R()<.35;if(!nearShore&&R()<.55&&h>1.3){n++;const b=new T.Mesh(blob(.1+R()*.14,[C('#33502a'),'#7a8f3a'],.7),foliage);b.position.set(x,h+.03,z);b.castShadow=true;scene.add(b);continue}
const g=new T.IcosahedronGeometry(.1+R()*(big?.28:.14),3),p=g.attributes.position;for(let j=0;j<p.count;j++){const a=p.getX(j),b=p.getY(j),c=p.getZ(j),k=1+(fbm(a*6+i,b*6+c*5,3)-.5)*.9;p.setXYZ(j,a*k,b*k*.65,c*k)}g.computeVertexNormals();
const m=new T.Mesh(g,new T.MeshStandardMaterial({color:C(['#8e8272','#a09280','#74695d'][R()*3|0]),roughness:.95,bumpMap:bump,bumpScale:4}));m.position.set(x,h-.01,z);m.rotation.set(R()*3,R()*3,R()*3);m.castShadow=m.receiveShadow=true;scene.add(m);n++}
for(let i=0;i<14;i++){const u=i/13,x=-2.7+u*1.1,z=1.9-u*1.1;const s=new T.Mesh(gBox,stone);s.scale.set(.5,.05,.17);const px=lerp(-2.5,-3.7,u),pz=lerp(1.4,.3,u);s.position.set(px,H(px,pz)+.02+u*.0,pz);s.rotation.y=.7+(R()-.5)*.1;scene.add(s)}

/* boats */
function boat(x,z,ry,hex){const g=new T.Group(),sp=new T.SphereGeometry(1,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),p=sp.attributes.position,c=new Float32Array(p.count*3),k=new T.Color(),hc=C(hex),wd=C('#a97b4a');
for(let i=0;i<p.count;i++){const X=p.getX(i),Y=p.getY(i),Z=p.getZ(i),u=Math.abs(X),pin=Math.pow(Math.max(0,1-Math.pow(u,3.2)),.75);p.setXYZ(i,X*.62,Y*.17+u*u*.09,Z*.23*pin);k.copy(Y>-.12?wd:hc).multiplyScalar(.9+R()*.15);c[i*3]=k.r;c[i*3+1]=k.g;c[i*3+2]=k.b}
sp.setAttribute('color',new T.BufferAttribute(c,3));sp.computeVertexNormals();
const hull=new T.Mesh(sp,new T.MeshStandardMaterial({vertexColors:true,roughness:.6,side:T.DoubleSide,bumpMap:bump,bumpScale:1}));hull.castShadow=hull.receiveShadow=true;g.add(hull);
const wm=new T.MeshStandardMaterial({color:wd,roughness:.8});for(const tx_ of[-.2,.2]){const t=new T.Mesh(gBox,wm);t.scale.set(.05,.02,.2);t.position.set(tx_,-.035,0);g.add(t)}
for(const s of[-1,1]){const o=new T.Mesh(new T.CylinderGeometry(.007,.007,.5,6).rotateX(Math.PI/2),wm);o.position.set(.05*s,.03,s*.2);o.rotation.set(0,-s*.5,.1);g.add(o);const bl=new T.Mesh(gBox,wm);bl.scale.set(.05,.005,.07);bl.position.set(.05*s+s*.0,.0,s*.43);bl.rotation.y=-s*.5;g.add(bl)}
g.scale.setScalar(1.15);g.position.set(x,WL,z);g.rotation.y=ry;g.userData.ph=R()*6;scene.add(g);return g}
const boats=[[-.2,2.2,.3,'#e8e2d4'],[.9,1.4,-.2,'#a9743f'],[2.4,2.3,.5,'#2d5d8a'],[1.8,3.7,.1,'#e6e0d0'],[3.9,1,.2,'#a67947'],[4.4,2.9,-.3,'#d9d3c3'],[-.4,3.5,.7,'#e8e2d4']].filter(b=>H(b[0],b[1])<WL-.15).map(b=>boat(...b));
const bu=new T.MeshStandardMaterial({color:C('#e8742a'),roughness:.5});[[1.6,1.1],[3,1.8],[3.3,3.4],[.2,.4]].forEach(([x,z])=>{if(H(x,z)<WL-.1){const m=new T.Mesh(new T.SphereGeometry(.035,12,10),bu);m.position.set(x,WL,z);scene.add(m)}});

/* laundry lines */
[[0,1],[1,2],[4,5],[8,9]].forEach(([i,j])=>{const a=houses[i],b=houses[j],A=new T.Vector3(a.x,a.y+a.h*.75,a.z),Bp=new T.Vector3(b.x,b.y+b.h*.75,b.z),pts=[];
for(let k=0;k<=20;k++){const u=k/20;pts.push(A.clone().lerp(Bp,u).add(new T.Vector3(0,-Math.sin(u*Math.PI)*.07,0)))}
scene.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0x403830})));
for(let k=2;k<19;k+=3){const m=new T.Mesh(new T.PlaneGeometry(.08,.11),new T.MeshStandardMaterial({color:C(['#f1ede4','#9db7d3','#e8cfa5','#f6f4ee'][R()*4|0]),side:T.DoubleSide,roughness:1}));m.position.copy(pts[k]).y-=.06;m.lookAt(m.position.clone().add(new T.Vector3(1,0,1)));scene.add(m)}});

/* birds */
const birds=[],bm_=new T.MeshBasicMaterial({color:0x3a3530,side:T.DoubleSide}),wgm=new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute([0,0,0,.09,0,.03,0,0,.05],3));
for(let i=0;i<16;i++){const g=new T.Group(),l=new T.Mesh(wgm,bm_),r=new T.Mesh(wgm,bm_);r.scale.z=-1;g.add(l,r);g.userData={l,r,a:R()*6.28,rad:1.5+R()*3,h:2.6+R()*2.2,sp:.15+R()*.2,ph:R()*6};scene.add(g);birds.push(g)}

/* camera + loop */
const ctl=new T.OrbitControls(camera,renderer.domElement);ctl.target.set(0,1.3,0);ctl.enablePan=false;ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=.6;ctl.minPolarAngle=.55;ctl.maxPolarAngle=1.42;
function fit(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;const d=44/Math.min(1,camera.aspect*1.15);const dir=camera.position.lengthSq()?camera.position.clone().sub(ctl.target).normalize():new T.Vector3(.6,.5,.6);camera.position.copy(ctl.target).addScaledVector(dir,d);camera.updateProjectionMatrix()}
camera.position.set(13,10,13);addEventListener('resize',fit);fit();
renderer.setAnimationLoop(t=>{t*=.001;
for(let i=0;i<wp.count;i++){const x=w0[i*3],z=w0[i*3+2];wp.setY(i,(Math.sin(x*2.2+t*1.3)*.012+Math.sin(z*2.9-t*1.7)*.01+Math.sin((x+z)*5+t*2.4)*.004)*(1-sm(-.1,.35,H(x,z)-WL+.3)*0))}
wp.needsUpdate=true;wg.computeVertexNormals();
boats.forEach(b=>{const p=b.userData.ph;b.position.y=WL-.025+Math.sin(t*1.2+p)*.012;b.rotation.z=Math.sin(t*1.1+p)*.025;b.rotation.x=Math.sin(t*.9+p*2)*.02});
birds.forEach(b=>{const u=b.userData;u.a+=u.sp*.016;b.position.set(3.5+Math.cos(u.a)*u.rad,u.h+Math.sin(u.a*2+u.ph)*.2,-1.5+Math.sin(u.a)*u.rad);b.rotation.y=-u.a;const f=Math.sin(t*9+u.ph)*.6;u.l.rotation.x=f;u.r.rotation.x=-f});
ctl.update();renderer.render(scene,camera)});
</script></body></html>
