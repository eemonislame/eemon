      function updateFleetPhysics(time, dt) {
        const waveInt = sharedUniforms.uWaveIntensity.value;
        const breeze = sharedUniforms.uBreeze.value;
        const springAlpha = 1.0 - Math.exp(-dt * 9.0);

        vessels.forEach((v, idx) => {
          const swingPhase = time * v.swingFreq * (0.65 + 0.35 * breeze) + v.phase;
          const surgeX = Math.sin(swingPhase) * v.surgeAmpX * (0.45 + 0.55 * breeze);
          const surgeZ = Math.cos(swingPhase * 0.85) * v.surgeAmpZ * (0.45 + 0.55 * breeze);
          const yaw = v.baseYaw + Math.sin(swingPhase * 0.92 + 0.4) * v.swingAmpYaw * (0.4 + 0.6 * breeze);

          const cx = v.baseX + surgeX;
          const cz = v.baseZ + surgeZ;

          const sinY = Math.sin(yaw);
          const cosY = Math.cos(yaw);

          const sampleHullPoint = (lx, lz) => {
            const wx = cx + lx * cosY + lz * sinY;
            const wz = cz - lx * sinY + lz * cosY;
            return evaluateOceanWaveJS(wx, wz, time, waveInt).waterY;
          };

          const spanL = v.halfL * 0.82;
          const spanB = v.halfB * 0.85;

          const hCenter = sampleHullPoint(0, 0);
          const hBow = sampleHullPoint(0, -spanL);
          const hStern = sampleHullPoint(0, spanL);
          const hPort = sampleHullPoint(-spanB, 0);
          const hStarboard = sampleHullPoint(spanB, 0);

          const avgWaterY = hCenter * 0.40 + (hBow + hStern + hPort + hStarboard) * 0.15;
          const buoyantWaterY = Math.max(avgWaterY, hCenter - 0.02);
          const targetY = buoyantWaterY + v.draftOffset;
          const targetPitch = Math.atan2(hBow - hStern, spanL * 2.0) * 0.92;
          const targetRoll = Math.atan2(hPort - hStarboard, spanB * 2.0) * 0.92;

          if (dt === 0) {
            v.currentY = targetY;
            v.currentPitch = targetPitch;
            v.currentRoll = targetRoll;
          } else {
            v.currentY += (targetY - v.currentY) * springAlpha;
            v.currentPitch += (targetPitch - v.currentPitch) * springAlpha;
            v.currentRoll += (targetRoll - v.currentRoll) * springAlpha;
          }

          v.mesh.position.set(cx, v.currentY, cz);
          v.mesh.rotation.order = 'YXZ';
          v.mesh.rotation.y = yaw;
          v.mesh.rotation.x = v.currentPitch;
          v.mesh.rotation.z = v.currentRoll;

          sharedUniforms.uBoats.value[idx].set(cx, cz, v.halfL, v.halfB);
        });

        const sAnim = sloopMesh.userData.sailAnim;
        if (sAnim) {
          sAnim.boomRig.rotation.y = 0.22 + Math.sin(time * 1.15) * 0.055 * breeze;
          if (sAnim.burgeeMesh) {
            sAnim.burgeeMesh.rotation.y = -Math.PI / 2 + 0.25 + Math.sin(time * 6.4) * 0.16 * breeze;
          }
          const msPos = sAnim.mainSailGeo.attributes.position;
          for (let i = 0; i < msPos.count; i++) {
            const flutter = Math.sin(time * 3.4 - sAnim.msUVu[i] * 5.2 + sAnim.msUVv[i] * 2.4)
              * 0.028 * breeze * sAnim.msUVu[i];
            msPos.setX(i, sAnim.msBaseX[i] * (0.85 + 0.18 * breeze) + flutter);
          }
          msPos.needsUpdate = true;

          const jbPos = sAnim.jibGeo.attributes.position;
          for (let i = 0; i < jbPos.count; i++) {
            const flutter = Math.sin(time * 3.9 - sAnim.jbUVu[i] * 4.8 + sAnim.jbUVv[i] * 2.1)
              * 0.022 * breeze * sAnim.jbUVu[i];
            jbPos.setX(i, sAnim.jbBaseX[i] * (0.85 + 0.18 * breeze) + flutter);
          }
          jbPos.needsUpdate = true;
        }

        // Bobbing harbor mooring buoys
        function updateBuoyPose(bMesh, bx0, bz0, phaseOffset) {
          const bx = bx0 + Math.sin(time * 0.72 + phaseOffset) * 0.10;
          const bz = bz0 + Math.cos(time * 0.64 + phaseOffset) * 0.10;
          const bWave = evaluateOceanWaveJS(bx, bz, time, waveInt);
          const bWaveFwd = evaluateOceanWaveJS(bx, bz - 0.2, time, waveInt);
          const bWaveSide = evaluateOceanWaveJS(bx + 0.2, bz, time, waveInt);
          bMesh.position.set(bx, bWave.waterY + 0.06, bz);
          bMesh.rotation.set(
            Math.atan2(bWaveFwd.waterY - bWave.waterY, 0.2) * 0.7,
            time * 0.25 + phaseOffset,
            Math.atan2(bWave.waterY - bWaveSide.waterY, 0.2) * 0.7
          );

        updateCatenaryRope(doryRopeMesh, doryBowWorld, eastBuoyRingWorld, 0.18);
      }

      // =========================================================================
      // 9. ANATOMICALLY ACCURATE RUBBERY PELAGIC SHARK (3.55m) & LIVELY SWIMMING
      // =========================================================================
      function createPelagicShark() {
        const sharkGroup = new THREE.Group();
        const SHARK_LEN = 3.55;
        const HALF_LEN = SHARK_LEN * 0.5;

        const uSegs = 136;
        const vSegs = 60;
        const positions = [];
        const uvs = [];
        const finMasks = [];
        const finTypes = [];
        const indices = [];

        function getSharkRadii(u) {
          let rx, ryDorsal, ryVentral, yCenter;

          if (u < 0.24) {
            const t = u / 0.24;
            const snoutCurve = Math.pow(Math.sin(t * Math.PI * 0.5), 0.76);
            rx = 0.004 + 0.315 * snoutCurve;
            ryDorsal = 0.004 + 0.255 * Math.pow(t, 0.72);
            ryVentral = 0.003 + 0.180 * Math.pow(t, 0.85);
            yCenter = -0.022 * Math.sin(t * Math.PI * 0.5);
          } else if (u < 0.44) {
            const t = (u - 0.24) / 0.20;
            const hump = Math.sin(t * Math.PI);
            rx = 0.319 + 0.025 * hump;
            ryDorsal = 0.259 + 0.058 * hump;
            ryVentral = 0.183 + 0.045 * hump;
            yCenter = -0.022 + 0.014 * hump;
          } else {
            const t = (u - 0.44) / 0.56;
            const taper = Math.pow(Math.max(0.0, 1.0 - t), 1.28);
            rx = 0.036 + 0.283 * taper;
            ryDorsal = 0.058 + 0.201 * taper;
            ryVentral = 0.052 + 0.131 * taper;
            yCenter = -0.008 * (1.0 - t);
          }

          if (u > 0.84) {
            const kt = Math.sin(Math.min(1.0, (u - 0.84) / 0.15) * Math.PI);
            rx += 0.030 * kt;
          }

          return { rx, ryDorsal, ryVentral, yCenter };
        }

        for (let iu = 0; iu <= uSegs; iu++) {
          const u = iu / uSegs;
          const z = HALF_LEN - u * SHARK_LEN;
          const { rx, ryDorsal, ryVentral, yCenter } = getSharkRadii(u);

          for (let iv = 0; iv <= vSegs; iv++) {
            const v = iv / vSegs;
            const theta = v * Math.PI * 2.0;
            const sinT = Math.sin(theta);
            const cosT = Math.cos(theta);

            let localRx = rx;
            let localRy = cosT >= 0.0 ? ryDorsal : ryVentral;
            if (cosT < 0.0) {
              localRx *= 1.0 + 0.07 * Math.abs(cosT);
            }

            let x = sinT * localRx;
            let y = yCenter + cosT * localRy;

            // Orbital eye socket indentation
            const browDistU = (u - 0.105) / 0.024;
            const eyeAngleDiff = Math.abs(Math.abs(sinT) - 0.94) / 0.14;
            if (Math.abs(browDistU) < 1.6 && eyeAngleDiff < 1.5 && cosT > -0.15 && cosT < 0.55) {
              const socketEnv = Math.exp(-(browDistU * browDistU + eyeAngleDiff * eyeAngleDiff));
              x -= Math.sign(sinT) * 0.015 * socketEnv;
            }

            // Paired ventral nostrils (nares)
            const nareU = (u - 0.055) / 0.010;
            const nareSide = (Math.abs(sinT) - 0.54) / 0.11;
            if (cosT < -0.35 && Math.abs(nareU) < 1.5 && Math.abs(nareSide) < 1.5) {
              const nareEnv = Math.exp(-(nareU * nareU + nareSide * nareSide));
              y += 0.008 * nareEnv;
            }

            // Closed ventral crescent jaw crease
            if (cosT < -0.45 && u > 0.092 && u < 0.162) {
              const jawArcU = 0.105 + 0.036 * (sinT * sinT);
              const jawDist = (u - jawArcU) / 0.0085;
              const jawWidthMask = Math.exp(-Math.pow(sinT / 0.68, 4.0));
              const jawCrease = Math.exp(-(jawDist * jawDist)) * jawWidthMask;
              y += 0.016 * jawCrease;
            }

            // 5 sculpted recessed vertical gill slits on each flank
            if (Math.abs(sinT) > 0.68 && cosT > -0.42 && cosT < 0.36 && u > 0.205 && u < 0.288) {
              const verticalMask = Math.exp(-Math.pow((cosT + 0.03) / 0.22, 2.0));
              for (let g = 0; g < 5; g++) {
                const gillU = 0.216 + g * 0.0145 - cosT * 0.012;
                const dg = (u - gillU) / 0.0026;
                const slitIndent = Math.exp(-(dg * dg)) * verticalMask;
                x -= Math.sign(sinT) * 0.018 * slitIndent;
              }
            }

            positions.push(x, y, z);
            uvs.push(u, v);
            finMasks.push(0.0);
            finTypes.push(0.0);
          }
        }

        const stride = vSegs + 1;
        for (let iu = 0; iu < uSegs; iu++) {
          for (let iv = 0; iv < vSegs; iv++) {
            const a = iu * stride + iv;
            const b = (iu + 1) * stride + iv;
            const c = (iu + 1) * stride + (iv + 1);
            const d = iu * stride + (iv + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
          }
        }

        const bodyGeo = new THREE.BufferGeometry();
        bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        bodyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        bodyGeo.setAttribute('aFinMask', new THREE.Float32BufferAttribute(finMasks, 1));
        bodyGeo.setAttribute('aFinType', new THREE.Float32BufferAttribute(finTypes, 1));
        bodyGeo.setIndex(indices);
        bodyGeo.computeVertexNormals();

        function createAirfoilFinGeometry(profilePts, maxThickness, spanAxis = 'y', droopAngle = 0.0, finTypeVal = 1.0) {
          const shape = new THREE.Shape();
          shape.moveTo(profilePts[0][0], profilePts[0][1]);
          for (let i = 1; i < profilePts.length; i++) {
            shape.lineTo(profilePts[i][0], profilePts[i][1]);
          }
          shape.closePath();

          const geo = new THREE.ExtrudeGeometry(shape, {
            depth: maxThickness,
            bevelEnabled: true,
            bevelThickness: maxThickness * 0.45,
            bevelSize: maxThickness * 0.35,
            bevelSegments: 3,
            curveSegments: 16
          });
          geo.translate(0, 0, -maxThickness * 0.5);

          const p = geo.attributes.position;
          let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
          for (let i = 0; i < p.count; i++) {
            minX = Math.min(minX, p.getX(i));
            maxX = Math.max(maxX, p.getX(i));
            minY = Math.min(minY, p.getY(i));
            maxY = Math.max(maxY, p.getY(i));
          }
          const spanY = Math.max(0.001, maxY - minY);
          const chordX = Math.max(0.001, maxX - minX);
          const finMaskArr = new Float32Array(p.count);
          const finTypeArr = new Float32Array(p.count);

          for (let i = 0; i < p.count; i++) {
            const sx = p.getX(i);
            const sy = p.getY(i);
            const sz = p.getZ(i);

            const vSpan = THREE.MathUtils.clamp((sy - minY) / spanY, 0.0, 1.0);
            const uChord = THREE.MathUtils.clamp((maxX - sx) / chordX, 0.0, 1.0);

            const spanTaper = Math.pow(1.0 - vSpan * 0.86, 0.78);
            const chordTaper = Math.sin(Math.pow(uChord, 0.55) * Math.PI) * 0.85 + 0.15 * (1.0 - uChord);
            const taperedThick = sz * spanTaper * chordTaper;

            finMaskArr[i] = THREE.MathUtils.clamp(vSpan * 0.82 + uChord * 0.28, 0.0, 1.0);
            finTypeArr[i] = finTypeVal;

            if (spanAxis === 'y') {
              p.setXYZ(i, taperedThick, sy, sx);
            } else {
              const droopY = taperedThick - sy * Math.sin(droopAngle);
              const spanX = sy * Math.cos(droopAngle);
              p.setXYZ(i, spanX, droopY, sx);
            }
          }

          geo.setAttribute('aFinMask', new THREE.BufferAttribute(finMaskArr, 1));
          geo.setAttribute('aFinType', new THREE.BufferAttribute(finTypeArr, 1));
          geo.computeVertexNormals();
          return geo;
        }

          [-0.18,  0.30],
          [-0.17,  0.04],
          [-0.22, -0.02]
        ];
        const pecRightGeo = createAirfoilFinGeometry(pecShapePts, 0.024, 'x', 0.26, 2.0);
        pecRightGeo.translate(0.25, -0.11, 0.72);

        function mirrorGeometryX(srcGeo) {
          const geo = srcGeo.clone();
          geo.scale(-1, 1, 1);
          if (geo.index) {
            const idx = geo.index;
            for (let i = 0; i < idx.count; i += 3) {
              const tmp = idx.getX(i + 1);
              idx.setX(i + 1, idx.getX(i + 2));
              idx.setX(i + 2, tmp);
            }
          } else {
            const pos = geo.attributes.position;
            const uv = geo.attributes.uv;
            const finMask = geo.attributes.aFinMask;
            const finType = geo.attributes.aFinType;
            for (let i = 0; i < pos.count; i += 3) {
              const x1 = pos.getX(i + 1), y1 = pos.getY(i + 1), z1 = pos.getZ(i + 1);
              pos.setXYZ(i + 1, pos.getX(i + 2), pos.getY(i + 2), pos.getZ(i + 2));
              pos.setXYZ(i + 2, x1, y1, z1);

              if (uv) {
                const u1 = uv.getX(i + 1), v1 = uv.getY(i + 1);
                uv.setXY(i + 1, uv.getX(i + 2), uv.getY(i + 2));
                uv.setXY(i + 2, u1, v1);
              }
              if (finMask) {
                const f1 = finMask.getX(i + 1);
                finMask.setX(i + 1, finMask.getX(i + 2));
                finMask.setX(i + 2, f1);
              }
              if (finType) {
                const t1 = finType.getX(i + 1);
                finType.setX(i + 1, finType.getX(i + 2));
                finType.setX(i + 2, t1);
              }
            }
          }
          geo.computeVertexNormals();
          return geo;
        }

        const pecLeftGeo = mirrorGeometryX(pecRightGeo);

        const pelvShapePts = [
          [ 0.09, -0.02],
          [-0.03,  0.17],
          [-0.09,  0.19],
          [-0.11,  0.14],
          [-0.08,  0.02],
          [-0.12, -0.01]
        ];
        const pelvRightGeo = createAirfoilFinGeometry(pelvShapePts, 0.015, 'x', 0.34, 2.0);
        pelvRightGeo.translate(0.14, -0.14, -0.22);

        const pelvLeftGeo = mirrorGeometryX(pelvRightGeo);

        const sharkShaderMat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: sharedUniforms.uTime,
            uBreeze: sharedUniforms.uBreeze,
            uSunDir: sharedUniforms.uSunDir,
            uSunColor: sharedUniforms.uSunColor,
            uWaterClarity: sharedUniforms.uWaterClarity
          },
          vertexShader: /* glsl */ `
            attribute float aFinMask;
            attribute float aFinType;
            uniform float uTime;
            uniform float uBreeze;

            varying vec3 vLocalPos;
            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying float vFinMask;
            varying float vFinType;

            vec3 sharkOrganicDeform(vec3 pos, float finMask, float finType, float t, float speedMult) {
              vec3 p = pos;
              float s = clamp((1.775 - p.z) / 3.55, 0.0, 1.25);
              float freq = 4.35 * speedMult;
              float phase = t * freq - s * 4.75;

              float headCounter = -0.022 * speedMult * (1.0 - smoothstep(0.0, 0.30, s)) * sin(t * freq + 0.4);

              float posterior = max(0.0, s - 0.10);
              float baseAmp = (0.028 + 0.385 * pow(posterior, 1.72)) * (0.85 + 0.25 * speedMult);
              float primaryWave = sin(phase) + 0.14 * sin(phase * 2.0 - 0.6);
              float lateralX = headCounter + baseAmp * primaryWave;

              float verticalY = 0.024 * pow(posterior, 2.2) * sin(phase * 2.0 + 0.5);

              if (finType > 0.5 && finType < 1.5) {
                float tipFlex = pow(finMask, 1.65) * 0.085 * sin(phase - 0.95);
                lateralX += tipFlex;
              } else if (finType > 1.5 && finType < 2.5) {
                float sideSign = sign(p.x);
                float spanRatio = finMask;
                float strokePhase = t * (freq * 0.72) + sideSign * 0.35;
                float flapY = pow(spanRatio, 1.45) * (0.105 * sin(strokePhase) + 0.036 * sin(strokePhase * 2.0));
                float sweepZ = pow(spanRatio, 1.3) * 0.048 * cos(strokePhase);
                float featherTwist = spanRatio * 0.024 * sin(strokePhase - 0.6) * (0.72 - p.z);
                verticalY += flapY + featherTwist;
                p.z += sweepZ;
              } else if (finType > 2.5) {
                float tailLag = pow(finMask, 1.45) * 0.155 * sin(phase - 0.85);
                lateralX += tailLag;
                verticalY += pow(finMask, 1.5) * 0.032 * cos(phase - 0.4);
              }

              if (finType < 0.5 && p.z > 0.74 && p.z < 1.05 && abs(p.x) > 0.18) {
                float gillPulse = (0.5 + 0.5 * sin(t * 2.8)) * 0.008;
                lateralX += sign(p.x) * gillPulse;
              }

              p.x += lateralX;
              p.y += verticalY;
              return p;
            }

            void main() {
              vLocalPos = position;
              vFinMask = aFinMask;
              vFinType = aFinType;

              float speedMult = 0.92 + 0.28 * uBreeze;
              vec3 bentPos = sharkOrganicDeform(position, aFinMask, aFinType, uTime, speedMult);

              float eps = 0.02;
              vec3 dPx = sharkOrganicDeform(position + vec3(eps, 0.0, 0.0), aFinMask, aFinType, uTime, speedMult) - bentPos;
              vec3 dPy = sharkOrganicDeform(position + vec3(0.0, eps, 0.0), aFinMask, aFinType, uTime, speedMult) - bentPos;
              vec3 dPz = sharkOrganicDeform(position + vec3(0.0, 0.0, eps), aFinMask, aFinType, uTime, speedMult) - bentPos;

              vec3 bentNormal = normalize(
                normal.x * cross(dPy, dPz) +
                normal.y * cross(dPz, dPx) +
                normal.z * cross(dPx, dPy)
              );

              vec4 worldPos = modelMatrix * vec4(bentPos, 1.0);
              vWorldPos = worldPos.xyz;
              vWorldNormal = normalize(mat3(modelMatrix) * bentNormal);

              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            uniform vec3 uSunDir;
            uniform vec3 uSunColor;
            uniform float uWaterClarity;

            varying vec3 vLocalPos;
            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying float vFinMask;
            varying float vFinType;

            ${GLSL_SHARED_NOISE_AND_WAVES}

            float sharkCaustic(vec2 uv, float t) {
              vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.005;
              for (int n = 0; n < 3; n++) {
                float timeStep = t * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(
                  cos(timeStep - i.x) + sin(timeStep + i.y),
                  sin(timeStep - i.y) + cos(timeStep + i.x)
                );
                c += 1.0 / length(vec2(
                  p.x / (sin(i.x + timeStep) / inten),
                  p.y / (cos(i.y + timeStep) / inten)
                ));
              }
              c /= 3.0;
              c = 1.17 - pow(c, 1.4);
              return pow(abs(c), 7.5);
            }

            void main() {
              vec3 N = normalize(vWorldNormal);
              vec3 V = normalize(cameraPosition - vWorldPos);
              vec3 L = normalize(uSunDir);

              float mottle = fbm2D(vLocalPos.zy * 4.6 + vec2(2.1, 5.4));
              float fineMottle = fbm2D(vLocalPos.zy * 14.0 - vec2(1.3, 3.7));
              float denticle = valueNoise2D(vLocalPos.zy * 185.0 + vLocalPos.xy * 185.0);
              float myomereChevrons = sin(vLocalPos.z * 28.0 + abs(vLocalPos.y) * 18.0) * 0.5 + 0.5;

              float lateralLineDist = abs(vLocalPos.y - (-0.012 - 0.015 * smoothstep(0.5, -1.5, vLocalPos.z)));
              float lateralLine = (1.0 - smoothstep(0.004, 0.016, lateralLineDist)) * smoothstep(1.1, 0.5, vLocalPos.z) * smoothstep(-1.6, -1.2, vLocalPos.z);

              float boundaryWarp = (fbm2D(vec2(vLocalPos.z * 3.2, 1.7)) - 0.5) * 0.075;
              float pectoralMask = smoothstep(0.35, 0.85, vLocalPos.z) * (1.0 - smoothstep(0.85, 1.25, vLocalPos.z));
              float ventralLine = -0.048 + boundaryWarp - pectoralMask * 0.038;

              float dorsalMask = smoothstep(ventralLine - 0.055, ventralLine + 0.065, vLocalPos.y + (fineMottle - 0.5) * 0.025);

              vec3 dorsalSlate = mix(vec3(0.11, 0.16, 0.21), vec3(0.23, 0.29, 0.35), mottle * 0.7 + fineMottle * 0.3);
              dorsalSlate += (myomereChevrons - 0.5) * 0.022 + (denticle - 0.5) * 0.026;
              dorsalSlate = mix(dorsalSlate, vec3(0.12, 0.15, 0.19), lateralLine * 0.38);

              float scarNoise = smoothstep(0.92, 0.985, fbm2D(vec2(vLocalPos.z * 9.0, vLocalPos.y * 22.0)));
              dorsalSlate = mix(dorsalSlate, vec3(0.46, 0.51, 0.56), scarNoise * 0.32 * dorsalMask);

              vec3 ventralBelly = vec3(0.84, 0.87, 0.89) + (denticle - 0.5) * 0.022 + (fineMottle - 0.5) * 0.02;
              vec3 albedo = mix(ventralBelly, dorsalSlate, dorsalMask);

              if (vFinType > 0.5) {
                albedo = mix(albedo, vec3(0.07, 0.09, 0.13), smoothstep(0.25, 0.95, vFinMask) * 0.72);
              }

              if (vFinType < 0.5 && abs(vLocalPos.x) > 0.16 && vLocalPos.z > 0.72 && vLocalPos.z < 1.04) {
                float gillDark = smoothstep(0.29, 0.22, abs(vLocalPos.x));
                albedo = mix(albedo, vec3(0.16, 0.08, 0.09), gillDark * 0.55);
              }

              float diff = max(dot(N, L), 0.0);
              float wrapDiff = max(0.0, (dot(N, L) + 0.52) / 1.52);

              float thinCartilage = clamp(vFinMask * 0.85 + smoothstep(1.35, 1.77, vLocalPos.z) * 0.55, 0.0, 1.0);
              float backSSS = pow(clamp(dot(V, -L + N * 0.35), 0.0, 1.0), 2.2) * (0.28 + 0.72 * thinCartilage);
              vec3 sssTint = mix(vec3(0.16, 0.34, 0.40), vec3(0.32, 0.26, 0.28), thinCartilage * 0.45);

              vec3 skyDown = vec3(0.28, 0.58, 0.70) * (0.5 + 0.5 * N.y);
              vec3 sandBounce = vec3(0.24, 0.28, 0.26) * (0.5 - 0.5 * N.y);

              vec3 H = normalize(L + V);
              float NdotH = max(dot(N, H), 0.0);
              float satinSheen = pow(NdotH, 16.0) * (0.14 + 0.06 * denticle);
              float microDenticleSparkle = pow(NdotH, 42.0) * smoothstep(0.65, 0.98, denticle) * 0.12;
              float rimVelvet = pow(1.0 - max(dot(N, V), 0.0), 3.2) * 0.26;

              vec3 litCol = albedo * (uSunColor * (diff * 0.62 + wrapDiff * 0.44) + skyDown + sandBounce)
                          + uSunColor * (satinSheen + microDenticleSparkle + sssTint * backSSS * 0.55)
                          + vec3(0.20, 0.54, 0.66) * rimVelvet;

              float subDepth = max(0.0, -0.05 - vWorldPos.y);
              if (subDepth > 0.02) {
                float dorsalExposure = smoothstep(-0.2, 0.75, N.y);
                vec2 cUV = vWorldPos.xz * 0.36;
                float cVal = sharkCaustic(cUV, uTime * 1.05) * 0.65 + sharkCaustic(cUV * 1.38 + vec2(1.7, -2.3), -uTime * 0.82) * 0.45;
                float cFade = exp(-subDepth * 0.32) * dorsalExposure;
                litCol += uSunColor * vec3(0.84, 1.06, 1.15) * cVal * cFade * 0.68;

                float clarityInv = 1.0 / clamp(uWaterClarity, 0.3, 1.85);
                vec3 waterTint = vec3(0.03, 0.32, 0.44);
                float tintAmt = clamp(1.0 - exp(-subDepth * 0.16 * clarityInv), 0.0, 0.46);
                litCol = mix(litCol, waterTint, tintAmt);
              }

              gl_FragColor = vec4(litCol, 1.0);
            }
          `
        });

        const bodyMesh = new THREE.Mesh(bodyGeo, sharkShaderMat);
        bodyMesh.castShadow = true;
        bodyMesh.receiveShadow = true;
        sharkGroup.add(bodyMesh);

        [dorsal1Geo, dorsal2Geo, analFinGeo, caudalGeo, pecRightGeo, pecLeftGeo, pelvRightGeo, pelvLeftGeo].forEach((g) => {
          const finMesh = new THREE.Mesh(g, sharkShaderMat);
          finMesh.castShadow = true;
          finMesh.receiveShadow = true;
          sharkGroup.add(finMesh);
        });

        const eyeMat = new THREE.MeshStandardMaterial({
          color: 0x06090e,
          roughness: 0.08,
          metalness: 0.10,
          envMapIntensity: 1.3
        });
        const eyeGeo = new THREE.SphereGeometry(0.025, 16, 12);
        [-1, 1].forEach((side) => {
          const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
          eyeMesh.scale.set(0.65, 1.0, 1.05);
          eyeMesh.position.set(side * 0.178, 0.022, 1.40);
          sharkGroup.add(eyeMesh);
        });

        return sharkGroup;
      }

      const sharkMesh = createPelagicShark();
      scene.add(sharkMesh);

      const sharkState = {
        pos: new THREE.Vector3(0, -2.15, 14.2),
        yaw: 0.0,
        pitch: 0.0,
        roll: 0.0,
        prevYaw: 0.0,
        initialized: false
      };

      function evaluateSharkPatrolPose(t) {
        const omega = 0.21;
        const a = t * omega;
        const x = Math.sin(a) * 15.6 + Math.sin(a * 2.0) * 1.6;
        const z = 14.2 + Math.cos(a) * 4.4 + Math.sin(a * 2.0) * 0.5;

        const baseDepthY = -2.15 + Math.sin(a * 2.0 + 0.6) * 0.55;
        const seabedY = getBeachHeight(x, z);
        const y = Math.max(seabedY + 1.25, Math.min(-1.40, Math.max(-2.85, baseDepthY)));

        return new THREE.Vector3(x, y, z);
      }

      function updateSharkMotion(time, dt) {
        const breeze = sharedUniforms.uBreeze.value;
        const patrolTime = time * (0.88 + 0.16 * breeze);

        const pNow = evaluateSharkPatrolPose(patrolTime);
        const pAhead = evaluateSharkPatrolPose(patrolTime + 0.06);

        const tangent = new THREE.Vector3().subVectors(pAhead, pNow);
        const horizSpeed = Math.hypot(tangent.x, tangent.z);
        const targetYaw = Math.atan2(tangent.x, tangent.z);
        const targetPitch = -Math.atan2(tangent.y, Math.max(0.001, horizSpeed));

        if (!sharkState.initialized || dt === 0) {
          sharkState.pos.copy(pNow);
          sharkState.yaw = targetYaw;
          sharkState.prevYaw = targetYaw;
          sharkState.pitch = targetPitch;
          sharkState.roll = 0.0;
          sharkState.initialized = true;
        } else {
          let deltaYaw = targetYaw - sharkState.prevYaw;
          while (deltaYaw > Math.PI) deltaYaw -= Math.PI * 2.0;
          while (deltaYaw < -Math.PI) deltaYaw += Math.PI * 2.0;
          const turnRate = deltaYaw / Math.max(0.001, dt);
          sharkState.prevYaw = targetYaw;

          const targetRoll = THREE.MathUtils.clamp(-turnRate * 1.45, -0.34, 0.34);
          const smooth = 1.0 - Math.exp(-dt * 6.5);

          sharkState.pos.copy(pNow);
          sharkState.yaw = targetYaw;
          sharkState.pitch += (targetPitch - sharkState.pitch) * smooth;
          sharkState.roll += (targetRoll - sharkState.roll) * smooth;
        }

        sharkMesh.position.copy(sharkState.pos);
        sharkMesh.rotation.order = 'YXZ';
        sharkMesh.rotation.y = sharkState.yaw;
        sharkMesh.rotation.x = sharkState.pitch;
        sharkMesh.rotation.z = sharkState.roll;
      }

      // =========================================================================
      // 10. WEATHERED COASTAL FISHING HUT, GRANITE HEADLAND, REEF & FLORA
      // =========================================================================
      const propsGroup = new THREE.Group();
      scene.add(propsGroup);

      function buildCoastalFishingHut() {

        });
        const driftwoodBeamMat = new THREE.MeshStandardMaterial({

        });
        const deckPlankMat = new THREE.MeshStandardMaterial({
          map: teakDeckTex,

        });
        const trimTealMat = new THREE.MeshStandardMaterial({

        });
        const rustyTinMat = new THREE.MeshStandardMaterial({

        });

        function addCoastalWindow(wx, wy, wz, rotY) {

        ];

        boulders.forEach((b, idx) => {
          const geo = new THREE.IcosahedronGeometry(1.0, 3);
          const pos = geo.attributes.position;
          const groundY = getBeachHeight(b.x, b.z);
          const centerY = groundY + b.sy * 0.32;
          const bCols = new Float32Array(pos.count * 3);

          for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vy = pos.getY(i);
            const vz = pos.getZ(i);
            const n1 = fbm2D(vx * 2.2 + idx * 3.1, vz * 2.2 + vy * 2.4);
            const ledge = Math.sin(vy * 7.5 + n1 * 3.0) * 0.06;
            const scale = 0.82 + n1 * 0.38 + ledge;

            const sx = vx * b.sx * scale;
            const sy = vy * b.sy * scale;
            const sz = vz * b.sz * scale;
            pos.setXYZ(i, sx, sy, sz);

            const worldY = centerY + sy;
            const c = new THREE.Color(0x6b665f).lerp(new THREE.Color(0x989187), n1);
            if (vy > 0.35 && worldY > 0.5) {
              c.lerp(new THREE.Color(0x888450), smoothstepJS(0.35, 0.85, vy) * 0.42);
            }
            const wetSplash = 1.0 - smoothstepJS(0.15, 0.40, worldY);
            c.multiplyScalar(THREE.MathUtils.lerp(1.0, 0.52, wetSplash));
            if (worldY < -0.1) {
              c.lerp(new THREE.Color(0x3a4e46), smoothstepJS(-0.1, -1.2, worldY) * 0.55);
            }

            bCols[i * 3] = c.r;
            bCols[i * 3 + 1] = c.g;
            bCols[i * 3 + 2] = c.b;
          }

          geo.setAttribute('color', new THREE.BufferAttribute(bCols, 3));
          geo.computeVertexNormals();

          const mesh = new THREE.Mesh(geo, rockMat);
          mesh.position.set(b.x, centerY, b.z);
          mesh.rotation.y = b.rot;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          rockGroup.add(mesh);
        });

        return rockGroup;
      }

      // Current-Swaying Submerged Giant Kelp Fronds on Reef Outcrops
      const kelpMeshes = [];
      function createSubmergedKelpForest() {
        const frondGeo = new THREE.PlaneGeometry(0.16, 2.3, 2, 12);
        frondGeo.translate(0, 1.15, 0);

        const fPos = frondGeo.attributes.position;
        const fCols = [];
        for (let i = 0; i < fPos.count; i++) {
          const y = fPos.getY(i);
          const t = THREE.MathUtils.clamp(y / 2.3, 0.0, 1.0);
          const ruffle = Math.sin(t * 22.0) * 0.035 * Math.sin(t * Math.PI);
          const taper = Math.sin(Math.pow(t, 0.65) * Math.PI * 0.92 + 0.12);
          fPos.setX(i, fPos.getX(i) * taper + ruffle);
          fPos.setZ(i, Math.cos(t * 16.0) * 0.025);

          fCols.push(
            THREE.MathUtils.lerp(0.14, 0.34, t),
            THREE.MathUtils.lerp(0.28, 0.46, t),
            THREE.MathUtils.lerp(0.12, 0.18, t)
          );
        }
        frondGeo.setAttribute('color', new THREE.Float32BufferAttribute(fCols, 3));
        frondGeo.computeVertexNormals();

        const kelpMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.45,
          metalness: 0.02,
          side: THREE.DoubleSide
        });

        const kelpBeds = [
          { cx: -13.6, cz:  5.0, count: 12 },
          { cx: -10.9, cz:  6.3, count: 10 },
          { cx:  13.4, cz:  5.6, count: 12 },
          { cx:  15.4, cz:  7.2, count: 10 }
        ];

        kelpBeds.forEach((bed, bIdx) => {
          for (let i = 0; i < bed.count; i++) {
            const ang = hash21(bIdx * 9.1 + i, 3.4) * Math.PI * 2;
            const rad = Math.sqrt(hash21(bIdx * 4.7 + i, 7.2)) * 1.15;
            const kx = bed.cx + Math.cos(ang) * rad;
            const kz = bed.cz + Math.sin(ang) * rad;
            const ky = getBeachHeight(kx, kz);

            const frond = new THREE.Mesh(frondGeo, kelpMat);
            frond.position.set(kx, ky - 0.05, kz);
            frond.rotation.y = ang;
            frond.scale.y = 0.65 + hash21(bIdx * 20 + i, 2.8) * 0.55;
            frond.userData.phase = kx * 0.6 + kz * 0.5 + i * 0.4;
            propsGroup.add(frond);
            kelpMeshes.push(frond);
          }
        });
      }

      // Fluted Scallop Shells
      function createScallopShellGeometry() {
        const geo = new THREE.PlaneGeometry(0.24, 0.22, 26, 16);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const colors = [];

        for (let i = 0; i < pos.count; i++) {
          const u = pos.getX(i) / 0.12;
          const v = THREE.MathUtils.clamp((pos.getZ(i) + 0.11) / 0.22, 0.0, 1.0);
          const fanWidth = 0.16 + 0.84 * Math.pow(v, 0.72);
          const x = u * 0.125 * fanWidth;
          const rimCurve = Math.sqrt(Math.max(0.0, 1.0 - u * u * 0.82));
          const z = (v * rimCurve - 0.45) * 0.23;
          const dome = Math.sin(v * Math.PI) * (1.0 - u * u * 0.65) * 0.04;
          const flutes = Math.cos(u * Math.PI * 11.0) * 0.007 * smoothstepJS(0.15, 0.95, v);
          pos.setXYZ(i, x, dome + flutes, z);

          const band = 0.5 + 0.5 * Math.sin(v * 22.0 + Math.abs(u) * 3.0);
          colors.push(
            THREE.MathUtils.lerp(0.95, 0.82, band),
            THREE.MathUtils.lerp(0.88, 0.62, band),
            THREE.MathUtils.lerp(0.80, 0.50, band)
          );
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        return geo;
      }

          const vy = tPos.getY(i);
          const vz = tPos.getZ(i);
          const t = THREE.MathUtils.clamp((vx + 4.2) / 5.4, 0.0, 1.0);
          const center = mainCurve.getPointAt(t);
          const taper = 1.18 - 0.58 * t + 0.12 * Math.sin(t * 14.0);
          tPos.setXYZ(
            i,
            center.x + (vx - center.x) * taper,
            center.y + (vy - center.y) * taper,
            center.z + (vz - center.z) * taper
          );
        }
        trunkGeo.computeVertexNormals();
        const trunkMesh = new THREE.Mesh(trunkGeo, woodMat);
        trunkMesh.castShadow = true;
        trunkMesh.receiveShadow = true;
        woodGroup.add(trunkMesh);

        const branchCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-2.1, getBeachHeight(-2.1, -8.45) + 0.15, -8.45),
          new THREE.Vector3(-1.3, getBeachHeight(-1.3, -9.15) + 0.24, -9.15),
          new THREE.Vector3(-0.5, getBeachHeight(-0.5, -9.65) + 0.14, -9.65)
        ]);
        const branchMesh = new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 24, 0.09, 10, false), woodMat);
        branchMesh.castShadow = true;
        woodGroup.add(branchMesh);

        return woodGroup;
      }
      propsGroup.add(createDriftwoodProp());

      // Shallow Starfish
      function createStarfishProp(cx, cz) {
        const geo = new THREE.CylinderGeometry(0.28, 0.30, 0.05, 84, 5, false);
        const pos = geo.attributes.position;
        const colors = [];

        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const vz = pos.getZ(i);
          const r = Math.hypot(vx, vz);
          const angle = Math.atan2(vz, vx);
          const armWave = Math.cos(angle * 5.0 + 0.35 * Math.sin(angle * 2.0));
          const starRadius = 0.11 + 0.19 * Math.pow(Math.max(0.0, 0.5 + 0.5 * armWave), 1.65);

          const normR = r / 0.29;
          const scaledR = normR * starRadius;
          const nx = Math.cos(angle) * scaledR;
          const nz = Math.sin(angle) * scaledR;

          const spine = Math.max(0.0, armWave) * (1.0 - normR * 0.75);
          const ossicle = (valueNoise2D(nx * 90.0, nz * 90.0) - 0.5) * 0.008;
          const ny = vy > 0 ? (0.014 + (1.0 - normR * 0.82) * 0.036 + spine * 0.018 + ossicle) : -0.004;

          const groundY = getBeachHeight(cx + nx, cz + nz);
          pos.setXYZ(i, cx + nx, groundY + ny, cz + nz);

          const ridgeHighlight = smoothstepJS(0.3, 0.95, spine + ossicle * 18.0);
          colors.push(
            THREE.MathUtils.lerp(0.84, 0.96, ridgeHighlight),
            THREE.MathUtils.lerp(0.34, 0.68, ridgeHighlight),
            THREE.MathUtils.lerp(0.20, 0.52, ridgeHighlight)
          );
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.computeVertexNormals();

        const mesh = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.02 })
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }
      propsGroup.add(createStarfishProp(-2.2, -1.65));
      propsGroup.add(createStarfishProp(6.2, -1.15));

      // Coastal Dune Grass Tufts on Upper Dry Berm
      const grassTufts = [];
      function createDuneGrassClusters() {
        const bladeGeo = new THREE.PlaneGeometry(0.034, 0.92, 1, 6);
        bladeGeo.translate(0, 0.46, 0);

        const bPos = bladeGeo.attributes.position;
        const bCols = [];
        for (let i = 0; i < bPos.count; i++) {
          const y = bPos.getY(i);
          const t = THREE.MathUtils.clamp(y / 0.92, 0.0, 1.0);
          const taper = 1.0 - Math.pow(t, 1.35);
          const archZ = Math.pow(t, 2.1) * 0.24;
          bPos.setX(i, bPos.getX(i) * taper);
          bPos.setZ(i, bPos.getZ(i) + archZ);

          bCols.push(
            THREE.MathUtils.lerp(0.34, 0.78, t),
            THREE.MathUtils.lerp(0.44, 0.72, t),
            THREE.MathUtils.lerp(0.24, 0.42, t)
          );
        }
        bladeGeo.setAttribute('color', new THREE.Float32BufferAttribute(bCols, 3));
        bladeGeo.computeVertexNormals();

        const grassMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.68,
          metalness: 0.0,
          side: THREE.DoubleSide
        });

        const tussocks = [
          { cx: -18.2, cz: -19.2, count: 16 },
          { cx: -13.6, cz: -19.8, count: 18 },
          { cx:  -8.4, cz: -18.6, count: 16 },
          { cx:  -3.2, cz: -20.2, count: 18 },
          { cx:   2.4, cz: -18.8, count: 18 },
          { cx:   6.8, cz: -19.6, count: 16 },
          { cx:  16.8, cz: -18.5, count: 16 },
          { cx:  18.8, cz: -14.8, count: 18 },
          { cx: -10.5, cz: -14.5, count: 14 },
          { cx:  -1.8, cz: -14.8, count: 14 },
          { cx:   5.2, cz: -13.8, count: 14 },
          { cx:  17.4, cz: -11.2, count: 14 }
        ];

        tussocks.forEach((tussock, tIdx) => {
          const tuftGroup = new THREE.Group();
          const gy = getBeachHeight(tussock.cx, tussock.cz);
          tuftGroup.position.set(tussock.cx, gy - 0.02, tussock.cz);
          tuftGroup.userData.phase = tussock.cx * 0.7 + tussock.cz * 0.6;

          for (let i = 0; i < tussock.count; i++) {
            const angle = hash21(tIdx * 13.7 + i, 2.1) * Math.PI * 2;
            const radius = Math.sqrt(hash21(tIdx * 5.3 + i, 8.4)) * 0.75;
            const blade = new THREE.Mesh(bladeGeo, grassMat);
            blade.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            blade.rotation.set(
              (hash21(tIdx * 30 + i, 3.1) - 0.5) * 0.25,
              angle + (hash21(tIdx * 30 + i, 6.7) - 0.5) * 0.8,
              (hash21(tIdx * 30 + i, 9.4) - 0.5) * 0.25
            );
            blade.scale.y = 0.65 + hash21(tIdx * 30 + i, 1.5) * 0.72;
            blade.castShadow = true;
            tuftGroup.add(blade);
          }

          propsGroup.add(tuftGroup);
          grassTufts.push(tuftGroup);
        });
      }
      createDuneGrassClusters();

      // =========================================================================
      // 11. INTERACTIVE STUDIO CONTROLS, CAMERA PRESETS & RESIZE
      // =========================================================================
      let isPlaying = true;
      let simTime = 2.4;
      let activePresetKey = 'hero';
      let activePresetTransition = null;

      const sunSlider = document.getElementById('sun-slider');
      const sunVal = document.getElementById('sun-val');
      const waveSlider = document.getElementById('wave-slider');
      const waveVal = document.getElementById('wave-val');
      const claritySlider = document.getElementById('clarity-slider');
      const clarityVal = document.getElementById('clarity-val');
      const breezeSlider = document.getElementById('breeze-slider');
      const breezeVal = document.getElementById('breeze-val');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const resetBtn = document.getElementById('reset-btn');
      const collapseBtn = document.getElementById('collapse-btn');
      const panelHeader = document.getElementById('panel-header');
      const panelBody = document.getElementById('panel-body');
      const presetButtons = document.querySelectorAll('.preset-btn');

      function formatSunLabel(deg) {
        if (deg <= 16) return `${deg}° (Golden Hour)`;
        if (deg <= 24) return `${deg}° (Warm Morning)`;
        if (deg <= 48) return `${deg}° (Afternoon)`;
        return `${deg}° (High Noon)`;
      }

      function formatClarityLabel(val) {
        if (val <= 0.7) return `${val.toFixed(2)} (Emerald)`;
        if (val <= 1.28) return `${val.toFixed(2)} (Crystal)`;
        return `${val.toFixed(2)} (Ultra-Clear)`;
      }

      updateSunAndEnvironment(parseFloat(sunSlider.value));
      sunVal.textContent = formatSunLabel(parseFloat(sunSlider.value));

      sunSlider.addEventListener('input', (e) => {
        const deg = parseFloat(e.target.value);
        sunVal.textContent = formatSunLabel(deg);
        updateSunAndEnvironment(deg);
      });

      waveSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uWaveIntensity.value = val;
        waveVal.textContent = `${val.toFixed(2)}×`;
      });

      claritySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uWaterClarity.value = val;
        clarityVal.textContent = formatClarityLabel(val);
      });

      breezeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uBreeze.value = val;
        breezeVal.textContent = `${val.toFixed(2)}×`;
      });

      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? 'Pause' : 'Resume';
      });

      function computeSharkCameraOffsets() {
        const forward = new THREE.Vector3(Math.sin(sharkState.yaw), 0, Math.cos(sharkState.yaw));
        const right = new THREE.Vector3(forward.z, 0, -forward.x);
        const camPos = sharkState.pos.clone()
          .addScaledVector(forward, -3.6)
          .addScaledVector(right, 4.4)
          .add(new THREE.Vector3(0, 1.15, 0));
        const camTarget = sharkState.pos.clone().addScaledVector(forward, 0.55);
        return { camPos, camTarget };
      }

      function triggerCameraPreset(presetKey) {
        const preset = CAMERA_PRESETS[presetKey];
        if (!preset) return;

        activePresetKey = presetKey;
        presetButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.preset === presetKey);
        });

        let endPos = preset.pos.clone();
        let endTarget = preset.target.clone();
        if (presetKey === 'shark') {
          const sCam = computeSharkCameraOffsets();
          endPos = sCam.camPos;
          endTarget = sCam.camTarget;
        }

        activePresetTransition = {
          startPos: camera.position.clone(),
          endPos,
          startTarget: controls.target.clone(),
          endTarget,
          progress: 0.0
        };
      }

      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          triggerCameraPreset(btn.dataset.preset);
        });
      });

      resetBtn.addEventListener('click', () => {
        triggerCameraPreset('hero');
      });

      controls.addEventListener('start', () => {
        activePresetTransition = null;
        if (activePresetKey === 'shark') {
          activePresetKey = 'custom';
        }
      });

      let panelCollapsed = false;
      collapseBtn.addEventListener('click', () => {
        panelCollapsed = !panelCollapsed;
        panelBody.classList.toggle('hidden', panelCollapsed);
        panelHeader.classList.toggle('collapsed', panelCollapsed);
        collapseBtn.textContent = panelCollapsed ? '+' : '−';
      });

      function handleResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);

        renderer.getDrawingBufferSize(rtSize);
        refractionRT.setSize(Math.max(1, Math.floor(rtSize.x)), Math.max(1, Math.floor(rtSize.y)));
        sharedUniforms.uResolution.value.copy(rtSize);
      }
      window.addEventListener('resize', handleResize);

      // Initialize fleet & shark poses before first render
      updateFleetPhysics(simTime, 0);
      updateSharkMotion(simTime, 0);

      // =========================================================================
      // 12. TWO-PASS REFRACTION RENDER LOOP & IMMEDIATE LOADER DISMISSAL
      // =========================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        if (isPlaying) {
          simTime += dt;
          sharedUniforms.uTime.value = simTime;
          updateFleetPhysics(simTime, dt);
          updateSharkMotion(simTime, dt);

          const breeze = sharedUniforms.uBreeze.value;
          for (let i = 0; i < grassTufts.length; i++) {
            const tuft = grassTufts[i];
            const p = tuft.userData.phase;
            tuft.rotation.z = Math.sin(simTime * 1.85 + p) * 0.085 * breeze;
            tuft.rotation.x = Math.cos(simTime * 1.45 + p) * 0.045 * breeze;
          }

          const waveInt = sharedUniforms.uWaveIntensity.value;
          for (let i = 0; i < kelpMeshes.length; i++) {
            const frond = kelpMeshes[i];
            const p = frond.userData.phase;
            frond.rotation.x = Math.sin(simTime * 1.45 + p) * 0.14 * (0.6 + 0.4 * waveInt);
            frond.rotation.z = Math.cos(simTime * 1.15 + p) * 0.09 * (0.6 + 0.4 * waveInt);
          }
        }

        if (activePresetTransition) {
          activePresetTransition.progress = Math.min(1.0, activePresetTransition.progress + dt * 1.45);
          const t = activePresetTransition.progress;
          const ease = 1.0 - Math.pow(1.0 - t, 3.0);

          if (activePresetKey === 'shark') {
            const sCam = computeSharkCameraOffsets();
            activePresetTransition.endPos.copy(sCam.camPos);
            activePresetTransition.endTarget.copy(sCam.camTarget);
          }

          camera.position.lerpVectors(activePresetTransition.startPos, activePresetTransition.endPos, ease);
          controls.target.lerpVectors(activePresetTransition.startTarget, activePresetTransition.endTarget, ease);

          if (t >= 1.0) {
            activePresetTransition = null;
          }
        } else if (activePresetKey === 'shark' && isPlaying) {
          const sCam = computeSharkCameraOffsets();
          const followLerp = 1.0 - Math.exp(-dt * 4.2);
          camera.position.lerp(sCam.camPos, followLerp);
          controls.target.lerp(sCam.camTarget, followLerp);
        }

        controls.update();

        // Pass 1: Render stationary seabed, strata, granite headland, reef, kelp,
        // submerged boat keels/rudders & swimming shark into refractionRT
        waterTopMesh.visible = false;
        waterWallsGroup.visible = false;
        renderer.setRenderTarget(refractionRT);
        renderer.clear();
        renderer.render(scene, camera);

        // Pass 2: Render complete diorama with refractive waves & volumetric side-walls
        waterTopMesh.visible = true;
        waterWallsGroup.visible = true;
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);

        dismissLoader();
      }

      // Start render loop immediately
      animate();
    } catch (err) {
      console.error('Diorama initialization error:', err);
      showLoaderError(err && err.message ? err.message : String(err));
    }
  </script>
</body>
</html>
