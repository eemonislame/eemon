          { x:  15.6, z: 10.2, sx: 1.7, sy: 0.90, sz: 1.5, rot: 3.5 }
        ];

        boulders.forEach((b, idx) => {
          const geo = new THREE.IcosahedronGeometry(1.0, 3);
          const pos = geo.attributes.position;
          const groundY = getBeachHeight(b.x, b.z);
          const centerY = groundY + b.sy * 0.32;
          const bCols = new Float32Array(pos.count * 3);

          for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vy = pos.getY(i);
            const vz = pos.getZ(i);
            const n1 = fbm2D(vx * 2.2 + idx * 3.1, vz * 2.2 + vy * 2.4);
            const ledge = Math.sin(vy * 7.5 + n1 * 3.0) * 0.06;
            const scale = 0.82 + n1 * 0.38 + ledge;

            const sx = vx * b.sx * scale;
            const sy = vy * b.sy * scale;
            const sz = vz * b.sz * scale;
            pos.setXYZ(i, sx, sy, sz);

            const worldY = centerY + sy;
            const c = new THREE.Color(0x6b665f).lerp(new THREE.Color(0x989187), n1);
            // Golden coastal lichen on upper dry tops
            if (vy > 0.35 && worldY > 0.5) {
              c.lerp(new THREE.Color(0x888450), smoothstepJS(0.35, 0.85, vy) * 0.42);
            }
            // Dark wet tidal splash zone below Y = +0.38m
            const wetSplash = 1.0 - smoothstepJS(0.15, 0.40, worldY);
            c.multiplyScalar(THREE.MathUtils.lerp(1.0, 0.52, wetSplash));
            // Submerged reef moss & coralline algae below sea level
            if (worldY < -0.1) {
              c.lerp(new THREE.Color(0x3a4e46), smoothstepJS(-0.1, -1.2, worldY) * 0.55);
            }

            bCols[i * 3] = c.r;
            bCols[i * 3 + 1] = c.g;
            bCols[i * 3 + 2] = c.b;
          }

          geo.setAttribute('color', new THREE.BufferAttribute(bCols, 3));
          geo.computeVertexNormals();

          const mesh = new THREE.Mesh(geo, rockMat);
          mesh.position.set(b.x, centerY, b.z);
          mesh.rotation.y = b.rot;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          rockGroup.add(mesh);
        });

        return rockGroup;
      }
      propsGroup.add(createCoastalGraniteAndReef());

      // Current-Swaying Submerged Giant Kelp Fronds on Reef Outcrops
      const kelpMeshes = [];
      function createSubmergedKelpForest() {
        const frondGeo = new THREE.PlaneGeometry(0.16, 2.3, 2, 12);
        frondGeo.translate(0, 1.15, 0);

        const fPos = frondGeo.attributes.position;
        const fCols = [];
        for (let i = 0; i < fPos.count; i++) {
          const y = fPos.getY(i);
          const t = THREE.MathUtils.clamp(y / 2.3, 0.0, 1.0);
          const ruffle = Math.sin(t * 22.0) * 0.035 * Math.sin(t * Math.PI);
          const taper = Math.sin(Math.pow(t, 0.65) * Math.PI * 0.92 + 0.12);
          fPos.setX(i, fPos.getX(i) * taper + ruffle);
          fPos.setZ(i, Math.cos(t * 16.0) * 0.025);

          fCols.push(
            THREE.MathUtils.lerp(0.14, 0.34, t),
            THREE.MathUtils.lerp(0.28, 0.46, t),
            THREE.MathUtils.lerp(0.12, 0.18, t)
          );
        }
        frondGeo.setAttribute('color', new THREE.Float32BufferAttribute(fCols, 3));
        frondGeo.computeVertexNormals();

        const kelpMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.45,
          metalness: 0.02,
          side: THREE.DoubleSide
        });

        const kelpBeds = [
          { cx: -13.6, cz:  8.2, count: 12 },
          { cx: -10.9, cz:  9.5, count: 10 },
          { cx:  13.4, cz:  8.8, count: 12 },
          { cx:  15.4, cz: 10.4, count: 10 }
        ];

        kelpBeds.forEach((bed, bIdx) => {
          for (let i = 0; i < bed.count; i++) {
            const ang = hash21(bIdx * 9.1 + i, 3.4) * Math.PI * 2;
            const rad = Math.sqrt(hash21(bIdx * 4.7 + i, 7.2)) * 1.15;
            const kx = bed.cx + Math.cos(ang) * rad;
            const kz = bed.cz + Math.sin(ang) * rad;
            const ky = getBeachHeight(kx, kz);

            const frond = new THREE.Mesh(frondGeo, kelpMat);
            frond.position.set(kx, ky - 0.05, kz);
            frond.rotation.y = ang;
            frond.scale.y = 0.65 + hash21(bIdx * 20 + i, 2.8) * 0.55;
            frond.userData.phase = kx * 0.6 + kz * 0.5 + i * 0.4;
            propsGroup.add(frond);
            kelpMeshes.push(frond);
          }
        });
      }
      createSubmergedKelpForest();

      // Fluted Scallop Shells
      function createScallopShellGeometry() {
        const geo = new THREE.PlaneGeometry(0.24, 0.22, 26, 16);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const colors = [];

        for (let i = 0; i < pos.count; i++) {
          const u = pos.getX(i) / 0.12;
          const v = THREE.MathUtils.clamp((pos.getZ(i) + 0.11) / 0.22, 0.0, 1.0);
          const fanWidth = 0.16 + 0.84 * Math.pow(v, 0.72);
          const x = u * 0.125 * fanWidth;
          const rimCurve = Math.sqrt(Math.max(0.0, 1.0 - u * u * 0.82));
          const z = (v * rimCurve - 0.45) * 0.23;
          const dome = Math.sin(v * Math.PI) * (1.0 - u * u * 0.65) * 0.04;
          const flutes = Math.cos(u * Math.PI * 11.0) * 0.007 * smoothstepJS(0.15, 0.95, v);
          pos.setXYZ(i, x, dome + flutes, z);

          const band = 0.5 + 0.5 * Math.sin(v * 22.0 + Math.abs(u) * 3.0);
          colors.push(
            THREE.MathUtils.lerp(0.95, 0.82, band),
            THREE.MathUtils.lerp(0.88, 0.62, band),
            THREE.MathUtils.lerp(0.80, 0.50, band)
          );
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        return geo;
      }

      const shellGeo = createScallopShellGeometry();
      const shellMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.28,
        metalness: 0.04,
        side: THREE.DoubleSide
      });

      [
        { x: -7.4, z: -2.8, s: 1.15, rot: 0.4 },
        { x: -4.2, z: -3.2, s: 0.95, rot: 2.1 },
        { x: -1.4, z: -2.4, s: 1.25, rot: 1.1 },
        { x:  1.8, z: -2.9, s: 1.02, rot: 4.5 },
        { x:  4.6, z: -2.2, s: 1.20, rot: 3.2 },
        { x:  8.2, z: -3.0, s: 0.95, rot: 5.1 },
        { x: 11.8, z: -2.4, s: 1.12, rot: 0.9 },
        { x: 15.4, z: -3.1, s: 0.90, rot: 2.7 },
        { x: -4.8, z:  1.1, s: 1.22, rot: 1.8 },
        { x: -1.2, z:  1.8, s: 1.05, rot: 4.1 },
        { x:  3.4, z:  1.2, s: 1.18, rot: 0.3 },
        { x:  7.2, z:  2.4, s: 0.98, rot: 2.6 },
        { x: 10.8, z:  1.9, s: 1.14, rot: 5.4 },
        { x:  0.8, z:  3.8, s: 1.08, rot: 1.4 }
      ].forEach((loc) => {
        const mesh = new THREE.Mesh(shellGeo, shellMat);
        const y = getBeachHeight(loc.x, loc.z);
        mesh.position.set(loc.x, y + 0.005, loc.z);
        mesh.scale.setScalar(loc.s);
        const hX = getBeachHeight(loc.x + 0.1, loc.z);
        const hZ = getBeachHeight(loc.x, loc.z + 0.1);
        mesh.rotation.set(Math.atan2(hZ - y, 0.1), loc.rot, -Math.atan2(hX - y, 0.1));
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        propsGroup.add(mesh);
      });

      // Wave-Tumbled Coastal Pebbles
      const pebbleBaseGeo = new THREE.IcosahedronGeometry(0.11, 2);
      const pPos = pebbleBaseGeo.attributes.position;
      for (let i = 0; i < pPos.count; i++) {
        const vx = pPos.getX(i);
        const vy = pPos.getY(i);
        const vz = pPos.getZ(i);
        const n = 0.88 + 0.22 * valueNoise2D(vx * 18.0 + vz * 14.0, vy * 18.0);
        pPos.setXYZ(i, vx * 1.25 * n, vy * 0.56 * n, vz * 0.95 * n);
      }
      pebbleBaseGeo.computeVertexNormals();

      const pebbleMat = new THREE.MeshStandardMaterial({ roughness: 0.22, metalness: 0.05 });
      const PEBBLE_COUNT = 140;
      const pebbleInstanced = new THREE.InstancedMesh(pebbleBaseGeo, pebbleMat, PEBBLE_COUNT);
      pebbleInstanced.castShadow = true;
      pebbleInstanced.receiveShadow = true;

      const pebblePalette = [
        new THREE.Color(0x3a3f47),
        new THREE.Color(0x6e655c),
        new THREE.Color(0xd8cfc2),
        new THREE.Color(0x8c5a3c),
        new THREE.Color(0x526b62),
        new THREE.Color(0x76b5a0)
      ];

      const dummy = new THREE.Object3D();
      for (let i = 0; i < PEBBLE_COUNT; i++) {
        const px = (hash21(i * 3.1, 1.7) - 0.5) * 40.0;
        const pz = -4.5 + hash21(i * 7.3, 4.9) * 16.0;
        const py = getBeachHeight(px, pz);

        dummy.position.set(px, py - 0.01, pz);
        dummy.rotation.set(
          (hash21(i, 9.1) - 0.5) * 0.35,
          hash21(i, 2.3) * Math.PI * 2,
          (hash21(i, 5.7) - 0.5) * 0.35
        );
        const s = 0.55 + hash21(i * 1.9, 8.2) * 1.4;
        dummy.scale.set(s, s * (0.75 + hash21(i, 3.3) * 0.4), s * 0.9);
        dummy.updateMatrix();

        pebbleInstanced.setMatrixAt(i, dummy.matrix);
        pebbleInstanced.setColorAt(i, pebblePalette[i % pebblePalette.length]);
      }
      pebbleInstanced.instanceMatrix.needsUpdate = true;
      if (pebbleInstanced.instanceColor) pebbleInstanced.instanceColor.needsUpdate = true;
      propsGroup.add(pebbleInstanced);

      // Weathered Driftwood Log
      function createDriftwoodProp() {
        const woodGroup = new THREE.Group();
        const woodMat = new THREE.MeshStandardMaterial({
          map: oakTrimTex,
          color: 0xb7a796,
          roughness: 0.86,
          metalness: 0.02
        });

        const mainCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(5.8, getBeachHeight(5.8, -5.2) + 0.06, -5.2),
          new THREE.Vector3(7.6, getBeachHeight(7.6, -4.8) + 0.14, -4.8),
          new THREE.Vector3(9.4, getBeachHeight(9.4, -5.1) + 0.13, -5.1),
          new THREE.Vector3(11.2, getBeachHeight(11.2, -4.6) + 0.06, -4.6)
        ]);
        const trunkGeo = new THREE.TubeGeometry(mainCurve, 48, 0.19, 14, false);
        const tPos = trunkGeo.attributes.position;
        for (let i = 0; i < tPos.count; i++) {
          const vx = tPos.getX(i);
          const vy = tPos.getY(i);
          const vz = tPos.getZ(i);
          const t = THREE.MathUtils.clamp((vx - 5.8) / 5.4, 0.0, 1.0);
          const center = mainCurve.getPointAt(t);
          const taper = 1.18 - 0.58 * t + 0.12 * Math.sin(t * 14.0);
          tPos.setXYZ(
            i,
            center.x + (vx - center.x) * taper,
            center.y + (vy - center.y) * taper,
            center.z + (vz - center.z) * taper
          );
        }
        trunkGeo.computeVertexNormals();
        const trunkMesh = new THREE.Mesh(trunkGeo, woodMat);
        trunkMesh.castShadow = true;
        trunkMesh.receiveShadow = true;
        woodGroup.add(trunkMesh);

        const branchCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(7.9, getBeachHeight(7.9, -4.85) + 0.15, -4.85),
          new THREE.Vector3(8.7, getBeachHeight(8.7, -5.55) + 0.24, -5.55),
          new THREE.Vector3(9.5, getBeachHeight(9.5, -6.05) + 0.14, -6.05)
        ]);
        const branchMesh = new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 24, 0.09, 10, false), woodMat);
        branchMesh.castShadow = true;
        woodGroup.add(branchMesh);

        return woodGroup;
      }
      propsGroup.add(createDriftwoodProp());

      // Shallow Starfish
      function createStarfishProp(cx, cz) {
        const geo = new THREE.CylinderGeometry(0.28, 0.30, 0.05, 84, 5, false);
        const pos = geo.attributes.position;
        const colors = [];

        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const vz = pos.getZ(i);
          const r = Math.hypot(vx, vz);
          const angle = Math.atan2(vz, vx);
          const armWave = Math.cos(angle * 5.0 + 0.35 * Math.sin(angle * 2.0));
          const starRadius = 0.11 + 0.19 * Math.pow(Math.max(0.0, 0.5 + 0.5 * armWave), 1.65);

          const normR = r / 0.29;
          const scaledR = normR * starRadius;
          const nx = Math.cos(angle) * scaledR;
          const nz = Math.sin(angle) * scaledR;

          const spine = Math.max(0.0, armWave) * (1.0 - normR * 0.75);
          const ossicle = (valueNoise2D(nx * 90.0, nz * 90.0) - 0.5) * 0.008;
          const ny = vy > 0 ? (0.014 + (1.0 - normR * 0.82) * 0.036 + spine * 0.018 + ossicle) : -0.004;

          const groundY = getBeachHeight(cx + nx, cz + nz);
          pos.setXYZ(i, cx + nx, groundY + ny, cz + nz);

          const ridgeHighlight = smoothstepJS(0.3, 0.95, spine + ossicle * 18.0);
          colors.push(
            THREE.MathUtils.lerp(0.84, 0.96, ridgeHighlight),
            THREE.MathUtils.lerp(0.34, 0.68, ridgeHighlight),
            THREE.MathUtils.lerp(0.20, 0.52, ridgeHighlight)
          );
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.computeVertexNormals();

        const mesh = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.02 })
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }
      propsGroup.add(createStarfishProp(-2.2, 1.85));
      propsGroup.add(createStarfishProp(6.2, 2.35));

      // Coastal Dune Grass Tufts on Upper Dry Berm
      const grassTufts = [];
      function createDuneGrassClusters() {
        const bladeGeo = new THREE.PlaneGeometry(0.034, 0.92, 1, 6);
        bladeGeo.translate(0, 0.46, 0);

        const bPos = bladeGeo.attributes.position;
        const bCols = [];
        for (let i = 0; i < bPos.count; i++) {
          const y = bPos.getY(i);
          const t = THREE.MathUtils.clamp(y / 0.92, 0.0, 1.0);
          const taper = 1.0 - Math.pow(t, 1.35);
          const archZ = Math.pow(t, 2.1) * 0.24;
          bPos.setX(i, bPos.getX(i) * taper);
          bPos.setZ(i, bPos.getZ(i) + archZ);

          bCols.push(
            THREE.MathUtils.lerp(0.34, 0.78, t),
            THREE.MathUtils.lerp(0.44, 0.72, t),
            THREE.MathUtils.lerp(0.24, 0.42, t)
          );
        }
        bladeGeo.setAttribute('color', new THREE.Float32BufferAttribute(bCols, 3));
        bladeGeo.computeVertexNormals();

        const grassMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.68,
          metalness: 0.0,
          side: THREE.DoubleSide
        });

        const tussocks = [
          { cx: -18.2, cz: -14.8, count: 16 },
          { cx: -13.6, cz: -15.4, count: 18 },
          { cx:  -8.4, cz: -14.2, count: 16 },
          { cx:  -3.2, cz: -15.8, count: 18 },
          { cx:   2.4, cz: -14.4, count: 18 },
          { cx:   7.8, cz: -15.2, count: 16 },
          { cx:  13.2, cz: -14.0, count: 16 },
          { cx:  18.4, cz: -15.4, count: 18 },
          { cx: -10.5, cz: -10.8, count: 14 },
          { cx:  -1.8, cz: -11.2, count: 14 },
          { cx:   6.4, cz: -10.4, count: 14 },
          { cx:  15.6, cz: -10.6, count: 14 }
        ];

        tussocks.forEach((tussock, tIdx) => {
          const tuftGroup = new THREE.Group();
          const gy = getBeachHeight(tussock.cx, tussock.cz);
          tuftGroup.position.set(tussock.cx, gy - 0.02, tussock.cz);
          tuftGroup.userData.phase = tussock.cx * 0.7 + tussock.cz * 0.6;

          for (let i = 0; i < tussock.count; i++) {
            const angle = hash21(tIdx * 13.7 + i, 2.1) * Math.PI * 2;
            const radius = Math.sqrt(hash21(tIdx * 5.3 + i, 8.4)) * 0.75;
            const blade = new THREE.Mesh(bladeGeo, grassMat);
            blade.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            blade.rotation.set(
              (hash21(tIdx * 30 + i, 3.1) - 0.5) * 0.25,
              angle + (hash21(tIdx * 30 + i, 6.7) - 0.5) * 0.8,
              (hash21(tIdx * 30 + i, 9.4) - 0.5) * 0.25
            );
            blade.scale.y = 0.65 + hash21(tIdx * 30 + i, 1.5) * 0.72;
            blade.castShadow = true;
            tuftGroup.add(blade);
          }

          propsGroup.add(tuftGroup);
          grassTufts.push(tuftGroup);
        });
      }
      createDuneGrassClusters();

      // =========================================================================
      // 11. INTERACTIVE STUDIO CONTROLS, CAMERA PRESETS & RESIZE
      // =========================================================================
      let isPlaying = true;
      let simTime = 2.4;
      let activePresetKey = 'hero';
      let activePresetTransition = null;

      const sunSlider = document.getElementById('sun-slider');
      const sunVal = document.getElementById('sun-val');
      const waveSlider = document.getElementById('wave-slider');
      const waveVal = document.getElementById('wave-val');
      const claritySlider = document.getElementById('clarity-slider');
      const clarityVal = document.getElementById('clarity-val');
      const breezeSlider = document.getElementById('breeze-slider');
      const breezeVal = document.getElementById('breeze-val');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const resetBtn = document.getElementById('reset-btn');
      const collapseBtn = document.getElementById('collapse-btn');
      const panelHeader = document.getElementById('panel-header');
      const panelBody = document.getElementById('panel-body');
      const presetButtons = document.querySelectorAll('.preset-btn');

      function formatSunLabel(deg) {
        if (deg <= 16) return `${deg}° (Golden Hour)`;
        if (deg <= 24) return `${deg}° (Warm Morning)`;
        if (deg <= 48) return `${deg}° (Afternoon)`;
        return `${deg}° (High Noon)`;
      }

      function formatClarityLabel(val) {
        if (val <= 0.7) return `${val.toFixed(2)} (Emerald)`;
        if (val <= 1.28) return `${val.toFixed(2)} (Crystal)`;
        return `${val.toFixed(2)} (Ultra-Clear)`;
      }

      updateSunAndEnvironment(parseFloat(sunSlider.value));
      sunVal.textContent = formatSunLabel(parseFloat(sunSlider.value));

      sunSlider.addEventListener('input', (e) => {
        const deg = parseFloat(e.target.value);
        sunVal.textContent = formatSunLabel(deg);
        updateSunAndEnvironment(deg);
      });

      waveSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uWaveIntensity.value = val;
        waveVal.textContent = `${val.toFixed(2)}×`;
      });

      claritySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uWaterClarity.value = val;
        clarityVal.textContent = formatClarityLabel(val);
      });

      breezeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sharedUniforms.uBreeze.value = val;
        breezeVal.textContent = `${val.toFixed(2)}×`;
      });

      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? 'Pause' : 'Resume';
      });

      function computeSharkCameraOffsets() {
        const forward = new THREE.Vector3(Math.sin(sharkState.yaw), 0, Math.cos(sharkState.yaw));
        const right = new THREE.Vector3(forward.z, 0, -forward.x);
        const camPos = sharkState.pos.clone()
          .addScaledVector(forward, -3.6)
          .addScaledVector(right, 4.4)
          .add(new THREE.Vector3(0, 1.15, 0));
        const camTarget = sharkState.pos.clone().addScaledVector(forward, 0.55);
        return { camPos, camTarget };
      }

      function triggerCameraPreset(presetKey) {
        const preset = CAMERA_PRESETS[presetKey];
        if (!preset) return;

        activePresetKey = presetKey;
        presetButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.preset === presetKey);
        });

        let endPos = preset.pos.clone();
        let endTarget = preset.target.clone();
        if (presetKey === 'shark') {
          const sCam = computeSharkCameraOffsets();
          endPos = sCam.camPos;
          endTarget = sCam.camTarget;
        }

        activePresetTransition = {
          startPos: camera.position.clone(),
          endPos,
          startTarget: controls.target.clone(),
          endTarget,
          progress: 0.0
        };
      }

      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          triggerCameraPreset(btn.dataset.preset);
        });
      });

      resetBtn.addEventListener('click', () => {
        triggerCameraPreset('hero');
      });

      controls.addEventListener('start', () => {
        activePresetTransition = null;
        if (activePresetKey === 'shark') {
          activePresetKey = 'custom';
        }
      });

      let panelCollapsed = false;
      collapseBtn.addEventListener('click', () => {
        panelCollapsed = !panelCollapsed;
        panelBody.classList.toggle('hidden', panelCollapsed);
        panelHeader.classList.toggle('collapsed', panelCollapsed);
        collapseBtn.textContent = panelCollapsed ? '+' : '−';
      });

      function handleResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);

        renderer.getDrawingBufferSize(rtSize);
        refractionRT.setSize(Math.max(1, Math.floor(rtSize.x)), Math.max(1, Math.floor(rtSize.y)));
        sharedUniforms.uResolution.value.copy(rtSize);
      }
      window.addEventListener('resize', handleResize);

      // Initialize fleet & shark poses before first render
      updateFleetPhysics(simTime, 0);
      updateSharkMotion(simTime, 0);

      // =========================================================================
      // 12. TWO-PASS REFRACTION RENDER LOOP & IMMEDIATE LOADER DISMISSAL
      // =========================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        if (isPlaying) {
          simTime += dt;
          sharedUniforms.uTime.value = simTime;
          updateFleetPhysics(simTime, dt);
          updateSharkMotion(simTime, dt);

          // Gentle coastal breeze sway on dune grass & underwater kelp
          const breeze = sharedUniforms.uBreeze.value;
          for (let i = 0; i < grassTufts.length; i++) {
            const tuft = grassTufts[i];
            const p = tuft.userData.phase;
            tuft.rotation.z = Math.sin(simTime * 1.85 + p) * 0.085 * breeze;
            tuft.rotation.x = Math.cos(simTime * 1.45 + p) * 0.045 * breeze;
          }

          const waveInt = sharedUniforms.uWaveIntensity.value;
          for (let i = 0; i < kelpMeshes.length; i++) {
            const frond = kelpMeshes[i];
            const p = frond.userData.phase;
            frond.rotation.x = Math.sin(simTime * 1.45 + p) * 0.14 * (0.6 + 0.4 * waveInt);
            frond.rotation.z = Math.cos(simTime * 1.15 + p) * 0.09 * (0.6 + 0.4 * waveInt);
          }
        }

        if (activePresetTransition) {
          activePresetTransition.progress = Math.min(1.0, activePresetTransition.progress + dt * 1.45);
          const t = activePresetTransition.progress;
          const ease = 1.0 - Math.pow(1.0 - t, 3.0);

          if (activePresetKey === 'shark') {
            const sCam = computeSharkCameraOffsets();
            activePresetTransition.endPos.copy(sCam.camPos);
            activePresetTransition.endTarget.copy(sCam.camTarget);
          }

          camera.position.lerpVectors(activePresetTransition.startPos, activePresetTransition.endPos, ease);
          controls.target.lerpVectors(activePresetTransition.startTarget, activePresetTransition.endTarget, ease);

          if (t >= 1.0) {
            activePresetTransition = null;
          }
        } else if (activePresetKey === 'shark' && isPlaying) {
          const sCam = computeSharkCameraOffsets();
          const followLerp = 1.0 - Math.exp(-dt * 4.2);
          camera.position.lerp(sCam.camPos, followLerp);
          controls.target.lerp(sCam.camTarget, followLerp);
        }

        controls.update();

        // Pass 1: Render stationary seabed, strata, granite headland, reef, kelp,
        // submerged boat keels/rudders & swimming shark into refractionRT
        waterTopMesh.visible = false;
        waterWallsGroup.visible = false;
        renderer.setRenderTarget(refractionRT);
        renderer.clear();
        renderer.render(scene, camera);

        // Pass 2: Render complete diorama with refractive waves & volumetric side-walls
        waterTopMesh.visible = true;
        waterWallsGroup.visible = true;
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);

        dismissLoader();
      }

      // Start render loop immediately
      animate();
    } catch (err) {
      console.error('Diorama initialization error:', err);
      showLoaderError(err && err.message ? err.message : String(err));
    }
  </script>
</body>
</html>
