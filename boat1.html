<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photorealistic 3D Beach Cutout Diorama — Three.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a121d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: radial-gradient(circle at 50% 42%, #192638 0%, #0d1522 62%, #070b12 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Studio HUD Overlay Layer */
    .hud-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* Top-Left Compact Diorama Title Badge */
    .title-badge {
      position: fixed;
      top: 18px;
      left: 18px;
      pointer-events: auto;
      background: rgba(10, 17, 28, 0.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.48);
      max-width: calc(100vw - 300px);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      flex-shrink: 0;
    }

    .title-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .subtitle-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.35;
    }

    /* Top-Right Collapsible Studio Controls Panel */
    .control-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 254px;
      pointer-events: auto;
      background: rgba(10, 17, 28, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.52);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-header.collapsed {
      padding-bottom: 0;
      border-bottom: none;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    .collapse-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }

    .collapse-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .panel-body {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .panel-body.hidden {
      display: none;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #cbd5e1;
    }

    .slider-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #7dd3fc;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-primary {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-primary:hover {
      background: rgba(56, 189, 248, 0.32);
    }

    .btn-secondary {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #cbd5e1;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Bottom-Center Camera Preset Pill Bar */
    .preset-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      background: rgba(10, 17, 28, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .preset-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .preset-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .preset-btn.active {
      background: #38bdf8;
      color: #08101c;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.45);
    }

    /* Fullscreen Loading & Error Overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0a121d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.45s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.22);
      border-top-color: #38bdf8;
      animation: spin 0.85s linear infinite;
    }

    .loader-label {
      font-size: 12px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #cbd5e1;
      max-width: 480px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 720px) {
      .title-badge {
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: none;
        padding: 9px 12px;
      }

      .subtitle-text {
        display: none;
      }

      .control-panel {
        top: 62px;
        right: 12px;
        width: 224px;
        padding: 11px;
      }

      .preset-bar {
        bottom: 12px;
        border-radius: 16px;
        padding: 6px;
        gap: 5px;
      }

      .preset-btn {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>

  <!-- Global Safeguard Script so Loader Never Freezes Silently -->
  <script>
    window.addEventListener('error', function (ev) {
      var lbl = document.getElementById('loader-label');
      var spn = document.getElementById('loader-spinner');
      if (spn) spn.style.display = 'none';
      if (lbl) {
        lbl.style.color = '#fca5a5';
        lbl.textContent = 'Scene error: ' + (ev && ev.message ? ev.message : 'Unable to initialize WebGL.');
      }
    });
  </script>

  <!-- Pinned Three.js r160 ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }

  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <!-- Top-Left Title Badge -->
    <div class="title-badge">
      <div class="title-row">
        <span class="status-dot"></span>
        <span class="title-text">Photorealistic 3D Beach Cutout Diorama</span>
      </div>
      <div class="subtitle-text">
        44m × 46m Geological Slice • Coastal Fishing Hut • Pelagic Shark • Wave-Coupled Fleet
      </div>
    </div>

    <!-- Top-Right Collapsible Studio Controls -->
    <div class="control-panel">
      <div id="panel-header" class="panel-header">
        <span class="panel-title">Studio Controls</span>
        <button id="collapse-btn" class="collapse-btn" title="Toggle Controls">−</button>
      </div>
      <div id="panel-body" class="panel-body">
        <div class="slider-group">
          <div class="slider-label-row">
            <span>Sun Elevation</span>
            <span id="sun-val" class="slider-val">28° (Afternoon)</span>
          </div>
          <input id="sun-slider" type="range" min="10" max="75" step="0.5" value="28" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Wave Energy</span>
            <span id="wave-val" class="slider-val">1.00×</span>
          </div>
          <input id="wave-slider" type="range" min="0.2" max="1.8" step="0.05" value="1.0" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Water Clarity</span>
            <span id="clarity-val" class="slider-val">1.20 (Crystal)</span>
          </div>
          <input id="clarity-slider" type="range" min="0.3" max="1.8" step="0.05" value="1.20" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Breeze &amp; Boat Swing</span>
            <span id="breeze-val" class="slider-val">1.00×</span>
          </div>
          <input id="breeze-slider" type="range" min="0.2" max="1.8" step="0.05" value="1.0" />
        </div>

        <div class="action-row">
          <button id="play-pause-btn" class="btn-primary">Pause</button>
          <button id="reset-btn" class="btn-secondary" title="Reset Camera">Reset</button>
        </div>
      </div>
    </div>

    <!-- Bottom-Center Camera Preset Pill Bar -->
    <div class="preset-bar">
      <button data-preset="hero" class="preset-btn active">Panoramic Hero</button>
      <button data-preset="shark" class="preset-btn">Shark Patrol Cam</button>
      <button data-preset="boats" class="preset-btn">Sailboat &amp; Cove</button>
      <button data-preset="swash" class="preset-btn">Fishing Hut &amp; Shore</button>
      <button data-preset="section" class="preset-btn">Deep Cut-Out Profile</button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loader">
    <div id="loader-spinner" class="spinner"></div>
    <div id="loader-label" class="loader-label">Sculpting Coastal Cut-Out &amp; Marine Life…</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const loaderEl = document.getElementById('loader');
    const loaderLabel = document.getElementById('loader-label');
    const loaderSpinner = document.getElementById('loader-spinner');
    let loaderDismissed = false;

    function dismissLoader() {
      if (loaderDismissed || !loaderEl) return;
      loaderDismissed = true;
      loaderEl.style.opacity = '0';
      setTimeout(() => {
        loaderEl.style.display = 'none';
      }, 450);
    }

    function showLoaderError(msg) {
      if (loaderSpinner) loaderSpinner.style.display = 'none';
      if (loaderLabel) {
        loaderLabel.style.color = '#fca5a5';
        loaderLabel.textContent = `Initialization notice: ${msg}`;
      }
    }

    try {
      // =========================================================================
      // 1. DIORAMA DIMENSIONS & DETERMINISTIC NOISE / STATIC TOPOGRAPHY
      // =========================================================================
      const DIORAMA_W = 44.0;          // X: -22.0m to +22.0m
      const DIORAMA_D = 46.0;          // Z: -23.0m to +23.0m (Extended Sea Basin)
      const HALF_W = DIORAMA_W * 0.5;  // 22.0m
      const HALF_D = DIORAMA_D * 0.5;  // 23.0m
      const BASE_Y = -7.60;            // Geological strata base elevation
      const SEG_X = 220;               // Static terrain & water X grid resolution
      const SEG_Z = 220;               // Static terrain & water Z grid resolution

      function fract(x) {
        return x - Math.floor(x);
      }

      function smoothstepJS(edge0, edge1, x) {
        const t = Math.max(0.0, Math.min(1.0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3.0 - 2.0 * t);
      }

      function hash21(x, y) {
        let px = fract(x * 0.1031);
        let py = fract(y * 0.1030);
        let pz = fract(x * 0.0973);
        const d = px * (py + 33.33) + py * (pz + 33.33) + pz * (px + 33.33);
        px += d;
        py += d;
        pz += d;
        return fract((px + py) * pz);
      }

      function valueNoise2D(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        const a = hash21(ix, iy);
        const b = hash21(ix + 1, iy);
        const c = hash21(ix, iy + 1);
        const d = hash21(ix + 1, iy + 1);

        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      function fbm2D(x, y) {
        let v = 0.0;
        let amp = 0.5;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          v += amp * valueNoise2D(x * freq, y * freq);
          freq *= 2.03;
          amp *= 0.5;
        }
        return v;
      }

      /**
       * 100% STATIC COASTAL & SUBMARINE TOPOGRAPHY: y = getBeachHeight(x, z)
       * Never depends on time — ensures seabed sand is completely rock-solid.
       */
      function getBeachHeight(x, z) {
        const coveCurve = Math.sin((x + 1.6) * 0.16) * 1.45 - Math.cos(x * 0.09) * 0.55;
        const headlandPromontory = Math.exp(-Math.pow((x + 17.5) / 4.8, 2.0)) * 2.15;
        const effectiveZ = z + 3.5 + coveCurve - headlandPromontory;

        // Upper dry golden-sand beach berm & dunes (Z: -23 to -9.5)
        const duneT = Math.max(0.0, (-4.5 - effectiveZ) / 15.0);
        const duneProfile = Math.pow(duneT, 1.50) * 1.85;
        const duneRidge = Math.exp(-Math.pow((effectiveZ + 13.4) / 3.4, 2.0)) * (0.34 + 0.22 * Math.sin(x * 0.28 + 0.6));

        // Crescentic sloping foreshore & glossy wet-sand swash zone
        const foreshoreSlope = 0.66 - (effectiveZ + 4.5) * 0.195;

        // Shallow submerged nearshore sandbar
        const offshoreBar = Math.exp(-Math.pow((effectiveZ - 3.2) / 1.45, 2.0)) * 0.26;

        // Shelf drop-off into extended deep pelagic ocean basin (out to Z = +23.0m)
        const shelfDrop = smoothstepJS(3.8, 7.8, effectiveZ) * 2.38;
        const deepBasinFloor = smoothstepJS(7.2, 26.5, effectiveZ) * 0.78;

        let h = duneProfile + duneRidge + foreshoreSlope + offshoreBar - shelfDrop - deepBasinFloor;

        // Left granite headland promontory (X < -10) with tiered ledges & two carved tidepools
        const headlandShelf = smoothstepJS(-10.2, -18.2, x) * Math.exp(-Math.pow((z + 6.7) / 7.5, 2.0)) * 1.18;
        const ledgeStep = Math.floor(headlandShelf * 4.5) * 0.055 * smoothstepJS(-10.5, -15.0, x);
        const tidePool1 = Math.exp(-((x + 15.2) * (x + 15.2) * 0.45 + (z + 4.0) * (z + 4.0) * 0.72)) * 0.78;
        const tidePool2 = Math.exp(-((x + 18.0) * (x + 18.0) * 0.52 + (z + 2.1) * (z + 2.1) * 0.65)) * 0.68;
        h += headlandShelf + ledgeStep - tidePool1 - tidePool2;

        // Rhythmic crescentic beach cusps along the intertidal swash zone
        const cuspEnv = Math.exp(-Math.pow((effectiveZ + 2.2) / 2.6, 2.0)) * smoothstepJS(-12.5, -7.0, x);
        const beachCusps = Math.cos(x * 0.90 + 0.4) * 0.072 * cuspEnv;
        h += beachCusps;

        // Natural macro terrain undulations
        const macroNoise = (fbm2D(x * 0.14 + 3.7, z * 0.14 + 2.1) - 0.5) * 0.30;
        h += macroNoise * (0.35 + 0.65 * smoothstepJS(0.0, 6.0, Math.abs(effectiveZ + 1.0)));

        // Wind-sculpted asymmetric sand ripples on the dry upper berm (h > 0.42)
        const dryMask = smoothstepJS(0.38, 0.84, h);
        const windPhase = (z * 4.2 + x * 1.15) + fbm2D(x * 0.65, z * 0.65) * 2.4;
        const windRipples = (Math.sin(windPhase) + 0.32 * Math.sin(windPhase * 2.0)) * 0.017 * dryMask;

        // Stationary wave-carved oscillatory sand ripples on the shallow submerged sandbar
        const subMask = smoothstepJS(0.06, -0.32, h) * (1.0 - smoothstepJS(-3.6, -4.8, h));
        const seabedRipplePhase = (effectiveZ * 6.2 + Math.sin(x * 0.55) * 1.3) + fbm2D(x * 0.50, z * 0.50) * 1.8;
        const seabedRipples = Math.sin(seabedRipplePhase) * 0.025 * subMask;

        return Math.max(-5.55, h + windRipples + seabedRipples);
      }

      // =========================================================================
      // 2. IDENTICAL SHARED GERSTNER SWELL + SWASH WAVE PHYSICS (JS & GLSL)
      // =========================================================================
      function gerstnerWaveJS(x, z, dirX, dirZ, steepness, wavelength, speed, time) {
        const k = (Math.PI * 2.0) / wavelength;
        const c = Math.sqrt(9.81 / k) * speed;
        const len = Math.hypot(dirX, dirZ);
        const dx = dirX / len;
        const dz = dirZ / len;
        const f = k * (dx * x + dz * z - c * time);
        const a = steepness / k;
        return {
          x: dx * (a * Math.cos(f)),
          y: a * Math.sin(f),
          z: dz * (a * Math.cos(f))
        };
      }

      function evaluateOceanWaveJS(x, z, time, intensity) {
        const sandY = getBeachHeight(x, z);
        const clampedInt = Math.max(0.15, Math.min(2.0, intensity));

        const waveSet = 0.5 + 0.5 * Math.sin(time * 0.52 + x * 0.07);
        const lateralPhase = x * 0.09 + Math.sin(x * 0.28) * 0.26 + Math.cos(x * 0.64) * 0.09;
        const primaryPhase = time * 1.56 + lateralPhase;

        const asymPhase = primaryPhase - 0.56 * Math.sin(primaryPhase);
        const swashOsc = 0.5 + 0.5 * Math.sin(asymPhase);
        const swashVel = Math.cos(asymPhase) * (1.0 - 0.56 * Math.cos(primaryPhase));

        const baseWaterLevel = -0.05;
        const maxRunupReach = (0.36 + 0.30 * waveSet) * (0.45 + 0.55 * clampedInt);
        const currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

        const g1 = gerstnerWaveJS(x, z, -0.14, -0.990, 0.23 * clampedInt, 8.8, 0.90, time);
        const g2 = gerstnerWaveJS(x, z,  0.21, -0.978, 0.18 * clampedInt, 5.8, 0.94, time);
        const g3 = gerstnerWaveJS(x, z, -0.09, -0.996, 0.14 * clampedInt, 3.9, 0.98, time);
        const g4 = gerstnerWaveJS(x, z,  0.28, -0.960, 0.10 * clampedInt, 2.6, 1.03, time);
        const g5 = gerstnerWaveJS(x, z, -0.24, -0.971, 0.07 * clampedInt, 1.65, 1.07, time);
        const g6 = gerstnerWaveJS(x, z,  0.12, -0.993, 0.05 * clampedInt, 1.08, 1.12, time);

        const sumX = g1.x + g2.x + g3.x + g4.x + g5.x + g6.x;
        const sumY = g1.y + g2.y + g3.y + g4.y + g5.y + g6.y;
        const sumZ = g1.z + g2.z + g3.z + g4.z + g5.z + g6.z;

        const deepOceanMask = smoothstepJS(0.18, -0.58, sandY);
        const shoalBoost = 1.0 + 0.28 * Math.exp(-Math.pow((sandY + 0.42) / 0.34, 2.0));

        const borderLockX = smoothstepJS(HALF_W, HALF_W - 0.75, Math.abs(x));
        const borderLockZ = smoothstepJS(HALF_D, HALF_D - 0.75, Math.abs(z));
        const horizMask = deepOceanMask * borderLockX * borderLockZ;

        const swellVertical = sumY * deepOceanMask * shoalBoost;
        const swashSheetThickness = Math.max(0.0, currentSwashY - sandY);
        const boreLip = smoothstepJS(0.0, 0.12, swashSheetThickness)
                      * (1.0 - smoothstepJS(0.12, 0.38, swashSheetThickness))
                      * 0.022 * clampedInt;

        const shoreBlend = smoothstepJS(-0.24, 0.14, sandY);
        const targetWaterY = (baseWaterLevel + swellVertical) * (1.0 - shoreBlend) + (currentSwashY + boreLip) * shoreBlend;
        const depth = targetWaterY - sandY;

        return {
          displacedX: x + sumX * horizMask * shoalBoost,
          displacedY: depth > 0.0 ? targetWaterY : sandY - 0.03,
          displacedZ: z + sumZ * horizMask * shoalBoost,
          waterY: targetWaterY,
          sandY,
          depth,
          swashVelocity: swashVel
        };
      }

      const GLSL_SHARED_NOISE_AND_WAVES = /* glsl */ `
        float hash21(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        float valueNoise2D(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash21(i);
          float b = hash21(i + vec2(1.0, 0.0));
          float c = hash21(i + vec2(0.0, 1.0));
          float d = hash21(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        float fbm2D(vec2 p) {
          float v = 0.0;
          float amp = 0.5;
          float freq = 1.0;
          for (int i = 0; i < 4; i++) {
            v += amp * valueNoise2D(p * freq);
            freq *= 2.03;
            amp *= 0.5;
          }
          return v;
        }

        float getSandElevation(vec2 xz) {
          float x = xz.x;
          float z = xz.y;

          float coveCurve = sin((x + 1.6) * 0.16) * 1.45 - cos(x * 0.09) * 0.55;
          float headlandPromontory = exp(-pow((x + 17.5) / 4.8, 2.0)) * 2.15;
          float effectiveZ = z + 3.5 + coveCurve - headlandPromontory;

          float duneT = max(0.0, (-4.5 - effectiveZ) / 15.0);
          float duneProfile = pow(duneT, 1.50) * 1.85;
          float duneRidge = exp(-pow((effectiveZ + 13.4) / 3.4, 2.0)) * (0.34 + 0.22 * sin(x * 0.28 + 0.6));

          float foreshoreSlope = 0.66 - (effectiveZ + 4.5) * 0.195;
          float offshoreBar = exp(-pow((effectiveZ - 3.2) / 1.45, 2.0)) * 0.26;
          float shelfDrop = smoothstep(3.8, 7.8, effectiveZ) * 2.38;
          float deepBasinFloor = smoothstep(7.2, 26.5, effectiveZ) * 0.78;

          float h = duneProfile + duneRidge + foreshoreSlope + offshoreBar - shelfDrop - deepBasinFloor;

          float headlandShelf = smoothstep(-10.2, -18.2, x) * exp(-pow((z + 6.7) / 7.5, 2.0)) * 1.18;
          float ledgeStep = floor(headlandShelf * 4.5) * 0.055 * smoothstep(-10.5, -15.0, x);
          float tidePool1 = exp(-((x + 15.2) * (x + 15.2) * 0.45 + (z + 4.0) * (z + 4.0) * 0.72)) * 0.78;
          float tidePool2 = exp(-((x + 18.0) * (x + 18.0) * 0.52 + (z + 2.1) * (z + 2.1) * 0.65)) * 0.68;
          h += headlandShelf + ledgeStep - tidePool1 - tidePool2;

          float cuspEnv = exp(-pow((effectiveZ + 2.2) / 2.6, 2.0)) * smoothstep(-12.5, -7.0, x);
          float beachCusps = cos(x * 0.90 + 0.4) * 0.072 * cuspEnv;
          h += beachCusps;

          float macroNoise = (fbm2D(vec2(x * 0.14 + 3.7, z * 0.14 + 2.1)) - 0.5) * 0.30;
          h += macroNoise * (0.35 + 0.65 * smoothstep(0.0, 6.0, abs(effectiveZ + 1.0)));

          float dryMask = smoothstep(0.38, 0.84, h);
          float windPhase = (z * 4.2 + x * 1.15) + fbm2D(vec2(x * 0.65, z * 0.65)) * 2.4;
          float windRipples = (sin(windPhase) + 0.32 * sin(windPhase * 2.0)) * 0.017 * dryMask;

          float subMask = smoothstep(0.06, -0.32, h) * (1.0 - smoothstep(-3.6, -4.8, h));
          float seabedRipplePhase = (effectiveZ * 6.2 + sin(x * 0.55) * 1.3) + fbm2D(vec2(x * 0.50, z * 0.50)) * 1.8;
          float seabedRipples = sin(seabedRipplePhase) * 0.025 * subMask;

          return max(-5.55, h + windRipples + seabedRipples);
        }

        vec3 gerstnerWave(vec2 pos, vec2 dir, float steepness, float wavelength, float speed, float time) {
          float k = 6.2831853 / wavelength;
          float c = sqrt(9.81 / k) * speed;
          vec2 d = normalize(dir);
          float f = k * (dot(d, pos) - c * time);
          float a = steepness / k;
          return vec3(
            d.x * (a * cos(f)),
            a * sin(f),
            d.y * (a * cos(f))
          );
        }

        struct WaveState {
          vec3 displacedPos;
          float waterY;
          float depth;
          float swashVelocity;
          float crestFactor;
        };

        WaveState evaluateOceanWave(vec2 baseXZ, float sandY, float time, float intensity) {
          WaveState ws;
          float x = baseXZ.x;
          float z = baseXZ.y;

          float waveSet = 0.5 + 0.5 * sin(time * 0.52 + x * 0.07);
          float lateralPhase = x * 0.09 + sin(x * 0.28) * 0.26 + cos(x * 0.64) * 0.09;
          float primaryPhase = time * 1.56 + lateralPhase;

          float asymPhase = primaryPhase - 0.56 * sin(primaryPhase);
          float swashOsc = 0.5 + 0.5 * sin(asymPhase);
          float swashVel = cos(asymPhase) * (1.0 - 0.56 * cos(primaryPhase));

          float clampedInt = clamp(intensity, 0.15, 2.0);
          float baseWaterLevel = -0.05;
          float maxRunupReach = mix(0.36, 0.66, waveSet) * (0.45 + 0.55 * clampedInt);
          float currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

          vec3 g1 = gerstnerWave(baseXZ, vec2(-0.14, -0.990), 0.23 * clampedInt, 8.8, 0.90, time);
          vec3 g2 = gerstnerWave(baseXZ, vec2( 0.21, -0.978), 0.18 * clampedInt, 5.8, 0.94, time);
          vec3 g3 = gerstnerWave(baseXZ, vec2(-0.09, -0.996), 0.14 * clampedInt, 3.9, 0.98, time);
          vec3 g4 = gerstnerWave(baseXZ, vec2( 0.28, -0.960), 0.10 * clampedInt, 2.6, 1.03, time);
          vec3 g5 = gerstnerWave(baseXZ, vec2(-0.24, -0.971), 0.07 * clampedInt, 1.65, 1.07, time);
          vec3 g6 = gerstnerWave(baseXZ, vec2( 0.12, -0.993), 0.05 * clampedInt, 1.08, 1.12, time);

          vec3 gerstnerSum = g1 + g2 + g3 + g4 + g5 + g6;

          float deepOceanMask = smoothstep(0.18, -0.58, sandY);
          float shoalBoost = 1.0 + 0.28 * exp(-pow((sandY + 0.42) / 0.34, 2.0));

          float borderLockX = smoothstep(22.0, 21.25, abs(x));
          float borderLockZ = smoothstep(23.0, 22.25, abs(z));
          float horizMask = deepOceanMask * borderLockX * borderLockZ;

          vec2 horizOffset = gerstnerSum.xz * horizMask * shoalBoost;
          float swellVertical = gerstnerSum.y * deepOceanMask * shoalBoost;

          float swashSheetThickness = max(0.0, currentSwashY - sandY);
          float boreLip = smoothstep(0.0, 0.12, swashSheetThickness) * (1.0 - smoothstep(0.12, 0.38, swashSheetThickness)) * 0.022 * clampedInt;

          float shoreBlend = smoothstep(-0.24, 0.14, sandY);
          float targetWaterY = mix(baseWaterLevel + swellVertical, currentSwashY + boreLip, shoreBlend);

          float depth = targetWaterY - sandY;
          ws.depth = depth;
          ws.swashVelocity = swashVel;
          ws.crestFactor = clamp((swellVertical * shoalBoost) / (0.23 * clampedInt + 0.001), 0.0, 1.45);
          ws.waterY = depth > 0.0 ? targetWaterY : sandY - 0.03;
          ws.displacedPos = vec3(x + horizOffset.x, ws.waterY, z + horizOffset.y);
          return ws;
        }
      `;

      // =========================================================================
      // 3. RENDERER, SCENE, CAMERA, PROCEDURAL SKY DOME & PMREM REFLECTIONS
      // =========================================================================
      const container = document.getElementById('canvas-container');

      const CAMERA_PRESETS = {

      camera.position.copy(CAMERA_PRESETS.hero.pos);

      // Offscreen Render Target for Optical Water Refraction

      // Clean Standalone Atmospheric Sky Dome Shader (also feeds PMREM reflections)
      const sunDirection = new THREE.Vector3();
      const sunColor = new THREE.Color();

      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uSunDir: { value: sunDirection },
          uSunColor: { value: sunColor },
          uGoldenFactor: { value: 0.25 }
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldDir;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldDir = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform float uGoldenFactor;
          varying vec3 vWorldDir;

          void main() {
            vec3 dir = normalize(vWorldDir);
            vec3 L = normalize(uSunDir);

            float up = clamp(dir.y, 0.0, 1.0);
            float down = clamp(-dir.y, 0.0, 1.0);

            vec3 zenithDay = vec3(0.11, 0.34, 0.72);
            vec3 zenithGolden = vec3(0.17, 0.27, 0.50);
            vec3 zenith = mix(zenithDay, zenithGolden, uGoldenFactor);

            vec3 horizonDay = vec3(0.68, 0.85, 0.96);
            vec3 horizonGolden = vec3(0.96, 0.66, 0.42);
            vec3 horizon = mix(horizonDay, horizonGolden, uGoldenFactor);

            vec3 skyCol = mix(horizon, zenith, pow(up, 0.52));

            // Forward Mie sun glow & crisp solar disc
            float sunCos = max(dot(dir, L), 0.0);
            float mieGlow = pow(sunCos, 8.0) * 0.35 + pow(sunCos, 64.0) * 0.65;
            float sunDisc = smoothstep(0.99935, 0.99975, sunCos) * 6.5;
            skyCol += uSunColor * (mieGlow * (0.45 + 0.55 * uGoldenFactor) + sunDisc);

            // Subtle studio dark-slate lower hemisphere backdrop below horizon
            vec3 lowerStudio = vec3(0.05, 0.08, 0.13);
            skyCol = mix(skyCol, lowerStudio, smoothstep(0.0, 0.18, down));

            gl_FragColor = vec4(skyCol, 1.0);
          }
        `
      });

      const skyDome = new THREE.Mesh(new THREE.SphereGeometry(220, 32, 20), skyMat);

      sunLight.shadow.camera.left = -shadowExtent;
      sunLight.shadow.camera.right = shadowExtent;
      sunLight.shadow.camera.top = shadowExtent;
      sunLight.shadow.camera.bottom = -shadowExtent;
      sunLight.shadow.bias = -0.00045;
      sunLight.shadow.normalBias = 0.024;
      scene.add(sunLight);

      const hemiLight = new THREE.HemisphereLight(0x9ed4ff, 0x8d7456, 0.78);
      scene.add(hemiLight);

      const rimFillLight = new THREE.DirectionalLight(0x7cc4fa, 0.62);
      rimFillLight.position.set(-28, 14, -22);
      scene.add(rimFillLight);

      function updateSunAndEnvironment(elevationDeg) {
        const azimuthDeg = 134;
        const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
        const theta = THREE.MathUtils.degToRad(azimuthDeg);

        sunDirection.setFromSphericalCoords(1, phi, theta).normalize();
        const goldenFactor = 1.0 - THREE.MathUtils.smoothstep(elevationDeg, 10.0, 36.0);
        skyMat.uniforms.uGoldenFactor.value = goldenFactor;

        sunColor.setHSL(
          THREE.MathUtils.lerp(0.11, 0.068, goldenFactor),
          THREE.MathUtils.lerp(0.22, 0.85, goldenFactor),
          THREE.MathUtils.lerp(0.97, 0.78, goldenFactor)
        );

        sunLight.position.copy(sunDirection).multiplyScalar(42.0);
        sunLight.color.copy(sunColor);
        sunLight.intensity = THREE.MathUtils.lerp(3.55, 2.85, goldenFactor);
        hemiLight.intensity = THREE.MathUtils.lerp(0.80, 0.56, goldenFactor);

        if (currentEnvRT) currentEnvRT.dispose();
        currentEnvRT = pmremGenerator.fromScene(skyEnvScene, 0.03);
        scene.environment = currentEnvRT.texture;
        scene.environmentIntensity = 0.96;
      }

      const sharedUniforms = {
        uTime: { value: 0.0 },
        uWaveIntensity: { value: 1.0 },

        uBreeze: { value: 1.0 },

        uRefractionMap: { value: refractionRT.texture },
        uResolution: { value: new THREE.Vector2(rtSize.x, rtSize.y) },
        uBoats: {
          value: [
            new THREE.Vector4(5.8, 3.4, 2.40, 0.74),
            new THREE.Vector4(-6.8, 1.8, 1.75, 0.58),
            new THREE.Vector4(2.4, 4.6, 1.15, 0.46),
            new THREE.Vector4(-11.8, 8.2, 2.15, 0.72),
            new THREE.Vector4(13.6, 1.8, 1.85, 0.60)
          ]
        }
      };

      // =========================================================================
      // 4. PROCEDURAL PBR DATA TEXTURES FOR SAND, STRATA, ROCKS & WOODEN FLEET
      // =========================================================================
      function createQuartzSandTextures() {
        const w = 512;
        const h = 512;
        const roughData = new Uint8Array(w * h * 4);
        const bumpData = new Uint8Array(w * h * 4);

        for (let iy = 0; iy < h; iy++) {
          const wz = -HALF_D + (iy / (h - 1)) * DIORAMA_D;
          for (let ix = 0; ix < w; ix++) {
            const wx = -HALF_W + (ix / (w - 1)) * DIORAMA_W;
            const sandY = getBeachHeight(wx, wz);

            const grain = valueNoise2D(wx * 52.0, wz * 52.0);
            const fine = hash21(ix * 1.7, iy * 2.3);

            // Wet-sand swash zone (sandY < +0.44m) drops roughness to ~0.09 (mirror-like glossy sheen)
            const wetness = 1.0 - smoothstepJS(0.18, 0.48, sandY);
            let roughVal = THREE.MathUtils.lerp(0.88, 0.09, Math.pow(wetness, 1.3));
            roughVal += (grain - 0.5) * 0.05;

            if (wetness < 0.25 && fine > 0.968) {
              roughVal = 0.08;
            }
            const rByte = Math.round(THREE.MathUtils.clamp(roughVal, 0.05, 0.96) * 255);

            const bumpAmp = THREE.MathUtils.lerp(1.0, 0.14, wetness);
            const bByte = Math.round(THREE.MathUtils.clamp(0.5 + (grain - 0.5) * 0.85 * bumpAmp, 0.0, 1.0) * 255);

            const idx = (iy * w + ix) * 4;
            roughData[idx] = rByte;
            roughData[idx + 1] = rByte;
            roughData[idx + 2] = rByte;
            roughData[idx + 3] = 255;

            bumpData[idx] = bByte;
            bumpData[idx + 1] = bByte;
            bumpData[idx + 2] = bByte;
            bumpData[idx + 3] = 255;
          }
        }

        const roughTex = new THREE.DataTexture(roughData, w, h, THREE.RGBAFormat);
        roughTex.wrapS = THREE.ClampToEdgeWrapping;
        roughTex.wrapT = THREE.ClampToEdgeWrapping;
        roughTex.minFilter = THREE.LinearFilter;
        roughTex.magFilter = THREE.LinearFilter;
        roughTex.needsUpdate = true;

        const bumpTex = new THREE.DataTexture(bumpData, w, h, THREE.RGBAFormat);
        bumpTex.wrapS = THREE.ClampToEdgeWrapping;
        bumpTex.wrapT = THREE.ClampToEdgeWrapping;
        bumpTex.minFilter = THREE.LinearFilter;
        bumpTex.magFilter = THREE.LinearFilter;
        bumpTex.needsUpdate = true;

        return { roughTex, bumpTex };
      }

      function createGeologicalStrataTexture() {
        const w = 1024;
        const h = 512;
        const data = new Uint8Array(w * h * 4);

        for (let iy = 0; iy < h; iy++) {
          const v = 1.0 - iy / (h - 1);
          const depthApprox = v * 8.5;

          for (let ix = 0; ix < w; ix++) {
            const u = ix / (w - 1);
            const bedWarp = (fbm2D(u * 26.0, v * 12.0) - 0.5) * 0.35;
            const d = depthApprox + bedWarp;

            const lamina = Math.sin((v * 95.0 + bedWarp * 4.5) + fbm2D(u * 40.0, v * 16.0) * 3.2);
            const heavyPlacer = smoothstepJS(0.84, 0.98, lamina) * smoothstepJS(0.15, 0.55, d) * (1.0 - smoothstepJS(1.6, 2.6, d));

            const grain = valueNoise2D(ix * 0.65, iy * 0.75);
            const gravel = smoothstepJS(0.83, 0.96, valueNoise2D(ix * 0.24, iy * 0.30));
            const shellHash = smoothstepJS(0.91, 0.99, valueNoise2D(ix * 0.45 + 11.3, iy * 0.52 + 4.7));

            let r = 0.87, g = 0.75, b = 0.56;
            const tMid = smoothstepJS(0.15, 0.75, d);
            r = THREE.MathUtils.lerp(r, 0.66, tMid);
            g = THREE.MathUtils.lerp(g, 0.52, tMid);
            b = THREE.MathUtils.lerp(b, 0.36, tMid);

            const tShell = smoothstepJS(1.1, 1.9, d);
            r = THREE.MathUtils.lerp(r, 0.46, tShell);
            g = THREE.MathUtils.lerp(g, 0.40, tShell);
            b = THREE.MathUtils.lerp(b, 0.34, tShell);

            const tSilt = smoothstepJS(2.3, 3.8, d);
            r = THREE.MathUtils.lerp(r, 0.27, tSilt);
            g = THREE.MathUtils.lerp(g, 0.25, tSilt);
            b = THREE.MathUtils.lerp(b, 0.25, tSilt);

            const tBedrock = smoothstepJS(4.4, 6.2, d);
            r = THREE.MathUtils.lerp(r, 0.16, tBedrock);
            g = THREE.MathUtils.lerp(g, 0.17, tBedrock);
            b = THREE.MathUtils.lerp(b, 0.20, tBedrock);

            r = THREE.MathUtils.lerp(r, 0.20, heavyPlacer * 0.52);
            g = THREE.MathUtils.lerp(g, 0.17, heavyPlacer * 0.52);
            b = THREE.MathUtils.lerp(b, 0.15, heavyPlacer * 0.52);

            const shellMask = shellHash * (1.0 - smoothstepJS(1.5, 2.8, d)) * 0.62;
            r = THREE.MathUtils.lerp(r, 0.95, shellMask);
            g = THREE.MathUtils.lerp(g, 0.92, shellMask);
            b = THREE.MathUtils.lerp(b, 0.86, shellMask);

            const gravelMask = gravel * smoothstepJS(0.8, 2.0, d) * 0.35;
            r = THREE.MathUtils.lerp(r, 0.54, gravelMask);
            g = THREE.MathUtils.lerp(g, 0.50, gravelMask);
            b = THREE.MathUtils.lerp(b, 0.45, gravelMask);

            const gOff = (grain - 0.5) * 0.065;
            const idx = (iy * w + ix) * 4;
            data[idx] = Math.round(THREE.MathUtils.clamp(r + gOff, 0, 1) * 255);
            data[idx + 1] = Math.round(THREE.MathUtils.clamp(g + gOff, 0, 1) * 255);
            data[idx + 2] = Math.round(THREE.MathUtils.clamp(b + gOff, 0, 1) * 255);
            data[idx + 3] = 255;
          }
        }

        const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = true;
        tex.needsUpdate = true;
        return tex;
      }

      function createWoodPlankDataTexture(baseHex, darkHex, plankRows = 12, caulk = true) {
        const w = 256;
        const h = 256;
        const data = new Uint8Array(w * h * 4);
        const baseCol = new THREE.Color(baseHex);
        const darkCol = new THREE.Color(darkHex);
        const rowH = h / plankRows;

        for (let iy = 0; iy < h; iy++) {
          const r = Math.floor(iy / rowH);
          const localY = iy - r * rowH;
          const isSeam = caulk && localY < 1.5;
          const rowTone = (hash21(r, 3.1) - 0.5) * 0.14;

          for (let ix = 0; ix < w; ix++) {
            const idx = (iy * w + ix) * 4;
            if (isSeam) {
              data[idx] = 20;
              data[idx + 1] = 15;
              data[idx + 2] = 12;
              data[idx + 3] = 255;
            } else {
              const grain = fbm2D(iy * 0.45 + r * 11.0, ix * 0.04 + r * 2.7) - 0.5;
              const fine = valueNoise2D(iy * 1.6, ix * 0.12) - 0.5;
              const mixAmt = THREE.MathUtils.clamp(0.36 + grain * 0.65 + fine * 0.25 + rowTone, 0.0, 1.0);
              const c = baseCol.clone().lerp(darkCol, mixAmt);
              data[idx] = Math.round(c.r * 255);
              data[idx + 1] = Math.round(c.g * 255);
              data[idx + 2] = Math.round(c.b * 255);
              data[idx + 3] = 255;
            }
          }
        }

        const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      function createSailClothDataTexture() {
        const w = 256;
        const h = 256;
        const data = new Uint8Array(w * h * 4);
        for (let iy = 0; iy < h; iy++) {
          const isPanelSeam = (iy % 32) < 1.5;
          const isStripe = iy > 206 && iy < 216;
          for (let ix = 0; ix < w; ix++) {
            const idx = (iy * w + ix) * 4;
            const weave = (valueNoise2D(ix * 0.6, iy * 0.6) - 0.5) * 10;
            if (isStripe) {
              data[idx] = 28;
              data[idx + 1] = 56;
              data[idx + 2] = 94;
            } else if (isPanelSeam) {
              data[idx] = 185;
              data[idx + 1] = 172;
              data[idx + 2] = 152;
            } else {
              const base = 244 + weave;
              data[idx] = Math.round(THREE.MathUtils.clamp(base, 0, 255));
              data[idx + 1] = Math.round(THREE.MathUtils.clamp(base - 7, 0, 255));
              data[idx + 2] = Math.round(THREE.MathUtils.clamp(base - 19, 0, 255));
            }
            data[idx + 3] = 255;
          }
        }
        const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      function createBuoyDataTexture() {
        const w = 128;
        const h = 128;
        const data = new Uint8Array(w * h * 4);
        for (let iy = 0; iy < h; iy++) {
          const isRedBand = iy > 36 && iy < 92;
          for (let ix = 0; ix < w; ix++) {
            const idx = (iy * w + ix) * 4;
            const scuff = (valueNoise2D(ix * 0.25, iy * 0.25) - 0.5) * 18;
            if (isRedBand) {
              data[idx] = Math.round(THREE.MathUtils.clamp(202 + scuff, 0, 255));
              data[idx + 1] = Math.round(THREE.MathUtils.clamp(48 + scuff, 0, 255));
              data[idx + 2] = Math.round(THREE.MathUtils.clamp(38 + scuff, 0, 255));
            } else {
              data[idx] = Math.round(THREE.MathUtils.clamp(245 + scuff, 0, 255));
              data[idx + 1] = Math.round(THREE.MathUtils.clamp(247 + scuff, 0, 255));
              data[idx + 2] = Math.round(THREE.MathUtils.clamp(250 + scuff, 0, 255));
            }
            data[idx + 3] = 255;
          }
        }
        const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      const { roughTex: sandRoughTex, bumpTex: sandBumpTex } = createQuartzSandTextures();
      const strataTex = createGeologicalStrataTexture();
      const teakDeckTex = createWoodPlankDataTexture('#b67a44', '#6d411e', 16, true);
      const mahoganyTex = createWoodPlankDataTexture('#7d351c', '#43180a', 12, true);
      const oakTrimTex = createWoodPlankDataTexture('#c89658', '#8a5d2b', 8, false);
      const sailClothTex = createSailClothDataTexture();
      const buoyTex = createBuoyDataTexture();

      // =========================================================================
      // 5. 100% STATIC SAND TERRAIN & SEABED MESH (220 × 220 GRID)
      // =========================================================================
      const sandGeo = new THREE.PlaneGeometry(DIORAMA_W, DIORAMA_D, SEG_X, SEG_Z);
      sandGeo.rotateX(-Math.PI / 2);

      const sandPos = sandGeo.attributes.position;
      const sandUV = sandGeo.attributes.uv;
      const sandColors = new Float32Array(sandPos.count * 3);

      const colDryWarm = new THREE.Color(0xead2a5);
      const colDryLight = new THREE.Color(0xf4e3c1);
      const colWetAmber = new THREE.Color(0x6d5031);
      const colHeadlandRock = new THREE.Color(0x7c7469);
      const colShellFleck = new THREE.Color(0xfaf6ee);

      for (let i = 0; i < sandPos.count; i++) {
        const x = sandPos.getX(i);
        const z = sandPos.getZ(i);
        const y = getBeachHeight(x, z);
        sandPos.setY(i, y);

        sandUV.setXY(i, (x + HALF_W) / DIORAMA_W, (z + HALF_D) / DIORAMA_D);

        const macroTone = fbm2D(x * 0.42 + 2.3, z * 0.42 + 1.9);
        const grainTone = valueNoise2D(x * 18.0, z * 18.0);
        const shellFleck = smoothstepJS(0.90, 0.985, valueNoise2D(x * 34.0 + 7.1, z * 34.0 + 3.4));
        const headlandTint = smoothstepJS(-10.2, -18.0, x);

        const c = colDryWarm.clone().lerp(colDryLight, macroTone);
        c.lerp(colHeadlandRock, headlandTint * 0.56);
        c.offsetHSL(0, 0, (grainTone - 0.5) * 0.035);
        c.lerp(colShellFleck, shellFleck * 0.42);

        const wetness = 1.0 - smoothstepJS(0.18, 0.48, y);
        c.lerp(colWetAmber, wetness * 0.86);

        sandColors[i * 3] = c.r;
        sandColors[i * 3 + 1] = c.g;
        sandColors[i * 3 + 2] = c.b;
      }

      sandGeo.setAttribute('color', new THREE.BufferAttribute(sandColors, 3));
      sandGeo.computeVertexNormals();

      const sandMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 1.0,
        roughnessMap: sandRoughTex,
        bumpMap: sandBumpTex,
        bumpScale: 0.016,
        metalness: 0.02,
        envMapIntensity: 1.15
      });

      const sandMesh = new THREE.Mesh(sandGeo, sandMaterial);
      sandMesh.receiveShadow = true;
      sandMesh.castShadow = true;
      scene.add(sandMesh);

      // =========================================================================
      // 6. CROSS-BEDDED GEOLOGICAL STRATA WALLS & SLATE ARCHITECTURAL PLINTH
      // =========================================================================
      function buildGeologicalCutoutWalls() {
        const group = new THREE.Group();
        const positions = [];
        const normals = [];
        const uvs = [];
        const colors = [];
        const indices = [];

        function addWallStrip(segs, getPointAtT, normalVec, uRepeat) {
          const baseVertexIndex = positions.length / 3;
          for (let i = 0; i <= segs; i++) {
            const t = i / segs;
            const pt = getPointAtT(t);
            const topY = getBeachHeight(pt.x, pt.z);
            const colH = Math.max(0.1, topY - BASE_Y);
            const vBottom = Math.min(1.0, colH / 9.8);

            // Capillary water-table saturation darkening below sea level (+0.18m)
            const topWet = 1.0 - smoothstepJS(0.06, 0.30, topY);
            const graniteTint = smoothstepJS(-10.5, -18.5, pt.x);

            const topCol = new THREE.Color(0xffffff)
              .lerp(new THREE.Color(0x6e604f), topWet * 0.58)
              .lerp(new THREE.Color(0x7c7872), graniteTint * 0.55);

            const botCol = new THREE.Color(0x7d7973)
              .lerp(new THREE.Color(0x5b5d62), graniteTint * 0.45);

            // Top vertex along terrain edge
            positions.push(pt.x, topY, pt.z);
            normals.push(normalVec.x, normalVec.y, normalVec.z);
            uvs.push(t * uRepeat, 0.0);
            colors.push(topCol.r, topCol.g, topCol.b);

            // Bottom vertex along BASE_Y
            positions.push(pt.x, BASE_Y, pt.z);
            normals.push(normalVec.x, normalVec.y, normalVec.z);
            uvs.push(t * uRepeat, vBottom);
            colors.push(botCol.r, botCol.g, botCol.b);
          }

          for (let i = 0; i < segs; i++) {
            const a = baseVertexIndex + i * 2;
            const b = a + 1;
            const c = a + 2;
            const d = a + 3;
            indices.push(a, b, c);
            indices.push(b, d, c);
          }
        }

        // Front wall (Z = +HALF_D, normal +Z)
        addWallStrip(
          SEG_X,
          (t) => ({ x: -HALF_W + t * DIORAMA_W, z: HALF_D }),
          new THREE.Vector3(0, 0, 1),
          4.0
        );
        // Right wall (X = +HALF_W, normal +X)
        addWallStrip(
          SEG_Z,
          (t) => ({ x: HALF_W, z: HALF_D - t * DIORAMA_D }),
          new THREE.Vector3(1, 0, 0),
          4.2
        );
        // Back wall (Z = -HALF_D, normal -Z)
        addWallStrip(
          SEG_X,
          (t) => ({ x: HALF_W - t * DIORAMA_W, z: -HALF_D }),
          new THREE.Vector3(0, 0, -1),
          4.0
        );
        // Left wall (X = -HALF_W, normal -X)
        addWallStrip(
          SEG_Z,
          (t) => ({ x: -HALF_W, z: -HALF_D + t * DIORAMA_D }),
          new THREE.Vector3(-1, 0, 0),
          4.2
        );

        const wallGeo = new THREE.BufferGeometry();
        wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        wallGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        wallGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        wallGeo.setIndex(indices);

        const wallMat = new THREE.MeshStandardMaterial({
          map: strataTex,
          bumpMap: strataTex,
          bumpScale: 0.032,
          vertexColors: true,
          roughness: 0.86,
          metalness: 0.03
        });

        const strataWalls = new THREE.Mesh(wallGeo, wallMat);
        strataWalls.receiveShadow = true;
        strataWalls.castShadow = true;
        group.add(strataWalls);

        // Architectural Museum Slate Plinth Base & Brushed Brass Inlay Trim
        const slateMat = new THREE.MeshStandardMaterial({
          color: 0x151d28,
          roughness: 0.42,
          metalness: 0.25
        });
        const brassTrimMat = new THREE.MeshStandardMaterial({
          color: 0xb6955a,
          roughness: 0.30,
          metalness: 0.82
        });

        const upperSlab = new THREE.Mesh(
          new THREE.BoxGeometry(DIORAMA_W + 0.36, 0.28, DIORAMA_D + 0.36),
          slateMat
        );
        upperSlab.position.set(0, BASE_Y - 0.14, 0);
        upperSlab.receiveShadow = true;
        group.add(upperSlab);

        const brassInlay = new THREE.Mesh(
          new THREE.BoxGeometry(DIORAMA_W + 0.42, 0.045, DIORAMA_D + 0.42),
          brassTrimMat
        );
        brassInlay.position.set(0, BASE_Y - 0.29, 0);
        group.add(brassInlay);

        const lowerPlinth = new THREE.Mesh(
          new THREE.BoxGeometry(DIORAMA_W + 0.96, 0.42, DIORAMA_D + 0.96),
          slateMat
        );
        lowerPlinth.position.set(0, BASE_Y - 0.52, 0);
        lowerPlinth.receiveShadow = true;
        group.add(lowerPlinth);

        return group;
      }
      scene.add(buildGeologicalCutoutWalls());

      // =========================================================================
      // 7. REFRACTIVE GERSTNER OCEAN SURFACE & VOLUMETRIC WATER SIDE-WALLS
      // =========================================================================
      function createOceanSurfaceAndWalls() {
        // A. Top Ocean Surface Mesh (220 x 220 Grid)
        const waterGeo = new THREE.PlaneGeometry(DIORAMA_W, DIORAMA_D, SEG_X, SEG_Z);
        waterGeo.rotateX(-Math.PI / 2);

        const waterTopMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            uTime: sharedUniforms.uTime,
            uWaveIntensity: sharedUniforms.uWaveIntensity,
            uWaterClarity: sharedUniforms.uWaterClarity,
            uSunDir: sharedUniforms.uSunDir,
            uSunColor: sharedUniforms.uSunColor,
            uRefractionMap: sharedUniforms.uRefractionMap,
            uResolution: sharedUniforms.uResolution,
            uBoats: sharedUniforms.uBoats
          },
          vertexShader: /* glsl */ `
            uniform float uTime;
            uniform float uWaveIntensity;

            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying vec2 vBaseXZ;
            varying float vDepth;
            varying float vSwashVel;
            varying float vCrestFactor;

            ${GLSL_SHARED_NOISE_AND_WAVES}

            void main() {
              vec2 baseXZ = position.xz;
              vBaseXZ = baseXZ;

              float sandC = getSandElevation(baseXZ);
              WaveState wsC = evaluateOceanWave(baseXZ, sandC, uTime, uWaveIntensity);

              // Finite-difference surface normal for accurate refraction & specular glints
              float eps = 0.14;
              vec2 xzX = baseXZ + vec2(eps, 0.0);
              vec2 xzZ = baseXZ + vec2(0.0, eps);
              WaveState wsX = evaluateOceanWave(xzX, getSandElevation(xzX), uTime, uWaveIntensity);
              WaveState wsZ = evaluateOceanWave(xzZ, getSandElevation(xzZ), uTime, uWaveIntensity);

              vec3 dX = wsX.displacedPos - wsC.displacedPos;
              vec3 dZ = wsZ.displacedPos - wsC.displacedPos;
              vec3 surfNormal = normalize(cross(dZ, dX));
              if (surfNormal.y < 0.0) surfNormal = -surfNormal;

              vDepth = wsC.depth;
              vSwashVel = wsC.swashVelocity;
              vCrestFactor = wsC.crestFactor;

              vec4 worldPos = modelMatrix * vec4(wsC.displacedPos, 1.0);
              vWorldPos = worldPos.xyz;
              vWorldNormal = normalize(mat3(modelMatrix) * surfNormal);

              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            uniform float uWaveIntensity;
            uniform float uWaterClarity;
            uniform vec3 uSunDir;
            uniform vec3 uSunColor;
            uniform sampler2D uRefractionMap;
            uniform vec2 uResolution;
            uniform vec4 uBoats[5];

            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying vec2 vBaseXZ;
            varying float vDepth;
            varying float vSwashVel;
            varying float vCrestFactor;

            ${GLSL_SHARED_NOISE_AND_WAVES}

            float causticLayer(vec2 uv, float t) {
              vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.005;
              for (int n = 0; n < 3; n++) {
                float timeStep = t * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(
                  cos(timeStep - i.x) + sin(timeStep + i.y),
                  sin(timeStep - i.y) + cos(timeStep + i.x)
                );
                c += 1.0 / length(vec2(
                  p.x / (sin(i.x + timeStep) / inten),
                  p.y / (cos(i.y + timeStep) / inten)
                ));
              }
              c /= 3.0;
              c = 1.17 - pow(c, 1.4);
              return pow(abs(c), 7.5);
            }

            void main() {
              if (vDepth <= 0.001) discard;

              // High-frequency capillary wind ripples layered onto wave normal
              vec2 rUV1 = vBaseXZ * 1.45 + vec2(uTime * 0.42, -uTime * 0.68);
              vec2 rUV2 = vBaseXZ * 3.10 + vec2(-uTime * 0.55, -uTime * 0.85);
              float n1 = fbm2D(rUV1) - 0.5;
              float n2 = fbm2D(rUV2) - 0.5;
              vec3 ripplePerturb = vec3(n1 * 0.14 + n2 * 0.09, 0.0, n1 * 0.11 - n2 * 0.12);
              vec3 N = normalize(vWorldNormal + ripplePerturb * smoothstep(0.01, 0.25, vDepth));

              vec3 V = normalize(cameraPosition - vWorldPos);
              vec3 L = normalize(uSunDir);

              // 1. Screen-space Optical Refraction + Subtle Chromatic Dispersion
              vec2 screenUV = gl_FragCoord.xy / max(uResolution, vec2(1.0));
              float refractStrength = 0.032 * clamp(vDepth, 0.04, 1.65);
              vec2 refractOffset = N.xz * refractStrength;

              vec2 uvR = clamp(screenUV + refractOffset * 1.06, vec2(0.002), vec2(0.998));
              vec2 uvG = clamp(screenUV + refractOffset * 1.00, vec2(0.002), vec2(0.998));
              vec2 uvB = clamp(screenUV + refractOffset * 0.94, vec2(0.002), vec2(0.998));

              vec3 refractedScene = vec3(
                texture2D(uRefractionMap, uvR).r,
                texture2D(uRefractionMap, uvG).g,
                texture2D(uRefractionMap, uvB).b
              );

              // Animated solar caustics on shallow & mid-depth seabed
              vec2 cUV = vWorldPos.xz * 0.34 + N.xz * 0.35;
              float caust = causticLayer(cUV, uTime * 1.05) * 0.65 + causticLayer(cUV * 1.38 + vec2(1.7, -2.1), -uTime * 0.84) * 0.45;
              float caustMask = smoothstep(0.03, 0.25, vDepth) * exp(-vDepth * 0.36);
              refractedScene += uSunColor * vec3(0.86, 1.06, 1.14) * caust * caustMask * 0.72;

              // 2. Beer-Lambert Exponential Depth Absorption (Turquoise Shallows -> Deep Pelagic Cobalt)
              float clarityInv = 1.0 / clamp(uWaterClarity, 0.28, 1.85);
              vec3 sigma = vec3(0.54, 0.16, 0.09) * clarityInv;
              vec3 transmittance = exp(-sigma * max(0.0, vDepth));

              vec3 shallowScatter = vec3(0.06, 0.48, 0.56);
              vec3 deepScatter = vec3(0.015, 0.11, 0.24);
              vec3 volumeColor = mix(shallowScatter, deepScatter, smoothstep(0.35, 3.8, vDepth));

              // Subsurface forward wave-crest sun translucency (emerald glow through thin wave peaks)
              float crestBacklit = pow(clamp(dot(V, -L + N * 0.45), 0.0, 1.0), 3.0) * smoothstep(0.25, 1.15, vCrestFactor);
              volumeColor += vec3(0.06, 0.42, 0.38) * uSunColor * crestBacklit * 0.65;

              vec3 underwaterCol = refractedScene * transmittance + volumeColor * (1.0 - transmittance);

              // 3. Schlick Fresnel Sky Reflection & Crisp Solar Specular Glints
              float NdotV = max(dot(N, V), 0.0);
              float fresnel = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);

              vec3 R = reflect(-V, N);
              float skyUp = clamp(R.y, 0.0, 1.0);
              vec3 reflSky = mix(vec3(0.62, 0.82, 0.95), vec3(0.14, 0.38, 0.74), pow(skyUp, 0.55));
              float sunReflCos = max(dot(R, L), 0.0);
              reflSky += uSunColor * (pow(sunReflCos, 16.0) * 0.35 + pow(sunReflCos, 280.0) * 4.8);

              vec3 waterCol = mix(underwaterCol, reflSky, clamp(fresnel * 0.92, 0.02, 0.94));

              // 4. Multi-Tiered Coastal Surf Foam, Swash Lace & Boat Hull Wakes
              float foamCell1 = fbm2D(vBaseXZ * 3.8 + vec2(uTime * 0.18, -uTime * 0.34));
              float foamCell2 = fbm2D(vBaseXZ * 9.5 - vec2(uTime * 0.24, uTime * 0.41));
              float foamWeb = smoothstep(0.42, 0.78, foamCell1 * 0.65 + foamCell2 * 0.35);

              // Shoreline swash leading edge & receding bubble lace
              float swashEdge = (1.0 - smoothstep(0.005, 0.14, vDepth)) * smoothstep(0.001, 0.025, vDepth);
              float swashTrail = (1.0 - smoothstep(0.06, 0.46, vDepth)) * smoothstep(0.32, 0.72, foamCell1) * (0.45 + 0.55 * max(0.0, -vSwashVel));
              float shoreFoam = clamp(swashEdge * (0.65 + 0.45 * foamCell2) + swashTrail * 0.78, 0.0, 1.0);

              // Breaking offshore swell crests
              float crestFoam = smoothstep(0.62, 1.18, vCrestFactor) * foamWeb * smoothstep(0.18, 0.65, vDepth);

              // Vessel waterline displacement foam rings for all 5 boats
              float hullFoam = 0.0;
              for (int b = 0; b < 5; b++) {
                vec2 rel = (vWorldPos.xz - uBoats[b].xy) / max(uBoats[b].zw, vec2(0.1));
                float ellipDist = length(rel);
                float ring = exp(-pow((ellipDist - 1.02) / 0.24, 2.0));
                hullFoam = max(hullFoam, ring * (0.45 + 0.55 * foamCell2));
              }

              float totalFoam = clamp(shoreFoam + crestFoam * 0.85 + hullFoam * 0.72, 0.0, 1.0);
              vec3 foamLit = vec3(0.95, 0.97, 0.99) * (0.55 + 0.45 * max(dot(N, L), 0.2)) * mix(vec3(1.0), uSunColor, 0.35);
              waterCol = mix(waterCol, foamLit, totalFoam);

              // Smooth shoreline alpha feathering so swash edge blends cleanly over wet sand
              float shoreAlpha = smoothstep(0.001, 0.036, vDepth);
              float finalAlpha = clamp(mix(shoreAlpha, 1.0, totalFoam * 0.75), 0.0, 0.985);

              gl_FragColor = vec4(waterCol, finalAlpha);
            }
          `
        });

        const waterTopMesh = new THREE.Mesh(waterGeo, waterTopMat);
        waterTopMesh.renderOrder = 10;
        scene.add(waterTopMesh);

        // B. Volumetric Cross-Section Water Side-Walls (4 Border Curtains)
        const waterWallsGroup = new THREE.Group();
        waterWallsGroup.renderOrder = 11;

        const wPositions = [];
        const wNormals = [];
        const wUVs = [];
        const wIndices = [];

        function addWaterBorderWall(segs, getPointAtT, normalVec) {
          const baseIdx = wPositions.length / 3;
          for (let i = 0; i <= segs; i++) {
            const t = i / segs;
            const pt = getPointAtT(t);
            const sandY = getBeachHeight(pt.x, pt.z);

            // Top edge vertex (v = 1.0 -> displaced to wave surface in vertex shader)
            wPositions.push(pt.x, sandY, pt.z);
            wNormals.push(normalVec.x, normalVec.y, normalVec.z);
            wUVs.push(t, 1.0);

            // Bottom edge vertex (v = 0.0 -> pinned to seabed sandY)
            wPositions.push(pt.x, sandY, pt.z);
            wNormals.push(normalVec.x, normalVec.y, normalVec.z);
            wUVs.push(t, 0.0);
          }

          for (let i = 0; i < segs; i++) {
            const a = baseIdx + i * 2;
            const b = a + 1;
            const c = a + 2;
            const d = a + 3;
            wIndices.push(a, b, c);
            wIndices.push(b, d, c);
          }
        }

        addWaterBorderWall(SEG_X, (t) => ({ x: -HALF_W + t * DIORAMA_W, z: HALF_D }), new THREE.Vector3(0, 0, 1));
        addWaterBorderWall(SEG_Z, (t) => ({ x: HALF_W, z: HALF_D - t * DIORAMA_D }), new THREE.Vector3(1, 0, 0));
        addWaterBorderWall(SEG_X, (t) => ({ x: HALF_W - t * DIORAMA_W, z: -HALF_D }), new THREE.Vector3(0, 0, -1));
        addWaterBorderWall(SEG_Z, (t) => ({ x: -HALF_W, z: -HALF_D + t * DIORAMA_D }), new THREE.Vector3(-1, 0, 0));

        const waterWallGeo = new THREE.BufferGeometry();
        waterWallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPositions, 3));
        waterWallGeo.setAttribute('normal', new THREE.Float32BufferAttribute(wNormals, 3));
        waterWallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(wUVs, 2));
        waterWallGeo.setIndex(wIndices);

        const waterWallMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            uTime: sharedUniforms.uTime,
            uWaveIntensity: sharedUniforms.uWaveIntensity,
            uWaterClarity: sharedUniforms.uWaterClarity,
            uSunDir: sharedUniforms.uSunDir,
            uSunColor: sharedUniforms.uSunColor,
            uRefractionMap: sharedUniforms.uRefractionMap,
            uResolution: sharedUniforms.uResolution
          },
          vertexShader: /* glsl */ `
            uniform float uTime;
            uniform float uWaveIntensity;

            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying float vVerticalT;
            varying float vColDepth;

            ${GLSL_SHARED_NOISE_AND_WAVES}

            void main() {
              vec2 baseXZ = position.xz;
              float sandY = position.y;
              WaveState ws = evaluateOceanWave(baseXZ, sandY, uTime, uWaveIntensity);

              vVerticalT = uv.y;
              vColDepth = ws.depth;

              vec3 finalPos = vec3(baseXZ.x, sandY, baseXZ.y);
              if (uv.y > 0.5) {
                finalPos = ws.displacedPos;
              }

              vec4 worldPos = modelMatrix * vec4(finalPos, 1.0);
              vWorldPos = worldPos.xyz;
              vWorldNormal = normalize(mat3(modelMatrix) * normal);

              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: /* glsl */ `
            uniform float uTime;
            uniform float uWaterClarity;
            uniform vec3 uSunDir;
            uniform vec3 uSunColor;
            uniform sampler2D uRefractionMap;
            uniform vec2 uResolution;

            varying vec3 vWorldPos;
            varying vec3 vWorldNormal;
            varying float vVerticalT;
            varying float vColDepth;

            ${GLSL_SHARED_NOISE_AND_WAVES}

            void main() {
              if (vColDepth <= 0.004) discard;

              float depthFromTop = (1.0 - vVerticalT) * max(0.0, vColDepth);
              vec2 screenUV = gl_FragCoord.xy / max(uResolution, vec2(1.0));

              float waveRefr = sin(vWorldPos.x * 1.6 + vWorldPos.z * 1.6 + uTime * 2.1) * 0.006;
              vec2 uvRefr = clamp(screenUV + vec2(waveRefr, waveRefr * 0.5), vec2(0.002), vec2(0.998));
              vec3 bgRefract = texture2D(uRefractionMap, uvRefr).rgb;

              float clarityInv = 1.0 / clamp(uWaterClarity, 0.28, 1.85);
              vec3 absorb = exp(-vec3(0.45, 0.14, 0.08) * (depthFromTop * 0.9 + 0.45) * clarityInv);

              vec3 topAquamarine = vec3(0.12, 0.62, 0.72);
              vec3 midCerulean = vec3(0.04, 0.34, 0.52);
              vec3 deepAbyss = vec3(0.015, 0.12, 0.26);

              vec3 volTint = mix(topAquamarine, midCerulean, smoothstep(0.0, 1.8, depthFromTop));
              volTint = mix(volTint, deepAbyss, smoothstep(1.6, 5.2, depthFromTop));

              // Volumetric underwater sun rays streaming down from the wave surface
              float rayPattern = 0.5 + 0.5 * sin((vWorldPos.x + vWorldPos.z) * 2.4 + uTime * 1.3 + depthFromTop * 0.8);
              float sunShafts = pow(rayPattern, 3.0) * exp(-depthFromTop * 0.42) * 0.24;
              volTint += uSunColor * vec3(0.45, 0.85, 0.95) * sunShafts;

              vec3 col = mix(bgRefract * absorb, volTint, 0.58);

              // Crisp illuminated air-water meniscus line along the top cross-section edge
              float meniscus = smoothstep(0.968, 1.0, vVerticalT);
              col = mix(col, vec3(0.86, 0.96, 1.0) * (0.75 + 0.25 * uSunColor), meniscus * 0.85);

              float alpha = clamp(0.76 + (1.0 - vVerticalT) * 0.16, 0.72, 0.94);
              gl_FragColor = vec4(col, alpha);
            }
          `
        });

        const waterWallsMesh = new THREE.Mesh(waterWallGeo, waterWallMat);
        waterWallsGroup.add(waterWallsMesh);
        scene.add(waterWallsGroup);

        return { waterTopMesh, waterWallsGroup };
      }
      const { waterTopMesh, waterWallsGroup } = createOceanSurfaceAndWalls();

      // =========================================================================
      // 8. HANDCRAFTED WOODEN COASTAL FLEET & DYNAMIC CATENARY MOORING LINES
      // =========================================================================
      function createBoatHullGeometry(
        length,
        beam,
        depth,
        bowSharpness = 1.65,
        sternWidthRatio = 0.58,
        options = {}
      ) {
        const {
          topsideHex = 0xffffff,
          stripeHex = 0xf4efe6,
          bottomHex = 0x5c231c,
          lapstrake = true,
          strakeCount = 7
        } = options;

        const uSegs = 36; // Stern (+length/2) to Bow (-length/2)
        const vSegs = 24; // Port gunwale to Keel to Starboard gunwale
        const positions = [];
        const uvs = [];
        const colors = [];
        const indices = [];

        const topCol = new THREE.Color(topsideHex);
        const stripeCol = new THREE.Color(stripeHex);
        const botCol = new THREE.Color(bottomHex);

        const portSheerPts = [];
        const stbdSheerPts = [];
        const stemPts = [];

        const getHullPoint = (u, s) => {
          const z = (0.5 - u) * length;
          const bowTaper = Math.pow(Math.max(0.0, 1.0 - Math.pow(u, bowSharpness)), 0.62);
          const sternTaper = sternWidthRatio + (1.0 - sternWidthRatio) * smoothstepJS(0.0, 0.28, u);
          const halfW = (beam * 0.5) * bowTaper * sternTaper;

          const sheerY = depth * (0.52 + 0.26 * Math.pow(u, 2.4) + 0.08 * Math.pow(1.0 - u, 2.0));
          const keelY = -depth * (0.48 - 0.14 * Math.pow(u, 3.0));

          const absS = Math.abs(s);
          // Subtle clinker / lapstrake plank ridges along the topsides
          let strakeOffset = 0.0;
          if (lapstrake && absS > 0.22) {
            const plankT = ((absS - 0.22) / 0.78) * strakeCount;
            const saw = plankT - Math.floor(plankT);
            strakeOffset = (0.5 - saw) * 0.0085 * Math.sin(u * Math.PI);
          }

          const x = Math.sign(s) * (halfW * Math.pow(absS, 0.72) + strakeOffset);
          const y = keelY + (sheerY - keelY) * Math.pow(absS, 1.55);
          return { x, y, z, sheerY, keelY };
        };

        for (let iu = 0; iu <= uSegs; iu++) {
          const u = iu / uSegs; // 0 = stern (+Z), 1 = bow (-Z)

          for (let iv = 0; iv <= vSegs; iv++) {
            const v = iv / vSegs; // 0 = port gunwale, 0.5 = keel, 1 = starboard gunwale
            const s = (v - 0.5) * 2.0;
            const pt = getHullPoint(u, s);

            positions.push(pt.x, pt.y, pt.z);
            uvs.push(u * 2.4, v);

            // Antifouling bottom paint, crisp waterline boot-stripe & topside finish
            const waterlineY = -depth * 0.06;
            const stripeHalfH = depth * 0.042;
            const c = topCol.clone();
            if (pt.y < waterlineY - stripeHalfH) {
              c.copy(botCol);
            } else if (pt.y <= waterlineY + stripeHalfH) {
              c.copy(stripeCol);
            }
            colors.push(c.r, c.g, c.b);

            if (iv === 0) portSheerPts.push(new THREE.Vector3(pt.x, pt.y, pt.z));
            if (iv === vSegs) stbdSheerPts.push(new THREE.Vector3(pt.x, pt.y, pt.z));
            if (iu === uSegs && iv >= vSegs / 2) {
              stemPts.push(new THREE.Vector3(0, pt.y, pt.z));
            }
          }
        }

        const stride = vSegs + 1;
        for (let iu = 0; iu < uSegs; iu++) {
          for (let iv = 0; iv < vSegs; iv++) {
            const a = iu * stride + iv;
            const b = (iu + 1) * stride + iv;
            const c = (iu + 1) * stride + (iv + 1);
            const d = iu * stride + (iv + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
          }
        }

        // Seal the stern opening (iu = 0) with a solid transom bulkhead
        const sternTop = getHullPoint(0, 0).sheerY;
        const sternBot = getHullPoint(0, 0).keelY;
        const transomCenterIdx = positions.length / 3;
        positions.push(0, sternBot + (sternTop - sternBot) * 0.55, length * 0.5);
        uvs.push(0.5, 0.5);
        colors.push(topCol.r, topCol.g, topCol.b);

        for (let iv = 0; iv <= vSegs; iv++) {
          const v = iv / vSegs;
          const s = (v - 0.5) * 2.0;
          const pt = getHullPoint(0, s);
          positions.push(pt.x, pt.y, pt.z);
          uvs.push(0.5 + s * 0.5, (pt.y - sternBot) / Math.max(0.01, sternTop - sternBot));
          const c = pt.y < -depth * 0.06 ? botCol : topCol;
          colors.push(c.r, c.g, c.b);
        }

        const transomStart = transomCenterIdx + 1;
        for (let iv = 0; iv < vSegs; iv++) {
          indices.push(transomCenterIdx, transomStart + iv + 1, transomStart + iv);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        geo.userData = { portSheerPts, stbdSheerPts, stemPts, getHullPoint };
        return geo;
      }

      function addHullGunwalesAndStem(group, hullGeo, trimMat, railRadius = 0.026) {
        const { portSheerPts, stbdSheerPts, stemPts } = hullGeo.userData;
        if (portSheerPts && portSheerPts.length > 2) {
          const portCurve = new THREE.CatmullRomCurve3(portSheerPts);
          const portRail = new THREE.Mesh(
            new THREE.TubeGeometry(portCurve, 32, railRadius, 8, false),
            trimMat
          );
          portRail.castShadow = true;
          group.add(portRail);
        }
        if (stbdSheerPts && stbdSheerPts.length > 2) {
          const stbdCurve = new THREE.CatmullRomCurve3(stbdSheerPts);
          const stbdRail = new THREE.Mesh(
            new THREE.TubeGeometry(stbdCurve, 32, railRadius, 8, false),
            trimMat
          );
          stbdRail.castShadow = true;
          group.add(stbdRail);
        }
        if (stemPts && stemPts.length > 2) {
          const stemCurve = new THREE.CatmullRomCurve3(stemPts);
          const stemPost = new THREE.Mesh(
            new THREE.TubeGeometry(stemCurve, 12, railRadius * 1.15, 8, false),
            trimMat
          );
          stemPost.castShadow = true;
          group.add(stemPost);
        }
      }

      function addInteriorRibsAndDuckboards(group, hullGeo, length, depth, ribMat, boardMat, ribCount = 7) {
        const getHullPoint = hullGeo.userData.getHullPoint;
        if (!getHullPoint) return;

        // Curved interior oak hull ribs (frames)
        for (let r = 1; r <= ribCount; r++) {
          const u = r / (ribCount + 1);
          const ribPts = [];
          for (let k = 0; k <= 14; k++) {
            const s = -0.94 + (k / 14) * 1.88;
            const pt = getHullPoint(u, s);
            ribPts.push(new THREE.Vector3(pt.x * 0.96, pt.y + 0.015, pt.z));
          }
          const ribCurve = new THREE.CatmullRomCurve3(ribPts);
          const ribMesh = new THREE.Mesh(
            new THREE.TubeGeometry(ribCurve, 16, 0.014, 6, false),
            ribMat
          );
          ribMesh.receiveShadow = true;
          group.add(ribMesh);
        }

        // Tapered slatted teak floorboards (duckboards) nested cleanly inside the bilge
        const slatOffsets = [-0.14, -0.05, 0.05, 0.14];
        slatOffsets.forEach((ox) => {
          const innerSpan = Math.max(0.15, 0.92 - Math.abs(ox) * 2.4);
          const slatGeo = new THREE.BoxGeometry(0.055, 0.022, length * 0.62 * innerSpan);
          const slat = new THREE.Mesh(slatGeo, boardMat);
          slat.position.set(ox, -depth * 0.16, length * 0.04);
          slat.receiveShadow = true;
          group.add(slat);
        });
      }

      function createCoiledRope(outerR, tubeR, mat) {
        const pts = [];
        const steps = 44;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const ang = t * Math.PI * 6.5;
          const r = outerR * (0.28 + 0.72 * t);
          pts.push(new THREE.Vector3(Math.cos(ang) * r, tubeR * (1.0 + 0.35 * (1.0 - t)), Math.sin(ang) * r));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const mesh = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 44, tubeR, 7, false),
          mat
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function createDetailedFishCrate(w, h, d, woodMat, withCatch = true) {
        const crate = new THREE.Group();
        const postGeo = new THREE.BoxGeometry(0.026, h, 0.026);
        [
          [-w * 0.46, -d * 0.46],
          [ w * 0.46, -d * 0.46],
          [-w * 0.46,  d * 0.46],
          [ w * 0.46,  d * 0.46]
        ].forEach(([px, pz]) => {
          const post = new THREE.Mesh(postGeo, woodMat);
          post.position.set(px, h * 0.5, pz);
          post.castShadow = true;
          crate.add(post);
        });

        const bottom = new THREE.Mesh(new THREE.BoxGeometry(w * 0.96, 0.02, d * 0.96), woodMat);
        bottom.position.y = 0.015;
        crate.add(bottom);

        for (let row = 0; row < 3; row++) {
          const sy = 0.045 + row * (h * 0.30);
          [-1, 1].forEach((side) => {
            const sideSlat = new THREE.Mesh(new THREE.BoxGeometry(w, 0.036, 0.016), woodMat);
            sideSlat.position.set(0, sy, side * d * 0.48);
            sideSlat.castShadow = true;
            crate.add(sideSlat);

            const endSlat = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.036, d), woodMat);
            endSlat.position.set(side * w * 0.48, sy, 0);
            endSlat.castShadow = true;
            crate.add(endSlat);
          });
        }

        if (withCatch) {
          const fishMat = new THREE.MeshStandardMaterial({
            color: 0x9fb8c7,
            roughness: 0.22,
            metalness: 0.65
          });
          for (let f = 0; f < 4; f++) {
            const fish = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), fishMat);
            fish.scale.set(0.65, 0.85, 3.6);
            fish.position.set(
              (f - 1.5) * 0.065,
              h * 0.68 + (f % 2) * 0.015,
              (f % 2 === 0 ? 1 : -1) * 0.02
            );
            fish.rotation.y = (f - 1.5) * 0.22;
            crate.add(fish);
          }
        }
        return crate;
      }

        function createCatenaryRopeMesh(segs = 22, radius = 0.015) {

          for (let i = 0; i < segs; i++) {

              const jNext = (j + 1) % radialSegs;
              const a = i * radialSegs + j;
              const b = (i + 1) * radialSegs + j;
              const c = (i + 1) * radialSegs + jNext;
              const d = i * radialSegs + jNext;
              indices.push(a, b, d);
              indices.push(b, c, d);
            }
          }

          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geo.setIndex(indices);
          geo.userData = { segs, radialSegs, radius };

          const mesh = new THREE.Mesh(geo, hempRopeMat);
          mesh.frustumCulled = false;
          mesh.castShadow = true;
          return mesh;

      function updateCatenaryRope(ropeMesh, pStart, pEnd, sag) {
        const geo = ropeMesh.geometry;
        const { segs, radialSegs, radius } = geo.userData;
        const pos = geo.attributes.position;

        _ropeTan.subVectors(pEnd, pStart);
        if (_ropeTan.lengthSq() < 1e-6) _ropeTan.set(0, 0, 1);
        _ropeTan.normalize();
        _ropeSide.crossVectors(_ropeTan, _worldUp);
        if (_ropeSide.lengthSq() < 1e-6) _ropeSide.set(1, 0, 0);
        _ropeSide.normalize();
        _ropeUp.crossVectors(_ropeSide, _ropeTan).normalize();

        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          _ropePt.lerpVectors(pStart, pEnd, t);
          _ropePt.y -= Math.sin(t * Math.PI) * sag;

          for (let j = 0; j < radialSegs; j++) {
            const ang = (j / radialSegs) * Math.PI * 2;
            const cosA = Math.cos(ang) * radius;
            const sinA = Math.sin(ang) * radius;
            const idx = i * radialSegs + j;
            pos.setXYZ(
              idx,
              _ropePt.x + _ropeSide.x * cosA + _ropeUp.x * sinA,
              _ropePt.y + _ropeSide.y * cosA + _ropeUp.y * sinA,
              _ropePt.z + _ropeSide.z * cosA + _ropeUp.z * sinA
            );
          }
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
      }
