<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photorealistic 3D Beach Cutout Diorama — Three.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a121d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: radial-gradient(circle at 50% 42%, #192638 0%, #0d1522 62%, #070b12 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Studio HUD Overlay Layer */
    .hud-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* Top-Left Compact Diorama Title Badge */
    .title-badge {
      position: fixed;
      top: 18px;
      left: 18px;
      pointer-events: auto;
      background: rgba(10, 17, 28, 0.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.48);
      max-width: calc(100vw - 300px);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      flex-shrink: 0;
    }

    .title-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .subtitle-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.35;
    }

    /* Top-Right Collapsible Studio Controls Panel */
    .control-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 254px;
      pointer-events: auto;
      background: rgba(10, 17, 28, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.52);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-header.collapsed {
      padding-bottom: 0;
      border-bottom: none;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    .collapse-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }

    .collapse-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .panel-body {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .panel-body.hidden {
      display: none;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #cbd5e1;
    }

    .slider-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #7dd3fc;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-primary {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-primary:hover {
      background: rgba(56, 189, 248, 0.32);
    }

    .btn-secondary {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #cbd5e1;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Bottom-Center Camera Preset Pill Bar */
    .preset-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      background: rgba(10, 17, 28, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .preset-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .preset-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .preset-btn.active {
      background: #38bdf8;
      color: #08101c;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.45);
    }

    /* Fullscreen Loading & Error Overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0a121d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.45s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.22);
      border-top-color: #38bdf8;
      animation: spin 0.85s linear infinite;
    }

    .loader-label {
      font-size: 12px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #cbd5e1;
      max-width: 480px;
      line-height: 1.5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 720px) {
      .title-badge {
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: none;
        padding: 9px 12px;
      }

      .subtitle-text {
        display: none;
      }

      .control-panel {
        top: 62px;
        right: 12px;
        width: 224px;
        padding: 11px;
      }

      .preset-bar {
        bottom: 12px;
        border-radius: 16px;
        padding: 6px;
        gap: 5px;
      }

      .preset-btn {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>

<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <!-- Top-Left Title Badge -->
    <div class="title-badge">
      <div class="title-row">
        <span class="status-dot"></span>
        <span class="title-text">Photorealistic 3D Beach Cutout Diorama</span>
      </div>
      <div class="subtitle-text">
        44m × 36m Geological Slice • Pelagic Shark • Wave-Coupled Fleet • Drag to Orbit
      </div>
    </div>

    <!-- Top-Right Collapsible Studio Controls -->
    <div class="control-panel">
      <div id="panel-header" class="panel-header">
        <span class="panel-title">Studio Controls</span>
        <button id="collapse-btn" class="collapse-btn" title="Toggle Controls">−</button>
      </div>
      <div id="panel-body" class="panel-body">
        <div class="slider-group">
          <div class="slider-label-row">
            <span>Sun Elevation</span>
            <span id="sun-val" class="slider-val">28° (Afternoon)</span>
          </div>
          <input id="sun-slider" type="range" min="10" max="75" step="0.5" value="28" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Wave Energy</span>
            <span id="wave-val" class="slider-val">1.00×</span>
          </div>
          <input id="wave-slider" type="range" min="0.2" max="1.8" step="0.05" value="1.0" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Water Clarity</span>
            <span id="clarity-val" class="slider-val">1.20 (Crystal)</span>
          </div>
          <input id="clarity-slider" type="range" min="0.3" max="1.8" step="0.05" value="1.20" />
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span>Breeze &amp; Boat Swing</span>
            <span id="breeze-val" class="slider-val">1.00×</span>
          </div>
          <input id="breeze-slider" type="range" min="0.2" max="1.8" step="0.05" value="1.0" />
        </div>

        <div class="action-row">
          <button id="play-pause-btn" class="btn-primary">Pause</button>
          <button id="reset-btn" class="btn-secondary" title="Reset Camera">Reset</button>
        </div>
      </div>
    </div>

    <!-- Bottom-Center Camera Preset Pill Bar -->
    <div class="preset-bar">
      <button data-preset="hero" class="preset-btn active">Panoramic Hero</button>
      <button data-preset="shark" class="preset-btn">Shark Patrol Cam</button>
      <button data-preset="boats" class="preset-btn">Sailboat &amp; Cove</button>
      <button data-preset="swash" class="preset-btn">Shoreline Swash</button>
      <button data-preset="section" class="preset-btn">Deep Cut-Out Profile</button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loader">
    <div id="loader-spinner" class="spinner"></div>
    <div id="loader-label" class="loader-label">Sculpting Coastal Cut-Out &amp; Marine Life…</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const loaderEl = document.getElementById('loader');
    const loaderLabel = document.getElementById('loader-label');
    const loaderSpinner = document.getElementById('loader-spinner');
    let loaderDismissed = false;

    function dismissLoader() {
      if (loaderDismissed || !loaderEl) return;
      loaderDismissed = true;
      loaderEl.style.opacity = '0';
      setTimeout(() => {
        loaderEl.style.display = 'none';
      }, 450);
    }

    function showLoaderError(msg) {
      if (loaderSpinner) loaderSpinner.style.display = 'none';
      if (loaderLabel) {
        loaderLabel.style.color = '#fca5a5';
        loaderLabel.textContent = `Initialization notice: ${msg}`;
      }
    }

    // Safety fallback so loader never stays stuck
    setTimeout(dismissLoader, 1500);

    try {
      // =========================================================================
      // 1. DIORAMA DIMENSIONS & DETERMINISTIC NOISE / STATIC TOPOGRAPHY
      // =========================================================================
      const DIORAMA_W = 44.0;          // X: -22.0m to +22.0m
      const DIORAMA_D = 36.0;          // Z: -18.0m to +18.0m
      const HALF_W = DIORAMA_W * 0.5;  // 22.0m
      const HALF_D = DIORAMA_D * 0.5;  // 18.0m
      const BASE_Y = -7.20;            // Geological strata base elevation
      const SEG_X = 240;               // Static terrain & water X grid resolution
      const SEG_Z = 200;               // Static terrain & water Z grid resolution

      function fract(x) {
        return x - Math.floor(x);
      }

      function smoothstepJS(edge0, edge1, x) {
        const t = Math.max(0.0, Math.min(1.0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3.0 - 2.0 * t);
      }

      function hash21(x, y) {
        let px = fract(x * 0.1031);
        let py = fract(y * 0.1030);
        let pz = fract(x * 0.0973);
        const d = px * (py + 33.33) + py * (pz + 33.33) + pz * (px + 33.33);
        px += d;
        py += d;
        pz += d;
        return fract((px + py) * pz);
      }

      function valueNoise2D(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        const a = hash21(ix, iy);
        const b = hash21(ix + 1, iy);
        const c = hash21(ix, iy + 1);
        const d = hash21(ix + 1, iy + 1);

        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      function fbm2D(x, y) {
        let v = 0.0;
        let amp = 0.5;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          v += amp * valueNoise2D(x * freq, y * freq);
          freq *= 2.03;
          amp *= 0.5;
        }
        return v;
      }

      /**
       * 100% STATIC COASTAL & SUBMARINE TOPOGRAPHY: y = getBeachHeight(x, z)
       * Never depends on time — ensures seabed sand is completely rock-solid.
       */
      function getBeachHeight(x, z) {
        const coveCurve = Math.sin((x + 1.6) * 0.16) * 1.45 - Math.cos(x * 0.09) * 0.55;
        const headlandPromontory = Math.exp(-Math.pow((x + 17.5) / 4.8, 2.0)) * 2.15;
        const effectiveZ = z + coveCurve - headlandPromontory;

        // Upper dry golden-sand beach berm & dunes (Z: -18 to -8.5)
        const duneT = Math.max(0.0, (-4.5 - effectiveZ) / 13.5);
        const duneProfile = Math.pow(duneT, 1.52) * 1.68;
        const duneRidge = Math.exp(-Math.pow((effectiveZ + 12.4) / 3.2, 2.0)) * (0.34 + 0.22 * Math.sin(x * 0.28 + 0.6));

        // Crescentic sloping foreshore & glossy wet-sand swash zone (Z: -8.5 to -1.5)
        const foreshoreSlope = 0.66 - (effectiveZ + 4.5) * 0.195;

        // Shallow submerged nearshore sandbar (Z: -1.5 to +5.0)
        const offshoreBar = Math.exp(-Math.pow((effectiveZ - 3.2) / 1.45, 2.0)) * 0.26;

        // Shelf drop-off into deep pelagic ocean basin (Z: +5.0 to +18.0, down to Y = -5.2m)
        const shelfDrop = smoothstepJS(3.8, 7.6, effectiveZ) * 2.35;
        const deepBasinFloor = smoothstepJS(7.0, 18.0, effectiveZ) * 0.58;

        let h = duneProfile + duneRidge + foreshoreSlope + offshoreBar - shelfDrop - deepBasinFloor;

        // Left granite headland promontory (X < -10, Z: -16 to +3) with tiered ledges & two carved tidepools
        const headlandShelf = smoothstepJS(-10.2, -18.2, x) * Math.exp(-Math.pow((z + 3.2) / 7.5, 2.0)) * 1.18;
        const ledgeStep = Math.floor(headlandShelf * 4.5) * 0.055 * smoothstepJS(-10.5, -15.0, x);
        const tidePool1 = Math.exp(-((x + 15.2) * (x + 15.2) * 0.45 + (z + 0.5) * (z + 0.5) * 0.72)) * 0.78;
        const tidePool2 = Math.exp(-((x + 18.0) * (x + 18.0) * 0.52 + (z - 1.4) * (z - 1.4) * 0.65)) * 0.68;
        h += headlandShelf + ledgeStep - tidePool1 - tidePool2;

        // Rhythmic crescentic beach cusps along the intertidal swash zone
        const cuspEnv = Math.exp(-Math.pow((effectiveZ + 2.2) / 2.6, 2.0)) * smoothstepJS(-12.5, -7.0, x);
        const beachCusps = Math.cos(x * 0.90 + 0.4) * 0.072 * cuspEnv;
        h += beachCusps;

        // Natural macro terrain undulations
        const macroNoise = (fbm2D(x * 0.14 + 3.7, z * 0.14 + 2.1) - 0.5) * 0.32;
        h += macroNoise * (0.35 + 0.65 * smoothstepJS(0.0, 6.0, Math.abs(effectiveZ + 1.0)));

        // Wind-sculpted asymmetric sand ripples on the dry upper berm (h > 0.42)
        const dryMask = smoothstepJS(0.38, 0.84, h);
        const windPhase = (z * 4.2 + x * 1.15) + fbm2D(x * 0.65, z * 0.65) * 2.4;
        const windRipples = (Math.sin(windPhase) + 0.32 * Math.sin(windPhase * 2.0)) * 0.017 * dryMask;

        // Stationary wave-carved oscillatory sand ripples on the shallow submerged sandbar
        const subMask = smoothstepJS(0.06, -0.32, h) * (1.0 - smoothstepJS(-3.6, -4.8, h));
        const seabedRipplePhase = (effectiveZ * 6.2 + Math.sin(x * 0.55) * 1.3) + fbm2D(x * 0.50, z * 0.50) * 1.8;
        const seabedRipples = Math.sin(seabedRipplePhase) * 0.025 * subMask;

        return Math.max(-5.25, h + windRipples + seabedRipples);
      }

      // =========================================================================
      // 2. IDENTICAL SHARED GERSTNER SWELL + SWASH WAVE PHYSICS (JS & GLSL)
      // =========================================================================
      function gerstnerWaveJS(x, z, dirX, dirZ, steepness, wavelength, speed, time) {
        const k = (Math.PI * 2.0) / wavelength;
        const c = Math.sqrt(9.81 / k) * speed;
        const len = Math.hypot(dirX, dirZ);
        const dx = dirX / len;
        const dz = dirZ / len;
        const f = k * (dx * x + dz * z - c * time);
        const a = steepness / k;
        return {
          x: dx * (a * Math.cos(f)),
          y: a * Math.sin(f),
          z: dz * (a * Math.cos(f))
        };
      }

      function evaluateOceanWaveJS(x, z, time, intensity) {
        const sandY = getBeachHeight(x, z);
        const clampedInt = Math.max(0.15, Math.min(2.0, intensity));

        const waveSet = 0.5 + 0.5 * Math.sin(time * 0.52 + x * 0.07);
        const lateralPhase = x * 0.09 + Math.sin(x * 0.28) * 0.26 + Math.cos(x * 0.64) * 0.09;
        const primaryPhase = time * 1.56 + lateralPhase;

        const asymPhase = primaryPhase - 0.56 * Math.sin(primaryPhase);
        const swashOsc = 0.5 + 0.5 * Math.sin(asymPhase);
        const swashVel = Math.cos(asymPhase) * (1.0 - 0.56 * Math.cos(primaryPhase));

        const baseWaterLevel = -0.05;
        const maxRunupReach = (0.36 + 0.30 * waveSet) * (0.45 + 0.55 * clampedInt);
        const currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

        const g1 = gerstnerWaveJS(x, z, -0.14, -0.990, 0.23 * clampedInt, 8.8, 0.90, time);
        const g2 = gerstnerWaveJS(x, z,  0.21, -0.978, 0.18 * clampedInt, 5.8, 0.94, time);
        const g3 = gerstnerWaveJS(x, z, -0.09, -0.996, 0.14 * clampedInt, 3.9, 0.98, time);
        const g4 = gerstnerWaveJS(x, z,  0.28, -0.960, 0.10 * clampedInt, 2.6, 1.03, time);
        const g5 = gerstnerWaveJS(x, z, -0.24, -0.971, 0.07 * clampedInt, 1.65, 1.07, time);
        const g6 = gerstnerWaveJS(x, z,  0.12, -0.993, 0.05 * clampedInt, 1.08, 1.12, time);

        const sumX = g1.x + g2.x + g3.x + g4.x + g5.x + g6.x;
        const sumY = g1.y + g2.y + g3.y + g4.y + g5.y + g6.y;
        const sumZ = g1.z + g2.z + g3.z + g4.z + g5.z + g6.z;

        const deepOceanMask = smoothstepJS(0.18, -0.58, sandY);
        const shoalBoost = 1.0 + 0.28 * Math.exp(-Math.pow((sandY + 0.42) / 0.34, 2.0));

        const borderLockX = smoothstepJS(HALF_W, HALF_W - 0.75, Math.abs(x));
        const borderLockZ = smoothstepJS(HALF_D, HALF_D - 0.75, Math.abs(z));
        const horizMask = deepOceanMask * borderLockX * borderLockZ;

        const swellVertical = sumY * deepOceanMask * shoalBoost;
        const swashSheetThickness = Math.max(0.0, currentSwashY - sandY);
        const boreLip = smoothstepJS(0.0, 0.12, swashSheetThickness)
                      * (1.0 - smoothstepJS(0.12, 0.38, swashSheetThickness))
                      * 0.022 * clampedInt;

        const shoreBlend = smoothstepJS(-0.24, 0.14, sandY);
        const targetWaterY = (baseWaterLevel + swellVertical) * (1.0 - shoreBlend) + (currentSwashY + boreLip) * shoreBlend;
        const depth = targetWaterY - sandY;

        return {
          displacedX: x + sumX * horizMask * shoalBoost,
          displacedY: depth > 0.0 ? targetWaterY : sandY - 0.03,
          displacedZ: z + sumZ * horizMask * shoalBoost,
          waterY: targetWaterY,
          sandY,
          depth,
          swashVelocity: swashVel
        };
      }

      const GLSL_SHARED_NOISE_AND_WAVES = /* glsl */ `
        float hash21(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        float valueNoise2D(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash21(i);
          float b = hash21(i + vec2(1.0, 0.0));
          float c = hash21(i + vec2(0.0, 1.0));
          float d = hash21(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        float fbm2D(vec2 p) {
          float v = 0.0;
          float amp = 0.5;
          float freq = 1.0;
          for (int i = 0; i < 4; i++) {
            v += amp * valueNoise2D(p * freq);
            freq *= 2.03;
            amp *= 0.5;
          }
          return v;
        }

        float getSandElevation(vec2 xz) {
          float x = xz.x;
          float z = xz.y;

          float coveCurve = sin((x + 1.6) * 0.16) * 1.45 - cos(x * 0.09) * 0.55;
          float headlandPromontory = exp(-pow((x + 17.5) / 4.8, 2.0)) * 2.15;
          float effectiveZ = z + coveCurve - headlandPromontory;

          float duneT = max(0.0, (-4.5 - effectiveZ) / 13.5);
          float duneProfile = pow(duneT, 1.52) * 1.68;
          float duneRidge = exp(-pow((effectiveZ + 12.4) / 3.2, 2.0)) * (0.34 + 0.22 * sin(x * 0.28 + 0.6));

          float foreshoreSlope = 0.66 - (effectiveZ + 4.5) * 0.195;
          float offshoreBar = exp(-pow((effectiveZ - 3.2) / 1.45, 2.0)) * 0.26;
          float shelfDrop = smoothstep(3.8, 7.6, effectiveZ) * 2.35;
          float deepBasinFloor = smoothstep(7.0, 18.0, effectiveZ) * 0.58;

          float h = duneProfile + duneRidge + foreshoreSlope + offshoreBar - shelfDrop - deepBasinFloor;

          float headlandShelf = smoothstep(-10.2, -18.2, x) * exp(-pow((z + 3.2) / 7.5, 2.0)) * 1.18;
          float ledgeStep = floor(headlandShelf * 4.5) * 0.055 * smoothstep(-10.5, -15.0, x);
          float tidePool1 = exp(-((x + 15.2) * (x + 15.2) * 0.45 + (z + 0.5) * (z + 0.5) * 0.72)) * 0.78;
          float tidePool2 = exp(-((x + 18.0) * (x + 18.0) * 0.52 + (z - 1.4) * (z - 1.4) * 0.65)) * 0.68;
          h += headlandShelf + ledgeStep - tidePool1 - tidePool2;

          float cuspEnv = exp(-pow((effectiveZ + 2.2) / 2.6, 2.0)) * smoothstep(-12.5, -7.0, x);
          float beachCusps = cos(x * 0.90 + 0.4) * 0.072 * cuspEnv;
          h += beachCusps;

          float macroNoise = (fbm2D(vec2(x * 0.14 + 3.7, z * 0.14 + 2.1)) - 0.5) * 0.32;
          h += macroNoise * (0.35 + 0.65 * smoothstep(0.0, 6.0, abs(effectiveZ + 1.0)));

          float dryMask = smoothstep(0.38, 0.84, h);
          float windPhase = (z * 4.2 + x * 1.15) + fbm2D(vec2(x * 0.65, z * 0.65)) * 2.4;
          float windRipples = (sin(windPhase) + 0.32 * sin(windPhase * 2.0)) * 0.017 * dryMask;

          float subMask = smoothstep(0.06, -0.32, h) * (1.0 - smoothstep(-3.6, -4.8, h));
          float seabedRipplePhase = (effectiveZ * 6.2 + sin(x * 0.55) * 1.3) + fbm2D(vec2(x * 0.50, z * 0.50)) * 1.8;
          float seabedRipples = sin(seabedRipplePhase) * 0.025 * subMask;

          return max(-5.25, h + windRipples + seabedRipples);
        }

        vec3 gerstnerWave(vec2 pos, vec2 dir, float steepness, float wavelength, float speed, float time) {
          float k = 6.2831853 / wavelength;
          float c = sqrt(9.81 / k) * speed;
          vec2 d = normalize(dir);
          float f = k * (dot(d, pos) - c * time);
          float a = steepness / k;
          return vec3(
            d.x * (a * cos(f)),
            a * sin(f),
            d.y * (a * cos(f))
          );
        }

        struct WaveState {
          vec3 displacedPos;
          float waterY;
          float depth;
          float swashVelocity;
          float crestFactor;
        };

        WaveState evaluateOceanWave(vec2 baseXZ, float sandY, float time, float intensity) {
          WaveState ws;
          float x = baseXZ.x;
          float z = baseXZ.y;

          float waveSet = 0.5 + 0.5 * sin(time * 0.52 + x * 0.07);
          float lateralPhase = x * 0.09 + sin(x * 0.28) * 0.26 + cos(x * 0.64) * 0.09;
          float primaryPhase = time * 1.56 + lateralPhase;

          float asymPhase = primaryPhase - 0.56 * sin(primaryPhase);
          float swashOsc = 0.5 + 0.5 * sin(asymPhase);
          float swashVel = cos(asymPhase) * (1.0 - 0.56 * cos(primaryPhase));

          float clampedInt = clamp(intensity, 0.15, 2.0);
          float baseWaterLevel = -0.05;
          float maxRunupReach = mix(0.36, 0.66, waveSet) * (0.45 + 0.55 * clampedInt);
          float currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

          vec3 g1 = gerstnerWave(baseXZ, vec2(-0.14, -0.990), 0.23 * clampedInt, 8.8, 0.90, time);
          vec3 g2 = gerstnerWave(baseXZ, vec2( 0.21, -0.978), 0.18 * clampedInt, 5.8, 0.94, time);
          vec3 g3 = gerstnerWave(baseXZ, vec2(-0.09, -0.996), 0.14 * clampedInt, 3.9, 0.98, time);
          vec3 g4 = gerstnerWave(baseXZ, vec2( 0.28, -0.960), 0.10 * clampedInt, 2.6, 1.03, time);
          vec3 g5 = gerstnerWave(baseXZ, vec2(-0.24, -0.971), 0.07 * clampedInt, 1.65, 1.07, time);
          vec3 g6 = gerstnerWave(baseXZ, vec2( 0.12, -0.993), 0.05 * clampedInt, 1.08, 1.12, time);

          vec3 gerstnerSum = g1 + g2 + g3 + g4 + g5 + g6;

          float deepOceanMask = smoothstep(0.18, -0.58, sandY);
          float shoalBoost = 1.0 + 0.28 * exp(-pow((sandY + 0.42) / 0.34, 2.0));

          float borderLockX = smoothstep(22.0, 21.25, abs(x));
          float borderLockZ = smoothstep(18.0, 17.25, abs(z));
          float horizMask = deepOceanMask * borderLockX * borderLockZ;

          vec2 horizOffset = gerstnerSum.xz * horizMask * shoalBoost;
          float swellVertical = gerstnerSum.y * deepOceanMask * shoalBoost;

          float swashSheetThickness = max(0.0, currentSwashY - sandY);
          float boreLip = smoothstep(0.0, 0.12, swashSheetThickness) * (1.0 - smoothstep(0.12, 0.38, swashSheetThickness)) * 0.022 * clampedInt;

          float shoreBlend = smoothstep(-0.24, 0.14, sandY);
          float targetWaterY = mix(baseWaterLevel + swellVertical, currentSwashY + boreLip, shoreBlend);

          float depth = targetWaterY - sandY;
          ws.depth = depth;
          ws.swashVelocity = swashVel;
          ws.crestFactor = clamp((swellVertical * shoalBoost) / (0.23 * clampedInt + 0.001), 0.0, 1.45);
          ws.waterY = depth > 0.0 ? targetWaterY : sandY - 0.03;
          ws.displacedPos = vec3(x + horizOffset.x, ws.waterY, z + horizOffset.y);
          return ws;
        }
      `;

      // =========================================================================
      // 3. RENDERER, SCENE, CAMERA, PROCEDURAL SKY DOME & PMREM REFLECTIONS
      // =========================================================================
      const container = document.getElementById('canvas-container');

      const scene = new THREE.Scene();

      const CAMERA_PRESETS = {

      // Offscreen Render Target for Optical Water Refraction

      // Clean Standalone Atmospheric Sky Dome Shader (also feeds PMREM reflections)
      const sunDirection = new THREE.Vector3();
      const sunColor = new THREE.Color();

      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uSunDir: { value: sunDirection },
          uSunColor: { value: sunColor },
          uGoldenFactor: { value: 0.25 }
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldDir;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldDir = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform float uGoldenFactor;
          varying vec3 vWorldDir;

          void main() {
            vec3 dir = normalize(vWorldDir);
            vec3 L = normalize(uSunDir);

            float up = clamp(dir.y, 0.0, 1.0);
            float down = clamp(-dir.y, 0.0, 1.0);

            vec3 zenithDay = vec3(0.11, 0.34, 0.72);
            vec3 zenithGolden = vec3(0.17, 0.27, 0.50);
            vec3 zenith = mix(zenithDay, zenithGolden, uGoldenFactor);

            vec3 horizonDay = vec3(0.68, 0.85, 0.96);
            vec3 horizonGolden = vec3(0.96, 0.66, 0.42);
            vec3 horizon = mix(horizonDay, horizonGolden, uGoldenFactor);

            vec3 skyCol = mix(horizon, zenith, pow(up, 0.52));

            // Forward Mie sun glow & crisp solar disc
            float sunCos = max(dot(dir, L), 0.0);
            float mieGlow = pow(sunCos, 8.0) * 0.35 + pow(sunCos, 64.0) * 0.65;
            float sunDisc = smoothstep(0.99935, 0.99975, sunCos) * 6.5;
            skyCol += uSunColor * (mieGlow * (0.45 + 0.55 * uGoldenFactor) + sunDisc);

            // Subtle studio dark-slate lower hemisphere backdrop below horizon
            vec3 lowerStudio = vec3(0.05, 0.08, 0.13);
            skyCol = mix(skyCol, lowerStudio, smoothstep(0.0, 0.18, down));

            gl_FragColor = vec4(skyCol, 1.0);
          }
        `
      });

      const skyDome = new THREE.Mesh(new THREE.SphereGeometry(220, 32, 20), skyMat);

      // Three-Point Coastal Sunlight + Sky Bounce Rig

      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 4.0;
      sunLight.shadow.camera.far = 94.0;

      sunLight.shadow.camera.left = -shadowExtent;
      sunLight.shadow.camera.right = shadowExtent;
      sunLight.shadow.camera.top = shadowExtent;
      sunLight.shadow.camera.bottom = -shadowExtent;
      sunLight.shadow.bias = -0.00045;
      sunLight.shadow.normalBias = 0.024;
      scene.add(sunLight);

      const hemiLight = new THREE.HemisphereLight(0x9ed4ff, 0x8d7456, 0.78);
      scene.add(hemiLight);

      const rimFillLight = new THREE.DirectionalLight(0x7cc4fa, 0.62);
      rimFillLight.position.set(-28, 14, -22);
      scene.add(rimFillLight);

      function updateSunAndEnvironment(elevationDeg) {
        const azimuthDeg = 134;
        const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
        const theta = THREE.MathUtils.degToRad(azimuthDeg);

        sunDirection.setFromSphericalCoords(1, phi, theta).normalize();
        const goldenFactor = 1.0 - THREE.MathUtils.smoothstep(elevationDeg, 10.0, 36.0);
        skyMat.uniforms.uGoldenFactor.value = goldenFactor;

        sunColor.setHSL(
          THREE.MathUtils.lerp(0.11, 0.068, goldenFactor),
          THREE.MathUtils.lerp(0.22, 0.85, goldenFactor),
          THREE.MathUtils.lerp(0.97, 0.78, goldenFactor)
        );

        sunLight.position.copy(sunDirection).multiplyScalar(42.0);
        sunLight.color.copy(sunColor);
        sunLight.intensity = THREE.MathUtils.lerp(3.55, 2.85, goldenFactor);
        hemiLight.intensity = THREE.MathUtils.lerp(0.80, 0.56, goldenFactor);

        if (currentEnvRT) currentEnvRT.dispose();
        currentEnvRT = pmremGenerator.fromScene(skyEnvScene, 0.03);
        scene.environment = currentEnvRT.texture;
        scene.environmentIntensity = 0.96;
      }

      const sharedUniforms = {
        uTime: { value: 0.0 },
        uWaveIntensity: { value: 1.0 },
        uWaterClarity: { value: 1.20 },
        uBreeze: { value: 1.0 },
        uSunDir: { value: sunDirection },
        uSunColor: { value: sunColor },
        uRefractionMap: { value: refractionRT.texture },
        uResolution: { value: new THREE.Vector2(rtSize.x, rtSize.y) },
        uBoats: {
          value: [
            new THREE.Vector4(5.8, 6.2, 2.40, 0.74),
            new THREE.Vector4(-6.8, 4.6, 1.75, 0.58),
