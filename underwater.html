  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;

      position: fixed;

      height: 100%;

    }

      display: block;

      height: 100%;

      background: rgba(8, 22, 34, 0.62);

      -webkit-backdrop-filter: blur(18px) saturate(160%);

      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);

      background: rgba(8, 24, 38, 0.68);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);

      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    input[type="range"].diorama-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.24);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].diorama-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.75);

      background: #7dd3fc;

    input[type="range"].diorama-slider::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #e0f2fe;

  <!-- Unified ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"

  <!-- Main Three.js Application Module -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // 1. GLOBAL CONFIGURATION & SHARED SHADER UNIFORMS
    // =========================================================================
    const OCEAN_EXTENT = 320.0;
    const WATER_LEVEL = 23.6;

    const sharedUniforms = {
      uTime: { value: 0 },
      uWaveStrength: { value: 1.0 },
      uCurrentStrength: { value: 1.0 },
      uCausticsIntensity: { value: 0.78 },
      uCausticsColor: { value: new THREE.Color(0xcff4ff) },
      uWaterLevel: { value: WATER_LEVEL },
      uWaterClarity: { value: 0.88 },
      uWaterTint: { value: new THREE.Color(0x1e7682) },
      uDeepWaterTint: { value: new THREE.Color(0x0d3f4f) },
      uSunDir: { value: new THREE.Vector3(14, 38, 12).normalize() },
      uSunColor: { value: new THREE.Color(0xf2ebd9) },
      uSkyTopColor: { value: new THREE.Color(0x3f8ab5) },
      uSkyHorizonColor: { value: new THREE.Color(0xbce3f2) },
      uBiolumIntensity: { value: 0.14 }
    };

    // =========================================================================
    // 2. DETERMINISTIC PSEUDO-RANDOM & PROCEDURAL NOISE HELPERS
    // =========================================================================
    function createSeededRandom(seed) {
      let s = seed >>> 0;
      return function () {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function hash2D(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);

      const a = hash2D(ix, iy);
      const b = hash2D(ix + 1, iy);
      const c = hash2D(ix, iy + 1);
      const d = hash2D(ix + 1, iy + 1);

      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 4) {
      let val = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return val;
    }

    // Continuous seabed height function shared across terrain & object placement
    function getSeabedHeight(x, z) {
      const baseDunes = (fbm2D(x * 0.06 + 3.1, z * 0.06 - 1.7, 4) - 0.5) * 1.45;
      const sandRipples = Math.sin(x * 1.45 + z * 0.55 + fbm2D(x * 0.25, z * 0.25, 2) * 2.2) * 0.075;

      // Subtle scour depression around the sunken galleon
      const dxShip = x + 2.4;
      const dzShip = z + 1.2;
      const shipDist = Math.hypot(dxShip * 0.72, dzShip);
      const shipBasin = -0.58 * Math.exp(-(shipDist * shipDist) / 36.0);

      // Gentle outer jungle terrace rise
      const radial = Math.hypot(x, z);
      const outerRise = Math.max(0.0, (radial - 14.0) * 0.055) * fbm2D(x * 0.05 + 8.0, z * 0.05 + 4.0, 3);

      return baseDunes + sandRipples + shipBasin + outerRise;
    }

    function deformBoulderGeometry(geo, radius, seed = 1) {
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const dir = v.clone().normalize();
        const n1 = fbm2D(dir.x * 2.4 + seed * 3.7, dir.z * 2.4 + dir.y * 2.1, 4);
        const n2 = fbm2D(dir.y * 5.2 - seed * 1.9, dir.x * 5.2 + dir.z * 3.1, 3);
        const disp = radius * (0.76 + 0.42 * n1 + 0.14 * n2);
        v.copy(dir).multiplyScalar(disp);
        if (v.y < -radius * 0.35) {
          v.y *= 0.65;
        }
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // =========================================================================
    // 3. PROCEDURAL PBR TEXTURES (SAND, TIMBER, ROCK, BARK)
    // =========================================================================
    function generateProceduralTextures() {
      // A. Rippled Ocean Sand Albedo + Bump
      const sandSize = 512;
      const sandAlbedoCanvas = document.createElement('canvas');
      sandAlbedoCanvas.width = sandSize;
      sandAlbedoCanvas.height = sandSize;
      const sCtx = sandAlbedoCanvas.getContext('2d');

      const sandBumpCanvas = document.createElement('canvas');
      sandBumpCanvas.width = sandSize;
      sandBumpCanvas.height = sandSize;
      const bCtx = sandBumpCanvas.getContext('2d');

      const sImg = sCtx.createImageData(sandSize, sandSize);
      const bImg = bCtx.createImageData(sandSize, sandSize);

      for (let y = 0; y < sandSize; y++) {
        for (let x = 0; x < sandSize; x++) {
          const u = (x / sandSize) * Math.PI * 2;
          const v = (y / sandSize) * Math.PI * 2;
          const wave = Math.sin(u * 14.0 + Math.sin(v * 3.0) * 1.4) * 0.5 + 0.5;
          const grain = hash2D(x * 0.73, y * 0.91);
          const mottle = fbm2D((x / sandSize) * 10.0, (y / sandSize) * 10.0, 3);
          const heightVal = wave * 0.62 + mottle * 0.25 + grain * 0.13;

          const idx = (y * sandSize + x) * 4;
          sImg.data[idx] = Math.min(255, Math.floor(204 + heightVal * 34));
          sImg.data[idx + 1] = Math.min(255, Math.floor(193 + heightVal * 32));
          sImg.data[idx + 2] = Math.min(255, Math.floor(160 + heightVal * 28));
          sImg.data[idx + 3] = 255;

          const bumpByte = Math.min(255, Math.max(0, Math.floor(heightVal * 255)));
          bImg.data[idx] = bumpByte;
          bImg.data[idx + 1] = bumpByte;
          bImg.data[idx + 2] = bumpByte;
          bImg.data[idx + 3] = 255;
        }
      }
      sCtx.putImageData(sImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const sandMap = new THREE.CanvasTexture(sandAlbedoCanvas);
      sandMap.wrapS = THREE.RepeatWrapping;
      sandMap.wrapT = THREE.RepeatWrapping;
      sandMap.repeat.set(36, 36);
      sandMap.colorSpace = THREE.SRGBColorSpace;

      const sandBump = new THREE.CanvasTexture(sandBumpCanvas);
      sandBump.wrapS = THREE.RepeatWrapping;
      sandBump.wrapT = THREE.RepeatWrapping;
      sandBump.repeat.set(36, 36);

      // B. Weathered Shipwreck Timber Albedo + Bump
      const woodSize = 512;
      const woodCanvas = document.createElement('canvas');
      woodCanvas.width = woodSize;
      woodCanvas.height = woodSize;
      const wCtx = woodCanvas.getContext('2d');

      const woodBumpCanvas = document.createElement('canvas');
      woodBumpCanvas.width = woodSize;
      woodBumpCanvas.height = woodSize;
      const wbCtx = woodBumpCanvas.getContext('2d');

      const wImg = wCtx.createImageData(woodSize, woodSize);
      const wbImg = wbCtx.createImageData(woodSize, woodSize);

      for (let y = 0; y < woodSize; y++) {
        const plankIdx = Math.floor(y / 64);
        const plankEdge = (y % 64) < 3 || (y % 64) > 61 ? 0.35 : 1.0;
        for (let x = 0; x < woodSize; x++) {
          const grain = fbm2D(x * 0.015 + plankIdx * 7.3, y * 0.16, 4);
          const ring = Math.sin((y * 0.22 + grain * 4.5)) * 0.5 + 0.5;
          const algae = Math.max(0, fbm2D(x * 0.025 + 4.2, y * 0.025 - 1.9, 3) - 0.54) * 2.1;

          const baseR = (84 + ring * 38) * plankEdge;
          const baseG = (60 + ring * 28 + algae * 48) * plankEdge;
          const baseB = (42 + ring * 20 + algae * 22) * plankEdge;

          const idx = (y * woodSize + x) * 4;
          wImg.data[idx] = Math.min(255, Math.floor(baseR));
          wImg.data[idx + 1] = Math.min(255, Math.floor(baseG));
          wImg.data[idx + 2] = Math.min(255, Math.floor(baseB));
          wImg.data[idx + 3] = 255;

          const bVal = Math.min(255, Math.floor((ring * 0.7 + grain * 0.3) * plankEdge * 255));
          wbImg.data[idx] = bVal;
          wbImg.data[idx + 1] = bVal;
          wbImg.data[idx + 2] = bVal;
          wbImg.data[idx + 3] = 255;
        }
      }
      wCtx.putImageData(wImg, 0, 0);
      wbCtx.putImageData(wbImg, 0, 0);

      const woodMap = new THREE.CanvasTexture(woodCanvas);
      woodMap.wrapS = THREE.RepeatWrapping;
      woodMap.wrapT = THREE.RepeatWrapping;
      woodMap.colorSpace = THREE.SRGBColorSpace;

      const woodBump = new THREE.CanvasTexture(woodBumpCanvas);
      woodBump.wrapS = THREE.RepeatWrapping;
      woodBump.wrapT = THREE.RepeatWrapping;

      // C. Reef Rock Albedo + Bump
      const rockSize = 256;
      const rockCanvas = document.createElement('canvas');
      rockCanvas.width = rockSize;
      rockCanvas.height = rockSize;
      const rCtx = rockCanvas.getContext('2d');
      const rImg = rCtx.createImageData(rockSize, rockSize);

      for (let y = 0; y < rockSize; y++) {
        for (let x = 0; x < rockSize; x++) {
          const n = fbm2D(x * 0.04, y * 0.04, 4);
          const moss = Math.max(0, fbm2D(x * 0.06 + 9.2, y * 0.06 + 3.4, 3) - 0.5) * 1.9;
          const idx = (y * rockSize + x) * 4;
          rImg.data[idx] = Math.min(255, Math.floor(62 + n * 48 - moss * 14));
          rImg.data[idx + 1] = Math.min(255, Math.floor(70 + n * 52 + moss * 34));
          rImg.data[idx + 2] = Math.min(255, Math.floor(74 + n * 50 + moss * 12));
          rImg.data[idx + 3] = 255;
        }
      }
      rCtx.putImageData(rImg, 0, 0);
      const rockMap = new THREE.CanvasTexture(rockCanvas);
      rockMap.wrapS = THREE.RepeatWrapping;
      rockMap.wrapT = THREE.RepeatWrapping;
      rockMap.colorSpace = THREE.SRGBColorSpace;

      return { sandMap, sandBump, woodMap, woodBump, rockMap };
    }

    // =========================================================================
    // 4. REAL-TIME PRISMATIC GLSL CAUSTICS INJECTION FOR UNDERWATER MATERIALS
    // =========================================================================
    function injectUnderwaterCaustics(material, options = {}) {
      const causticScale = options.scale ?? 0.34;
      const causticBoost = options.boost ?? 1.0;

      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uCausticsIntensity = sharedUniforms.uCausticsIntensity;
        shader.uniforms.uCausticsColor = sharedUniforms.uCausticsColor;
        shader.uniforms.uWaterLevel = sharedUniforms.uWaterLevel;
        shader.uniforms.uWaterClarity = sharedUniforms.uWaterClarity;
        shader.uniforms.uWaterTint = sharedUniforms.uWaterTint;
        shader.uniforms.uDeepWaterTint = sharedUniforms.uDeepWaterTint;
        shader.uniforms.uSunDir = sharedUniforms.uSunDir;

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            varying vec3 vCwWorldPos;
            varying vec3 vCwWorldNormal;`
          )
          .replace(
            '#include <worldpos_vertex>',
            `#include <worldpos_vertex>
            vec4 cwWp = vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              cwWp = instanceMatrix * cwWp;
            #endif
            cwWp = modelMatrix * cwWp;
            vCwWorldPos = cwWp.xyz;

            vec3 cwWn = objectNormal;
            #ifdef USE_INSTANCING
              cwWn = mat3(instanceMatrix) * cwWn;
            #endif
            vCwWorldNormal = normalize(mat3(modelMatrix) * cwWn);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vCwWorldPos;
            varying vec3 vCwWorldNormal;
            uniform float uTime;
            uniform float uCausticsIntensity;
            uniform vec3 uCausticsColor;
            uniform float uWaterLevel;
            uniform float uWaterClarity;
            uniform vec3 uWaterTint;
            uniform vec3 uDeepWaterTint;
            uniform vec3 uSunDir;

            float causticLayer(vec2 uv, float t) {
              vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.005;
              for (int n = 0; n < 4; n++) {
                float time = t * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(
                  cos(time - i.x) + sin(time + i.y),
                  sin(time - i.y) + cos(time + i.x)
                );
                float sx = max(0.001, abs(sin(i.x + time)));
                float cy = max(0.001, abs(cos(i.y + time)));
                c += 1.0 / length(vec2(p.x / (sx / inten), p.y / (cy / inten)));
              }
              c /= 4.0;
              c = 1.17 - pow(max(0.0, c), 1.4);
              return pow(abs(c), 7.5);
            }`
          )
          .replace(
            '#include <opaque_fragment>',
            `if (vCwWorldPos.y < uWaterLevel) {
              float depth = max(0.0, uWaterLevel - vCwWorldPos.y);
              vec2 projUV = (vCwWorldPos.xz - uSunDir.xz * (depth / max(0.25, uSunDir.y))) * ${causticScale.toFixed(3)};

              float cR = causticLayer(projUV + vec2(0.012, 0.006), uTime * 0.85);
              float cG = causticLayer(projUV, uTime * 0.85);
              float cB = causticLayer(projUV - vec2(0.012, 0.008), uTime * 0.85);
              vec3 causticRGB = clamp(vec3(cR, cG, cB), 0.0, 2.0);

              float upFacing = smoothstep(-0.15, 0.85, vCwWorldNormal.y);
              float depthFade = exp(-depth * 0.016);
              float radialFade = smoothstep(115.0, 36.0, length(vCwWorldPos.xz));

              float depthNorm = clamp(depth / 26.0, 0.0, 1.0);
              vec3 waterTransmission = mix(vec3(0.88, 0.93, 0.96), vec3(0.68, 0.84, 0.90), depthNorm);
              outgoingLight *= waterTransmission;

              outgoingLight += causticRGB * uCausticsColor * uCausticsIntensity * ${causticBoost.toFixed(2)} * upFacing * depthFade * radialFade * 1.15;

              float absorb = 1.0 - exp(-(depth * 0.45 + 2.0) * (1.08 - uWaterClarity) * 0.09);
              vec3 waterScatter = mix(uWaterTint * 1.02, uDeepWaterTint * 1.08, depthNorm);
              outgoingLight = mix(outgoingLight, waterScatter, clamp(absorb * 0.40, 0.05, 0.48));
            }
            #include <opaque_fragment>`
          );
      };
      return material;
    }

    // =========================================================================
    // 5. EXPANSIVE OCEAN SEABED & SUNLIT WAVE-ANIMATED WATER SURFACE
    // =========================================================================
    function buildOceanEnvironment(scene, textures) {
      const group = new THREE.Group();
      scene.add(group);

      // A. Sculpted Horizon-Spanning Ocean Floor
      const sandGeo = new THREE.PlaneGeometry(OCEAN_EXTENT, OCEAN_EXTENT, 180, 180);
      sandGeo.rotateX(-Math.PI / 2);
      const sPos = sandGeo.attributes.position;
      for (let i = 0; i < sPos.count; i++) {
        const x = sPos.getX(i);
        const z = sPos.getZ(i);
        sPos.setY(i, getSeabedHeight(x, z));
      }
      sandGeo.computeVertexNormals();

      const sandMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: textures.sandMap,
          bumpMap: textures.sandBump,
          bumpScale: 0.09,
          roughness: 0.86,
          metalness: 0.02
        }),
        { scale: 0.28, boost: 1.32 }
      );
      const sandMesh = new THREE.Mesh(sandGeo, sandMat);
      sandMesh.receiveShadow = true;
      sandMesh.name = 'seabed';
      group.add(sandMesh);

      // B. Open-Ocean Gerstner Wave Water Surface (Snell's Window & Sunlit Shimmer)
      const waterCapGeo = new THREE.PlaneGeometry(OCEAN_EXTENT, OCEAN_EXTENT, 160, 160);
      waterCapGeo.rotateX(-Math.PI / 2);

      const waterCapMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uTime: sharedUniforms.uTime,
          uWaveStrength: sharedUniforms.uWaveStrength,
          uWaterTint: sharedUniforms.uWaterTint,
          uDeepWaterTint: sharedUniforms.uDeepWaterTint,
          uSunDir: sharedUniforms.uSunDir,
          uSunColor: sharedUniforms.uSunColor,
          uSkyTopColor: sharedUniforms.uSkyTopColor,
          uSkyHorizonColor: sharedUniforms.uSkyHorizonColor
        },
        vertexShader: `
          uniform float uTime;
          uniform float uWaveStrength;
          varying vec3 vWorldPos;
          varying vec3 vWaveNormal;

          void main() {
            vec3 pos = position;
            float t = uTime * 1.45;
            float amp = 0.24 * uWaveStrength;

            float w1 = sin(pos.x * 0.34 + pos.z * 0.22 + t * 1.3) * amp;
            float w2 = cos(pos.x * 0.52 - pos.z * 0.44 + t * 1.7) * amp * 0.65;
            float w3 = sin(pos.x * 0.95 + pos.z * 0.85 - t * 2.1) * amp * 0.32;
            float w4 = cos(pos.x * 1.65 - pos.z * 1.45 + t * 2.6) * amp * 0.16;
            pos.y += w1 + w2 + w3 + w4;

            float dHx = 0.34 * cos(pos.x * 0.34 + pos.z * 0.22 + t * 1.3) * amp
                      - 0.52 * sin(pos.x * 0.52 - pos.z * 0.44 + t * 1.7) * amp * 0.65
                      + 0.95 * cos(pos.x * 0.95 + pos.z * 0.85 - t * 2.1) * amp * 0.32;
            float dHz = 0.22 * cos(pos.x * 0.34 + pos.z * 0.22 + t * 1.3) * amp
                      + 0.44 * sin(pos.x * 0.52 - pos.z * 0.44 + t * 1.7) * amp * 0.65
                      + 0.85 * cos(pos.x * 0.95 + pos.z * 0.85 - t * 2.1) * amp * 0.32;

            vWaveNormal = normalize(vec3(-dHx, 1.0, -dHz));
            vec4 wp = modelMatrix * vec4(pos, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uWaterTint;
          uniform vec3 uDeepWaterTint;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyTopColor;
          uniform vec3 uSkyHorizonColor;
          varying vec3 vWorldPos;
          varying vec3 vWaveNormal;

          void main() {
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 N = normalize(vWaveNormal);
            float dist = length(vWorldPos.xz);
            float horizonFade = smoothstep(155.0, 68.0, dist);

            if (gl_FrontFacing) {
              float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.4);
              vec3 R = reflect(-V, N);
              vec3 skyRefl = mix(uSkyHorizonColor, uSkyTopColor, clamp(R.y * 1.25, 0.0, 1.0));
              vec3 H = normalize(uSunDir + V);
              float spec = pow(max(dot(N, H), 0.0), 170.0) * 2.6;
              float foam = smoothstep(0.24, 0.42, length(N.xz));

              vec3 baseCol = mix(uWaterTint * 1.25, skyRefl, clamp(fresnel * 0.85 + 0.16, 0.0, 0.94));
              baseCol += uSunColor * spec + vec3(0.88, 0.98, 1.0) * foam * 0.24;
              float alpha = mix(0.56, 0.88, fresnel) * horizonFade;
              gl_FragColor = vec4(baseCol, alpha);
            } else {
              // Underwater view looking up: Dazzling Snell's window & sunlit wave shimmer
              vec3 Nu = -N;
              float cosTheta = clamp(dot(Nu, V), 0.0, 1.0);
              float snellWindow = smoothstep(0.42, 0.74, cosTheta);
              vec3 tirColor = mix(uDeepWaterTint * 1.25, uWaterTint * 1.38, 0.65);
              vec3 skyWindow = mix(uWaterTint * 1.65, uSunColor * 1.32, pow(cosTheta, 1.85));
              vec3 col = mix(tirColor, skyWindow, snellWindow);
              gl_FragColor = vec4(col, mix(0.62, 0.28, snellWindow) * horizonFade);
            }
          }
        `
      });

      const waterCapMesh = new THREE.Mesh(waterCapGeo, waterCapMat);
      waterCapMesh.position.y = WATER_LEVEL;
      waterCapMesh.renderOrder = 12;
      group.add(waterCapMesh);

      return { group, waterCapMesh, sandMesh };
    }

    // =========================================================================
    // 6. VOLUMETRIC GOD RAYS (RADIANT SHINING SUNLIGHT SHAFTS)
    // =========================================================================
    function buildVolumetricGodRays(scene) {
      const raysGroup = new THREE.Group();
      scene.add(raysGroup);

      const rayMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uTime: sharedUniforms.uTime,
          uCausticsIntensity: sharedUniforms.uCausticsIntensity,
          uSunColor: sharedUniforms.uSunColor,
          uCausticsColor: sharedUniforms.uCausticsColor
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormalV;
          varying vec3 vViewDir;

          void main() {
            vUv = uv;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vNormalV = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          varying vec3 vNormalV;
          varying vec3 vViewDir;

          uniform float uTime;
          uniform float uCausticsIntensity;
          uniform vec3 uSunColor;
          uniform vec3 uCausticsColor;

          void main() {
            float edgeFade = pow(abs(dot(vNormalV, vViewDir)), 1.65);
            float vertFade = smoothstep(0.0, 0.22, vUv.y) * smoothstep(1.0, 0.68, vUv.y);
            float s1 = sin(vUv.x * 18.849 + uTime * 1.35);
            float s2 = cos(vUv.x * 31.415 - uTime * 0.95 + vUv.y * 2.5);
            float streak = 0.55 + 0.45 * (s1 * 0.6 + s2 * 0.4);

            vec3 warmSun = mix(uCausticsColor, uSunColor, 0.62);
            vec3 col = mix(vec3(0.38, 0.78, 0.88), warmSun, streak * 0.72);
            float alpha = edgeFade * vertFade * streak * 0.056 * uCausticsIntensity;
            gl_FragColor = vec4(col, alpha);
          }
        `
      });

      const raySpecs = [
        // Central hero sunbeams illuminating the galleon, treasure & reef clearing
        { x: -2.8, z: -1.0, rTop: 2.2, rBot: 5.2, h: 25.0 },
        { x: 1.8, z: 1.6, rTop: 2.0, rBot: 4.8, h: 24.6 },
        { x: -0.5, z: 3.4, rTop: 1.7, rBot: 4.1, h: 24.4 },
        { x: 4.6, z: -2.4, rTop: 1.9, rBot: 4.4, h: 24.2 },
        { x: -5.8, z: 3.2, rTop: 1.8, rBot: 4.2, h: 24.6 },
        { x: 6.4, z: 4.2, rTop: 1.8, rBot: 4.2, h: 24.2 },
        { x: 0.4, z: -5.4, rTop: 2.0, rBot: 4.6, h: 24.4 },
        { x: -6.4, z: -5.6, rTop: 1.9, rBot: 4.4, h: 24.0 },
        { x: 7.4, z: -5.2, rTop: 1.8, rBot: 4.2, h: 23.8 },
        { x: -1.6, z: 6.8, rTop: 1.9, rBot: 4.4, h: 24.8 },
        // Outer jungle-edge sunbeams filtering through the kelp canopy
        { x: -15.5, z: -12.0, rTop: 2.4, rBot: 5.4, h: 24.5 },
        { x: 16.0, z: -11.5, rTop: 2.3, rBot: 5.2, h: 24.0 },
        { x: -14.5, z: 13.5, rTop: 2.2, rBot: 5.0, h: 24.8 },
        { x: 15.0, z: 14.0, rTop: 2.3, rBot: 5.1, h: 24.2 },
        { x: 0.0, z: -17.5, rTop: 2.5, rBot: 5.6, h: 24.4 },
        { x: 2.5, z: 16.5, rTop: 2.2, rBot: 4.9, h: 24.6 },
        { x: -18.5, z: 0.5, rTop: 2.3, rBot: 5.2, h: 24.4 },
        { x: 18.5, z: 1.0, rTop: 2.3, rBot: 5.2, h: 24.4 }
      ];

      raySpecs.forEach((spec) => {
        const coneGeo = new THREE.CylinderGeometry(spec.rTop, spec.rBot, spec.h, 24, 1, true);
        const cone = new THREE.Mesh(coneGeo, rayMat);
        cone.position.set(spec.x, WATER_LEVEL - spec.h * 0.5, spec.z);
        cone.rotation.set(0.11, 0, -0.14);
        cone.renderOrder = 6;
        raysGroup.add(cone);
      });

      return raysGroup;
    }

    // =========================================================================
    // 7. HERO SUNKEN GALLEON & NAUTICAL ARTIFACTS
    // =========================================================================
    function buildSunkenGalleon(scene, textures) {
      const shipGroup = new THREE.Group();
      const baseX = -2.4;
      const baseZ = -1.2;
      const baseY = getSeabedHeight(baseX, baseZ) + 0.45;
      shipGroup.position.set(baseX, baseY, baseZ);
      shipGroup.rotation.set(0.08, 0.52, -0.24);
      scene.add(shipGroup);

      const woodMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: textures.woodMap,
          bumpMap: textures.woodBump,
          bumpScale: 0.06,
          roughness: 0.82,
          metalness: 0.05
        }),
        { scale: 0.4, boost: 1.1 }
      );

      const darkTimberMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: textures.woodMap,
          color: 0x6b5344,
          roughness: 0.88,
          metalness: 0.04
        }),
        { scale: 0.4, boost: 1.0 }
      );

      const ironMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x3a4046,
          roughness: 0.62,
          metalness: 0.78
        }),
        { scale: 0.45, boost: 1.0 }
      );

      const brassMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xd4a438,
          roughness: 0.32,
          metalness: 0.88
        }),
        { scale: 0.5, boost: 1.25 }
      );

      // 1. Keel & Spine
      const keel = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 11.4), darkTimberMat);
      keel.position.set(0, -0.35, 0);
      keel.castShadow = true;
      keel.receiveShadow = true;
      shipGroup.add(keel);

      // 2. Curved Hull Ribs & Planking
      const ribCount = 15;
      for (let i = 0; i < ribCount; i++) {
        const t = i / (ribCount - 1);
        const z = (t - 0.5) * 9.8;
        const beamProfile = Math.sin(Math.pow(t, 0.82) * Math.PI);
        const halfWidth = 0.55 + beamProfile * 1.85;
        const ribHeight = 1.45 + (1.0 - t) * 0.95;

        const sideList = [-1, 1];
        for (let s = 0; s < sideList.length; s++) {
          const side = sideList[s];
          if (side === 1 && i >= 6 && i <= 10) continue;

          const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.25, z),
            new THREE.Vector3(side * halfWidth * 0.68, 0.15, z),
            new THREE.Vector3(side * halfWidth, ribHeight * 0.62, z),
            new THREE.Vector3(side * halfWidth * 0.92, ribHeight, z)
          ]);
          const ribGeo = new THREE.TubeGeometry(curve, 12, 0.11, 7, false);
          const ribMesh = new THREE.Mesh(ribGeo, darkTimberMat);
          ribMesh.castShadow = true;
          ribMesh.receiveShadow = true;
          shipGroup.add(ribMesh);

          if (i < ribCount - 1) {
            const plankCount = side === 1 && i >= 4 && i <= 11 ? 2 : 4;
            for (let p = 0; p < plankCount; p++) {
              const py = 0.15 + p * 0.34;
              const plank = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.27, 0.78), woodMat);
              plank.position.set(side * (halfWidth * (0.76 + p * 0.06)), py, z + 0.35);
              plank.rotation.z = -side * (0.35 - p * 0.08);
              plank.castShadow = true;
              plank.receiveShadow = true;
              shipGroup.add(plank);
            }
          }
        }
      }

      // 3. Main Deck & Stern Quarterdeck
      const mainDeck = new THREE.Mesh(new THREE.BoxGeometry(2.85, 0.16, 7.6), woodMat);
      mainDeck.position.set(0, 1.05, 0.4);
      mainDeck.castShadow = true;
      mainDeck.receiveShadow = true;
      shipGroup.add(mainDeck);

      const sternDeck = new THREE.Mesh(new THREE.BoxGeometry(2.65, 0.18, 2.8), woodMat);
      sternDeck.position.set(0, 1.85, -3.5);
      sternDeck.castShadow = true;
      sternDeck.receiveShadow = true;
      shipGroup.add(sternDeck);

      // Stern Cabin Walls & Window Frames
      const sternCabin = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.85, 2.4), darkTimberMat);
      sternCabin.position.set(0, 1.42, -3.55);
      sternCabin.castShadow = true;
      shipGroup.add(sternCabin);

      const sternTransom = new THREE.Mesh(new THREE.BoxGeometry(2.35, 1.25, 0.18), woodMat);
      sternTransom.position.set(0, 1.72, -4.82);
      sternTransom.rotation.x = -0.18;
      shipGroup.add(sternTransom);

      const lanternCage = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.38, 6), brassMat);
      lanternCage.position.set(0, 2.45, -4.95);
      shipGroup.add(lanternCage);

      const lanternGlowMat = new THREE.MeshStandardMaterial({
        color: 0xffd27d,
        emissive: 0xff9d2e,
        emissiveIntensity: 1.8,
        roughness: 0.2
      });
      const lanternCore = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), lanternGlowMat);
      lanternCore.position.copy(lanternCage.position);
      shipGroup.add(lanternCore);

      const lanternLight = new THREE.PointLight(0xffaa44, 2.2, 8.5, 1.6);
      lanternLight.position.set(0, 2.45, -5.2);
      shipGroup.add(lanternLight);

      // 4. Ship's Helm Wheel
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(0, 2.38, -2.55);
      const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.045, 10, 24), woodMat);
      wheelGroup.add(wheelRim);
      for (let sp = 0; sp < 8; sp++) {
        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.05, 8), woodMat);
        spoke.rotation.z = (sp * Math.PI) / 4;
        wheelGroup.add(spoke);
      }
      shipGroup.add(wheelGroup);

      // 5. Broken Mainmast, Foremast, Bowsprit & Tattered Sail
      const mainMast = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.21, 5.4, 12), darkTimberMat);
      mainMast.position.set(0, 3.3, -0.35);
      mainMast.rotation.z = 0.09;
      mainMast.castShadow = true;
      shipGroup.add(mainMast);

      const crowsNest = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.44, 0.34, 14), woodMat);
      crowsNest.position.set(-0.22, 4.45, -0.35);
      shipGroup.add(crowsNest);

      const yardArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.6, 10), darkTimberMat);
      yardArm.position.set(-0.18, 4.1, -0.35);
      yardArm.rotation.z = Math.PI / 2 + 0.14;
      yardArm.rotation.y = 0.22;
      shipGroup.add(yardArm);

      const sailGeo = new THREE.PlaneGeometry(3.1, 2.1, 18, 12);
      const sailPos = sailGeo.attributes.position;
      for (let i = 0; i < sailPos.count; i++) {
        const sx = sailPos.getX(i);
        const sy = sailPos.getY(i);
        const billow = Math.cos((sx / 1.55) * (Math.PI * 0.5)) * 0.42 * (1.0 - Math.abs(sy) / 1.2);
        const fray = sy < -0.65 ? Math.sin(sx * 7.5) * 0.18 : 0;
        sailPos.setZ(i, billow + fray);
      }
      sailGeo.computeVertexNormals();

      const sailMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xc8bfa8,
          roughness: 0.92,
          side: THREE.DoubleSide
        }),
        { scale: 0.38, boost: 1.15 }
      );
      const sailMesh = new THREE.Mesh(sailGeo, sailMat);
      sailMesh.position.set(-0.16, 3.05, -0.22);
      sailMesh.rotation.y = 0.22;
      sailMesh.castShadow = true;
      shipGroup.add(sailMesh);

      // Broken Foremast & Bowsprit
      const foreMast = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.16, 2.7, 10), darkTimberMat);
      foreMast.position.set(0, 2.15, 2.65);
      foreMast.rotation.x = 0.26;
      shipGroup.add(foreMast);

      const bowsprit = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 3.4, 10), darkTimberMat);
      bowsprit.position.set(0, 1.85, 5.4);
      bowsprit.rotation.x = 1.12;
      bowsprit.castShadow = true;
      shipGroup.add(bowsprit);

      // 6. Corroded Bronze Naval Cannons, Ship's Bell & Detached Rudder
      const bronzeCannonMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x3b5954,
          roughness: 0.48,
          metalness: 0.72
        }),
        { scale: 0.45, boost: 1.1 }
      );

      [-1.05, 1.05].forEach((cx, cIdx) => {
        const cannonGrp = new THREE.Group();
        cannonGrp.position.set(cx, 1.28, cIdx === 0 ? 1.15 : -0.75);
        cannonGrp.rotation.y = cIdx === 0 ? -Math.PI / 2 + 0.15 : Math.PI / 2 - 0.12;

        const carriage = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.26, 0.65), darkTimberMat);
        cannonGrp.add(carriage);

        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 1.05, 14), bronzeCannonMat);
        barrel.rotation.x = Math.PI / 2 - 0.08;
        barrel.position.set(0, 0.18, 0.12);
        barrel.castShadow = true;
        cannonGrp.add(barrel);

        shipGroup.add(cannonGrp);
      });

      // Pyramid of Iron Cannonballs on Deck
      for (let bx = -1; bx <= 1; bx++) {
        for (let bz = -1; bz <= 1; bz++) {
          const cb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), ironMat);
          cb.position.set(0.45 + bx * 0.15, 1.2, 1.55 + bz * 0.15);
          shipGroup.add(cb);
        }
      }
      const topBall = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), ironMat);
      topBall.position.set(0.45, 1.32, 1.55);
      shipGroup.add(topBall);

      // Brass Ship's Bell Belfry
      const bellFrame = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.44, 0.12), darkTimberMat);
      bellFrame.position.set(0, 2.15, -2.05);
      shipGroup.add(bellFrame);
      const shipsBell = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.13, 0.22, 14), brassMat);
      shipsBell.position.set(0, 2.08, -2.05);
      shipGroup.add(shipsBell);

      // Detached Rudder Half-Buried in Sand near Stern
      const rudderX = baseX - 3.6;
      const rudderZ = baseZ - 4.2;
      const rudderMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.65, 0.85), woodMat);
      rudderMesh.position.set(rudderX, getSeabedHeight(rudderX, rudderZ) + 0.32, rudderZ);
      rudderMesh.rotation.set(0.65, 0.82, 0.35);
      rudderMesh.castShadow = true;
      scene.add(rudderMesh);

      // 7. Wooden Cargo Barrels & Crates
      const barrelPositions = [
        [0.45, 1.38, 1.85, 0.12],
        [-0.55, 1.32, 2.15, 1.35],
        [0.15, 1.32, -1.35, 0.4]
      ];
      barrelPositions.forEach(([bx, by, bz, tilt]) => {
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 0.68, 14), woodMat);
        barrel.position.set(bx, by, bz);
        barrel.rotation.z = tilt;
        barrel.castShadow = true;
        shipGroup.add(barrel);
      });

      const crate1 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.56, 0.62), darkTimberMat);
      crate1.position.set(-0.62, 1.4, -1.45);
      crate1.rotation.y = 0.35;
      crate1.castShadow = true;
      shipGroup.add(crate1);

      // 8. Heavy Iron Anchor & 3D Chain Links on Seabed
      const anchorGroup = new THREE.Group();
      const anchX = baseX + 3.4;
      const anchZ = baseZ + 3.8;
      anchorGroup.position.set(anchX, getSeabedHeight(anchX, anchZ) + 0.28, anchZ);
      anchorGroup.rotation.set(1.28, -0.45, 0.32);

      const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.1, 10), ironMat);
      anchorGroup.add(shank);
      const stock = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.14, 0.16), darkTimberMat);
      stock.position.y = 0.78;
      anchorGroup.add(stock);
      const crown = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.08, 8, 18, Math.PI), ironMat);
      crown.position.y = -0.75;
      crown.rotation.z = Math.PI;
      anchorGroup.add(crown);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.04, 8, 16), ironMat);
      ring.position.y = 1.12;
      anchorGroup.add(ring);
      scene.add(anchorGroup);

      const chainCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(baseX + 1.4, baseY + 1.1, baseZ + 2.6),
        new THREE.Vector3(baseX + 2.2, getSeabedHeight(baseX + 2.2, baseZ + 3.1) + 0.08, baseZ + 3.1),
        new THREE.Vector3(anchX - 0.3, getSeabedHeight(anchX - 0.3, anchZ - 0.3) + 0.08, anchZ - 0.3),
        new THREE.Vector3(anchX, getSeabedHeight(anchX, anchZ) + 0.36, anchZ)
      ]);
      const linkGeo = new THREE.TorusGeometry(0.09, 0.028, 6, 12);
      const chainPoints = chainCurve.getSpacedPoints(26);
      chainPoints.forEach((pt, idx) => {
        const link = new THREE.Mesh(linkGeo, ironMat);
        link.position.copy(pt);
        link.rotation.set(Math.PI / 2 + (idx % 2) * 0.7, idx * 0.5, 0);
        scene.add(link);
      });

      // 9. Sunken Treasure Chest Overflowing with Gold Coins & Jewels
      const chestGroup = new THREE.Group();
      const chX = baseX + 3.6;
      const chZ = baseZ - 1.5;
      chestGroup.position.set(chX, getSeabedHeight(chX, chZ) + 0.05, chZ);
      chestGroup.rotation.y = -0.68;

      const chestBase = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.58, 0.76), woodMat);
      chestBase.position.y = 0.29;
      chestBase.castShadow = true;
      chestBase.receiveShadow = true;
      chestGroup.add(chestBase);

      [-0.48, 0, 0.48].forEach((bx) => {
        const band = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.61, 0.79), ironMat);
        band.position.set(bx, 0.29, 0);
        chestGroup.add(band);
      });

      const lidPivot = new THREE.Group();
      lidPivot.position.set(0, 0.58, -0.38);
      lidPivot.rotation.x = -0.78;
      const lidMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.38, 1.15, 14, 1, false, 0, Math.PI),
        woodMat
      );
      lidMesh.rotation.z = Math.PI / 2;
      lidMesh.position.set(0, 0, 0.38);
      lidPivot.add(lidMesh);
      chestGroup.add(lidPivot);

      const goldMound = new THREE.Mesh(new THREE.SphereGeometry(0.46, 16, 12), brassMat);
      goldMound.scale.set(1.1, 0.38, 0.72);
      goldMound.position.set(0, 0.54, 0);
      chestGroup.add(goldMound);

      const coinGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.016, 10);
      const rand = createSeededRandom(777);
      for (let c = 0; c < 48; c++) {
        const coin = new THREE.Mesh(coinGeo, brassMat);
        if (c < 30) {
          coin.position.set((rand() - 0.5) * 0.85, 0.58 + rand() * 0.14, (rand() - 0.5) * 0.52);
          coin.rotation.set((rand() - 0.5) * 0.7, rand() * Math.PI, (rand() - 0.5) * 0.7);
        } else {
          coin.position.set((rand() - 0.5) * 1.6, 0.02, 0.48 + rand() * 0.75);
          coin.rotation.y = rand() * Math.PI;
        }
        chestGroup.add(coin);
      }

      const rubyMat = new THREE.MeshStandardMaterial({
        color: 0xff1e56,
        emissive: 0x880828,
        emissiveIntensity: 0.9,
        roughness: 0.12,
        metalness: 0.2
      });
      const ruby = new THREE.Mesh(new THREE.OctahedronGeometry(0.11, 0), rubyMat);
      ruby.position.set(0.15, 0.68, 0.08);
      chestGroup.add(ruby);

      const chestGlow = new THREE.PointLight(0xffd54f, 1.4, 4.2, 1.8);
      chestGlow.position.set(0, 0.95, 0.1);
      chestGroup.add(chestGlow);

      scene.add(chestGroup);

      return { shipGroup, lanternLight, chestGlow, sailMesh };
    }

    // =========================================================================
    // 8. EXPANSIVE UNDERWATER JUNGLE FLORA, CORAL REEFS & PERIPHERAL ROCKS
    // =========================================================================
    function buildRocksPlantsAndCorals(scene, textures) {
      const rand = createSeededRandom(2026);
      const dummy = new THREE.Object3D();

      const rockMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: textures.rockMap,
          bumpMap: textures.rockMap,
          bumpScale: 0.08,
          roughness: 0.88,
          metalness: 0.04
        }),
        { scale: 0.35, boost: 1.2 }
      );

      // A. Open Central Reef Vista & Peripheral Sea Stacks (Big stones removed from central area)
      const rockClusters = [
        // Low-profile flat den shelf for the Giant Octopus (non-blocking)
        { x: 7.8, z: -4.2, r: 1.25, sy: 0.42, seed: 11 },
        { x: 9.1, z: -4.9, r: 1.15, sy: 0.48, seed: 12 },

        // Low flat coral bed pads (non-blocking)
        { x: 8.6, z: 4.8, r: 1.35, sy: 0.36, seed: 21 },
        { x: -7.8, z: 5.6, r: 1.20, sy: 0.35, seed: 34 },

        // Surrounding Outer Ocean Reef Formations & Distant Sea Stacks
        { x: -21.5, z: -16.0, r: 4.4, sy: 1.85, seed: 51 },
        { x: -24.0, z: 4.5, r: 3.8, sy: 1.55, seed: 52 },
        { x: -18.5, z: 19.0, r: 3.5, sy: 1.35, seed: 53 },
        { x: 21.0, z: 17.5, r: 4.1, sy: 1.65, seed: 54 },
        { x: 24.5, z: -6.5, r: 4.6, sy: 1.95, seed: 55 },
        { x: 17.5, z: -21.0, r: 3.9, sy: 1.75, seed: 56 },
        { x: -4.5, z: -23.5, r: 4.2, sy: 1.65, seed: 57 },
        { x: 5.5, z: 22.5, r: 3.6, sy: 1.30, seed: 58 },
        { x: -34.0, z: -26.0, r: 6.2, sy: 2.10, seed: 61 },
        { x: 35.0, z: -24.0, r: 5.8, sy: 2.00, seed: 62 },
        { x: -32.0, z: 28.0, r: 5.4, sy: 1.85, seed: 63 },
        { x: 33.0, z: 27.0, r: 5.6, sy: 1.90, seed: 64 }
      ];

      rockClusters.forEach((rc) => {
        const geo = deformBoulderGeometry(new THREE.IcosahedronGeometry(1.0, 3), rc.r, rc.seed);
        const mesh = new THREE.Mesh(geo, rockMat);
        const y = getSeabedHeight(rc.x, rc.z) + rc.r * rc.sy * 0.45;
        mesh.position.set(rc.x, y, rc.z);
        mesh.scale.set(1.0, rc.sy, 1.0);
        mesh.rotation.y = rc.seed * 0.8;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      // B. 340 Instanced Pebbles & 120 Fluted Scallop Shells Scattered on Seabed
      const pebbleGeo = deformBoulderGeometry(new THREE.IcosahedronGeometry(0.16, 1), 0.16, 99);
      const pebbleInst = new THREE.InstancedMesh(pebbleGeo, rockMat, 340);
      pebbleInst.receiveShadow = true;
      for (let i = 0; i < 340; i++) {
        const px = (rand() - 0.5) * 44.0;
        const pz = (rand() - 0.5) * 44.0;
        const py = getSeabedHeight(px, pz) + 0.03;
        dummy.position.set(px, py, pz);
        dummy.rotation.set(rand() * 3, rand() * 3, rand() * 3);
        const s = 0.45 + rand() * 1.45;
        dummy.scale.set(s * 1.2, s * 0.65, s);
        dummy.updateMatrix();
        pebbleInst.setMatrixAt(i, dummy.matrix);
      }
      pebbleInst.instanceMatrix.needsUpdate = true;
      scene.add(pebbleInst);

      // Fluted Scallop Shells
      const shellGeo = new THREE.CircleGeometry(0.16, 14, 0, Math.PI);
      shellGeo.rotateX(-Math.PI / 2);
      const shPos = shellGeo.attributes.position;
      for (let i = 0; i < shPos.count; i++) {
        const sx = shPos.getX(i);
        const sz = shPos.getZ(i);
        const flute = Math.sin(Math.atan2(sz, sx) * 9.0) * 0.015;
        const dome = (1.0 - Math.hypot(sx, sz) / 0.16) * 0.035;
        shPos.setY(i, dome + flute);
      }
      shellGeo.computeVertexNormals();
      const shellMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.42,
          metalness: 0.08,
          side: THREE.DoubleSide
        }),
        { scale: 0.4, boost: 1.2 }
      );
      const shellCount = 120;
      const shellInst = new THREE.InstancedMesh(shellGeo, shellMat, shellCount);
      const shCol = new THREE.Color();
      for (let i = 0; i < shellCount; i++) {
        const sx = (rand() - 0.5) * 34.0;
        const sz = (rand() - 0.5) * 34.0;
        const sy = getSeabedHeight(sx, sz) + 0.015;
        dummy.position.set(sx, sy, sz);
        dummy.rotation.set((rand() - 0.5) * 0.25, rand() * Math.PI * 2, (rand() - 0.5) * 0.25);
        const ss = 0.65 + rand() * 0.95;
        dummy.scale.set(ss, ss, ss);
        dummy.updateMatrix();
        shellInst.setMatrixAt(i, dummy.matrix);
        shCol.setHSL(0.06 + rand() * 0.08, 0.35 + rand() * 0.3, 0.72 + rand() * 0.18);
        shellInst.setColorAt(i, shCol);
      }
      shellInst.instanceMatrix.needsUpdate = true;
      if (shellInst.instanceColor) shellInst.instanceColor.needsUpdate = true;
      scene.add(shellInst);

      // C. Plant Type 1: Giant Bull Kelp Forest with Pneumatocyst Gas Bladders (Outer Jungle Perimeter)
      const kelpGeo = new THREE.PlaneGeometry(0.32, 1.0, 2, 22);
      kelpGeo.translate(0, 0.5, 0);
      const kPos = kelpGeo.attributes.position;
      for (let i = 0; i < kPos.count; i++) {
        const ky = kPos.getY(i);
        const kx = kPos.getX(i);
        const taper = Math.sin(ky * Math.PI) * 0.88 + 0.18;
        const ruffle = Math.sin(ky * 24.0) * 0.075 * Math.sign(kx);
        kPos.setX(i, kx * taper);
        kPos.setZ(i, ruffle);
      }
      kelpGeo.computeVertexNormals();

      const kelpMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.52,
          metalness: 0.04,
          side: THREE.DoubleSide
        }),
        { scale: 0.32, boost: 1.25 }
      );

      const prevKelpCompile = kelpMat.onBeforeCompile;
      kelpMat.onBeforeCompile = (shader) => {
        prevKelpCompile(shader);
        shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uCurrentStrength;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float hFrac = clamp(transformed.y, 0.0, 1.0);
            float swayX = sin(uTime * 1.45 + instPos.x * 0.55 + hFrac * 4.2) * 0.24 * hFrac * uCurrentStrength;
            float swayZ = cos(uTime * 1.15 + instPos.z * 0.55 + hFrac * 3.6) * 0.19 * hFrac * uCurrentStrength;
            transformed.x += swayX;
            transformed.z += swayZ;`
          );
      };

      const kelpClusters = [
        // Dense 360-degree underwater jungle ringing the outer perimeter
        { cx: -16.5, cz: -13.5, count: 24, spread: 4.6 },
        { cx: -19.5, cz: -4.5, count: 22, spread: 4.5 },
        { cx: -18.5, cz: 6.5, count: 22, spread: 4.5 },
        { cx: -15.5, cz: 16.5, count: 22, spread: 4.6 },
        { cx: -6.5, cz: 19.5, count: 20, spread: 4.5 },
        { cx: 4.5, cz: 20.0, count: 20, spread: 4.5 },
        { cx: 15.0, cz: 17.5, count: 22, spread: 4.6 },
        { cx: 19.5, cz: 8.5, count: 22, spread: 4.5 },
        { cx: 20.5, cz: -2.5, count: 22, spread: 4.5 },
        { cx: 18.0, cz: -13.5, count: 24, spread: 4.6 },
        { cx: 8.5, cz: -19.0, count: 22, spread: 4.5 },
        { cx: -2.5, cz: -19.5, count: 22, spread: 4.5 },
        { cx: -11.5, cz: -17.5, count: 20, spread: 4.2 },
        // Deep outer jungle canopy layer (26m - 42m radius)
        { cx: -28.0, cz: -22.0, count: 24, spread: 6.5 },
        { cx: -31.0, cz: 2.0, count: 22, spread: 6.5 },
        { cx: -26.0, cz: 24.0, count: 22, spread: 6.5 },
        { cx: 0.0, cz: 30.0, count: 22, spread: 6.5 },
        { cx: 26.0, cz: 24.0, count: 22, spread: 6.5 },
        { cx: 31.0, cz: -2.0, count: 22, spread: 6.5 },
        { cx: 27.0, cz: -23.0, count: 24, spread: 6.5 },
        { cx: -1.0, cz: -30.0, count: 22, spread: 6.5 }
      ];

      let totalKelp = 0;
      kelpClusters.forEach((c) => {
        totalKelp += c.count;
      });
      const kelpInst = new THREE.InstancedMesh(kelpGeo, kelpMat, totalKelp);
      kelpInst.castShadow = true;

      // Floating Pneumatocyst Gas Bladders at top of Bull Kelp stalks
      const bladderGeo = new THREE.SphereGeometry(0.11, 10, 10);
      bladderGeo.scale(1.0, 1.35, 1.0);
      const bladderMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x7cb342,
          roughness: 0.35,
          metalness: 0.05
        }),
        { scale: 0.4, boost: 1.3 }
      );
      const bladderInst = new THREE.InstancedMesh(bladderGeo, bladderMat, totalKelp);

      let kIdx = 0;
      const kColor = new THREE.Color();
      kelpClusters.forEach((cluster) => {
        for (let i = 0; i < cluster.count; i++) {
          const kx = cluster.cx + (rand() - 0.5) * cluster.spread;
          const kz = cluster.cz + (rand() - 0.5) * cluster.spread;
          const ky = getSeabedHeight(kx, kz) - 0.05;
          const kh = 5.4 + rand() * 12.1;
          const kw = 0.78 + rand() * 0.78;
          const kRotY = rand() * Math.PI * 2;
          dummy.position.set(kx, ky, kz);
          dummy.rotation.set(0, kRotY, 0);
          dummy.scale.set(kw, kh, kw);
          dummy.updateMatrix();
          kelpInst.setMatrixAt(kIdx, dummy.matrix);

          kColor.setHSL(0.24 + (rand() - 0.5) * 0.07, 0.58 + rand() * 0.2, 0.25 + rand() * 0.16);
          kelpInst.setColorAt(kIdx, kColor);

          dummy.position.set(kx, ky + kh * 0.96, kz);
          dummy.rotation.set(0, kRotY, 0);
          dummy.scale.set(1.0, 1.0, 1.0);
          dummy.updateMatrix();
          bladderInst.setMatrixAt(kIdx, dummy.matrix);
          kIdx++;
        }
      });
      kelpInst.instanceMatrix.needsUpdate = true;
      if (kelpInst.instanceColor) kelpInst.instanceColor.needsUpdate = true;
      bladderInst.instanceMatrix.needsUpdate = true;
      scene.add(kelpInst, bladderInst);

      // C2. Outer Edge Underwater Jungle Broadleaf Sea Ferns & Giant Amazon Sword Plants (1,200 Fronds)
      const fernBladeGeo = new THREE.PlaneGeometry(0.42, 3.4, 3, 12);
      fernBladeGeo.translate(0, 1.7, 0);
      const fbPos = fernBladeGeo.attributes.position;
      for (let i = 0; i < fbPos.count; i++) {
        const fx = fbPos.getX(i);
        const fy = fbPos.getY(i);
        const t = Math.max(0, Math.min(1, fy / 3.4));
        const widthProfile = Math.sin(Math.pow(t, 0.72) * Math.PI) * 1.15;
        const arch = t * t * 0.65;
        const cup = Math.abs(fx) * 0.25;
        fbPos.setXYZ(i, fx * widthProfile, fy - t * t * 0.25, arch + cup);
      }
      fernBladeGeo.computeVertexNormals();

      const fernMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.52,
          metalness: 0.04,
          side: THREE.DoubleSide
        }),
        { scale: 0.32, boost: 1.25 }
      );
      const prevFernCompile = fernMat.onBeforeCompile;
      fernMat.onBeforeCompile = (shader) => {
        prevFernCompile(shader);
        shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uCurrentStrength;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float hFrac = clamp(transformed.y / 3.4, 0.0, 1.2);
            transformed.x += sin(uTime * 1.4 + instPos.x * 0.35 + instPos.z * 0.35) * 0.42 * hFrac * hFrac * uCurrentStrength;
            transformed.z += cos(uTime * 1.15 + instPos.z * 0.32) * 0.32 * hFrac * hFrac * uCurrentStrength;`
          );
      };

      const fernLeafCount = 1200;
      const fernInst = new THREE.InstancedMesh(fernBladeGeo, fernMat, fernLeafCount);
      fernInst.castShadow = true;
      const fernCol = new THREE.Color();
      const jungleClumpCount = 240;
      const leavesPerClump = 5;
      let fLeafIdx = 0;

      for (let c = 0; c < jungleClumpCount; c++) {
        const ang = (c / jungleClumpCount) * Math.PI * 2 + (rand() - 0.5) * 0.18;
        const rad = 13.5 + Math.pow(rand(), 0.78) * 40.5;
        const cx = Math.cos(ang) * rad;
        const cz = Math.sin(ang) * rad;
        const cy = getSeabedHeight(cx, cz) - 0.06;
        const clumpScale = 0.78 + rand() * 0.85;
        const baseYaw = rand() * Math.PI * 2;

        for (let b = 0; b < leavesPerClump; b++) {
          const leafYaw = baseYaw + (b / leavesPerClump) * Math.PI * 2 + (rand() - 0.5) * 0.35;
          dummy.position.set(cx, cy, cz);
          dummy.rotation.set(0.14 + rand() * 0.22, leafYaw, 0);
          dummy.scale.set(clumpScale, clumpScale * (0.85 + rand() * 0.35), clumpScale);
          dummy.updateMatrix();
          fernInst.setMatrixAt(fLeafIdx, dummy.matrix);

          fernCol.setHSL(0.24 + (rand() - 0.5) * 0.08, 0.62 + rand() * 0.22, 0.24 + rand() * 0.20);
          fernInst.setColorAt(fLeafIdx, fernCol);
          fLeafIdx++;
        }
      }
      fernInst.instanceMatrix.needsUpdate = true;
      if (fernInst.instanceColor) fernInst.instanceColor.needsUpdate = true;
      scene.add(fernInst);

      // D. Plant Type 2: 7,500 Instanced Swaying Eelgrass / Vallisneria Blades (Dense Jungle Edges)
      const grassGeo = new THREE.PlaneGeometry(0.095, 1.45, 1, 6);
      grassGeo.translate(0, 0.725, 0);
      const gPos = grassGeo.attributes.position;
      for (let i = 0; i < gPos.count; i++) {
        const gy = gPos.getY(i);
        gPos.setX(i, gPos.getX(i) * (1.0 - (gy / 1.45) * 0.88));
      }
      grassGeo.computeVertexNormals();

      const grassMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.6,
          side: THREE.DoubleSide
        }),
        { scale: 0.35, boost: 1.25 }
      );
      const prevGrassCompile = grassMat.onBeforeCompile;
      grassMat.onBeforeCompile = (shader) => {
        prevGrassCompile(shader);
        shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uCurrentStrength;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float hFrac = clamp(transformed.y / 1.45, 0.0, 1.2);
            transformed.x += sin(uTime * 1.85 + instPos.x * 0.75 + instPos.z * 0.65) * 0.28 * hFrac * hFrac * uCurrentStrength;
            transformed.z += cos(uTime * 1.45 + instPos.z * 0.75) * 0.22 * hFrac * hFrac * uCurrentStrength;`
          );
      };

      const grassCount = 7500;
      const grassInst = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
      const gCol = new THREE.Color();
      for (let i = 0; i < grassCount; i++) {
        let gx, gz;
        if (i < 1600) {
          do {
            gx = (rand() - 0.5) * 28.0;
            gz = (rand() - 0.5) * 28.0;
          } while (Math.hypot(gx + 2.4, gz + 1.2) < 5.5);
        } else {
          const ang = rand() * Math.PI * 2;
          const dist = 13.0 + Math.pow(rand(), 0.75) * 43.0;
          gx = Math.cos(ang) * dist;
          gz = Math.sin(ang) * dist;
        }

        const gy = getSeabedHeight(gx, gz) - 0.04;
        dummy.position.set(gx, gy, gz);
        dummy.rotation.set(0, rand() * Math.PI * 2, 0);
        const edgeBoost = Math.hypot(gx, gz) > 13.0 ? 1.35 : 0.85;
        const gs = (0.65 + rand() * 1.15) * edgeBoost;
        dummy.scale.set(1.0, gs, 1.0);
        dummy.updateMatrix();
        grassInst.setMatrixAt(i, dummy.matrix);

        gCol.setHSL(0.27 + (rand() - 0.5) * 0.08, 0.62, 0.26 + rand() * 0.22);
        grassInst.setColorAt(i, gCol);
      }
      grassInst.instanceMatrix.needsUpdate = true;
      if (grassInst.instanceColor) grassInst.instanceColor.needsUpdate = true;
      scene.add(grassInst);

      // E. Plant Type 3: Lacy Gorgonian Sea Fans (84 Instanced Reticulated Fans)
      const fanCanvas = document.createElement('canvas');
      fanCanvas.width = 256;
      fanCanvas.height = 256;
      const fCtx = fanCanvas.getContext('2d');
      fCtx.clearRect(0, 0, 256, 256);
      fCtx.strokeStyle = '#ffffff';
      fCtx.lineCap = 'round';
      function drawFanBranch(x, y, angle, len, width, depth) {
        if (depth <= 0 || len < 4) return;
        const nx = x + Math.cos(angle) * len;
        const ny = y - Math.sin(angle) * len;
        fCtx.lineWidth = width;
        fCtx.beginPath();
        fCtx.moveTo(x, y);
        fCtx.lineTo(nx, ny);
        fCtx.stroke();
        drawFanBranch(nx, ny, angle + 0.34, len * 0.76, width * 0.72, depth - 1);
        drawFanBranch(nx, ny, angle - 0.34, len * 0.76, width * 0.72, depth - 1);
        if (depth % 2 === 0) {
          drawFanBranch(nx, ny, angle + 0.05, len * 0.72, width * 0.68, depth - 1);
        }
      }
      drawFanBranch(128, 252, Math.PI / 2, 52, 7.5, 6);
      const fanAlphaTex = new THREE.CanvasTexture(fanCanvas);

      const fanGeo = new THREE.PlaneGeometry(1.5, 1.5, 2, 6);
      fanGeo.translate(0, 0.75, 0);
      const seaFanMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          alphaMap: fanAlphaTex,
          alphaTest: 0.35,
          roughness: 0.65,
          metalness: 0.05,
          side: THREE.DoubleSide
        }),
        { scale: 0.4, boost: 1.25 }
      );
      const prevFanCompile = seaFanMat.onBeforeCompile;
      seaFanMat.onBeforeCompile = (shader) => {
        prevFanCompile(shader);
        shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uCurrentStrength;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float hFrac = clamp(transformed.y / 1.5, 0.0, 1.0);
            transformed.z += sin(uTime * 1.5 + instPos.x * 0.6 + instPos.z * 0.6) * 0.16 * hFrac * hFrac * uCurrentStrength;`
          );
      };

      const fanCount = 84;
      const fanInst = new THREE.InstancedMesh(fanGeo, seaFanMat, fanCount);
      fanInst.castShadow = true;
      const fanSpots = [
        [8.6, 4.8], [9.8, 6.2], [7.4, 6.8], [10.4, 3.8], [6.2, 4.1],
        [6.4, -2.6], [9.2, -4.8], [8.2, -1.8], [5.4, -4.1],
        [-9.6, -6.2], [-10.8, 4.8], [-8.2, 7.4], [-11.4, -2.0],
        [-15.5, -12.5], [16.5, 14.0], [18.5, -5.5], [-15.5, 15.5],
        [-19.5, -14.5], [20.5, 16.0], [22.5, -5.5], [-17.5, 17.5],
        [0.5, -16.5], [-1.5, 16.5], [15.5, -13.5], [-16.0, 2.5]
      ];
      const fanPalette = [0xff5c8a, 0xff8a3d, 0xf59e0b, 0xc084fc, 0xf43f5e];
      const fanCol = new THREE.Color();
      for (let i = 0; i < fanCount; i++) {
        const spot = fanSpots[i % fanSpots.length];
        const fx = spot[0] + (rand() - 0.5) * 3.8;
        const fz = spot[1] + (rand() - 0.5) * 3.8;
        const fy = getSeabedHeight(fx, fz) - 0.04;
        dummy.position.set(fx, fy, fz);
        dummy.rotation.set((rand() - 0.5) * 0.25, rand() * Math.PI * 2, (rand() - 0.5) * 0.25);
        const fs = 0.65 + rand() * 0.9;
        dummy.scale.set(fs, fs, fs);
        dummy.updateMatrix();
        fanInst.setMatrixAt(i, dummy.matrix);
        fanCol.setHex(fanPalette[i % fanPalette.length]);
        fanInst.setColorAt(i, fanCol);
      }
      fanInst.instanceMatrix.needsUpdate = true;
      if (fanInst.instanceColor) fanInst.instanceColor.needsUpdate = true;
      scene.add(fanInst);

      // F. Plant Type 4 & 5: Ruffled Sea Lettuce (Ulva) & Ruby Red Macroalgae Rosettes (340 Clumps)
      const lettuceGeo = new THREE.SphereGeometry(0.32, 16, 12);
      const lPos = lettuceGeo.attributes.position;
      for (let i = 0; i < lPos.count; i++) {
        const lx = lPos.getX(i);
        const ly = lPos.getY(i);
        const lz = lPos.getZ(i);
        const ang = Math.atan2(lz, lx);
        const ruffle = 1.0 + Math.sin(ang * 7.0 + ly * 12.0) * 0.28;
        lPos.setXYZ(i, lx * ruffle, Math.max(0.0, ly * 0.65), lz * ruffle);
      }
      lettuceGeo.computeVertexNormals();
      const lettuceMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.48,
          metalness: 0.04,
          side: THREE.DoubleSide
        }),
        { scale: 0.4, boost: 1.3 }
      );
      const lettuceCount = 340;
      const lettuceInst = new THREE.InstancedMesh(lettuceGeo, lettuceMat, lettuceCount);
      lettuceInst.castShadow = true;
      const lCol = new THREE.Color();
      for (let i = 0; i < lettuceCount; i++) {
        let lx, lz;
        if (i < 90) {
          lx = (rand() - 0.5) * 28.0;
          lz = (rand() - 0.5) * 28.0;
        } else {
          const ang = rand() * Math.PI * 2;
          const dist = 13.0 + rand() * 38.0;
          lx = Math.cos(ang) * dist;
          lz = Math.sin(ang) * dist;
        }
        const ly = getSeabedHeight(lx, lz) - 0.02;
        dummy.position.set(lx, ly, lz);
        dummy.rotation.set((rand() - 0.5) * 0.3, rand() * Math.PI * 2, (rand() - 0.5) * 0.3);
        dummy.scale.set(0.75 + rand() * 1.0, 0.70 + rand() * 0.95, 0.75 + rand() * 1.0);
        dummy.updateMatrix();
        lettuceInst.setMatrixAt(i, dummy.matrix);

        if (i % 3 === 0) {
          lCol.setHSL(0.95 + rand() * 0.04, 0.72, 0.34 + rand() * 0.14);
        } else {
          lCol.setHSL(0.26 + rand() * 0.08, 0.68, 0.36 + rand() * 0.16);
        }
        lettuceInst.setColorAt(i, lCol);
      }
      lettuceInst.instanceMatrix.needsUpdate = true;
      if (lettuceInst.instanceColor) lettuceInst.instanceColor.needsUpdate = true;
      scene.add(lettuceInst);

      // G. Plant / Sessile Type 6: Giant Ribbed Barrel Sponges (5 Specimens)
      const barrelSpongeMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xd97706,
          roughness: 0.78,
          metalness: 0.04,
          side: THREE.DoubleSide
        }),
        { scale: 0.42, boost: 1.25 }
      );
      const barrelSpots = [
        [9.8, 5.2, 1.15],
        [6.8, 6.4, 0.85],
        [-9.2, 6.2, 1.05],
        [7.2, -3.2, 0.92],
        [-11.8, -5.8, 1.1]
      ];
      barrelSpots.forEach(([bx, bz, bs]) => {
        const bGeo = new THREE.CylinderGeometry(0.46 * bs, 0.34 * bs, 0.95 * bs, 20, 8, true);
        const bp = bGeo.attributes.position;
        for (let i = 0; i < bp.count; i++) {
          const vx = bp.getX(i);
          const vy = bp.getY(i);
          const vz = bp.getZ(i);
          const ang = Math.atan2(vz, vx);
          const rib = 1.0 + Math.sin(ang * 14.0) * 0.08 + Math.sin(vy * 8.0) * 0.06;
          bp.setXYZ(i, vx * rib, vy, vz * rib);
        }
        bGeo.computeVertexNormals();
        const barrel = new THREE.Mesh(bGeo, barrelSpongeMat);
        barrel.position.set(bx, getSeabedHeight(bx, bz) + 0.44 * bs, bz);
        barrel.castShadow = true;
        barrel.receiveShadow = true;
        scene.add(barrel);

        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.45 * bs, 0.065 * bs, 10, 20), barrelSpongeMat);
        rim.rotation.x = Math.PI / 2;
        rim.position.set(bx, getSeabedHeight(bx, bz) + 0.91 * bs, bz);
        scene.add(rim);
      });

      // H. Plant / Coral Type 7: Multi-Tiered Table Acropora Corals & Grooved Brain Corals
      const tableCoralMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          emissive: 0x0284c7,
          emissiveIntensity: 0.25,
          roughness: 0.58
        }),
        { scale: 0.45, boost: 1.3 }
      );
      const tableSpots = [
        [8.4, 3.8, 1.15],
        [10.2, 4.9, 0.9],
        [-8.4, 4.8, 1.05],
        [6.1, -2.2, 0.88]
      ];
      tableSpots.forEach(([tx, tz, ts]) => {
        const tGroup = new THREE.Group();
        tGroup.position.set(tx, getSeabedHeight(tx, tz), tz);
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * ts, 0.22 * ts, 0.55 * ts, 10), tableCoralMat);
        stalk.position.y = 0.27 * ts;
        tGroup.add(stalk);

        [0, 1].forEach((tier) => {
          const plate = new THREE.Mesh(
            new THREE.CylinderGeometry((0.92 - tier * 0.34) * ts, (0.78 - tier * 0.3) * ts, 0.1 * ts, 18),
            tableCoralMat
          );
          plate.position.set(tier * 0.22 * ts, (0.54 + tier * 0.24) * ts, tier * -0.15 * ts);
          plate.castShadow = true;
          plate.receiveShadow = true;
          tGroup.add(plate);
        });
        scene.add(tGroup);
      });

      const coralGardenGroup = new THREE.Group();
      scene.add(coralGardenGroup);

      const brainCoralColors = [0xff6b8b, 0xff9f43, 0xa55eea, 0x26de81, 0xfd9644];
      const brainLocations = [
        [8.6, 4.8, 0.72],
        [9.8, 5.8, 0.58],
        [7.3, 5.7, 0.52],
        [10.3, 4.2, 0.46],
        [6.2, -2.5, 0.55],
        [-7.8, 5.6, 0.62],
        [-9.2, 4.6, 0.48],
        [1.8, -5.8, 0.5],
        [-10.8, -4.8, 0.56],
        [11.4, -3.2, 0.52]
      ];

      brainLocations.forEach(([bx, bz, br], idx) => {
        const bGeo = new THREE.SphereGeometry(br, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.62);
        const bPos = bGeo.attributes.position;
        for (let i = 0; i < bPos.count; i++) {
          const vx = bPos.getX(i);
          const vy = bPos.getY(i);
          const vz = bPos.getZ(i);
          const ridge = Math.sin(vx * 18.0 + Math.sin(vz * 14.0) * 1.5) * 0.032;
          bPos.setXYZ(i, vx + ridge, vy + Math.abs(ridge) * 0.6, vz + ridge);
        }
        bGeo.computeVertexNormals();

        const bMat = injectUnderwaterCaustics(
          new THREE.MeshStandardMaterial({
            color: brainCoralColors[idx % brainCoralColors.length],
            roughness: 0.68,
            metalness: 0.05
          }),
          { scale: 0.45, boost: 1.25 }
        );
        const brainMesh = new THREE.Mesh(bGeo, bMat);
        brainMesh.position.set(bx, getSeabedHeight(bx, bz) - 0.04, bz);
        brainMesh.castShadow = true;
        brainMesh.receiveShadow = true;
        coralGardenGroup.add(brainMesh);
      });

      // Staghorn Branching Corals
      const stagMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xff7675,
          roughness: 0.62,
          metalness: 0.04
        }),
        { scale: 0.45, boost: 1.2 }
      );
      const stagLocations = [
        [8.1, 3.6, 1.05],
        [9.4, 4.1, 0.9],
        [7.6, 6.4, 0.85],
        [-7.2, 6.3, 0.95],
        [5.6, -3.1, 0.88],
        [-11.2, 3.6, 0.92]
      ];
      stagLocations.forEach(([sx, sz, scale]) => {
        const branchGroup = new THREE.Group();
        branchGroup.position.set(sx, getSeabedHeight(sx, sz), sz);
        for (let b = 0; b < 7; b++) {
          const ang = (b / 7) * Math.PI * 2;
          const h = (0.65 + (b % 3) * 0.24) * scale;
          const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * scale, 0.075 * scale, h, 8), stagMat);
          limb.position.set(Math.cos(ang) * 0.14 * scale, h * 0.45, Math.sin(ang) * 0.14 * scale);
          limb.rotation.set(Math.sin(ang) * 0.38, 0, -Math.cos(ang) * 0.38);
          limb.castShadow = true;
          branchGroup.add(limb);

          const fork = new THREE.Mesh(new THREE.CylinderGeometry(0.025 * scale, 0.045 * scale, h * 0.55, 7), stagMat);
          fork.position.set(Math.cos(ang) * 0.28 * scale, h * 0.78, Math.sin(ang) * 0.28 * scale);
          fork.rotation.set(Math.sin(ang) * 0.65, 0, -Math.cos(ang) * 0.65);
          branchGroup.add(fork);
        }
        coralGardenGroup.add(branchGroup);
      });

      // Glowing Tube Sponges
      const spongeMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xfeca57,
          emissive: 0x00d2d3,
          emissiveIntensity: 0.25,
          roughness: 0.72
        }),
        { scale: 0.45, boost: 1.25 }
      );
      const spongeSpots = [
        [9.2, 6.5],
        [10.5, 5.2],
        [-8.6, 5.1],
        [6.8, -1.9],
        [-10.4, -3.5]
      ];
      spongeSpots.forEach(([px, pz]) => {
        const sGrp = new THREE.Group();
        sGrp.position.set(px, getSeabedHeight(px, pz), pz);
        for (let t = 0; t < 5; t++) {
          const th = 0.42 + (t % 3) * 0.22;
          const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.065, th, 10, 1, true), spongeMat);
          tube.material.side = THREE.DoubleSide;
          const a = (t / 5) * Math.PI * 2;
          tube.position.set(Math.cos(a) * 0.14, th * 0.5, Math.sin(a) * 0.14);
          tube.rotation.set(Math.sin(a) * 0.16, 0, -Math.cos(a) * 0.16);
          tube.castShadow = true;
          sGrp.add(tube);
        }
        coralGardenGroup.add(sGrp);
      });

      // I. Plant / Anthozoan Type 8: Glowing Sea Anemones with Swaying Tentacles
      const anemoneTentacles = [];
      const anemoneMat = new THREE.MeshStandardMaterial({
        color: 0xf472b6,
        emissive: 0xec4899,
        emissiveIntensity: 0.45,
        roughness: 0.38
      });
      const anemoneSpots = [
        [8.9, 4.1],
        [7.8, 5.2],
        [-8.1, 4.2],
        [6.5, -3.5],
        [-9.6, -4.4]
      ];
      anemoneSpots.forEach(([ax, az], aIdx) => {
        const aGrp = new THREE.Group();
        aGrp.position.set(ax, getSeabedHeight(ax, az) + 0.04, az);
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.16, 14), anemoneMat);
        base.position.y = 0.08;
        aGrp.add(base);

        for (let t = 0; t < 18; t++) {
          const ring = t < 10 ? 0.16 : 0.08;
          const ang = (t / (t < 10 ? 10 : 8)) * Math.PI * 2;
          const tent = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.032, 0.36, 6), anemoneMat);
          tent.position.set(Math.cos(ang) * ring, 0.28, Math.sin(ang) * ring);
          tent.rotation.set(Math.sin(ang) * 0.38, 0, -Math.cos(ang) * 0.38);
          aGrp.add(tent);
          anemoneTentacles.push({
            mesh: tent,
            baseRotX: tent.rotation.x,
            baseRotZ: tent.rotation.z,
            phase: aIdx * 1.3 + t * 0.45
          });
        }
        coralGardenGroup.add(aGrp);
      });

      return { spongeMat, anemoneMat, anemoneTentacles };
    }

    // =========================================================================
    // 9. ARTICULATED GIANT REEF OCTOPUS (8 CURLED TENTACLES & BREATHING MANTLE)
    // =========================================================================
    function buildGiantOctopus(scene) {
      const octoGroup = new THREE.Group();
      const ox = 8.4;
      const oz = -4.5;
      const oy = getSeabedHeight(ox, oz) + 0.42;
      octoGroup.position.set(ox, oy, oz);
      octoGroup.rotation.y = -0.78;
      scene.add(octoGroup);

      const skinMat = injectUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xc2412d,
          roughness: 0.44,
          metalness: 0.06
        }),
        { scale: 0.5, boost: 1.25 }
      );

      const suckerMat = new THREE.MeshStandardMaterial({
        color: 0xf6d5b8,
        roughness: 0.55
      });

      const mantleGeo = new THREE.SphereGeometry(0.62, 24, 20);
      mantleGeo.scale(0.88, 1.35, 1.05);
      const mantle = new THREE.Mesh(mantleGeo, skinMat);
      mantle.position.set(0, 0.72, -0.18);
      mantle.rotation.x = -0.32;
      mantle.castShadow = true;
      octoGroup.add(mantle);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 20, 16), skinMat);
      head.position.set(0, 0.32, 0.14);
      head.castShadow = true;
      octoGroup.add(head);

      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.2 });
      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
      [-1, 1].forEach((side) => {
        const brow = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), skinMat);
        brow.position.set(side * 0.28, 0.48, 0.32);
        octoGroup.add(brow);

        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), eyeWhiteMat);
        eye.position.set(side * 0.3, 0.45, 0.39);
        octoGroup.add(eye);

        const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.032, 0.04), pupilMat);
        pupil.position.set(side * 0.31, 0.45, 0.48);
        octoGroup.add(pupil);
      });

      const tentacles = [];
      const armCount = 8;
      for (let a = 0; a < armCount; a++) {
        const baseAngle = ((a / (armCount - 1)) - 0.5) * Math.PI * 1.45;
        const armRoot = new THREE.Group();
        armRoot.position.set(Math.sin(baseAngle) * 0.32, 0.14, Math.cos(baseAngle) * 0.32 + 0.1);
        armRoot.rotation.y = baseAngle;
        octoGroup.add(armRoot);

        const segments = [];
        let parentObj = armRoot;
        const segCount = 11;
        for (let s = 0; s < segCount; s++) {
          const t = s / segCount;
          const rStart = 0.14 * (1.0 - t * 0.78);
          const rEnd = 0.14 * (1.0 - ((s + 1) / segCount) * 0.78);
          const segLen = 0.23;

          const segPivot = new THREE.Group();
          if (s > 0) {
            segPivot.position.set(0, 0, segLen);
          }

          const segGeo = new THREE.CylinderGeometry(rEnd, rStart, segLen, 10);
          segGeo.rotateX(Math.PI / 2);
          segGeo.translate(0, 0, segLen * 0.5);
          const segMesh = new THREE.Mesh(segGeo, skinMat);
          segMesh.castShadow = true;
          segPivot.add(segMesh);

          if (s < segCount - 2) {
            [-0.45, 0.45].forEach((sx) => {
              const sucker = new THREE.Mesh(new THREE.CylinderGeometry(rStart * 0.32, rStart * 0.36, 0.03, 8), suckerMat);
              sucker.position.set(sx * rStart, -rStart * 0.85, segLen * 0.5);
              segPivot.add(sucker);
            });
          }

          parentObj.add(segPivot);
          segments.push({ pivot: segPivot, index: s });
          parentObj = segPivot;
        }
        tentacles.push({ root: armRoot, segments, phase: a * 0.85 });
      }

      return { octoGroup, mantle, tentacles };
    }

    // =========================================================================
    // 10. ARTICULATED SCUTTLING REEF CRABS (5 SPECIMENS)

    function buildReefCrabs(scene) {

      const crabs = [];
      crabPaths.forEach((cp) => {

        const bodyGeo = new THREE.SphereGeometry(0.28, 16, 12);

        [-0.1, 0.1].forEach((ex) => {

          stalk.position.set(ex, 0.26, 0.24);
          group.add(stalk);
        });

        const claws = [];
        [-1, 1].forEach((side) => {
          const clawPivot = new THREE.Group();
          clawPivot.position.set(side * 0.34, 0.16, 0.22);
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.07, 0.08), crabMat);
          arm.position.set(side * 0.08, 0, 0.06);
          clawPivot.add(arm);

          const pincer = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), crabMat);
          pincer.scale.set(1.3, 0.65, 0.8);
          pincer.position.set(side * 0.16, 0.02, 0.16);
          clawPivot.add(pincer);
          group.add(clawPivot);
          claws.push({ pivot: clawPivot, side });

        const legs = [];

            upper.position.set(side * 0.11, -0.05, 0);
            upper.rotation.z = side * 1.05;
            legPivot.add(upper);
            group.add(legPivot);
            legs.push({ pivot: legPivot, side, index: l });
