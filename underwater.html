        crabs.push({ group, claws, legs, path: cp });
      });

      return crabs;
    }

    // =========================================================================
    // 11. MULTI-SPECIES SCHOOLING TROPICAL FISH & BIOLUMINESCENT JELLYFISH
    // =========================================================================
    function mergeNonIndexedGeometries(geos) {
      const normalized = geos.map((g) => {
        const ng = g.index ? g.toNonIndexed() : g.clone();
        if (!ng.attributes.normal) ng.computeVertexNormals();
        if (!ng.attributes.uv) {
          const count = ng.attributes.position.count;
          const uvs = new Float32Array(count * 2);
          uvs.fill(0.5);
          ng.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        }
        return ng;
      });

      let totalVerts = 0;
      normalized.forEach((g) => {
        totalVerts += g.attributes.position.count;
      });

      const positions = new Float32Array(totalVerts * 3);
      const normals = new Float32Array(totalVerts * 3);
      const uvs = new Float32Array(totalVerts * 2);

      let offset = 0;
      normalized.forEach((g) => {
        const pos = g.attributes.position.array;
        const norm = g.attributes.normal.array;
        const uv = g.attributes.uv.array;
        positions.set(pos, offset * 3);
        normals.set(norm, offset * 3);
        uvs.set(uv, offset * 2);
        offset += g.attributes.position.count;
        g.dispose();
      });

      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      return merged;
    }

    function buildFishSchools(scene) {
      const rand = createSeededRandom(909);

      const speciesList = [
        { name: 'Regal Blue Tang', bodyCol: 0x1d4ed8, accentCol: 0x0f172a, finCol: 0xfacc15, scale: 0.36, aspectY: 0.62, count: 22 },
        { name: 'Clownfish', bodyCol: 0xf97316, accentCol: 0xffffff, finCol: 0xfb923c, scale: 0.25, aspectY: 0.54, count: 16 },
        { name: 'Yellow Tang', bodyCol: 0xfde047, accentCol: 0xeab308, finCol: 0xfef08a, scale: 0.32, aspectY: 0.66, count: 18 },
        { name: 'Moorish Idol', bodyCol: 0xf8fafc, accentCol: 0x0f172a, finCol: 0xfacc15, scale: 0.38, aspectY: 0.72, count: 14 },
        { name: 'Neon Damselfish', bodyCol: 0x06b6d4, accentCol: 0x0284c7, finCol: 0x67e8f9, scale: 0.22, aspectY: 0.50, count: 14 },
        { name: 'Emperor Angelfish', bodyCol: 0x1e40af, accentCol: 0x38bdf8, finCol: 0xfacc15, scale: 0.40, aspectY: 0.68, count: 12 }
      ];

      function createFishTexture(sp) {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 128;
        const ctx = c.getContext('2d');

        const bodyHex = '#' + sp.bodyCol.toString(16).padStart(6, '0');
        const accentHex = '#' + sp.accentCol.toString(16).padStart(6, '0');
        const finHex = '#' + sp.finCol.toString(16).padStart(6, '0');

        const grad = ctx.createLinearGradient(0, 0, 0, 128);
        grad.addColorStop(0.0, accentHex);
        grad.addColorStop(0.24, bodyHex);
        grad.addColorStop(0.78, bodyHex);
        grad.addColorStop(1.0, '#e2e8f0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 128);

        // Species stripes / lateral markings
        ctx.fillStyle = accentHex;
        ctx.fillRect(76, 10, 20, 108);
        ctx.fillRect(142, 12, 18, 104);

        // Tail & fin tint zone
        ctx.fillStyle = finHex;
        ctx.fillRect(0, 0, 44, 128);

        // Subtle iridescent fish scales
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = 1.2;
        for (let sx = 48; sx < 195; sx += 11) {
          for (let sy = 16; sy < 112; sy += 11) {
            ctx.beginPath();
            ctx.arc(sx + ((sy / 11) % 2) * 5, sy, 5.5, -Math.PI * 0.42, Math.PI * 0.42);
            ctx.stroke();
          }
        }

        // Curved gill operculum line
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(178, 64, 28, -Math.PI * 0.36, Math.PI * 0.36);
        ctx.stroke();

        // Glossy eye with golden iris
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(212, 48, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(214, 48, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(216, 45, 2.0, 0, Math.PI * 2);
        ctx.fill();

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      function createDetailedFishGeometry(aspectY = 0.58) {
        // 1. Lofted sleek fusiform body (Nose at +Z = +0.52, Peduncle at -Z = -0.36)
        const radialSegs = 20;
        const lengthSegs = 24;
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let iz = 0; iz <= lengthSegs; iz++) {
          const t = iz / lengthSegs; // 0 = peduncle (-0.36), 1 = snout (+0.52)
          const z = -0.36 + t * 0.88;
          const profile = Math.pow(Math.sin(Math.pow(t, 0.82) * Math.PI), 0.72);
          const rx = 0.014 + profile * 0.145;
          const ry = (0.022 + profile * 0.31) * (aspectY / 0.58);

          for (let ir = 0; ir <= radialSegs; ir++) {
            const theta = (ir / radialSegs) * Math.PI * 2;
            const vx = Math.cos(theta) * rx;
            const vy = Math.sin(theta) * ry;
            positions.push(vx, vy, z);
            uvs.push(0.18 + t * 0.82, 0.5 - Math.sin(theta) * 0.45);
          }
        }

        const stride = radialSegs + 1;
        for (let iz = 0; iz < lengthSegs; iz++) {
          for (let ir = 0; ir < radialSegs; ir++) {
            const a = iz * stride + ir;
            const b = (iz + 1) * stride + ir;
            const c = (iz + 1) * stride + (ir + 1);
            const d = iz * stride + (ir + 1);
            indices.push(a, d, b);
            indices.push(b, d, c);
          }
        }

        const bodyGeo = new THREE.BufferGeometry();
        bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        bodyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        bodyGeo.setIndex(indices);
        bodyGeo.computeVertexNormals();

        // Helper for thin swept fish fins mapped into the fin UV region (u ~ 0.05)
        function makeFishFin(chord, span, sweepBack, xOff, yOff, zOff, rotX = 0, rotZ = 0) {
          const fg = new THREE.BoxGeometry(0.012, span, chord, 1, 5, 3);
          const fp = fg.attributes.position;
          const fuv = fg.attributes.uv;
          for (let i = 0; i < fp.count; i++) {
            let x = fp.getX(i);
            let y = fp.getY(i);
            let z = fp.getZ(i);
            const h = Math.max(0, (y + span * 0.5) / span);
            y = h * span;
            z = z * (1.0 - h * 0.65) - h * sweepBack;
            x = x * (1.0 - h * 0.75);
            fp.setXYZ(i, x, y, z);
            fuv.setXY(i, 0.06, 0.5);
          }
          if (rotX) fg.rotateX(rotX);
          if (rotZ) fg.rotateZ(rotZ);
          fg.translate(xOff, yOff, zOff);
          fg.computeVertexNormals();
          return fg;
        }

        // 2. Sculpted Dorsal, Anal, Pectoral & Forked Caudal Fins
        const dorsalFin = makeFishFin(0.28, 0.18 * (aspectY / 0.58), 0.14, 0, 0.22 * (aspectY / 0.58), -0.02);
        const analFin = makeFishFin(0.20, 0.14 * (aspectY / 0.58), 0.11, 0, -0.19 * (aspectY / 0.58), -0.10, Math.PI);
        const pecL = makeFishFin(0.11, 0.18, 0.08, 0.11, -0.05, 0.14, 0.25, -1.15);
        const pecR = makeFishFin(0.11, 0.18, 0.08, -0.11, -0.05, 0.14, 0.25, 1.15);
        const tailUpper = makeFishFin(0.14, 0.24 * (aspectY / 0.58), 0.11, 0, 0.01, -0.34, -0.45);
        const tailLower = makeFishFin(0.14, 0.24 * (aspectY / 0.58), 0.11, 0, -0.01, -0.34, Math.PI + 0.45);

        return mergeNonIndexedGeometries([bodyGeo, dorsalFin, analFin, pecL, pecR, tailUpper, tailLower]);
      }

      const fishAgents = [];
      const schoolInstancedMeshes = [];

      speciesList.forEach((sp, spIdx) => {
        const tex = createFishTexture(sp);
        const baseFishGeo = createDetailedFishGeometry(sp.aspectY);
        const mat = injectUnderwaterCaustics(
          new THREE.MeshPhysicalMaterial({
            map: tex,
            roughness: 0.28,
            metalness: 0.14,
            clearcoat: 0.38,
            clearcoatRoughness: 0.24
          }),
          { scale: 0.45, boost: 1.2 }
        );

        const prevFishCompile = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader) => {
          prevFishCompile(shader);
          shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>
              uniform float uCurrentStrength;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
              vec4 fInst = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
              float bodyT = clamp((0.52 - transformed.z) / 1.08, 0.0, 1.1);
              float phase = fInst.x * 1.7 + fInst.y * 2.3 + fInst.z * 1.9;
              float freq = 9.2 + uCurrentStrength * 2.8;
              float rubberEnv = 0.014 + pow(bodyT, 1.65) * 0.165;
              transformed.x += sin(uTime * freq - bodyT * 4.4 + phase) * rubberEnv;`
            );
        };

        const instMesh = new THREE.InstancedMesh(baseFishGeo, mat, sp.count);
        instMesh.castShadow = true;
        scene.add(instMesh);
        schoolInstancedMeshes.push(instMesh);

        const schoolCenter = new THREE.Vector3(
          Math.cos(spIdx * 1.15) * 6.5,
          3.5 + spIdx * 2.8,
          Math.sin(spIdx * 1.15) * 6.5
        );

        for (let i = 0; i < sp.count; i++) {
          const pos = schoolCenter.clone().add(
            new THREE.Vector3(
              (rand() - 0.5) * 5.2,
              (rand() - 0.5) * 3.4,
              (rand() - 0.5) * 5.2
            )
          );
          const vel = new THREE.Vector3(rand() - 0.5, (rand() - 0.5) * 0.25, rand() - 0.5).normalize().multiplyScalar(1.8);
          fishAgents.push({
            instMesh,
            instanceIndex: i,
            speciesIndex: spIdx,
            scale: sp.scale * (0.85 + rand() * 0.35),
            pos,
            vel,
            baseSpeed: 1.45 + rand() * 0.85,
            wanderPhase: rand() * Math.PI * 2,
            scatterTimer: 0
          });
        }
      });

      // Bioluminescent Jellyfish (6 Drifting Deep-Water Specimens)
      const jellyfishList = [];
      const jellyMat = new THREE.MeshPhysicalMaterial({
        color: 0xe0f2fe,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.75,
        roughness: 0.15,
        transmission: 0.55,
        transparent: true,
        opacity: 0.82
      });

      const jellyPositions = [
        [-6.5, 13.5, -5.5],
        [7.2, 16.2, 4.8],
        [0.8, 18.8, -6.2],
        [-5.2, 9.8, 6.4],
        [8.4, 12.4, -4.6],
        [-1.8, 20.4, 3.2]
      ];
      jellyPositions.forEach(([jx, jy, jz], idx) => {
        const jGrp = new THREE.Group();
        jGrp.position.set(jx, jy, jz);
        const bell = new THREE.Mesh(
          new THREE.SphereGeometry(0.42, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.58),
          jellyMat
        );
        jGrp.add(bell);

        for (let t = 0; t < 6; t++) {
          const ang = (t / 6) * Math.PI * 2;
          const tent = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.004, 1.15, 6), jellyMat);
          tent.position.set(Math.cos(ang) * 0.18, -0.55, Math.sin(ang) * 0.18);
          jGrp.add(tent);
        }
        scene.add(jGrp);
        jellyfishList.push({ group: jGrp, bell, baseY: jy, phase: idx * 2.1 });
      });

      return { fishAgents, schoolInstancedMeshes, jellyfishList, jellyMat };
    }

    // =========================================================================
    // 11B. SLEEK PATROLLING SHARKS, GIANT MANTA RAYS & DETAILED BIG REEF FISHES
    // =========================================================================
    function buildSharksAndBigFish(scene) {
      const rand = createSeededRandom(5150);

      // A. High-Detail Procedural Counter-Shaded Shark Skin + Dermal Denticle Bump Map
      function createSharkSkinTextures(dorsalHex, flankHex, bellyHex, hasTigerStripes = false) {
        const w = 512;
        const h = 512;
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');

        const bumpC = document.createElement('canvas');
        bumpC.width = w;
        bumpC.height = h;
        const bCtx = bumpC.getContext('2d');
        bCtx.fillStyle = '#808080';
        bCtx.fillRect(0, 0, w, h);

        // Smooth dorsal-to-ventral countershading along v
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.0, dorsalHex);
        grad.addColorStop(0.38, flankHex);
        grad.addColorStop(0.54, '#aebec8');
        grad.addColorStop(0.62, bellyHex);
        grad.addColorStop(1.0, bellyHex);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Scalloped lateral countershading wave along the flank
        ctx.fillStyle = bellyHex;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.56);
        for (let x = 0; x <= w; x += 16) {
          const waveY = h * (0.54 + Math.sin(x * 0.045) * 0.025);
          ctx.lineTo(x, waveY);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        if (hasTigerStripes) {
          ctx.fillStyle = 'rgba(18, 28, 38, 0.34)';
          for (let s = 72; s < 410; s += 24) {
            ctx.beginPath();
            ctx.ellipse(s, h * 0.28, 6, 86, 0.14, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Subtle muscle myomere banding & dermal denticle micro-texture
        for (let i = 0; i < 2600; i++) {
          const gx = rand() * w;
          const gy = rand() * h;
          ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.04)';
          ctx.fillRect(gx, gy, 3, 1.5);

          bCtx.fillStyle = i % 2 === 0 ? 'rgba(210,210,210,0.22)' : 'rgba(55,55,55,0.22)';
          bCtx.fillRect(gx, gy, 2, 2);
        }

        // 5 Curved Crescent Gill Slits painted + bumped into the flank (u ~ 0.66..0.75)
        for (let g = 0; g < 5; g++) {
          const gx = w * (0.66 + g * 0.017);
          ctx.strokeStyle = 'rgba(12, 20, 28, 0.78)';
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.arc(gx, h * 0.46, 22, -Math.PI * 0.28, Math.PI * 0.28);
          ctx.stroke();

          bCtx.strokeStyle = '#181818';
          bCtx.lineWidth = 4.0;
          bCtx.beginPath();
          bCtx.arc(gx, h * 0.46, 22, -Math.PI * 0.28, Math.PI * 0.28);
          bCtx.stroke();
        }

        // Dark charcoal fin-tip accents (mapped at u < 0.08)
        const tipGrad = ctx.createLinearGradient(0, 0, w * 0.08, 0);
        tipGrad.addColorStop(0.0, 'rgba(15, 23, 32, 0.72)');
        tipGrad.addColorStop(1.0, 'rgba(15, 23, 32, 0.0)');
        ctx.fillStyle = tipGrad;
        ctx.fillRect(0, 0, w * 0.08, h * 0.35);

        const albedo = new THREE.CanvasTexture(c);
        albedo.colorSpace = THREE.SRGBColorSpace;
        const bump = new THREE.CanvasTexture(bumpC);
        return { albedo, bump };
      }

      // Ultra-Sleek Lofted Hydrodynamic Shark Torso Geometry (Nose at +Z = +0.54L, Peduncle at -Z = -0.36L)
      function createSleekSharkTorsoGeometry(length) {
        const radialSegs = 36;
        const lengthSegs = 48;
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let iz = 0; iz <= lengthSegs; iz++) {
          const t = iz / lengthSegs; // 0 = caudal peduncle (-0.36L), 1 = snout tip (+0.54L)
          const z = (-0.36 + t * 0.90) * length;

          let rx = 0.003;
          let ry = 0.003;
          let yCenter = 0.0;

          if (t < 0.64) {
            // Posterior fuselage tapering gracefully to a slender keeled peduncle
            const u = t / 0.64;
            const profile = Math.pow(Math.sin(u * Math.PI * 0.5), 0.76);
            rx = (0.014 + profile * 0.076) * length;
            ry = (0.019 + profile * 0.081) * length;

            // Lateral caudal keel flare near the tail base (like Mako / Great White)
            const keelBump = Math.exp(-Math.pow((u - 0.09) / 0.07, 2.0)) * 0.013 * length;
            rx += keelBump;
            yCenter = (1.0 - u) * 0.006 * length;
          } else {
            // Sleek torpedo snout taper (t from 0.64 -> 1.0)
            const u = (1.0 - t) / 0.36;
            const noseProfile = Math.pow(Math.max(0, u), 0.66);
            rx = (0.002 + noseProfile * 0.090) * length;
            ry = (0.002 + noseProfile * 0.098) * length;
            // Raised hydrofoil snout tip
            yCenter = (1.0 - u) * 0.018 * length;
          }

          for (let ir = 0; ir <= radialSegs; ir++) {
            const theta = (ir / radialSegs) * Math.PI * 2;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);

            // Flatter ventral belly & sleek dorsal ridge
            const yScale = sinT < 0 ? 0.78 : 1.04;
            let vx = cosT * rx;
            let vy = yCenter + sinT * ry * yScale;

            // Underslung crescent jaw recess around t = 0.84..0.92
            if (sinT < -0.25 && t > 0.82 && t < 0.93) {
              const jawFactor = Math.sin(((t - 0.82) / 0.11) * Math.PI) * (-sinT - 0.25);
              vy += jawFactor * 0.022 * length;
            }

            positions.push(vx, vy, z);
            const uCoord = 0.12 + t * 0.88;
            const vCoord = 0.5 - sinT * 0.44;
            uvs.push(uCoord, vCoord);
          }
        }

        const stride = radialSegs + 1;
        for (let iz = 0; iz < lengthSegs; iz++) {
          for (let ir = 0; ir < radialSegs; ir++) {
            const a = iz * stride + ir;
            const b = (iz + 1) * stride + ir;
            const c = (iz + 1) * stride + (ir + 1);
            const d = iz * stride + (ir + 1);
            indices.push(a, d, b);
            indices.push(b, d, c);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // Lofted NACA Hydrofoil Falcate Fin Generator (Smooth leading edge, razor trailing edge)
      function createSleekHydrofoilFin(chord, span, sweepBack, maxThick, tipDark = true) {
        const spanSegs = 14;
        const chordSegs = 12;
        const geo = new THREE.BoxGeometry(maxThick, span, chord, 2, spanSegs, chordSegs);
        const pos = geo.attributes.position;
        const uv = geo.attributes.uv;

        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);

          // h: 0 at fin root, 1 at fin tip
          const h = Math.max(0.0, Math.min(1.0, (y + span * 0.5) / span));
          y = h * span;

          // c: 0 at trailing edge (-Z), 1 at leading edge (+Z)
          const c = Math.max(0.0, Math.min(1.0, (z / chord) + 0.5));

          // Falcate (crescent-curved) planform taper
          const rootChord = chord * (1.0 - Math.pow(h, 0.85) * 0.82);
          const falcateArc = Math.sin(h * Math.PI) * sweepBack * 0.28;
          const zCenter = -Math.pow(h, 1.18) * sweepBack - falcateArc;
          z = zCenter + (c - 0.5) * rootChord;

          // NACA-style streamlined airfoil thickness profile (blunt leading, razor trailing)
          const naca = 2.6 * (0.2969 * Math.sqrt(c) - 0.126 * c - 0.3516 * c * c + 0.2843 * Math.pow(c, 3) - 0.1015 * Math.pow(c, 4));
          const spanThick = 1.0 - Math.pow(h, 0.9) * 0.84;
          x = Math.sign(x) * maxThick * 0.5 * Math.max(0.04, naca) * spanThick;

          pos.setXYZ(i, x, y, z);
          // Map fin tips into the dark tip UV zone when tipDark is enabled
          uv.setXY(i, tipDark ? (1.0 - h) * 0.18 + 0.02 : 0.32, 0.15 + h * 0.12);
        }

        geo.computeVertexNormals();
        return geo;
      }

      function createRubberySharkMaterial(textures, phase, swimFreq, length) {
        const mat = injectUnderwaterCaustics(
          new THREE.MeshPhysicalMaterial({
            map: textures.albedo,
            bumpMap: textures.bump,
            bumpScale: 0.016,
            roughness: 0.28,
            metalness: 0.06,
            clearcoat: 0.44,
            clearcoatRoughness: 0.24
          }),
          { scale: 0.38, boost: 1.15 }
        );

        const prevCompile = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader) => {
          prevCompile(shader);
          shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
          shader.uniforms.uSwimPhase = { value: phase };
          shader.uniforms.uSwimFreq = { value: swimFreq };
          shader.uniforms.uSharkLen = { value: length };
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>
              uniform float uCurrentStrength;
              uniform float uSwimPhase;
              uniform float uSwimFreq;
              uniform float uSharkLen;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
              // Normalized axial position: 0.0 at snout tip (+0.54L), 1.0 at tail tip (-0.58L)
              float s = clamp((0.54 * uSharkLen - transformed.z) / max(0.1, uSharkLen * 1.12), 0.0, 1.05);
              float freq = uSwimFreq * (0.78 + uCurrentStrength * 0.34);
              float wavePhase = uTime * freq - s * 5.6 + uSwimPhase;

              // Supple rubbery S-wave envelope: subtle head counter-yaw + muscular mid-body + whipping tail
              float bendEnv = (0.016 + 0.032 * sin(s * 3.14159) + 0.175 * pow(s, 1.72)) * uSharkLen;
              transformed.x += sin(wavePhase) * bendEnv;

              // Muscular torsional body roll coupled to tail stroke
              float rollTwist = sin(wavePhase - 0.65) * 0.085 * s;
              float cosR = cos(rollTwist);
              float sinR = sin(rollTwist);
              float rx = transformed.x * cosR - transformed.y * sinR;
              float ry = transformed.x * sinR + transformed.y * cosR;
              transformed.x = rx;
              transformed.y = ry;

              // Flexible hydrofoil pectoral wingtip undulation
              float wingSpan = clamp((abs(transformed.x) - 0.075 * uSharkLen) / max(0.05, 0.22 * uSharkLen), 0.0, 1.0);
              transformed.y += sin(uTime * freq * 0.55 + uSwimPhase - wingSpan * 1.5) * wingSpan * wingSpan * 0.032 * uSharkLen;`
            );
        };
        return mat;
      }

      // B. Giant Manta Rays / Spotted Eagle Rays (3 Specimens with Wing-Flap Kinematics)
      function createMantaTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#1d3244';
        ctx.fillRect(0, 0, 256, 256);

        ctx.fillStyle = 'rgba(186, 230, 253, 0.35)';
        for (let i = 0; i < 65; i++) {
          ctx.beginPath();
          ctx.arc(24 + rand() * 208, 30 + rand() * 190, 2.2 + rand() * 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const mantaTex = createMantaTexture();

        { span: 3.2, cx: 1.5, cz: 1.0, rx: 15.5, rz: 12.8, yBase: 16.5, yAmp: 1.8, speed: 0.15, dir: 1, phase: 4.9 }
      ];

      const mantas = [];
      mantaSpecs.forEach((ms) => {
        const halfSpan = ms.span * 0.5;
        const mantaGeo = new THREE.PlaneGeometry(ms.span, ms.span * 0.68, 32, 18);
        mantaGeo.rotateX(-Math.PI / 2);
        const mp = mantaGeo.attributes.position;
        for (let i = 0; i < mp.count; i++) {
          const x = mp.getX(i);
          const z = mp.getZ(i);
          const absX = Math.abs(x) / halfSpan;
          const normZ = z / (ms.span * 0.34);

          const chordScale = Math.max(0.06, 1.0 - Math.pow(absX, 0.88) * 0.92);
          const sweepZ = -Math.pow(absX, 1.25) * halfSpan * 0.42;
          const bodyArch = Math.max(0, 1.0 - absX * 2.4) * (1.0 - normZ * normZ) * 0.22;

          mp.setXYZ(i, x, bodyArch, z * chordScale + sweepZ);
        }
        mantaGeo.computeVertexNormals();

        const mantaMat = injectUnderwaterCaustics(
          new THREE.MeshPhysicalMaterial({
            map: mantaTex,
            roughness: 0.34,
            metalness: 0.06,
            clearcoat: 0.35,
            clearcoatRoughness: 0.26,

          }),

          shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
          shader.uniforms.uFlapPhase = { value: ms.phase };
          shader.uniforms.uHalfSpan = { value: halfSpan };
          shader.vertexShader = shader.vertexShader
            .replace(

              uniform float uFlapPhase;
              uniform float uHalfSpan;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
              float wingT = clamp(abs(transformed.x) / max(0.1, uHalfSpan), 0.0, 1.0);
              float flapFreq = 2.3 * (0.75 + uCurrentStrength * 0.3);
              transformed.y += sin(uTime * flapFreq + uFlapPhase - wingT * 1.45) * pow(wingT, 1.45) * 0.46;`
            );
        };

        const mantaGrp = new THREE.Group();
        const wingMesh = new THREE.Mesh(mantaGeo, mantaMat);
        wingMesh.castShadow = true;
        mantaGrp.add(wingMesh);

        [-1, 1].forEach((side) => {

        const whipTail = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.024, ms.span * 0.72, 6), mantaMat);

      // C. Detailed Big Reef Fishes — Napoleon Wrasse, Giant Trevally, Barracuda & Coral Grouper (5 Specimens)
      function createBigFishTextures(dorsalHex, flankHex, stripeHex, hasSpots = false) {
        const w = 512;
        const h = 256;
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');

        const bumpC = document.createElement('canvas');
        bumpC.width = w;
        bumpC.height = h;
        const bCtx = bumpC.getContext('2d');
        bCtx.fillStyle = '#808080';
        bCtx.fillRect(0, 0, w, h);

        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.0, dorsalHex);
        grad.addColorStop(0.45, flankHex);
        grad.addColorStop(0.75, flankHex);
        grad.addColorStop(1.0, '#e2e8f0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        if (hasSpots) {
          ctx.fillStyle = stripeHex;
          for (let i = 0; i < 120; i++) {
            ctx.beginPath();
            ctx.arc(85 + rand() * 320, 28 + rand() * 190, 3.5 + rand() * 4.5, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = stripeHex;
          for (let x = 90; x < 380; x += 28) {
            ctx.fillRect(x, 26, 10, 196);
          }
        }

        // Overlapping scales texture + bump
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = 1.4;
        bCtx.strokeStyle = 'rgba(220, 220, 220, 0.35)';
        bCtx.lineWidth = 1.5;
        for (let sx = 80; sx < 405; sx += 14) {
          for (let sy = 20; sy < 236; sy += 14) {
            const ox = sx + ((sy / 14) % 2) * 7;
            ctx.beginPath();
            ctx.arc(ox, sy, 7.2, -Math.PI * 0.42, Math.PI * 0.42);
            ctx.stroke();

            bCtx.beginPath();
            bCtx.arc(ox, sy, 7.2, -Math.PI * 0.42, Math.PI * 0.42);
            bCtx.stroke();
          }
        }

        // Curved gill operculum plate
        ctx.strokeStyle = 'rgba(10, 18, 28, 0.68)';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(386, 128, 54, -Math.PI * 0.36, Math.PI * 0.36);
        ctx.stroke();

        // Fin tip accent at u < 0.14
        ctx.fillStyle = stripeHex;
        ctx.fillRect(0, 0, w * 0.14, h);

        // Detailed Eye
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(444, 96, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(447, 96, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(451, 91, 3.2, 0, Math.PI * 2);
        ctx.fill();

        const albedo = new THREE.CanvasTexture(c);
        albedo.colorSpace = THREE.SRGBColorSpace;
        const bump = new THREE.CanvasTexture(bumpC);
        return { albedo, bump };
      }

      function createDetailedBigFishGeometry(sleekness = 1.0) {
        const radialSegs = 28;
        const lengthSegs = 36;
        const positions = [];
        const uvs = [];
        const indices = [];

        const len = 1.35 * sleekness;
        const rxMax = 0.21 / Math.sqrt(sleekness);
        const ryMax = 0.34 / Math.sqrt(sleekness);

        for (let iz = 0; iz <= lengthSegs; iz++) {
          const t = iz / lengthSegs; // 0 = tail peduncle, 1 = snout
          const z = (-0.42 + t * 0.94) * len;
          const profile = Math.pow(Math.sin(Math.pow(t, 0.8) * Math.PI), 0.72);
          const rx = 0.022 + profile * rxMax;
          const ry = 0.036 + profile * ryMax;

          for (let ir = 0; ir <= radialSegs; ir++) {
            const theta = (ir / radialSegs) * Math.PI * 2;
            positions.push(Math.cos(theta) * rx, Math.sin(theta) * ry, z);
            uvs.push(0.16 + t * 0.84, 0.5 - Math.sin(theta) * 0.46);
          }
        }

        const stride = radialSegs + 1;
        for (let iz = 0; iz < lengthSegs; iz++) {
          for (let ir = 0; ir < radialSegs; ir++) {
            const a = iz * stride + ir;
            const b = (iz + 1) * stride + ir;
            const c = (iz + 1) * stride + (ir + 1);
            const d = iz * stride + (ir + 1);
            indices.push(a, d, b);
            indices.push(b, d, c);
          }
        }

        const bodyGeo = new THREE.BufferGeometry();
        bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        bodyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        bodyGeo.setIndex(indices);
        bodyGeo.computeVertexNormals();

        const dorsal = createSleekHydrofoilFin(0.46 * len, 0.22 / Math.sqrt(sleekness), 0.16 * len, 0.022, false);
        dorsal.translate(0, ryMax * 0.72, -0.02 * len);

        const anal = createSleekHydrofoilFin(0.28 * len, 0.17 / Math.sqrt(sleekness), 0.12 * len, 0.018, false);
        anal.rotateX(Math.PI);
        anal.translate(0, -ryMax * 0.64, -0.14 * len);

        const pecL = createSleekHydrofoilFin(0.16 * len, 0.28, 0.11, 0.016, false);
        pecL.rotateZ(-1.18);
        pecL.rotateY(0.18);
        pecL.translate(rxMax * 0.82, -ryMax * 0.22, 0.16 * len);

        const pecR = createSleekHydrofoilFin(0.16 * len, 0.28, 0.11, 0.016, false);
        pecR.rotateZ(1.18);
        pecR.rotateY(-0.18);
        pecR.translate(-rxMax * 0.82, -ryMax * 0.22, 0.16 * len);

        const tailUp = createSleekHydrofoilFin(0.18 * len, 0.34 / Math.sqrt(sleekness), 0.15, 0.018, false);
        tailUp.rotateX(-0.44);
        tailUp.translate(0, 0.01, -0.40 * len);

        const tailLo = createSleekHydrofoilFin(0.18 * len, 0.34 / Math.sqrt(sleekness), 0.15, 0.018, false);
        tailLo.rotateX(Math.PI + 0.44);
        tailLo.translate(0, -0.01, -0.40 * len);

        return mergeNonIndexedGeometries([bodyGeo, dorsal, anal, pecL, pecR, tailUp, tailLo]);
      }

      const bigFishSpecs = [
        { scale: 1.05, sleek: 1.0,  dorsal: '#0f5132', flank: '#15803d', stripe: '#38bdf8', spots: false, cx: 1.5,  cz: 1.2,  rx: 7.4,  rz: 6.2, yBase: 4.2, speed: 0.29, dir: 1,  phase: 0.4 },
        { scale: 1.18, sleek: 1.15, dorsal: '#1e3a5f', flank: '#3b82f6', stripe: '#fde047', spots: false, cx: -2.2, cz: -0.8, rx: 8.6,  rz: 7.0, yBase: 6.4, speed: 0.25, dir: -1, phase: 2.2 },
        { scale: 1.00, sleek: 0.92, dorsal: '#7c2d12', flank: '#c2410c', stripe: '#38bdf8', spots: true,  cx: 4.5,  cz: 3.2,  rx: 6.8,  rz: 5.8, yBase: 3.4, speed: 0.31, dir: 1,  phase: 3.9 },
        { scale: 1.12, sleek: 1.05, dorsal: '#1e3a8a', flank: '#0284c7', stripe: '#34d399', spots: false, cx: -4.2, cz: 2.5,  rx: 8.2,  rz: 6.8, yBase: 5.5, speed: 0.26, dir: -1, phase: 5.1 },
        { scale: 1.24, sleek: 1.45, dorsal: '#334155', flank: '#94a3b8', stripe: '#1e293b', spots: false, cx: 0.5,  cz: -2.5, rx: 10.2, rz: 8.4, yBase: 9.6, speed: 0.33, dir: 1,  phase: 1.4 }
      ];

      const bigFishes = [];
      bigFishSpecs.forEach((bf) => {
        const texPair = createBigFishTextures(bf.dorsal, bf.flank, bf.stripe, bf.spots);
        const geo = createDetailedBigFishGeometry(bf.sleek);
        const mat = injectUnderwaterCaustics(
          new THREE.MeshPhysicalMaterial({
            map: texPair.albedo,
            bumpMap: texPair.bump,
            bumpScale: 0.02,
            roughness: 0.28,
            metalness: 0.14,
            clearcoat: 0.42,
            clearcoatRoughness: 0.22
          }),
          { scale: 0.42, boost: 1.18 }
        );
        const prevBfCompile = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader) => {
          prevBfCompile(shader);
          shader.uniforms.uCurrentStrength = sharedUniforms.uCurrentStrength;
          shader.uniforms.uSwimPhase = { value: bf.phase };
          shader.uniforms.uSleek = { value: bf.sleek };
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>
              uniform float uCurrentStrength;
              uniform float uSwimPhase;
              uniform float uSleek;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
              float lenSpan = 1.35 * uSleek;
              float bodyT = clamp((0.52 * lenSpan - transformed.z) / max(0.2, 1.15 * lenSpan), 0.0, 1.1);
              float freq = 6.2 + uCurrentStrength * 2.2;
              float rubberEnv = 0.018 + 0.03 * sin(bodyT * 3.14159) + pow(bodyT, 1.65) * 0.24;
              transformed.x += sin(uTime * freq - bodyT * 4.8 + uSwimPhase) * rubberEnv;`
            );
        };

        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.setScalar(bf.scale);
        mesh.castShadow = true;
        scene.add(mesh);
        bigFishes.push({ mesh, spec: bf, angle: bf.phase });
      });

      return { sharks, mantas, bigFishes };
    }

    // =========================================================================
    // 12. RISING AIR BUBBLES & FLOATING MARINE PLANKTON MOTES
    // =========================================================================
    function buildBubblesAndPlankton(scene) {
      const rand = createSeededRandom(4242);

      // 340 Instanced Rising Bubbles
      const bubbleCount = 340;
      const bubbleGeo = new THREE.SphereGeometry(0.055, 10, 10);
      const bubbleMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        roughness: 0.05,
        metalness: 0.1,
        transparent: true,
        opacity: 0.48
      });
      const bubbleInst = new THREE.InstancedMesh(bubbleGeo, bubbleMat, bubbleCount);
      scene.add(bubbleInst);

      const emitters = [
        new THREE.Vector3(1.2, 0.6, -2.7),
        new THREE.Vector3(-2.4, 1.4, -1.2),
        new THREE.Vector3(8.4, 0.8, -4.5),
        new THREE.Vector3(-6.2, 1.2, 4.8),
        new THREE.Vector3(4.5, 0.9, 5.2),
        new THREE.Vector3(-9.5, 1.0, -6.5)
      ];

      const bubbles = [];
      for (let i = 0; i < bubbleCount; i++) {
        const em = emitters[i % emitters.length];
        bubbles.push({
          emitter: em,
          pos: new THREE.Vector3(
            em.x + (rand() - 0.5) * 1.4,
            em.y + rand() * (WATER_LEVEL - 1.2),
            em.z + (rand() - 0.5) * 1.4
          ),
          speed: 0.95 + rand() * 1.35,
          radius: 0.35 + rand() * 1.15,
          wobblePhase: rand() * Math.PI * 2
        });
      }

      // 1,800 Suspended Marine Snow / Sunlit Plankton Particles
      const moteCount = 1800;
      const moteGeo = new THREE.BufferGeometry();
      const motePositions = new Float32Array(moteCount * 3);
      for (let i = 0; i < moteCount; i++) {
        motePositions[i * 3] = (rand() - 0.5) * 58.0;
        motePositions[i * 3 + 1] = 0.3 + rand() * (WATER_LEVEL - 0.6);
        motePositions[i * 3 + 2] = (rand() - 0.5) * 58.0;
      }
      moteGeo.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));

      const moteMat = new THREE.PointsMaterial({
        color: 0xdff8ff,
        size: 0.085,
        transparent: true,
        opacity: 0.52,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const motesPoints = new THREE.Points(moteGeo, moteMat);
      scene.add(motesPoints);

      return { bubbleInst, bubbles, motesPoints, moteMat };
    }

      function triggerFishScatter(originPoint) {
        const origin = originPoint || new THREE.Vector3(0, 6.5, 0);
        wildlife.fishAgents.forEach((fish) => {
          const away = fish.pos.clone().sub(origin);
          if (away.lengthSq() < 0.01) {
            away.set(Math.random() - 0.5, 0.3, Math.random() - 0.5);
          }
          away.normalize().multiplyScalar(5.8 + Math.random() * 2.8);
          fish.vel.copy(away);
          fish.scatterTimer = 1.6;
        });
      }

      document.getElementById('scatter-fish-btn').addEventListener('click', () => {
        triggerFishScatter(new THREE.Vector3(0, 6.5, 0));
      });

      // Raycast click on seabed to scatter nearby fish
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let pointerDownPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (moved > 6) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const hits = raycaster.intersectObject(oceanEnv.sandMesh);
        if (hits.length > 0) {
          triggerFishScatter(hits[0].point.clone().add(new THREE.Vector3(0, 3.0, 0)));

      // Responsive Resize Handler & ResizeObserver
      function handleResize() {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', handleResize);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(handleResize).observe(container);
      }

      // Reveal Viewport cleanly
      setProgress(100, 'Ecosystem online.');
      setTimeout(() => {
        if (loaderOverlay) loaderOverlay.classList.add('hidden-loader');
      }, 350);

      // -----------------------------------------------------------------------
      // Real-Time Ecosystem Animation Loop
      // -----------------------------------------------------------------------
      const clock = new THREE.Clock();
      const dummyObj = new THREE.Object3D();
      const lookTarget = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();
        sharedUniforms.uTime.value = elapsed;

        // 1. Smooth Camera Flight Transition
        if (camTransition) {
          camTransition.progress = Math.min(1.0, camTransition.progress + dt * 1.15);
          const ease = 1.0 - Math.pow(1.0 - camTransition.progress, 3.0);
          camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
          controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, ease);
          if (camTransition.progress >= 1.0) {
            camTransition = null;
          }
        }
        controls.update();

        // Seamless Submerged vs Above-Surface Fog & Background Adaptation
        const isSubmerged = camera.position.y < WATER_LEVEL;
        const targetFogHex = isSubmerged ? activeMood.underwaterBg : activeMood.skyHorizon;
        scene.background.lerp(new THREE.Color(targetFogHex), Math.min(1, 5.0 * dt));
        scene.fog.color.lerp(new THREE.Color(targetFogHex), Math.min(1, 5.0 * dt));
        scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, isSubmerged ? 0.0115 : 0.0045, Math.min(1, 5.0 * dt));

        // Prevent camera from clipping beneath the sculpted ocean floor
        const minCamY = getSeabedHeight(camera.position.x, camera.position.z) + 0.85;
        if (camera.position.y < minCamY) {
          camera.position.y = minCamY;
        }

        const current = sharedUniforms.uCurrentStrength.value;

        // 2. Shipwreck Lantern & Treasure Shimmer
        galleon.lanternLight.intensity = activeMood.lanternInt * (0.92 + Math.sin(elapsed * 4.3) * 0.08);
        galleon.chestGlow.intensity = 1.25 + Math.sin(elapsed * 3.1) * 0.25;

        // 3. Sea Anemone Tentacle Sway
        reef.anemoneTentacles.forEach((at) => {
          at.mesh.rotation.x = at.baseRotX + Math.sin(elapsed * 2.1 * current + at.phase) * 0.14;
          at.mesh.rotation.z = at.baseRotZ + Math.cos(elapsed * 1.7 * current + at.phase) * 0.14;
        });

        // 4. Giant Reef Octopus Breathing & 8-Tentacle Wave Kinematics
        const breath = 1.0 + Math.sin(elapsed * 1.65) * 0.055;
        octopus.mantle.scale.set(0.88 * breath, 1.35 * (2.0 - breath), 1.05 * breath);
        octopus.tentacles.forEach((arm) => {
          arm.segments.forEach((seg) => {
            const sIdx = seg.index;
            const wave = Math.sin(elapsed * 2.2 * current - sIdx * 0.48 + arm.phase);
            const curl = 0.09 + sIdx * 0.016 + wave * 0.045;
            seg.pivot.rotation.x = -curl;
            seg.pivot.rotation.y = Math.cos(elapsed * 1.6 * current - sIdx * 0.4 + arm.phase) * 0.06;
          });
        });

        // 5. Scuttling Reef Crabs
        crabs.forEach((crab) => {
          const p = crab.path;
          const t = elapsed * p.speed * (0.6 + current * 0.4) + p.phase;
          const cx = p.cx + Math.cos(t) * p.rx;
          const cz = p.cz + Math.sin(t) * p.rz;
          const cy = getSeabedHeight(cx, cz) + 0.02;

          const nx = p.cx + Math.cos(t + 0.05) * p.rx;
          const nz = p.cz + Math.sin(t + 0.05) * p.rz;

          crab.group.position.set(cx, cy, cz);
          crab.group.lookAt(nx, cy, nz);
          crab.group.rotateY(Math.PI * 0.5);

          crab.legs.forEach((leg) => {
            const gait = Math.sin(elapsed * 12.0 + leg.index * 1.5 + (leg.side > 0 ? 0 : Math.PI));
            leg.pivot.rotation.y = gait * 0.26;
            leg.pivot.rotation.z = gait * 0.12 * leg.side;
          });
          crab.claws.forEach((claw) => {
            claw.pivot.rotation.y = Math.sin(elapsed * 2.8 + claw.side) * 0.18;
          });
        });

        // 6. Multi-Species Schooling Tropical Fish
        wildlife.fishAgents.forEach((fish) => {
          if (fish.scatterTimer > 0) {
            fish.scatterTimer -= dt;
          }

          const orbitAngle = elapsed * (0.24 + fish.speciesIndex * 0.03) * (0.65 + current * 0.35) + fish.speciesIndex * 1.1;
          const orbitRadius = 6.2 + (fish.speciesIndex % 3) * 3.2;
          const attractor = new THREE.Vector3(
            Math.cos(orbitAngle) * orbitRadius + Math.sin(elapsed * 0.5 + fish.wanderPhase) * 2.2,
            2.6 + fish.speciesIndex * 2.7 + Math.cos(elapsed * 0.7 + fish.wanderPhase) * 1.3,
            Math.sin(orbitAngle) * orbitRadius + Math.cos(elapsed * 0.45 + fish.wanderPhase) * 2.2
          );

          const toAttractor = attractor.sub(fish.pos);
          const steerStrength = fish.scatterTimer > 0 ? 0.6 : 1.85;
          fish.vel.addScaledVector(toAttractor, steerStrength * dt);

          // Soft boundary & seabed/surface containment
          const floorY = getSeabedHeight(fish.pos.x, fish.pos.z) + 0.85;
          if (fish.pos.y < floorY) fish.vel.y += (floorY - fish.pos.y) * 9.0 * dt;
          if (fish.pos.y > WATER_LEVEL - 1.1) fish.vel.y -= (fish.pos.y - (WATER_LEVEL - 1.1)) * 9.0 * dt;
          const radialDist = Math.hypot(fish.pos.x, fish.pos.z);
          if (radialDist > 22.0) {
            fish.vel.x -= (fish.pos.x / radialDist) * (radialDist - 22.0) * 1.6 * dt;
            fish.vel.z -= (fish.pos.z / radialDist) * (radialDist - 22.0) * 1.6 * dt;
          }

          const targetSpeed = fish.scatterTimer > 0 ? fish.baseSpeed * 2.4 : fish.baseSpeed * (0.75 + current * 0.3);
          const spd = fish.vel.length();
          if (spd > 0.001) {
            fish.vel.multiplyScalar(THREE.MathUtils.lerp(spd, targetSpeed, 4.0 * dt) / spd);
          }

          fish.pos.addScaledVector(fish.vel, dt);

          dummyObj.position.copy(fish.pos);
          lookTarget.copy(fish.pos).add(fish.vel);
          dummyObj.lookAt(lookTarget);
          dummyObj.scale.setScalar(fish.scale);
          dummyObj.updateMatrix();
          fish.instMesh.setMatrixAt(fish.instanceIndex, dummyObj.matrix);
        });

        wildlife.schoolInstancedMeshes.forEach((im) => {
          im.instanceMatrix.needsUpdate = true;
        });

        // 7. Drifting Bioluminescent Jellyfish
        wildlife.jellyfishList.forEach((jf) => {
          const pulse = Math.sin(elapsed * 2.4 + jf.phase);
          jf.group.position.y = jf.baseY + Math.sin(elapsed * 0.65 + jf.phase) * 0.75;
          jf.bell.scale.set(1.0 + pulse * 0.14, 1.0 - pulse * 0.16, 1.0 + pulse * 0.14);
        });

        // 7B. Patrolling Sharks, Giant Manta Rays & Large Reef Fishes
        const swimFlow = 0.72 + current * 0.32;
        bigMarineLife.sharks.forEach((sh) => {
          const sp = sh.spec;
          const burst = 1.0 + Math.sin(elapsed * 0.85 + sp.phase) * 0.12;
          sh.angle += sp.speed * swimFlow * burst * sp.dir * dt;
          const ang = sh.angle;
          const nextAng = ang + 0.04 * sp.dir;

          const sx = sp.cx + Math.cos(ang) * sp.rx + Math.sin(ang * 2.0) * 1.8;
          const sz = sp.cz + Math.sin(ang) * sp.rz + Math.cos(ang * 1.5) * 1.1;
          const sy = Math.max(getSeabedHeight(sx, sz) + 1.8, sp.yBase + Math.sin(elapsed * 0.55 + sp.phase) * sp.yAmp);

          const nx = sp.cx + Math.cos(nextAng) * sp.rx + Math.sin(nextAng * 2.0) * 1.8;
          const nz = sp.cz + Math.sin(nextAng) * sp.rz + Math.cos(nextAng * 1.5) * 1.1;
          const ny = Math.max(getSeabedHeight(nx, nz) + 1.8, sp.yBase + Math.sin((elapsed + 0.22) * 0.55 + sp.phase) * sp.yAmp);

          sh.group.position.set(sx, sy, sz);
          sh.group.lookAt(nx, ny, nz);
          // Dynamic hydrodynamic banking & counter-roll as the shark cuts through the water
          sh.group.rotateZ(sp.dir * 0.14 + Math.sin(elapsed * 1.8 + sp.phase) * 0.04);
        });

        bigMarineLife.mantas.forEach((mt) => {
          const ms = mt.spec;
          mt.angle += ms.speed * swimFlow * ms.dir * dt;
          const ang = mt.angle;
          const nextAng = ang + 0.04 * ms.dir;

          const mx = ms.cx + Math.cos(ang) * ms.rx;
          const mz = ms.cz + Math.sin(ang) * ms.rz;
          const my = ms.yBase + Math.sin(elapsed * 0.45 + ms.phase) * ms.yAmp;

          const nx = ms.cx + Math.cos(nextAng) * ms.rx;
          const nz = ms.cz + Math.sin(nextAng) * ms.rz;
          const ny = ms.yBase + Math.sin((elapsed + 0.22) * 0.45 + ms.phase) * ms.yAmp;

          mt.group.position.set(mx, my, mz);
          mt.group.lookAt(nx, ny, nz);
          mt.group.rotateZ(ms.dir * 0.16);
        });

        bigMarineLife.bigFishes.forEach((bfItem) => {
          const bf = bfItem.spec;
          bfItem.angle += bf.speed * swimFlow * bf.dir * dt;
          const ang = bfItem.angle;
          const nextAng = ang + 0.04 * bf.dir;

          const bx = bf.cx + Math.cos(ang) * bf.rx;
          const bz = bf.cz + Math.sin(ang) * bf.rz;
          const by = Math.max(getSeabedHeight(bx, bz) + 1.3, bf.yBase + Math.sin(elapsed * 0.7 + bf.phase) * 0.65);

          const nx = bf.cx + Math.cos(nextAng) * bf.rx;
          const nz = bf.cz + Math.sin(nextAng) * bf.rz;
          const ny = Math.max(getSeabedHeight(nx, nz) + 1.3, bf.yBase + Math.sin((elapsed + 0.22) * 0.7 + bf.phase) * 0.65);

          bfItem.mesh.position.set(bx, by, bz);
          bfItem.mesh.lookAt(nx, ny, nz);
        });

        // 8. Rising Air Bubbles & Sunlit Plankton Motes
        for (let i = 0; i < particles.bubbles.length; i++) {
          const b = particles.bubbles[i];
          b.pos.y += b.speed * (0.65 + current * 0.45) * dt;
          b.pos.x += Math.sin(elapsed * 3.0 + b.wobblePhase) * 0.18 * dt;
          b.pos.z += Math.cos(elapsed * 2.6 + b.wobblePhase) * 0.18 * dt;

          if (b.pos.y >= WATER_LEVEL - 0.15) {
            b.pos.set(
              b.emitter.x + (Math.random() - 0.5) * 1.2,
              b.emitter.y,
              b.emitter.z + (Math.random() - 0.5) * 1.2
            );
          }

          dummyObj.position.copy(b.pos);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.setScalar(b.radius);
          dummyObj.updateMatrix();
          particles.bubbleInst.setMatrixAt(i, dummyObj.matrix);
        }
        particles.bubbleInst.instanceMatrix.needsUpdate = true;

        const mAttr = particles.motesPoints.geometry.attributes.position;
        for (let i = 0; i < mAttr.count; i++) {
          let mx = mAttr.getX(i) + Math.sin(elapsed * 0.4 + i) * 0.08 * current * dt;
          let my = mAttr.getY(i) + Math.cos(elapsed * 0.35 + i * 0.7) * 0.05 * dt;
          if (mx > 29.0) mx = -29.0;
          if (mx < -29.0) mx = 29.0;
          if (my > WATER_LEVEL - 0.4) my = 0.5;
          if (my < 0.3) my = WATER_LEVEL - 0.6;
          mAttr.setXY(i, mx, my);
        }
        mAttr.needsUpdate = true;

        renderer.render(scene, camera);
      }

      animate();
    }

    window.addEventListener('load', () => {
      try {
        initApp();
      } catch (err) {
        console.error('Initialization error:', err);
        const status = document.getElementById('loader-status');
        if (status) {
          status.textContent = `Renderer error: ${err.message}`;
        }
      }
    });
  </script>
</body>
</html>
