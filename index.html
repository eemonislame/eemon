    /**
     * 5-Point Wave-Coupled Buoyancy, Pitch, Roll & Mooring Swing Solver
     */
    function updateFleetPhysics(time, dt) {
      const waveInt = sharedUniforms.uWaveIntensity.value;
      const breeze = sharedUniforms.uBreeze.value;
      const springAlpha = 1.0 - Math.exp(-dt * 9.0);

      vessels.forEach((v, idx) => {
        const swingPhase = time * v.swingFreq * (0.65 + 0.35 * breeze) + v.phase;
        const surgeX = Math.sin(swingPhase) * v.surgeAmpX * (0.45 + 0.55 * breeze);
        const surgeZ = Math.cos(swingPhase * 0.85) * v.surgeAmpZ * (0.45 + 0.55 * breeze);
        const yaw = v.baseYaw + Math.sin(swingPhase * 0.92 + 0.4) * v.swingAmpYaw * (0.4 + 0.6 * breeze);

        const cx = v.baseX + surgeX;
        const cz = v.baseZ + surgeZ;

        const sinY = Math.sin(yaw);
        const cosY = Math.cos(yaw);

        const sampleHullPoint = (lx, lz) => {
          const wx = cx + lx * cosY + lz * sinY;
          const wz = cz - lx * sinY + lz * cosY;
          return evaluateOceanWaveJS(wx, wz, time, waveInt).waterY;
        };

        const spanL = v.halfL * 0.82;
        const spanB = v.halfB * 0.85;

        const hCenter = sampleHullPoint(0, 0);
        const hBow = sampleHullPoint(0, -spanL);
        const hStern = sampleHullPoint(0, spanL);
        const hPort = sampleHullPoint(-spanB, 0);
        const hStarboard = sampleHullPoint(spanB, 0);

        const targetY = (hCenter * 0.36 + (hBow + hStern + hPort + hStarboard) * 0.16) + v.draftOffset;
        const targetPitch = Math.atan2(hBow - hStern, spanL * 2.0) * 0.92;
        const targetRoll = Math.atan2(hPort - hStarboard, spanB * 2.0) * 0.92;

        if (dt === 0) {
          v.currentY = targetY;
          v.currentPitch = targetPitch;
          v.currentRoll = targetRoll;
        } else {
          v.currentY += (targetY - v.currentY) * springAlpha;
          v.currentPitch += (targetPitch - v.currentPitch) * springAlpha;
          v.currentRoll += (targetRoll - v.currentRoll) * springAlpha;
        }

        v.mesh.position.set(cx, v.currentY, cz);
        v.mesh.rotation.order = 'YXZ';
        v.mesh.rotation.y = yaw;
        v.mesh.rotation.x = v.currentPitch;
        v.mesh.rotation.z = v.currentRoll;

        sharedUniforms.uBoats.value[idx].set(cx, cz, v.halfL, v.halfB);
      });

      const sAnim = sloopMesh.userData.sailAnim;
      if (sAnim) {
        sAnim.boomRig.rotation.y = 0.22 + Math.sin(time * 1.15) * 0.055 * breeze;
        const msPos = sAnim.mainSailGeo.attributes.position;
        for (let i = 0; i < msPos.count; i++) {
          const flutter = Math.sin(time * 3.4 - sAnim.msUVu[i] * 5.2 + sAnim.msUVv[i] * 2.4)
            * 0.028 * breeze * sAnim.msUVu[i];
          msPos.setX(i, sAnim.msBaseX[i] * (0.85 + 0.18 * breeze) + flutter);
        }
        msPos.needsUpdate = true;

        const jbPos = sAnim.jibGeo.attributes.position;
        for (let i = 0; i < jbPos.count; i++) {
          const flutter = Math.sin(time * 3.9 - sAnim.jbUVu[i] * 4.8 + sAnim.jbUVv[i] * 2.1)
            * 0.022 * breeze * sAnim.jbUVu[i];
          jbPos.setX(i, sAnim.jbBaseX[i] * (0.85 + 0.18 * breeze) + flutter);
        }
        jbPos.needsUpdate = true;
      }

      const buoyX = -5.5 + Math.sin(time * 0.72) * 0.10;
      const buoyZ = 3.8 + Math.cos(time * 0.64) * 0.10;
      const bWave = evaluateOceanWaveJS(buoyX, buoyZ, time, waveInt);
      const bWaveFwd = evaluateOceanWaveJS(buoyX, buoyZ - 0.2, time, waveInt);
      const bWaveSide = evaluateOceanWaveJS(buoyX + 0.2, buoyZ, time, waveInt);
      buoyMesh.position.set(buoyX, bWave.waterY + 0.02, buoyZ);
      buoyMesh.rotation.set(
        Math.atan2(bWaveFwd.waterY - bWave.waterY, 0.2) * 0.7,
        time * 0.25,
        Math.atan2(bWave.waterY - bWaveSide.waterY, 0.2) * 0.7
      );

      skiffMesh.updateMatrixWorld();
      buoyMesh.updateMatrixWorld();
      sloopMesh.updateMatrixWorld();
      dinghyMesh.updateMatrixWorld();

      const skiffBowWorld = new THREE.Vector3(0, 0.42, -1.68).applyMatrix4(skiffMesh.matrixWorld);
      const buoyRingWorld = new THREE.Vector3(0, 0.26, 0).applyMatrix4(buoyMesh.matrixWorld);
      updateCatenaryRope(skiffRopeGeo, skiffBowWorld, buoyRingWorld, 0.18);

      const dinghyBowWorld = new THREE.Vector3(0, 0.36, -1.11).applyMatrix4(dinghyMesh.matrixWorld);
      const sloopSternWorld = new THREE.Vector3(0, 0.35, 2.30).applyMatrix4(sloopMesh.matrixWorld);
      updateCatenaryRope(dinghyRopeGeo, dinghyBowWorld, sloopSternWorld, 0.24);
    }

    function createCoastalGraniteHeadland() {
      const rockGroup = new THREE.Group();

      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x6b6761,
        roughness: 0.78,
        metalness: 0.04
      });

      rockMat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vRockWorldPos;\nvarying vec3 vRockWorldNorm;')
          .replace(
            '#include <worldpos_vertex>',
            '#include <worldpos_vertex>\nvRockWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvRockWorldNorm = normalize(mat3(modelMatrix) * objectNormal);'
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vRockWorldPos;
            varying vec3 vRockWorldNorm;
            ${GLSL_NOISE_AND_WAVE_COMMON}
            `
          )
          .replace(
            '#include <color_fragment>',
            `
            #include <color_fragment>
            float speckle = valueNoise2D(vRockWorldPos.xz * 28.0 + vRockWorldPos.y * 28.0);
            float strata = fbm2D(vec2(vRockWorldPos.x * 2.5, vRockWorldPos.y * 6.5));
            vec3 graniteBase = mix(vec3(0.42, 0.40, 0.38), vec3(0.62, 0.59, 0.55), strata);
            graniteBase += (speckle - 0.5) * 0.14;

            // Golden-olive coastal lichen on dry upper rock surfaces
            float topMask = smoothstep(0.55, 0.88, vRockWorldNorm.y) * smoothstep(0.45, 0.95, vRockWorldPos.y);
            graniteBase = mix(graniteBase, vec3(0.55, 0.54, 0.34), topMask * 0.42);

            // Dark wet tidal splash zone band below Y = +0.35m
            float wetBand = 1.0 - smoothstep(0.18, 0.42, vRockWorldPos.y);
            graniteBase *= mix(1.0, 0.46, wetBand);

            diffuseColor.rgb = graniteBase;
            `
          )
          .replace(
            '#include <roughnessmap_fragment>',
            `
            #include <roughnessmap_fragment>
            float wetR = 1.0 - smoothstep(0.18, 0.42, vRockWorldPos.y);
            roughnessFactor = mix(0.84, 0.16, wetR);
            `
          );
      };

      const boulders = [
        { x: -12.6, z: -2.2, sx: 2.4, sy: 1.5, sz: 2.1, rot: 0.4 },
        { x: -10.4, z: -1.1, sx: 1.8, sy: 1.1, sz: 1.6, rot: 1.3 },
        { x: -13.4, z:  0.4, sx: 2.1, sy: 1.3, sz: 1.9, rot: 2.2 },
        { x: -11.2, z:  1.4, sx: 1.5, sy: 0.95, sz: 1.4, rot: 0.9 },
        { x: -9.1,  z:  0.3, sx: 1.2, sy: 0.72, sz: 1.1, rot: 3.1 },
        { x: -13.8, z: -4.2, sx: 2.6, sy: 1.7, sz: 2.3, rot: 1.8 },
        { x: -10.8, z: -3.5, sx: 1.7, sy: 1.05, sz: 1.5, rot: 4.2 },
        { x: -8.3,  z:  1.7, sx: 0.95, sy: 0.58, sz: 0.88, rot: 2.6 }
      ];

      boulders.forEach((b, idx) => {
        const geo = new THREE.IcosahedronGeometry(1.0, 3);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const vz = pos.getZ(i);
          const n1 = fbm2D(vx * 2.2 + idx * 3.1, vz * 2.2 + vy * 2.4);
          const ledge = Math.sin(vy * 7.5 + n1 * 3.0) * 0.06;
          const scale = 0.82 + n1 * 0.38 + ledge;
          pos.setXYZ(i, vx * b.sx * scale, vy * b.sy * scale, vz * b.sz * scale);
        }
        geo.computeVertexNormals();

        const mesh = new THREE.Mesh(geo, rockMat);
        const groundY = getBeachHeight(b.x, b.z);
        mesh.position.set(b.x, groundY + b.sy * 0.34, b.z);
        mesh.rotation.y = b.rot;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        rockGroup.add(mesh);
      });

      return rockGroup;
    }

    function createScallopShellGeometry() {
      const geo = new THREE.PlaneGeometry(0.24, 0.22, 26, 16);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = [];

      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) / 0.12;
        const v = (pos.getZ(i) + 0.11) / 0.22;
        const fanWidth = 0.16 + 0.84 * Math.pow(v, 0.72);
        const x = u * 0.125 * fanWidth;
        const rimCurve = Math.sqrt(Math.max(0.0, 1.0 - u * u * 0.82));
        const z = (v * rimCurve - 0.45) * 0.23;
        const dome = Math.sin(v * Math.PI) * (1.0 - u * u * 0.65) * 0.04;
        const flutes = Math.cos(u * Math.PI * 11.0) * 0.007 * smoothstepJS(0.15, 0.95, v);
        pos.setXYZ(i, x, dome + flutes, z);

        const band = 0.5 + 0.5 * Math.sin(v * 22.0 + Math.abs(u) * 3.0);
        colors.push(
          THREE.MathUtils.lerp(0.95, 0.82, band),
          THREE.MathUtils.lerp(0.88, 0.62, band),
          THREE.MathUtils.lerp(0.80, 0.50, band)
        );
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

      ]);
      const trunkGeo = new THREE.TubeGeometry(mainCurve, 48, 0.17, 14, false);
      const tPos = trunkGeo.attributes.position;
      for (let i = 0; i < tPos.count; i++) {
        const vx = tPos.getX(i);
        const vy = tPos.getY(i);
        const vz = tPos.getZ(i);
        const t = THREE.MathUtils.clamp((vx - 4.2) / 4.3, 0.0, 1.0);
        const center = mainCurve.getPointAt(t);
        const taper = 1.18 - 0.58 * t + 0.12 * Math.sin(t * 14.0);
        tPos.setXYZ(
          i,
          center.x + (vx - center.x) * taper,
          center.y + (vy - center.y) * taper,
          center.z + (vz - center.z) * taper
        );
      }
      trunkGeo.computeVertexNormals();
      const trunkMesh = new THREE.Mesh(trunkGeo, woodMat);
      trunkMesh.castShadow = true;
      trunkMesh.receiveShadow = true;
      woodGroup.add(trunkMesh);

      const branchCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(5.9, getBeachHeight(5.9, -3.55) + 0.13, -3.55),
        new THREE.Vector3(6.5, getBeachHeight(6.5, -4.15) + 0.22, -4.15),
        new THREE.Vector3(7.1, getBeachHeight(7.1, -4.60) + 0.12, -4.60)
      ]);
      const branchGeo = new THREE.TubeGeometry(branchCurve, 24, 0.08, 10, false);
      const branchMesh = new THREE.Mesh(branchGeo, woodMat);
      branchMesh.castShadow = true;
      woodGroup.add(branchMesh);

      return woodGroup;
    }
    propsGroup.add(createDriftwoodProp());

    function createStarfishProp(cx, cz) {
      const geo = new THREE.CylinderGeometry(0.28, 0.30, 0.05, 84, 5, false);
      const pos = geo.attributes.position;
      const colors = [];

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const r = Math.hypot(vx, vz);
        const angle = Math.atan2(vz, vx);
        const armWave = Math.cos(angle * 5.0 + 0.35 * Math.sin(angle * 2.0));
        const starRadius = 0.11 + 0.19 * Math.pow(Math.max(0.0, 0.5 + 0.5 * armWave), 1.65);

        const normR = r / 0.29;
        const scaledR = normR * starRadius;
        const nx = Math.cos(angle) * scaledR;
        const nz = Math.sin(angle) * scaledR;

        const spine = Math.max(0.0, armWave) * (1.0 - normR * 0.75);
        const ossicle = (valueNoise2D(nx * 90.0, nz * 90.0) - 0.5) * 0.008;
        const ny = vy > 0 ? (0.014 + (1.0 - normR * 0.82) * 0.036 + spine * 0.018 + ossicle) : -0.004;

        const groundY = getBeachHeight(cx + nx, cz + nz);
        pos.setXYZ(i, cx + nx, groundY + ny, cz + nz);

        const ridgeHighlight = smoothstepJS(0.3, 0.95, spine + ossicle * 18.0);
        colors.push(
          THREE.MathUtils.lerp(0.84, 0.96, ridgeHighlight),
          THREE.MathUtils.lerp(0.34, 0.68, ridgeHighlight),
          THREE.MathUtils.lerp(0.20, 0.52, ridgeHighlight)
        );
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.02 })
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    propsGroup.add(createStarfishProp(-1.8, 1.45));
    propsGroup.add(createStarfishProp(4.8, 1.95));

    function createDuneGrassClusters() {
      const bladeGeo = new THREE.PlaneGeometry(0.030, 0.82, 1, 7);
      bladeGeo.translate(0, 0.41, 0);

      const bPos = bladeGeo.attributes.position;
      const bCols = [];
      for (let i = 0; i < bPos.count; i++) {
        const y = bPos.getY(i);
        const t = y / 0.82;
        const taper = 1.0 - Math.pow(t, 1.35);
        const archZ = Math.pow(t, 2.1) * 0.22;
        bPos.setX(i, bPos.getX(i) * taper);
        bPos.setZ(i, bPos.getZ(i) + archZ);

        bCols.push(
          THREE.MathUtils.lerp(0.34, 0.78, t),
          THREE.MathUtils.lerp(0.44, 0.72, t),
          THREE.MathUtils.lerp(0.24, 0.42, t)
        );
      }
      bladeGeo.setAttribute('color', new THREE.Float32BufferAttribute(bCols, 3));
      bladeGeo.computeVertexNormals();

      const grassMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.68,
        metalness: 0.0,
        side: THREE.DoubleSide
      });

      grassMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uBreeze = sharedUniforms.uBreeze;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform float uBreeze;')
          .replace(
            '#include <begin_vertex>',
            `
            #include <begin_vertex>
            vec4 instWorld = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            float hFactor = clamp(position.y / 0.82, 0.0, 1.0);
            float bend = hFactor * hFactor;
            float breeze = (sin(uTime * 1.85 + instWorld.x * 0.7 + instWorld.z * 0.6) * 0.11
                          + cos(uTime * 3.1 + instWorld.x * 1.9) * 0.035) * uBreeze;
            transformed.x += breeze * bend;
            transformed.z += breeze * 0.55 * bend;
            `
          );
      };

      const tussocks = [
        { cx: -12.2, cz: -9.8, count: 26 },
        { cx: -8.8,  cz: -10.4, count: 28 },
        { cx: -5.2,  cz: -9.5, count: 24 },
        { cx: -1.6,  cz: -10.8, count: 26 },
        { cx:  2.4,  cz: -9.6, count: 28 },
        { cx:  6.2,  cz: -10.5, count: 26 },
        { cx:  9.8,  cz: -9.2, count: 24 },
        { cx: 12.8,  cz: -10.4, count: 24 },
        { cx: -6.8,  cz: -7.4, count: 20 },
        { cx:  4.5,  cz: -7.1, count: 20 },
        { cx: 11.2,  cz: -6.8, count: 18 }
      ];

      const totalBlades = tussocks.reduce((acc, t) => acc + t.count, 0);
      const grassInstanced = new THREE.InstancedMesh(bladeGeo, grassMat, totalBlades);
      grassInstanced.castShadow = true;
      grassInstanced.receiveShadow = true;

      let idx = 0;
      tussocks.forEach((tussock, tIdx) => {
        for (let i = 0; i < tussock.count; i++) {
          const angle = hash21(tIdx * 13.7 + i, 2.1) * Math.PI * 2;
          const radius = Math.sqrt(hash21(tIdx * 5.3 + i, 8.4)) * 0.65;
          const gx = THREE.MathUtils.clamp(tussock.cx + Math.cos(angle) * radius, -14.6, 14.6);
          const gz = THREE.MathUtils.clamp(tussock.cz + Math.sin(angle) * radius, -11.6, -5.8);
          const gy = getBeachHeight(gx, gz);

          dummy.position.set(gx, gy - 0.02, gz);
          dummy.rotation.set(
            (hash21(idx, 3.1) - 0.5) * 0.25,
            angle + (hash21(idx, 6.7) - 0.5) * 0.8,
            (hash21(idx, 9.4) - 0.5) * 0.25
          );
          const scaleY = 0.65 + hash21(idx, 1.5) * 0.68;
          dummy.scale.set(1.0, scaleY, 1.0);
          dummy.updateMatrix();
          grassInstanced.setMatrixAt(idx++, dummy.matrix);
        }
      });

      grassInstanced.instanceMatrix.needsUpdate = true;
      return grassInstanced;
    }
    propsGroup.add(createDuneGrassClusters());

    // =========================================================================
    // 10. UI STUDIO CONTROLS, CAMERA PRESETS & RESIZE HANDLING
    // =========================================================================
    let isPlaying = true;
    let simTime = 1.6;
    let activePresetTransition = null;

    const sunSlider = document.getElementById('sun-slider');
    const sunVal = document.getElementById('sun-val');
    const waveSlider = document.getElementById('wave-slider');
    const waveVal = document.getElementById('wave-val');
    const claritySlider = document.getElementById('clarity-slider');
    const clarityVal = document.getElementById('clarity-val');
    const breezeSlider = document.getElementById('breeze-slider');
    const breezeVal = document.getElementById('breeze-val');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseLabel = document.getElementById('play-pause-label');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const resetBtn = document.getElementById('reset-btn');
    const togglePanelBtn = document.getElementById('toggle-panel-btn');
    const uiBody = document.getElementById('ui-body');
    const chevronIcon = document.getElementById('chevron-icon');
    const presetButtons = document.querySelectorAll('.preset-btn');

    function formatSunLabel(deg) {
      if (deg <= 14) return `${deg}° (Golden Hour)`;
      if (deg <= 23) return `${deg}° (Warm Morning)`;
      if (deg <= 42) return `${deg}° (Afternoon)`;
      return `${deg}° (High Noon)`;
    }

    function formatClarityLabel(val) {
      if (val <= 0.7) return `${val.toFixed(2)}× (Emerald)`;
      if (val <= 1.25) return `${val.toFixed(2)}× (Crystal)`;
      return `${val.toFixed(2)}× (Ultra-Clear)`;
    }

    updateSunAndEnvironment(parseFloat(sunSlider.value));
    sunVal.textContent = formatSunLabel(parseFloat(sunSlider.value));

    sunSlider.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      sunVal.textContent = formatSunLabel(deg);
      updateSunAndEnvironment(deg);
    });

    waveSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sharedUniforms.uWaveIntensity.value = val;
      waveVal.textContent = `${val.toFixed(2)}×`;
    });

    claritySlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sharedUniforms.uWaterClarity.value = val;
      clarityVal.textContent = formatClarityLabel(val);
    });

    breezeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sharedUniforms.uBreeze.value = val;
      breezeVal.textContent = `${val.toFixed(2)}×`;
    });

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseLabel.textContent = isPlaying ? 'Pause Ocean' : 'Resume Ocean';
      playIcon.classList.toggle('hidden', isPlaying);
      pauseIcon.classList.toggle('hidden', !isPlaying);
    });

    function triggerCameraPreset(presetKey) {
      const preset = CAMERA_PRESETS[presetKey];
      if (!preset) return;

      presetButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === presetKey);
      });

      activePresetTransition = {
        startPos: camera.position.clone(),
        endPos: preset.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: preset.target.clone(),
        progress: 0.0
      };
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        triggerCameraPreset(btn.dataset.preset);
      });
    });

    resetBtn.addEventListener('click', () => {
      triggerCameraPreset('hero');
    });

    controls.addEventListener('start', () => {
      activePresetTransition = null;
    });

    let panelCollapsed = false;
    togglePanelBtn.addEventListener('click', () => {
      panelCollapsed = !panelCollapsed;
      uiBody.classList.toggle('hidden', panelCollapsed);
      chevronIcon.style.transform = panelCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      renderer.getDrawingBufferSize(rtSize);
      refractionRT.setSize(Math.max(1, Math.floor(rtSize.x)), Math.max(1, Math.floor(rtSize.y)));
      sharedUniforms.uResolution.value.copy(rtSize);
    }
    window.addEventListener('resize', handleResize);

    // Initialize boat poses at t = simTime before first frame
    updateFleetPhysics(simTime, 0);

    // =========================================================================
    // 11. TWO-PASS REFRACTION RENDER LOOP (SEABED + SUBMERGED BOAT HULLS)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      if (isPlaying) {
        simTime += dt;
        sharedUniforms.uTime.value = simTime;
        updateFleetPhysics(simTime, dt);
      }

      if (activePresetTransition) {
        activePresetTransition.progress = Math.min(1.0, activePresetTransition.progress + dt * 1.45);
        const t = activePresetTransition.progress;
        const ease = 1.0 - Math.pow(1.0 - t, 3.0);

        camera.position.lerpVectors(activePresetTransition.startPos, activePresetTransition.endPos, ease);
        controls.target.lerpVectors(activePresetTransition.startTarget, activePresetTransition.endTarget, ease);

        if (t >= 1.0) {
          activePresetTransition = null;
        }
      }

      controls.update();

      // Pass 1: Render stationary seabed (with caustics), granite headland, strata walls,
      // AND submerged boat hulls/keels/rudders into refractionRT
      waterTopMesh.visible = false;
      waterWallsGroup.visible = false;
      renderer.setRenderTarget(refractionRT);
      renderer.clear();
      renderer.render(scene, camera);

      // Pass 2: Render complete diorama with refractive water surface & dynamic cross-section water walls
      waterTopMesh.visible = true;
      waterWallsGroup.visible = true;
      renderer.setRenderTarget(null);
      renderer.render(scene, camera);
    }

    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 150);
      animate();
    });
  </script>
</body>
