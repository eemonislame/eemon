  <style>

  <!-- Loading Overlay -->
  <div id="loader" class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-[#090e17] transition-opacity duration-500">
    <div class="w-11 h-11 rounded-full border-2 border-sky-400/30 border-t-sky-400 animate-spin mb-3"></div>
    <p class="text-xs tracking-widest uppercase text-slate-300">Crafting Panoramic Coastal Diorama…</p>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    // =========================================================================
    // 1. EXPANDED PANORAMIC DIORAMA CONSTANTS (30m × 24m) & NOISE HELPERS
    // =========================================================================
    const DIORAMA_W = 30.0;              // Width X: -15m to +15m
    const DIORAMA_D = 24.0;              // Depth Z: -12m to +12m
    const HALF_W = DIORAMA_W / 2.0;      // 15.0m
    const HALF_D = DIORAMA_D / 2.0;      // 12.0m
    const BASE_Y = -4.60;                // Geological strata base elevation
    const SEG_X = 260;                   // High-density terrain & water X segments
    const SEG_Z = 220;                   // High-density terrain & water Z segments

    function fract(x) {
      return x - Math.floor(x);
    }

    function smoothstepJS(edge0, edge1, x) {
      const t = Math.max(0.0, Math.min(1.0, (x - edge0) / (edge1 - edge0)));
      return t * t * (3.0 - 2.0 * t);
    }

    function hash21(x, y) {
      let px = fract(x * 0.1031);
      let py = fract(y * 0.1030);
      let pz = fract(x * 0.0973);
      const d = px * (py + 33.33) + py * (pz + 33.33) + pz * (px + 33.33);
      px += d;
      py += d;
      pz += d;
      return fract((px + py) * pz);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);

      const a = hash21(ix, iy);
      const b = hash21(ix + 1, iy);
      const c = hash21(ix, iy + 1);
      const d = hash21(ix + 1, iy + 1);

      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y) {
      let v = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < 4; i++) {
        v += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return v;
    }

    /**
     * 100% STATIC COASTAL TOPOGRAPHY: y = getBeachHeight(x, z)
     * - z = -12 to -5: Rolling coastal dunes (+1.2m to +2.15m)
     * - x = -15 to -8.5: Rocky granite headland shelf
     * - x = -7 to +2: Sheltered crescentic sandy cove
     * - z = -3.2 to +1.2: Broad golden-amber foreshore swash slope
     * - z = +1.2 to +12.0: Sculpted turquoise ocean basin (-0.2m down to -3.35m) with offshore sandbar
     * Exact mathematical twin of GLSL getSandElevation(vec2 xz) so seabed never moves or drifts.
     */
    function getBeachHeight(x, z) {
      // Crescentic cove shoreline contour along X
      const coveCurve = Math.sin((x + 1.5) * 0.22) * 1.15 - Math.cos(x * 0.12) * 0.45;
      // Left headland promontory jutting seaward around x = -12.5
      const headlandPromontory = Math.exp(-Math.pow((x + 12.6) / 3.4, 2.0)) * 1.45;
      const effectiveZ = z + coveCurve - headlandPromontory;

      // Normalized cross-shore parameter t in [0, 1]
      const t = (effectiveZ + HALF_D) / DIORAMA_D;

      // Rolling upper coastal sand dunes (t < 0.34)
      const duneProfile = Math.pow(Math.max(0.0, 1.0 - t * 2.55), 1.95) * 1.25;
      const duneRidge = Math.exp(-Math.pow((t - 0.14) / 0.11, 2.0)) * (0.28 + 0.18 * Math.sin(x * 0.38 + 0.7));

      // Foreshore slope transitioning smoothly into deep offshore ocean basin
      const basinSlope = 1.02 - 4.35 * t + 0.24 * Math.sin(t * Math.PI * 2.0);

      // Subtle offshore submerged sandbar around t = 0.68 (z ≈ +4.2m) & deeper tidal channel around t = 0.84
      const offshoreBar = Math.exp(-Math.pow((t - 0.67) / 0.085, 2.0)) * 0.24;
      const tidalChannel = -Math.exp(-Math.pow((t - 0.84) / 0.11, 2.0)) * 0.22;

      let h = duneProfile + duneRidge + basinSlope + offshoreBar + tidalChannel;

      // Rocky headland shelf elevation boost on far left (x < -8.5)
      const headlandShelf = smoothstepJS(-8.2, -13.5, x) * Math.exp(-Math.pow((z + 1.8) / 5.2, 2.0)) * 0.85;
      h += headlandShelf;

      // Rhythmic crescentic beach cusps along the intertidal swash zone
      const cuspEnv = Math.exp(-Math.pow((effectiveZ + 1.6) / 2.2, 2.0)) * smoothstepJS(-9.5, -5.5, x);
      const beachCusps = Math.cos(x * 1.15 + 0.4) * 0.065 * cuspEnv;
      h += beachCusps;

      // Organic macro terrain undulations
      const macroNoise = (fbm2D(x * 0.18 + 3.7, z * 0.18 + 2.1) - 0.5) * 0.28;
      h += macroNoise * (0.35 + 0.65 * Math.abs(t - 0.44));

      // Wind-sculpted asymmetric sand ripples on the dry upper berm & dunes (h > 0.42)
      const dryMask = smoothstepJS(0.38, 0.78, h);
      const windPhase = (z * 4.4 + x * 1.25) + fbm2D(x * 0.75, z * 0.75) * 2.4;
      const windRipples = (Math.sin(windPhase) + 0.32 * Math.sin(windPhase * 2.0)) * 0.016 * dryMask;

      // Stationary wave-carved oscillatory sand ripples baked into the submerged seabed (h < 0.06)
      const subMask = smoothstepJS(0.08, -0.32, h);
      const seabedRipplePhase = (effectiveZ * 6.4 + Math.sin(x * 0.65) * 1.2) + fbm2D(x * 0.55, z * 0.55) * 1.8;
      const seabedRipples = Math.sin(seabedRipplePhase) * 0.022 * subMask;

      return h + windRipples + seabedRipples;
    }

    // =========================================================================
    // 2. EXACT SHARED GERSTNER WAVE + SWASH PHYSICS (JS & GLSL IDENTICAL)
    // =========================================================================
    function gerstnerWaveJS(x, z, dirX, dirZ, steepness, wavelength, speed, time) {
      const k = (Math.PI * 2.0) / wavelength;
      const c = Math.sqrt(9.81 / k) * speed;
      const len = Math.hypot(dirX, dirZ);
      const dx = dirX / len;
      const dz = dirZ / len;
      const f = k * (dx * x + dz * z - c * time);
      const a = steepness / k;
      return {
        x: dx * (a * Math.cos(f)),
        y: a * Math.sin(f),
        z: dz * (a * Math.cos(f))
      };
    }

    /**
     * Exact JS counterpart of GLSL evaluateOceanWave(baseXZ, sandY, time, intensity)
     * Used by the 5-point boat buoyancy & swing physics solver so every vessel
     * pitches, rolls, heaves, and swings synchronously with the rendered 3D waves.
     */
    function evaluateOceanWaveJS(x, z, time, intensity) {
      const sandY = getBeachHeight(x, z);
      const clampedInt = Math.max(0.15, Math.min(2.0, intensity));

      // Swash run-up envelope along the sloping beach face
      const waveSet = 0.5 + 0.5 * Math.sin(time * 0.52 + x * 0.09);
      const lateralPhase = x * 0.11 + Math.sin(x * 0.34) * 0.25 + Math.cos(x * 0.72) * 0.09;
      const primaryPhase = time * 1.58 + lateralPhase;

      const asymPhase = primaryPhase - 0.56 * Math.sin(primaryPhase);
      const swashOsc = 0.5 + 0.5 * Math.sin(asymPhase);
      const swashVel = Math.cos(asymPhase) * (1.0 - 0.56 * Math.cos(primaryPhase));

      const baseWaterLevel = -0.05;
      const maxRunupReach = (0.34 + 0.28 * waveSet) * (0.45 + 0.55 * clampedInt);
      const currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

      // 6 multi-directional Gerstner swells traveling shoreward (-Z)
      const g1 = gerstnerWaveJS(x, z, -0.14, -0.990, 0.22 * clampedInt, 7.6, 0.90, time);
      const g2 = gerstnerWaveJS(x, z,  0.21, -0.978, 0.17 * clampedInt, 5.2, 0.94, time);
      const g3 = gerstnerWaveJS(x, z, -0.09, -0.996, 0.13 * clampedInt, 3.6, 0.98, time);
      const g4 = gerstnerWaveJS(x, z,  0.28, -0.960, 0.10 * clampedInt, 2.4, 1.03, time);
      const g5 = gerstnerWaveJS(x, z, -0.24, -0.971, 0.07 * clampedInt, 1.55, 1.07, time);
      const g6 = gerstnerWaveJS(x, z,  0.12, -0.993, 0.05 * clampedInt, 1.02, 1.12, time);

      const sumX = g1.x + g2.x + g3.x + g4.x + g5.x + g6.x;
      const sumY = g1.y + g2.y + g3.y + g4.y + g5.y + g6.y;
      const sumZ = g1.z + g2.z + g3.z + g4.z + g5.z + g6.z;

      const deepOceanMask = smoothstepJS(0.18, -0.55, sandY);
      const shoalBoost = 1.0 + 0.26 * Math.exp(-Math.pow((sandY + 0.35) / 0.30, 2.0));

      const borderLockX = smoothstepJS(HALF_W, HALF_W - 0.65, Math.abs(x));
      const borderLockZ = smoothstepJS(HALF_D, HALF_D - 0.65, Math.abs(z));
      const horizMask = deepOceanMask * borderLockX * borderLockZ;

      const swellVertical = sumY * deepOceanMask * shoalBoost;
      const swashSheetThickness = Math.max(0.0, currentSwashY - sandY);
      const boreLip = smoothstepJS(0.0, 0.12, swashSheetThickness) * (1.0 - smoothstepJS(0.12, 0.38, swashSheetThickness)) * 0.020 * clampedInt;

      const shoreBlend = smoothstepJS(-0.22, 0.14, sandY);
      const targetWaterY = (baseWaterLevel + swellVertical) * (1.0 - shoreBlend) + (currentSwashY + boreLip) * shoreBlend;
      const depth = targetWaterY - sandY;

      return {
        displacedX: x + sumX * horizMask * shoalBoost,
        displacedY: depth > 0.0 ? targetWaterY : sandY - 0.03,
        displacedZ: z + sumZ * horizMask * shoalBoost,
        waterY: targetWaterY,
        sandY,
        depth,
        swashVelocity: swashVel
      };
    }

    // Shared GLSL Noise, Static Topography & Wave Evaluation Chunk
    const GLSL_NOISE_AND_WAVE_COMMON = /* glsl */ `
      float hash21(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      float valueNoise2D(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1.0, 0.0));
        float c = hash21(i + vec2(0.0, 1.0));
        float d = hash21(i + vec2(1.0, 1.0));
        return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      float fbm2D(vec2 p) {
        float v = 0.0;
        float amp = 0.5;
        float freq = 1.0;
        for (int i = 0; i < 4; i++) {
          v += amp * valueNoise2D(p * freq);
          freq *= 2.03;
          amp *= 0.5;
        }
        return v;
      }

      // 100% STATIC GLSL twin of CPU getBeachHeight(x, z) — zero time dependence
      float getSandElevation(vec2 xz) {
        float x = xz.x;
        float z = xz.y;

        float coveCurve = sin((x + 1.5) * 0.22) * 1.15 - cos(x * 0.12) * 0.45;
        float headlandPromontory = exp(-pow((x + 12.6) / 3.4, 2.0)) * 1.45;
        float effectiveZ = z + coveCurve - headlandPromontory;

        float t = (effectiveZ + 12.0) / 24.0;

        float duneProfile = pow(max(0.0, 1.0 - t * 2.55), 1.95) * 1.25;
        float duneRidge = exp(-pow((t - 0.14) / 0.11, 2.0)) * (0.28 + 0.18 * sin(x * 0.38 + 0.7));
        float basinSlope = 1.02 - 4.35 * t + 0.24 * sin(t * 6.2831853);
        float offshoreBar = exp(-pow((t - 0.67) / 0.085, 2.0)) * 0.24;
        float tidalChannel = -exp(-pow((t - 0.84) / 0.11, 2.0)) * 0.22;

        float h = duneProfile + duneRidge + basinSlope + offshoreBar + tidalChannel;

        float headlandShelf = smoothstep(-8.2, -13.5, x) * exp(-pow((z + 1.8) / 5.2, 2.0)) * 0.85;
        h += headlandShelf;

        float cuspEnv = exp(-pow((effectiveZ + 1.6) / 2.2, 2.0)) * smoothstep(-9.5, -5.5, x);
        float beachCusps = cos(x * 1.15 + 0.4) * 0.065 * cuspEnv;
        h += beachCusps;

        float macroNoise = (fbm2D(vec2(x * 0.18 + 3.7, z * 0.18 + 2.1)) - 0.5) * 0.28;
        h += macroNoise * (0.35 + 0.65 * abs(t - 0.44));

        float dryMask = smoothstep(0.38, 0.78, h);
        float windPhase = (z * 4.4 + x * 1.25) + fbm2D(vec2(x * 0.75, z * 0.75)) * 2.4;
        float windRipples = (sin(windPhase) + 0.32 * sin(windPhase * 2.0)) * 0.016 * dryMask;

        float subMask = smoothstep(0.08, -0.32, h);
        float seabedRipplePhase = (effectiveZ * 6.4 + sin(x * 0.65) * 1.2) + fbm2D(vec2(x * 0.55, z * 0.55)) * 1.8;
        float seabedRipples = sin(seabedRipplePhase) * 0.022 * subMask;

        return h + windRipples + seabedRipples;
      }

      vec3 gerstnerWave(vec2 pos, vec2 dir, float steepness, float wavelength, float speed, float time) {
        float k = 6.2831853 / wavelength;
        float c = sqrt(9.81 / k) * speed;
        vec2 d = normalize(dir);
        float f = k * (dot(d, pos) - c * time);
        float a = steepness / k;
        return vec3(
          d.x * (a * cos(f)),
          a * sin(f),
          d.y * (a * cos(f))
        );
      }

      struct WaveState {
        vec3 displacedPos;
        float waterY;
        float depth;
        float swashVelocity;
        float crestFactor;
        float maxRunupY;
      };

      WaveState evaluateOceanWave(vec2 baseXZ, float sandY, float time, float intensity) {
        WaveState ws;
        float x = baseXZ.x;
        float z = baseXZ.y;

        float waveSet = 0.5 + 0.5 * sin(time * 0.52 + x * 0.09);
        float lateralPhase = x * 0.11 + sin(x * 0.34) * 0.25 + cos(x * 0.72) * 0.09;
        float primaryPhase = time * 1.58 + lateralPhase;

        float asymPhase = primaryPhase - 0.56 * sin(primaryPhase);
        float swashOsc = 0.5 + 0.5 * sin(asymPhase);
        float swashVel = cos(asymPhase) * (1.0 - 0.56 * cos(primaryPhase));

        float clampedInt = clamp(intensity, 0.15, 2.0);
        float baseWaterLevel = -0.05;
        float maxRunupReach = mix(0.34, 0.62, waveSet) * (0.45 + 0.55 * clampedInt);
        float currentSwashY = baseWaterLevel + swashOsc * maxRunupReach;

        float grainEdge = (fbm2D(vec2(x * 1.3, z * 1.3)) - 0.5) * 0.06;
        ws.maxRunupY = baseWaterLevel + maxRunupReach + 0.10 + grainEdge;

        vec3 g1 = gerstnerWave(baseXZ, vec2(-0.14, -0.990), 0.22 * clampedInt, 7.6, 0.90, time);
        vec3 g2 = gerstnerWave(baseXZ, vec2( 0.21, -0.978), 0.17 * clampedInt, 5.2, 0.94, time);
        vec3 g3 = gerstnerWave(baseXZ, vec2(-0.09, -0.996), 0.13 * clampedInt, 3.6, 0.98, time);
        vec3 g4 = gerstnerWave(baseXZ, vec2( 0.28, -0.960), 0.10 * clampedInt, 2.4, 1.03, time);
        vec3 g5 = gerstnerWave(baseXZ, vec2(-0.24, -0.971), 0.07 * clampedInt, 1.55, 1.07, time);
        vec3 g6 = gerstnerWave(baseXZ, vec2( 0.12, -0.993), 0.05 * clampedInt, 1.02, 1.12, time);

        vec3 gerstnerSum = g1 + g2 + g3 + g4 + g5 + g6;

        float deepOceanMask = smoothstep(0.18, -0.55, sandY);
        float shoalBoost = 1.0 + 0.26 * exp(-pow((sandY + 0.35) / 0.30, 2.0));

        float borderLockX = smoothstep(15.0, 14.35, abs(x));
        float borderLockZ = smoothstep(12.0, 11.35, abs(z));
        float horizMask = deepOceanMask * borderLockX * borderLockZ;

        vec2 horizOffset = gerstnerSum.xz * horizMask * shoalBoost;
        float swellVertical = gerstnerSum.y * deepOceanMask * shoalBoost;

        float swashSheetThickness = max(0.0, currentSwashY - sandY);
        float boreLip = smoothstep(0.0, 0.12, swashSheetThickness) * (1.0 - smoothstep(0.12, 0.38, swashSheetThickness)) * 0.020 * clampedInt;

        float shoreBlend = smoothstep(-0.22, 0.14, sandY);
        float targetWaterY = mix(baseWaterLevel + swellVertical, currentSwashY + boreLip, shoreBlend);

        float depth = targetWaterY - sandY;
        ws.depth = depth;
        ws.swashVelocity = swashVel;
        ws.crestFactor = clamp((swellVertical * shoalBoost) / (0.22 * clampedInt + 0.001), 0.0, 1.45);

        if (depth > 0.0) {
          ws.waterY = targetWaterY;
        } else {
          ws.waterY = sandY - 0.03;
        }

        ws.displacedPos = vec3(x + horizOffset.x, ws.waterY, z + horizOffset.y);
        return ws;
      }
    `;

    // =========================================================================
    // 3. INITIALIZE RENDERER, SCENE, CAMERA, SKY & PMREM ENVIRONMENT
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({

    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.15, 220);
    const controls = new OrbitControls(camera, renderer.domElement);

    // 5 Panoramic Studio Camera Presets
    const CAMERA_PRESETS = {

    camera.position.copy(CAMERA_PRESETS.hero.pos);
    controls.target.copy(CAMERA_PRESETS.hero.target);

    // Offscreen Render Target for True Optical Refraction (includes seabed + submerged boat hulls/keels)
    const rtSize = new THREE.Vector2();
    renderer.getDrawingBufferSize(rtSize);
    const refractionRT = new THREE.WebGLRenderTarget(
      Math.max(1, Math.floor(rtSize.x)),

    // Procedural Sky & PMREM Environment Map Generator
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const sky = new Sky();
    sky.scale.setScalar(4500);
    const skyUniforms = sky.material.uniforms;
    skyUniforms['turbidity'].value = 6.2;
    skyUniforms['rayleigh'].value = 1.85;
    skyUniforms['mieCoefficient'].value = 0.0045;
    skyUniforms['mieDirectionalG'].value = 0.82;

    const skyScene = new THREE.Scene();
    skyScene.add(sky);

    // Three-point Coastal Sunlight + Sky Bounce Rig
    const sunLight = new THREE.DirectionalLight(0xfff5e4, 3.45);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 4.0;
    sunLight.shadow.camera.far = 68.0;
    const shadowExtent = 19.5;
    sunLight.shadow.camera.left = -shadowExtent;
    sunLight.shadow.camera.right = shadowExtent;
    sunLight.shadow.camera.top = shadowExtent;
    sunLight.shadow.camera.bottom = -shadowExtent;
    sunLight.shadow.bias = -0.00045;
    sunLight.shadow.normalBias = 0.022;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x9ed4ff, 0x8d7456, 0.74);

    const rimFillLight = new THREE.DirectionalLight(0x7cc4fa, 0.58);

    const sunDirection = new THREE.Vector3();
    const sunColor = new THREE.Color();
    let currentEnvRT = null;

    function updateSunAndEnvironment(elevationDeg) {
      const azimuthDeg = 134;
      const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
      const theta = THREE.MathUtils.degToRad(azimuthDeg);

      sunDirection.setFromSphericalCoords(1, phi, theta).normalize();
      skyUniforms['sunPosition'].value.copy(sunDirection);

      const goldenFactor = 1.0 - THREE.MathUtils.smoothstep(elevationDeg, 6.0, 32.0);
      skyUniforms['turbidity'].value = THREE.MathUtils.lerp(5.2, 11.8, goldenFactor);
      skyUniforms['rayleigh'].value = THREE.MathUtils.lerp(1.6, 2.75, goldenFactor);

      scene.environmentIntensity = 0.94;

      sunLight.position.copy(sunDirection).multiplyScalar(32.0);
      sunColor.setHSL(
        THREE.MathUtils.lerp(0.11, 0.068, goldenFactor),
        THREE.MathUtils.lerp(0.22, 0.85, goldenFactor),
        THREE.MathUtils.lerp(0.97, 0.78, goldenFactor)
      );
      sunLight.color.copy(sunColor);
      sunLight.intensity = THREE.MathUtils.lerp(3.55, 2.85, goldenFactor);
      hemiLight.intensity = THREE.MathUtils.lerp(0.78, 0.52, goldenFactor);
    }

    // Shared Uniforms across Sand, Water Top, Water Side-Walls & Boats
    const sharedUniforms = {
      uTime: { value: 0.0 },
      uWaveIntensity: { value: 1.0 },
      uWaterClarity: { value: 1.15 },
      uBreeze: { value: 1.0 },
      uSunDir: { value: sunDirection },

      uRefractionMap: { value: refractionRT.texture },
      uResolution: { value: new THREE.Vector2(rtSize.x, rtSize.y) },
      // Boat hull footprints (x, z, halfLength, halfBeam) for waterline foam & concentric ripples
      uBoats: {
        value: [
          new THREE.Vector4(3.2, 6.2, 2.35, 0.74),
          new THREE.Vector4(-4.2, 4.6, 1.72, 0.58),
          new THREE.Vector4(6.5, 7.5, 1.12, 0.44)
        ]
      }
    };

    // =========================================================================
    // 4. 100% STATIONARY SAND TERRAIN MESH (DYNAMIC WET-SHEEN & CAUSTICS)
    // =========================================================================
    const sandGeo = new THREE.PlaneGeometry(DIORAMA_W, DIORAMA_D, SEG_X, SEG_Z);
    sandGeo.rotateX(-Math.PI / 2);

    const sandPos = sandGeo.attributes.position;
    for (let i = 0; i < sandPos.count; i++) {
      const x = sandPos.getX(i);
      const z = sandPos.getZ(i);
      sandPos.setY(i, getBeachHeight(x, z));
    }
    sandGeo.computeVertexNormals();

    const sandMaterial = new THREE.MeshStandardMaterial({
      color: 0xe7d0a7,
      roughness: 0.85,
      metalness: 0.02,
      envMapIntensity: 1.05
    });

    sandMaterial.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = sharedUniforms.uTime;
      shader.uniforms.uWaveIntensity = sharedUniforms.uWaveIntensity;
      shader.uniforms.uSunDir = sharedUniforms.uSunDir;
      shader.uniforms.uSunColor = sharedUniforms.uSunColor;

      shader.vertexShader = shader.vertexShader
        .replace(
          '#include <common>',
          `
          #include <common>
          varying vec3 vCustomWorldPos;
          `
        )
        .replace(
          '#include <worldpos_vertex>',
          `
          #include <worldpos_vertex>
          vCustomWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
          `
        );

      shader.fragmentShader = shader.fragmentShader
        .replace(
          '#include <common>',
          `
          #include <common>
          uniform float uTime;
          uniform float uWaveIntensity;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          varying vec3 vCustomWorldPos;
          ${GLSL_NOISE_AND_WAVE_COMMON}

          float causticPattern(vec2 uv, float t) {
            vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
            vec2 i = p;
            float c = 1.0;
            float inten = 0.005;
            for (int n = 0; n < 3; n++) {
              float timeStep = t * (1.0 - (3.5 / float(n + 1)));
              i = p + vec2(
                cos(timeStep - i.x) + sin(timeStep + i.y),
                sin(timeStep - i.y) + cos(timeStep + i.x)
              );
              c += 1.0 / length(vec2(
                p.x / (sin(i.x + timeStep) / inten),
                p.y / (cos(i.y + timeStep) / inten)
              ));
            }
            c /= 3.0;
            c = 1.17 - pow(c, 1.4);
            return pow(abs(c), 7.5);
          }
          `
        )
        .replace(
          '#include <color_fragment>',
          `
          #include <color_fragment>
          // Strictly static world-space sand grain & shell coordinates (zero time drift)
          vec2 xz = vCustomWorldPos.xz;
          float sandY = vCustomWorldPos.y;
          WaveState ws = evaluateOceanWave(xz, sandY, uTime, uWaveIntensity);

          float grainFine = valueNoise2D(xz * 95.0);
          float grainMed = valueNoise2D(xz * 26.0);
          float macroTone = fbm2D(xz * 0.45 + 2.3);
          float shellFleck = smoothstep(0.91, 0.985, valueNoise2D(xz * 62.0 + 7.1));

          // Slightly rockier mineral tone near the left granite headland (x < -9.5)
          float headlandTint = smoothstep(-8.5, -13.5, xz.x);

          vec3 drySandCol = mix(vec3(0.87, 0.76, 0.57), vec3(0.95, 0.87, 0.71), macroTone);
          drySandCol = mix(drySandCol, vec3(0.68, 0.62, 0.54), headlandTint * 0.45);
          drySandCol += (grainFine - 0.5) * 0.065 + (grainMed - 0.5) * 0.045;
          drySandCol = mix(drySandCol, vec3(0.98, 0.95, 0.90), shellFleck * 0.45);

          // Rich dark golden-amber wet sand
          vec3 wetSandCol = drySandCol * vec3(0.45, 0.40, 0.34);

          float wetness = 1.0 - smoothstep(ws.maxRunupY - 0.16, ws.maxRunupY + 0.02, sandY);
          wetness = max(wetness, smoothstep(-0.005, 0.015, ws.depth));

          diffuseColor.rgb = mix(drySandCol, wetSandCol, wetness);

          // Sunlit quartz micro-sparkles on dry sand
          vec3 viewDirW = normalize(cameraPosition - vCustomWorldPos);
          vec3 halfVec = normalize(uSunDir + viewDirW);
          float sparkleNoise = hash21(floor(xz * 240.0));
          float sparkleAngle = pow(max(dot(normalize(vec3((grainFine - 0.5) * 1.4, 1.0, (grainMed - 0.5) * 1.4)), halfVec), 0.0), 48.0);
          float drySparkle = step(0.965, sparkleNoise) * sparkleAngle * (1.0 - wetness) * 1.85;
          diffuseColor.rgb += uSunColor * drySparkle;

          // Animated underwater solar caustics projected onto the stationary seabed
          if (ws.depth > 0.004) {
            vec3 refractedSun = refract(-normalize(uSunDir), vec3(0.0, 1.0, 0.0), 0.75);
            vec2 causticUV = xz * 0.36 + refractedSun.xz * ws.depth * 0.75;
            float c1 = causticPattern(causticUV, uTime * 1.05);
            float c2 = causticPattern(causticUV * 1.38 + vec2(1.7, -2.3), -uTime * 0.82);
            float caustics = (c1 * 0.65 + c2 * 0.45);

            float depthFade = smoothstep(0.005, 0.10, ws.depth) * exp(-ws.depth * 0.42);
            vec3 causticTint = uSunColor * vec3(0.86, 1.06, 1.14);
            diffuseColor.rgb += causticTint * caustics * depthFade * 0.82;
          }
          `
        )
        .replace(
          '#include <roughnessmap_fragment>',
          `
          #include <roughnessmap_fragment>
          vec2 xzR = vCustomWorldPos.xz;
          float sandYR = vCustomWorldPos.y;
          WaveState wsR = evaluateOceanWave(xzR, sandYR, uTime, uWaveIntensity);
          float wetnessR = 1.0 - smoothstep(wsR.maxRunupY - 0.16, wsR.maxRunupY + 0.02, sandYR);
          wetnessR = max(wetnessR, smoothstep(-0.005, 0.015, wsR.depth));
          float microRough = (valueNoise2D(xzR * 80.0) - 0.5) * 0.055;
          roughnessFactor = clamp(mix(0.88, 0.09, pow(wetnessR, 1.25)) + microRough, 0.05, 0.96);
          `
        )
        .replace(
          '#include <normal_fragment_maps>',
          `
          #include <normal_fragment_maps>
          vec2 gUV = vCustomWorldPos.xz * 115.0;
          float gH = valueNoise2D(gUV);
          float gHx = valueNoise2D(gUV + vec2(0.15, 0.0));
          float gHz = valueNoise2D(gUV + vec2(0.0, 0.15));
          WaveState wsN = evaluateOceanWave(vCustomWorldPos.xz, vCustomWorldPos.y, uTime, uWaveIntensity);
          float wetN = 1.0 - smoothstep(wsN.maxRunupY - 0.14, wsN.maxRunupY + 0.02, vCustomWorldPos.y);
          float grainStrength = mix(0.14, 0.016, wetN);
          vec3 grainPerturb = normalize(vec3((gH - gHx) * grainStrength, 1.0, (gH - gHz) * grainStrength));
          normal = normalize(normal + (viewMatrix * vec4(grainPerturb.x, 0.0, grainPerturb.z, 0.0)).xyz);
          `
        );
    };

    const sandMesh = new THREE.Mesh(sandGeo, sandMaterial);
    sandMesh.receiveShadow = true;
    sandMesh.castShadow = true;
    scene.add(sandMesh);

    // =========================================================================
    // 5. GEOLOGICAL SUBSURFACE CUT-OUT WALLS & ARCHITECTURAL PLINTH BASE
    // =========================================================================
    function buildGeologicalCutoutWalls() {
      const group = new THREE.Group();
      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      function addWallStrip(segs, getPointAtT, normalVec) {
        const baseVertexIndex = positions.length / 3;
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const pt = getPointAtT(t);
          const topY = getBeachHeight(pt.x, pt.z);

          positions.push(pt.x, topY, pt.z);
          normals.push(normalVec.x, normalVec.y, normalVec.z);
          uvs.push(t, 1.0);

          positions.push(pt.x, BASE_Y, pt.z);
          normals.push(normalVec.x, normalVec.y, normalVec.z);
          uvs.push(t, 0.0);
        }

        for (let i = 0; i < segs; i++) {
          const i0 = baseVertexIndex + i * 2;
          const i1 = i0 + 1;
          const i2 = i0 + 2;
          const i3 = i0 + 3;
          indices.push(i0, i1, i2);
          indices.push(i2, i1, i3);
        }
      }

      // Front wall (Z = +12)
      addWallStrip(SEG_X, (t) => ({ x: -HALF_W + t * DIORAMA_W, z: HALF_D }), new THREE.Vector3(0, 0, 1));
      // Back wall (Z = -12)
      addWallStrip(SEG_X, (t) => ({ x: HALF_W - t * DIORAMA_W, z: -HALF_D }), new THREE.Vector3(0, 0, -1));
      // Right wall (X = +15)
      addWallStrip(SEG_Z, (t) => ({ x: HALF_W, z: HALF_D - t * DIORAMA_D }), new THREE.Vector3(1, 0, 0));
      // Left wall (X = -15)
      addWallStrip(SEG_Z, (t) => ({ x: -HALF_W, z: -HALF_D + t * DIORAMA_D }), new THREE.Vector3(-1, 0, 0));

      const wallGeo = new THREE.BufferGeometry();
      wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      wallGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      wallGeo.setIndex(indices);

      const strataMaterial = new THREE.MeshStandardMaterial({
        color: 0xc2a57a,
        roughness: 0.88,
        metalness: 0.02
      });

      strataMaterial.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vWorldPos;
            `
          )
          .replace(
            '#include <worldpos_vertex>',
            `
            #include <worldpos_vertex>
            vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
            `
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `
            #include <common>
            varying vec3 vWorldPos;
            ${GLSL_NOISE_AND_WAVE_COMMON}
            `
          )
          .replace(
            '#include <color_fragment>',
            `
            #include <color_fragment>
            float surfaceY = getSandElevation(vWorldPos.xz);
            float depthBelowSurface = max(0.0, surfaceY - vWorldPos.y);

            // Cross-bedded sedimentary stratification
            float bedWarp = (fbm2D(vec2((vWorldPos.x + vWorldPos.z) * 0.35, vWorldPos.y * 1.15)) - 0.5) * 0.22;
            float d = depthBelowSurface + bedWarp;

            // Fine laminar sediment streaks & dark magnetite heavy-mineral placer bands
            float lamina = sin((vWorldPos.y + bedWarp * 0.65) * 34.0 + fbm2D(vWorldPos.xz * 1.8) * 4.5);
            float heavyMineralBand = smoothstep(0.84, 0.98, lamina) * smoothstep(0.08, 0.35, d) * (1.0 - smoothstep(1.1, 1.85, d));

            float grain = valueNoise2D(vec2((vWorldPos.x + vWorldPos.z) * 75.0, vWorldPos.y * 75.0));
            float coarseGravel = smoothstep(0.82, 0.95, valueNoise2D(vec2((vWorldPos.x - vWorldPos.z) * 24.0, vWorldPos.y * 28.0)));
            float shellSpeck = smoothstep(0.92, 0.99, valueNoise2D(vec2((vWorldPos.x + vWorldPos.z) * 52.0, vWorldPos.y * 58.0)));

            // Granite intrusion on the far left headland cross-section (x < -9.5)
            float graniteIntrusion = smoothstep(-8.8, -13.2, vWorldPos.x) * smoothstep(0.15, 0.85, d);

            vec3 topSand = vec3(0.87, 0.75, 0.56);
            vec3 midSand = vec3(0.67, 0.53, 0.37);
            vec3 shellHash = vec3(0.46, 0.40, 0.34);
            vec3 siltstone = vec3(0.28, 0.26, 0.26);
            vec3 deepBedrock = vec3(0.18, 0.19, 0.21);

            vec3 strataCol = mix(topSand, midSand, smoothstep(0.10, 0.42, d));
            strataCol = mix(strataCol, shellHash, smoothstep(0.75, 1.15, d));
            strataCol = mix(strataCol, siltstone, smoothstep(1.55, 2.25, d));
            strataCol = mix(strataCol, deepBedrock, smoothstep(2.65, 3.45, d));

            // Blend coastal granite bedrock under the left headland
            vec3 graniteRock = vec3(0.36, 0.35, 0.37) + (valueNoise2D(vWorldPos.xy * 18.0) - 0.5) * 0.14;
            strataCol = mix(strataCol, graniteRock, graniteIntrusion * 0.78);

            strataCol += (grain - 0.5) * 0.06;
            strataCol = mix(strataCol, vec3(0.21, 0.18, 0.16), heavyMineralBand * 0.45);
            strataCol = mix(strataCol, vec3(0.56, 0.51, 0.46), coarseGravel * smoothstep(0.5, 1.2, d) * 0.35);
            strataCol = mix(strataCol, vec3(0.94, 0.91, 0.86), shellSpeck * (1.0 - smoothstep(1.2, 2.0, d)) * 0.55);

            // Capillary water-table saturation darkening below sea level (+0.16m wicking)
            float waterTableY = 0.16;
            float belowWaterTable = 1.0 - smoothstep(waterTableY - 0.12, waterTableY + 0.16, vWorldPos.y);
            strataCol *= mix(1.0, 0.68, belowWaterTable * (1.0 - smoothstep(1.6, 2.4, d)));

            // Ambient occlusion at plinth seam
            float baseAO = smoothstep(0.0, 0.32, vWorldPos.y - (${BASE_Y.toFixed(2)}));
            strataCol *= mix(0.60, 1.0, baseAO);

            diffuseColor.rgb = strataCol;
            `
          );
      };

      const wallsMesh = new THREE.Mesh(wallGeo, strataMaterial);
      wallsMesh.receiveShadow = true;
      wallsMesh.castShadow = true;
      group.add(wallsMesh);

      // Sleek Dark Architectural Gallery Plinth Base (Y = -4.60 to -4.95)
      const plinthGeo = new THREE.BoxGeometry(DIORAMA_W + 0.12, 0.35, DIORAMA_D + 0.12);
      const plinthMat = new THREE.MeshStandardMaterial({
        color: 0x141923,
        roughness: 0.42,
        metalness: 0.38
      });
      const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
      plinthMesh.position.set(0, BASE_Y - 0.175, 0);
      plinthMesh.receiveShadow = true;
      group.add(plinthMesh);

      // Subtle beveled titanium inlay trim line around plinth top
      const trimGeo = new THREE.BoxGeometry(DIORAMA_W + 0.15, 0.03, DIORAMA_D + 0.15);
      const trimMat = new THREE.MeshStandardMaterial({
        color: 0x475569,
        roughness: 0.32,
        metalness: 0.72
      });
      const trimMesh = new THREE.Mesh(trimGeo, trimMat);
      trimMesh.position.set(0, BASE_Y - 0.015, 0);
      group.add(trimMesh);

      // Soft studio contact shadow underneath the plinth
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 256;
      shadowCanvas.height = 256;
      const sctx = shadowCanvas.getContext('2d');
      const grad = sctx.createRadialGradient(128, 128, 28, 128, 128, 126);
      grad.addColorStop(0.0, 'rgba(0, 0, 0, 0.68)');
      grad.addColorStop(0.68, 'rgba(0, 0, 0, 0.38)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, 256, 256);

      const contactTex = new THREE.CanvasTexture(shadowCanvas);
      const contactPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(42.0, 34.0),
        new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false })
      );
      contactPlane.rotation.x = -Math.PI / 2;
      contactPlane.position.y = BASE_Y - 0.355;
      group.add(contactPlane);

      return group;
    }

    const cutoutWallsGroup = buildGeologicalCutoutWalls();
    scene.add(cutoutWallsGroup);

    // =========================================================================
    // 6. VOLUMETRIC WATER SURFACE (DEPTH-ATTENUATED REFRACTION + BOAT WAKES)
    // =========================================================================
    const waterTopGeo = new THREE.PlaneGeometry(DIORAMA_W, DIORAMA_D, SEG_X, SEG_Z);
    waterTopGeo.rotateX(-Math.PI / 2);

    const wPos = waterTopGeo.attributes.position;
    const sandHeightAttr = new Float32Array(wPos.count);
    for (let i = 0; i < wPos.count; i++) {
      sandHeightAttr[i] = getBeachHeight(wPos.getX(i), wPos.getZ(i));
    }
    waterTopGeo.setAttribute('aSandY', new THREE.BufferAttribute(sandHeightAttr, 1));

    const waterTopMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: true,
      side: THREE.FrontSide,
      uniforms: {
        uTime: sharedUniforms.uTime,
        uWaveIntensity: sharedUniforms.uWaveIntensity,
        uWaterClarity: sharedUniforms.uWaterClarity,
        uSunDir: sharedUniforms.uSunDir,
        uSunColor: sharedUniforms.uSunColor,
        uRefractionMap: sharedUniforms.uRefractionMap,
        uResolution: sharedUniforms.uResolution,
        uBoats: sharedUniforms.uBoats
      },
      vertexShader: /* glsl */ `
        attribute float aSandY;
        uniform float uTime;
        uniform float uWaveIntensity;

        varying vec3 vWorldPos;
        varying vec2 vBaseXZ;
        varying float vSandY;
        varying float vDepth;
        varying float vSwashVel;
        varying float vCrestFactor;

        ${GLSL_NOISE_AND_WAVE_COMMON}

        void main() {
          vBaseXZ = position.xz;
          vSandY = aSandY;

          WaveState ws = evaluateOceanWave(position.xz, aSandY, uTime, uWaveIntensity);
          vWorldPos = ws.displacedPos;
          vDepth = ws.depth;
          vSwashVel = ws.swashVelocity;
          vCrestFactor = ws.crestFactor;

          gl_Position = projectionMatrix * viewMatrix * vec4(ws.displacedPos, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uWaveIntensity;
        uniform float uWaterClarity;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform sampler2D uRefractionMap;
        uniform vec2 uResolution;
        uniform vec4 uBoats[3];

        varying vec3 vWorldPos;
        varying vec2 vBaseXZ;
        varying float vSandY;
        varying float vDepth;
        varying float vSwashVel;
        varying float vCrestFactor;

        ${GLSL_NOISE_AND_WAVE_COMMON}

        float voronoiFoam(vec2 x) {
          vec2 n = floor(x);
          vec2 f = fract(x);
          float md = 8.0;
          for (int j = -1; j <= 1; j++) {
            for (int i = -1; i <= 1; i++) {
              vec2 g = vec2(float(i), float(j));
              vec2 o = vec2(hash21(n + g), hash21(n + g + vec2(17.3, 41.9)));
              o = 0.5 + 0.42 * sin(uTime * 0.65 + 6.2831 * o);
              vec2 r = g + o - f;
              float d = dot(r, r);
              md = min(md, d);
            }
          }
          return sqrt(md);
        }

        // High-frequency capillary surface ripples + concentric boat hull ripples
        float capillaryHeight(vec2 p, float t) {
          float h = 0.0;
          h += sin(dot(p, vec2(4.4, -9.8)) - t * 3.8) * 0.0032;
          h += sin(dot(p, vec2(-7.1, -8.3)) - t * 4.4) * 0.0024;
          h += (valueNoise2D(p * 3.8 + vec2(0.0, t * 1.4)) - 0.5) * 0.0052;
          h += (valueNoise2D(p * 11.5 - vec2(t * 0.9, t * 2.1)) - 0.5) * 0.0024;

          // Subtle concentric wavelets radiating around the 3 swinging boats
          for (int i = 0; i < 3; i++) {
            vec2 rel = (p - uBoats[i].xy) / vec2(uBoats[i].w * 1.35, uBoats[i].z * 1.15);
            float dist = length(rel);
            float ringEnv = exp(-max(0.0, dist - 0.85) * 1.45) * smoothstep(0.75, 1.05, dist);
            h += sin(dist * 18.0 - t * 4.6 + float(i) * 1.9) * 0.0038 * ringEnv;
          }
          return h;
        }

        void main() {
          if (vDepth <= 0.0006) discard;

          float eps = 0.035;
          vec2 xzC = vBaseXZ;
          float capC = capillaryHeight(vWorldPos.xz, uTime);
          float capX = capillaryHeight(vWorldPos.xz + vec2(eps, 0.0), uTime);
          float capZ = capillaryHeight(vWorldPos.xz + vec2(0.0, eps), uTime);

          float hC = evaluateOceanWave(xzC, vSandY, uTime, uWaveIntensity).waterY + capC;
          float hX = evaluateOceanWave(xzC + vec2(eps, 0.0), getSandElevation(xzC + vec2(eps, 0.0)), uTime, uWaveIntensity).waterY + capX;
          float hZ = evaluateOceanWave(xzC + vec2(0.0, eps), getSandElevation(xzC + vec2(0.0, eps)), uTime, uWaveIntensity).waterY + capZ;

          vec3 N = normalize(vec3(hC - hX, eps, hC - hZ));
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 L = normalize(uSunDir);

          // CRITICAL FIX FOR STATIONARY SEABED:
          // Gentle, strictly depth-attenuated refraction driven by high-frequency capillary ripples
          // so shallow water reveals a razor-sharp, rock-solid stationary seabed with zero rubbery warping!
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec2 capNormalXZ = normalize(vec3(capC - capX, eps, capC - capZ)).xz;
          vec2 refrDir = mix(capNormalXZ, N.xz, 0.28);
          float refractStrength = smoothstep(0.08, 1.5, vDepth) * 0.016;
          vec2 refractUV = clamp(screenUV + refrDir * refractStrength, vec2(0.002), vec2(0.998));
          vec3 refractedSeabed = texture2D(uRefractionMap, refractUV).rgb;

          // Beer-Lambert exponential depth absorption modulated by Water Clarity
          float clarityInv = 1.0 / clamp(uWaterClarity, 0.35, 1.8);
          vec3 sigmaAbsorption = vec3(1.18, 0.32, 0.21) * clarityInv;
          vec3 transmittance = exp(-sigmaAbsorption * max(vDepth, 0.0) * 1.15);

          vec3 shallowTurquoise = vec3(0.07, 0.52, 0.58);
          vec3 deepOceanCerulean = vec3(0.015, 0.18, 0.34);
          vec3 scatterColor = mix(shallowTurquoise, deepOceanCerulean, smoothstep(0.25, 2.35, vDepth));
          vec3 underWaterColor = refractedSeabed * transmittance + scatterColor * (1.0 - transmittance) * (0.48 + 0.52 * max(L.y, 0.15));

          // Translucent emerald-aqua wave-crest subsurface scattering
          float sss = pow(clamp(dot(V, -L + N * 0.45), 0.0, 1.0), 3.0) * vCrestFactor * smoothstep(0.08, 0.65, vDepth);
          underWaterColor += vec3(0.08, 0.58, 0.58) * uSunColor * sss * 0.62;

          // Schlick Fresnel sky reflection
          float NdotV = max(dot(N, V), 0.001);
          float fresnel = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);

          vec3 R = reflect(-V, N);
          float skyGrad = clamp(R.y * 0.5 + 0.5, 0.0, 1.0);
          vec3 horizonSky = mix(vec3(0.68, 0.84, 0.95), vec3(0.96, 0.74, 0.52), 1.0 - smoothstep(0.1, 0.5, L.y));
          vec3 zenithSky = mix(vec3(0.16, 0.42, 0.78), vec3(0.24, 0.34, 0.56), 1.0 - smoothstep(0.1, 0.5, L.y));
          vec3 skyReflection = mix(horizonSky, zenithSky, pow(skyGrad, 0.65));

          // Crisp solar glitter path
          vec3 H = normalize(L + V);
          float NdotH = max(dot(N, H), 0.0);
          float specBroad = pow(NdotH, 130.0) * 0.55;
          float specTight = pow(NdotH, 980.0) * 6.8;
          vec3 sunSpecular = uSunColor * (specBroad + specTight) * smoothstep(0.0, 0.08, L.y);

          vec3 waterCol = mix(underWaterColor, skyReflection, clamp(fresnel * 1.15, 0.0, 0.95)) + sunSpecular;

          // Multi-layered aerated white seafoam (shoreline swash + receding Voronoi lace + wave crests + boat collars)
          float cell1 = voronoiFoam(vWorldPos.xz * 4.4 + vec2(0.0, uTime * 0.34));
          float cell2 = voronoiFoam(vWorldPos.xz * 10.5 - vec2(uTime * 0.2, 0.0));
          float foamWeb = smoothstep(0.32, 0.64, cell1 * 0.65 + cell2 * 0.35);
          float fbmFoam = fbm2D(vWorldPos.xz * 4.6 + vec2(0.0, uTime * 0.42));

          float leadingEdgeLip = (1.0 - smoothstep(0.002, 0.06, vDepth)) * smoothstep(-0.35, 0.35, vSwashVel);
          float swashFoam = leadingEdgeLip * smoothstep(0.22, 0.65, fbmFoam + 0.25);

          float thinSheet = smoothstep(0.001, 0.016, vDepth) * (1.0 - smoothstep(0.035, 0.15, vDepth));
          float recedingLace = thinSheet * foamWeb * smoothstep(0.35, 0.72, fbmFoam);

          float crestFoam = smoothstep(0.66, 1.08, vCrestFactor + (fbmFoam - 0.5) * 0.42) * smoothstep(0.10, 0.45, vDepth);

          // Delicate aerated foam collar hugging the 3 moored boats
          float boatCollar = 0.0;
          for (int i = 0; i < 3; i++) {
            vec2 rel = (vWorldPos.xz - uBoats[i].xy) / vec2(uBoats[i].w * 1.12, uBoats[i].z * 1.06);
            float dHull = length(rel);
            float collarBand = smoothstep(0.82, 0.98, dHull) * (1.0 - smoothstep(0.98, 1.24, dHull));
            boatCollar = max(boatCollar, collarBand * smoothstep(0.28, 0.72, fbmFoam + 0.18) * 0.72);
          }

          float totalFoam = clamp(max(max(swashFoam * 1.15, recedingLace * 0.85), max(crestFoam * 0.92, boatCollar)), 0.0, 1.0);
          vec3 foamAlbedo = mix(vec3(0.86, 0.93, 0.96), vec3(1.0, 0.99, 0.98), fbmFoam) * (0.55 + 0.55 * max(L.y, 0.2)) * uSunColor;
          waterCol = mix(waterCol, foamAlbedo, totalFoam);

          float edgeAlpha = smoothstep(0.0006, 0.009, vDepth);
          gl_FragColor = vec4(waterCol, edgeAlpha);
        }
      `
    });

    const waterTopMesh = new THREE.Mesh(waterTopGeo, waterTopMaterial);
    waterTopMesh.renderOrder = 2;
    scene.add(waterTopMesh);

    // =========================================================================
    // 7. FOUR DYNAMIC VERTICAL VOLUMETRIC WATER SIDE-WALL SKIRTS
    // =========================================================================
    function buildVolumetricWaterWalls() {
      const group = new THREE.Group();
      const positions = [];
      const normals = [];
      const uvs = [];
      const sandYs = [];
      const indices = [];

      function addWaterWall(segs, getPointAtT, normalVec) {
        const baseIdx = positions.length / 3;
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const pt = getPointAtT(t);
          const sY = getBeachHeight(pt.x, pt.z);

          positions.push(pt.x, sY, pt.z);
          normals.push(normalVec.x, normalVec.y, normalVec.z);
          uvs.push(t, 1.0);
          sandYs.push(sY);

          positions.push(pt.x, sY, pt.z);
          normals.push(normalVec.x, normalVec.y, normalVec.z);
          uvs.push(t, 0.0);
          sandYs.push(sY);
        }

        for (let i = 0; i < segs; i++) {
          const i0 = baseIdx + i * 2;
          const i1 = i0 + 1;
          const i2 = i0 + 2;
          const i3 = i0 + 3;
          indices.push(i0, i1, i2);
          indices.push(i2, i1, i3);
        }
      }

      addWaterWall(SEG_X, (t) => ({ x: -HALF_W + t * DIORAMA_W, z: HALF_D }), new THREE.Vector3(0, 0, 1));
      addWaterWall(SEG_X, (t) => ({ x: HALF_W - t * DIORAMA_W, z: -HALF_D }), new THREE.Vector3(0, 0, -1));
      addWaterWall(SEG_Z, (t) => ({ x: HALF_W, z: HALF_D - t * DIORAMA_D }), new THREE.Vector3(1, 0, 0));
      addWaterWall(SEG_Z, (t) => ({ x: -HALF_W, z: -HALF_D + t * DIORAMA_D }), new THREE.Vector3(-1, 0, 0));

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('aSandY', new THREE.Float32BufferAttribute(sandYs, 1));
      geo.setIndex(indices);

      const wallMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uTime: sharedUniforms.uTime,
          uWaveIntensity: sharedUniforms.uWaveIntensity,
          uWaterClarity: sharedUniforms.uWaterClarity,
          uSunDir: sharedUniforms.uSunDir,
          uSunColor: sharedUniforms.uSunColor,
          uRefractionMap: sharedUniforms.uRefractionMap,
          uResolution: sharedUniforms.uResolution
        },
        vertexShader: /* glsl */ `
          attribute float aSandY;
          uniform float uTime;
          uniform float uWaveIntensity;

          varying vec2 vWallUV;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vColThickness;

          ${GLSL_NOISE_AND_WAVE_COMMON}

          void main() {
            vWallUV = uv;
            WaveState ws = evaluateOceanWave(position.xz, aSandY, uTime, uWaveIntensity);
            float topY = max(ws.waterY, aSandY);
            vColThickness = topY - aSandY;

            vec3 pos = position;
            pos.y = mix(aSandY, topY, uv.y);

            vec4 worldPos = modelMatrix * vec4(pos, 1.0);
            vWorldPos = worldPos.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform float uWaterClarity;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform sampler2D uRefractionMap;
          uniform vec2 uResolution;

          varying vec2 vWallUV;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vColThickness;

          ${GLSL_NOISE_AND_WAVE_COMMON}

          void main() {
            if (vColThickness <= 0.0015) discard;

            vec2 screenUV = gl_FragCoord.xy / uResolution;
            vec2 wobble = vec2(
              sin(vWorldPos.y * 10.0 + uTime * 2.0),
              cos((vWorldPos.x + vWorldPos.z) * 8.0 - uTime * 1.6)
            ) * 0.0035;
            vec2 refrUV = clamp(screenUV + wobble, vec2(0.002), vec2(0.998));
            vec3 bgRefract = texture2D(uRefractionMap, refrUV).rgb;

            float depthFromSurface = (1.0 - vWallUV.y) * vColThickness;
            float clarityInv = 1.0 / clamp(uWaterClarity, 0.35, 1.8);

            vec3 transmittance = exp(-vec3(1.15, 0.32, 0.21) * clarityInv * (0.28 + depthFromSurface * 1.25));
            vec3 aquaTop = vec3(0.14, 0.70, 0.76);
            vec3 tealDeep = vec3(0.02, 0.22, 0.38);
            vec3 volumeTint = mix(aquaTop, tealDeep, smoothstep(0.0, 2.4, depthFromSurface));

            vec3 col = bgRefract * transmittance + volumeTint * (1.0 - transmittance * 0.65) * (0.55 + 0.45 * max(uSunDir.y, 0.2));

            vec3 V = normalize(cameraPosition - vWorldPos);
            float fresnel = 0.04 + 0.45 * pow(1.0 - abs(dot(normalize(vWorldNormal), V)), 4.0);
            col += vec3(0.45, 0.78, 0.92) * fresnel * 0.45;

            // Sparkling meniscus rim where the wave surface meets the cut-out wall
            float meniscus = smoothstep(0.982, 0.999, vWallUV.y) * smoothstep(0.004, 0.025, vColThickness);
            col += (vec3(0.75, 0.96, 1.0) + uSunColor * 0.55) * meniscus * 0.85;

            gl_FragColor = vec4(col, 0.94);
          }
        `
      });

      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.renderOrder = 3;
      group.add(mesh);
      return group;
    }

    const waterWallsGroup = buildVolumetricWaterWalls();
    scene.add(waterWallsGroup);

    // =========================================================================
    // 8. PROCEDURAL MARINE TEXTURES & THREE ARTISANAL 3D WOODEN BOATS
    // =========================================================================
    function createWoodPlankTexture(baseHex, darkHex, plankRows = 10, caulk = true) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const baseCol = new THREE.Color(baseHex);
      const darkCol = new THREE.Color(darkHex);

      ctx.fillStyle = `#${baseCol.getHexString()}`;
      ctx.fillRect(0, 0, 512, 512);

      const rowH = 512 / plankRows;
      for (let r = 0; r < plankRows; r++) {
        const y0 = r * rowH;
        const rowTone = (hash21(r, 3.1) - 0.5) * 0.14;
        for (let y = Math.floor(y0); y < Math.ceil(y0 + rowH); y++) {
          const grain = fbm2D(y * 0.35 + r * 11.0, r * 2.7) - 0.5;
          const fine = valueNoise2D(y * 1.4, r * 5.3) - 0.5;
          const mixAmt = THREE.MathUtils.clamp(0.35 + grain * 0.65 + fine * 0.25 + rowTone, 0.0, 1.0);
          const c = baseCol.clone().lerp(darkCol, mixAmt);
          ctx.fillStyle = `rgb(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)})`;
          ctx.fillRect(0, y, 512, 1);
        }
        if (caulk) {
          ctx.fillStyle = 'rgba(18, 14, 12, 0.72)';
          ctx.fillRect(0, Math.floor(y0), 512, 2);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createSailCanvasTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f6efe0';
      ctx.fillRect(0, 0, 512, 512);

      // Subtle woven sailcloth threads & horizontal panel seams
      for (let y = 0; y < 512; y += 2) {
        const shade = 242 + Math.floor((valueNoise2D(y * 0.2, 4.1) - 0.5) * 10);
        ctx.fillStyle = `rgb(${shade}, ${shade - 7}, ${shade - 20})`;
        ctx.fillRect(0, y, 512, 1);
      }
      ctx.strokeStyle = 'rgba(165, 148, 122, 0.55)';
      ctx.lineWidth = 2;
      for (let p = 1; p < 8; p++) {
        const y = (p / 8) * 512;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();
      }
      // Classic marine navy accent stripe near bottom
      ctx.fillStyle = 'rgba(28, 56, 92, 0.78)';
      ctx.fillRect(0, 420, 512, 14);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function createBuoyStripeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#c83228';
      ctx.fillRect(0, 68, 256, 120);
      for (let i = 0; i < 600; i++) {
        ctx.fillStyle = 'rgba(40, 32, 24, 0.14)';
        ctx.fillRect(hash21(i, 1.2) * 256, hash21(i, 4.8) * 256, 2, 2);
      }
      return new THREE.CanvasTexture(canvas);
    }

    const teakDeckTex = createWoodPlankTexture('#b67a44', '#6d411e', 16, true);
    const mahoganyTex = createWoodPlankTexture('#7d351c', '#43180a', 12, true);
    const oakTrimTex = createWoodPlankTexture('#c89658', '#8a5d2b', 8, false);
    const sailClothTex = createSailCanvasTexture();
    const buoyTex = createBuoyStripeTexture();

    const brassMat = new THREE.MeshStandardMaterial({
      color: 0xd9a84e,
      roughness: 0.24,
      metalness: 0.88
    });

    const ropeMat = new THREE.MeshStandardMaterial({
      color: 0xc2a878,
      roughness: 0.86,
      metalness: 0.0
    });

    /**
     * Parametric Lofted Boat Hull Builder
     * Generates smooth curved outer shell + optional lapstrake clinker steps + vertex colors
     * Bow is at -Z (-halfL), Stern is at +Z (+halfL).
     */
    function createLoftedHullGeometry(opts) {
      const {
        length,
        beam,
        depth,
        sheerBow = 0.22,
        sheerStern = 0.10,
        transomWidthRatio = 0.42,
        deadrise = 0.28,
        lapstrakeSteps = 0,
        threeTone = false,
        topColor = new THREE.Color(0x162b49),
        stripeColor = new THREE.Color(0xf8fafc),
        bottomColor = new THREE.Color(0x8c2d23)
      } = opts;

      const uSegs = 44; // Lengthwise stations (0 = bow, 1 = stern)
      const vSegs = 26; // Cross-section girth (-1 = port sheer, 0 = keel, +1 = starboard sheer)

      const positions = [];
      const uvs = [];
      const colors = [];
      const indices = [];

      const halfL = length * 0.5;
      const halfB = beam * 0.5;

      for (let iu = 0; iu <= uSegs; iu++) {
        const u = iu / uSegs;
        const z = -halfL + u * length;

        const bowTaper = Math.pow(Math.sin(Math.min(1.0, u * 1.48) * (Math.PI * 0.5)), 0.78);
        const sternTaper = 1.0 - (1.0 - transomWidthRatio) * Math.pow(Math.max(0.0, (u - 0.52) / 0.48), 1.85);
        const localHalfBeam = halfB * bowTaper * sternTaper;

        const sheerY = 0.24
          + sheerBow * Math.pow(Math.max(0.0, 1.0 - u * 2.1), 2.1)
          + sheerStern * Math.pow(Math.max(0.0, (u - 0.55) / 0.45), 2.0);

        const forefootLift = Math.pow(Math.max(0.0, 1.0 - u * 4.2), 2.4) * (depth * 0.72);
        const sternLift = Math.pow(Math.max(0.0, (u - 0.78) / 0.22), 2.0) * (depth * 0.35);
        const keelY = -depth + forefootLift + sternLift;

        for (let iv = 0; iv <= vSegs; iv++) {
          const s = (iv / vSegs) * 2.0 - 1.0;
          const absS = Math.abs(s);

          let xNorm = Math.pow(absS, 0.62);
          let yNorm = Math.pow(absS, 1.65 + deadrise);

          if (lapstrakeSteps > 0) {
            const strakePhase = absS * lapstrakeSteps;
            const stepFrac = strakePhase - Math.floor(strakePhase);
            xNorm += stepFrac * 0.032 * smoothstepJS(0.12, 0.95, absS);
          }

          const x = Math.sign(s) * localHalfBeam * xNorm;
          const y = THREE.MathUtils.lerp(keelY, sheerY, yNorm);

          positions.push(x, y, z);
          uvs.push(u * 4.0, absS * 2.0);

          if (threeTone) {
            let c;
            if (y > 0.045) {
              c = topColor;
            } else if (y > -0.015) {
              c = stripeColor;
            } else {
              c = bottomColor;
            }
            colors.push(c.r, c.g, c.b);
          } else {
            const c = topColor.clone().lerp(bottomColor, 1.0 - smoothstepJS(-0.08, 0.14, y));
            colors.push(c.r, c.g, c.b);
          }
        }
      }

      const stride = vSegs + 1;
      for (let iu = 0; iu < uSegs; iu++) {
        for (let iv = 0; iv < vSegs; iv++) {
          const a = iu * stride + iv;
          const b = (iu + 1) * stride + iv;
          const c = (iu + 1) * stride + (iv + 1);
          const d = iu * stride + (iv + 1);
          indices.push(a, d, b);
          indices.push(b, d, c);
        }
      }

      // Close stern transom panel (at u = 1.0)
      const sternStart = uSegs * stride;
      const transomCenterIdx = positions.length / 3;
      const sternSheerY = 0.24 + sheerStern;
      const sternKeelY = -depth * 0.65;
      positions.push(0, (sternSheerY + sternKeelY) * 0.5, halfL);
      uvs.push(0.5, 0.5);
      colors.push(topColor.r, topColor.g, topColor.b);

      for (let iv = 0; iv < vSegs; iv++) {
        const i0 = sternStart + iv;
        const i1 = sternStart + iv + 1;
        indices.push(i0, i1, transomCenterIdx);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createGunwaleRails(length, beam, sheerBow, sheerStern, transomWidthRatio, railMat) {
      const group = new THREE.Group();
      const halfL = length * 0.5;
      const halfB = beam * 0.5;

      [-1, 1].forEach((side) => {
        const pts = [];
        for (let i = 0; i <= 24; i++) {
          const u = i / 24;
          const z = -halfL + u * length;
          const bowTaper = Math.pow(Math.sin(Math.min(1.0, u * 1.48) * (Math.PI * 0.5)), 0.78);
          const sternTaper = 1.0 - (1.0 - transomWidthRatio) * Math.pow(Math.max(0.0, (u - 0.52) / 0.48), 1.85);
          const x = side * halfB * bowTaper * sternTaper;
          const y = 0.245
            + sheerBow * Math.pow(Math.max(0.0, 1.0 - u * 2.1), 2.1)
            + sheerStern * Math.pow(Math.max(0.0, (u - 0.55) / 0.45), 2.0);
          pts.push(new THREE.Vector3(x, y, z));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const railGeo = new THREE.TubeGeometry(curve, 36, 0.032, 8, false);
        const railMesh = new THREE.Mesh(railGeo, railMat);
        railMesh.castShadow = true;
        group.add(railMesh);
      });

      return group;
    }

    // -------------------------------------------------------------------------
    // BOAT 1: CLASSIC WOODEN COASTAL SLOOP (~4.65m long, moored at X=3.2, Z=6.2)
    // -------------------------------------------------------------------------
    function buildCoastalSloop() {
      const boat = new THREE.Group();

      // 1. Three-Tone Lofted Hull (Navy Topsides, White Boot-Stripe, Copper Anti-Fouling)
      const hullGeo = createLoftedHullGeometry({
        length: 4.65,
        beam: 1.44,
        depth: 0.44,
        sheerBow: 0.24,
        sheerStern: 0.11,
        transomWidthRatio: 0.44,
        deadrise: 0.34,
        threeTone: true,
        topColor: new THREE.Color(0x132744),
        stripeColor: new THREE.Color(0xf8fafc),
        bottomColor: new THREE.Color(0x8e2e22)
      });
      const hullMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.24,
        metalness: 0.08,
        side: THREE.DoubleSide
      });
      const hullMesh = new THREE.Mesh(hullGeo, hullMat);
      hullMesh.castShadow = true;
      hullMesh.receiveShadow = true;
      boat.add(hullMesh);

      // 2. Submerged Hydrodynamic Fin Keel & Spade Rudder (visible through clear water)
      const keelShape = new THREE.Shape();
      keelShape.moveTo(-0.55, 0.0);
      keelShape.lineTo(0.45, 0.0);
      keelShape.lineTo(0.28, -0.58);
      keelShape.lineTo(-0.32, -0.58);
      keelShape.closePath();

      const keelGeo = new THREE.ExtrudeGeometry(keelShape, {
        depth: 0.08,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.02,
        bevelSegments: 3
      });
      keelGeo.rotateY(Math.PI / 2);
      keelGeo.translate(-0.04, -0.38, 0.15);
      const keelMat = new THREE.MeshStandardMaterial({
        color: 0x3b4856,
        roughness: 0.38,
        metalness: 0.65
      });
      const keelMesh = new THREE.Mesh(keelGeo, keelMat);
      boat.add(keelMesh);

      const bulbGeo = new THREE.SphereGeometry(0.11, 18, 12);
      bulbGeo.scale(0.85, 0.72, 4.4);
      const bulbMesh = new THREE.Mesh(bulbGeo, keelMat);
      bulbMesh.position.set(0, -0.96, 0.15);
      boat.add(bulbMesh);

      const rudderGeo = new THREE.BoxGeometry(0.05, 0.56, 0.34);
      const rudderMesh = new THREE.Mesh(rudderGeo, keelMat);
      rudderMesh.position.set(0, -0.46, 2.02);
      rudderMesh.rotation.x = 0.12;
      boat.add(rudderMesh);

      // 3. Varnished Teak Planked Deck & Mahogany Gunwales
      const deckGeo = new THREE.PlaneGeometry(1.38, 4.55, 24, 36);
      deckGeo.rotateX(-Math.PI / 2);
      const dPos = deckGeo.attributes.position;
      for (let i = 0; i < dPos.count; i++) {
        const z = dPos.getZ(i);
        const u = THREE.MathUtils.clamp((z + 2.325) / 4.65, 0.0, 1.0);
        const bowTaper = Math.pow(Math.sin(Math.min(1.0, u * 1.48) * (Math.PI * 0.5)), 0.78);
        const sternTaper = 1.0 - 0.56 * Math.pow(Math.max(0.0, (u - 0.52) / 0.48), 1.85);
        const halfW = 0.69 * bowTaper * sternTaper;
        const xNorm = dPos.getX(i) / 0.69;
        const x = xNorm * halfW;
        const camber = (1.0 - xNorm * xNorm) * 0.045;
        const sheerY = 0.23
          + 0.24 * Math.pow(Math.max(0.0, 1.0 - u * 2.1), 2.1)
          + 0.11 * Math.pow(Math.max(0.0, (u - 0.55) / 0.45), 2.0);
        dPos.setXYZ(i, x, sheerY + camber, z);
      }
      deckGeo.computeVertexNormals();

      const teakMat = new THREE.MeshStandardMaterial({
        map: teakDeckTex,
        bumpMap: teakDeckTex,
        bumpScale: 0.008,
        roughness: 0.36,
        metalness: 0.04
      });
      const deckMesh = new THREE.Mesh(deckGeo, teakMat);
      deckMesh.castShadow = true;
      deckMesh.receiveShadow = true;
      boat.add(deckMesh);

      const mahoganyMat = new THREE.MeshStandardMaterial({
        map: mahoganyTex,
        roughness: 0.22,
        metalness: 0.06
      });
      boat.add(createGunwaleRails(4.65, 1.44, 0.24, 0.11, 0.44, mahoganyMat));

      // 4. Mahogany Cabin Trunk with 4 Brass Portholes & Cockpit
      const cabinGeo = new THREE.BoxGeometry(0.84, 0.34, 1.52, 12, 4, 16);
      const cPos = cabinGeo.attributes.position;
      for (let i = 0; i < cPos.count; i++) {
        const vx = cPos.getX(i);
        const vy = cPos.getY(i);
        const vz = cPos.getZ(i);
        const zFrac = (vz + 0.76) / 1.52;
        const widthScale = 0.74 + 0.26 * zFrac;
        const roofArch = vy > 0 ? (1.0 - Math.pow(vx / 0.42, 2.0)) * 0.065 - (1.0 - zFrac) * 0.05 : 0.0;
        cPos.setXYZ(i, vx * widthScale, vy + roofArch, vz);
      }
      cabinGeo.computeVertexNormals();
      const cabinMesh = new THREE.Mesh(cabinGeo, mahoganyMat);
      cabinMesh.position.set(0, 0.38, -0.35);
      cabinMesh.castShadow = true;
      cabinMesh.receiveShadow = true;
      boat.add(cabinMesh);

      const portGlassMat = new THREE.MeshStandardMaterial({
        color: 0x0f293a,
        roughness: 0.08,
        metalness: 0.2
      });
      [-1, 1].forEach((side) => {
        [-0.65, -0.10].forEach((pz) => {
          const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.014, 10, 20), brassMat);
          bezel.rotation.y = Math.PI / 2;
          bezel.position.set(side * 0.385, 0.39, pz);
          boat.add(bezel);

          const glass = new THREE.Mesh(new THREE.CircleGeometry(0.06, 18), portGlassMat);
          glass.rotation.y = side * (Math.PI / 2);
          glass.position.set(side * 0.387, 0.39, pz);
          boat.add(glass);
        });
      });

      const cockpitWell = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.14, 1.35), teakMat);
      cockpitWell.position.set(0, 0.27, 1.18);
      cockpitWell.receiveShadow = true;
      boat.add(cockpitWell);

      const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.42, 14), mahoganyMat);
      pedestal.position.set(0, 0.46, 1.48);
      pedestal.castShadow = true;
      boat.add(pedestal);

      const binnacle = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 12), brassMat);
      binnacle.position.set(0, 0.68, 1.48);
      boat.add(binnacle);

      // 8-Spoke Helm Wheel
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(0, 0.56, 1.56);
      wheelGroup.rotation.x = -0.18;
      const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.018, 10, 28), mahoganyMat);
      wheelGroup.add(wheelRim);
      const brassRim = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.008, 8, 28), brassMat);
      brassRim.position.z = 0.012;
      wheelGroup.add(brassRim);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.05, 14), brassMat);
      hub.rotation.x = Math.PI / 2;
      wheelGroup.add(hub);
      for (let s = 0; s < 8; s++) {
        const ang = (s / 8) * Math.PI * 2;
        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.011, 0.48, 8), mahoganyMat);
        spoke.rotation.z = ang;
        wheelGroup.add(spoke);
      }
      boat.add(wheelGroup);

      // 5. Tapered Wooden Mast, Boom, Standing Rigging & Billowing Canvas Sails
      const mastHeight = 5.35;
      const mastGeo = new THREE.CylinderGeometry(0.032, 0.068, mastHeight, 16);
      const mastMat = new THREE.MeshStandardMaterial({
        map: oakTrimTex,
        roughness: 0.34,
        metalness: 0.04
      });
      const mastMesh = new THREE.Mesh(mastGeo, mastMat);
      mastMesh.position.set(0, 0.48 + mastHeight * 0.5, -0.78);
      mastMesh.castShadow = true;
      boat.add(mastMesh);

      const mastTop = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), brassMat);
      mastTop.position.set(0, 0.48 + mastHeight + 0.03, -0.78);
      boat.add(mastTop);

      const spreader = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.92, 8), mastMat);
      spreader.rotation.z = Math.PI / 2;
      spreader.position.set(0, 3.65, -0.78);
      boat.add(spreader);

      const boomRig = new THREE.Group();
      boomRig.position.set(0, 1.15, -0.74);
      boomRig.rotation.y = 0.22;

      const boomMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.044, 2.55, 12), mastMat);
      boomMesh.rotation.x = Math.PI / 2;
      boomMesh.position.set(0, 0, 1.26);
      boomMesh.castShadow = true;
      boomRig.add(boomMesh);

      // Curved triangular woven canvas mainsail
      const mainSailGeo = new THREE.PlaneGeometry(2.42, 4.45, 18, 26);
      const msPos = mainSailGeo.attributes.position;
      const msBaseX = new Float32Array(msPos.count);
      const msUVu = new Float32Array(msPos.count);
      const msUVv = new Float32Array(msPos.count);

      for (let i = 0; i < msPos.count; i++) {
        const uFoot = (msPos.getX(i) + 1.21) / 2.42;
        const vHeight = (msPos.getY(i) + 2.225) / 4.45;
        const maxFootAtV = (1.0 - vHeight) * 2.42 + Math.sin(vHeight * Math.PI) * 0.24;
        const zLocal = uFoot * maxFootAtV + 0.04;
        const yLocal = vHeight * 4.48 + 0.05;
        const chordFrac = maxFootAtV > 0.01 ? (uFoot * maxFootAtV) / maxFootAtV : 0.0;
        const camber = Math.sin(chordFrac * Math.PI) * Math.sin(vHeight * Math.PI * 0.92 + 0.15) * 0.34;

        msPos.setXYZ(i, camber, yLocal, zLocal);
        msBaseX[i] = camber;
        msUVu[i] = chordFrac;
        msUVv[i] = vHeight;
      }
      mainSailGeo.computeVertexNormals();

      const sailMat = new THREE.MeshStandardMaterial({
        map: sailClothTex,
        roughness: 0.78,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
      const mainSailMesh = new THREE.Mesh(mainSailGeo, sailMat);
      mainSailMesh.castShadow = true;
      mainSailMesh.receiveShadow = true;
      boomRig.add(mainSailMesh);
      boat.add(boomRig);

      // Headsail / Jib forward of the mast
      const jibGeo = new THREE.PlaneGeometry(1.38, 3.85, 14, 20);
      const jbPos = jibGeo.attributes.position;
      const jbBaseX = new Float32Array(jbPos.count);
      const jbUVu = new Float32Array(jbPos.count);
      const jbUVv = new Float32Array(jbPos.count);

      for (let i = 0; i < jbPos.count; i++) {
        const u = (jbPos.getX(i) + 0.69) / 1.38;
        const v = (jbPos.getY(i) + 1.925) / 3.85;
        const footLen = (1.0 - v) * 1.42;
        const zStay = THREE.MathUtils.lerp(-2.22, -0.82, v);
        const zLocal = zStay + u * footLen;
        const yLocal = 0.56 + v * 4.15;
        const belly = Math.sin(u * Math.PI) * Math.sin(v * Math.PI * 0.9 + 0.1) * 0.22;
        jbPos.setXYZ(i, belly + u * 0.14, yLocal, zLocal);
        jbBaseX[i] = belly + u * 0.14;
        jbUVu[i] = u;
        jbUVv[i] = v;
      }
      jibGeo.computeVertexNormals();
      const jibMesh = new THREE.Mesh(jibGeo, sailMat);
      jibMesh.castShadow = true;
      boat.add(jibMesh);

      // Standing Rigging Wire Stays
      const stayMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.3, metalness: 0.85 });
      function addStay(p1, p2) {
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const len = dir.length();
        const stay = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, len, 6), stayMat);
        stay.position.copy(p1).addScaledVector(dir, 0.5);
        stay.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        boat.add(stay);
      }
      const mastHeadPt = new THREE.Vector3(0, 5.65, -0.78);
      addStay(mastHeadPt, new THREE.Vector3(0, 0.48, -2.26));
      addStay(mastHeadPt, new THREE.Vector3(0, 0.36, 2.28));
      addStay(mastHeadPt, new THREE.Vector3(-0.68, 0.28, -0.55));
      addStay(mastHeadPt, new THREE.Vector3(0.68, 0.28, -0.55));

      // 6. Glowing Brass Storm Lantern, Coiled Deck Rope & Bow Anchor Chain
      const lanternGroup = new THREE.Group();
      lanternGroup.position.set(0.14, 1.02, 0.45);
      const lCap = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.06, 12), brassMat);
      lCap.position.y = 0.08;
      lanternGroup.add(lCap);
      const lBase = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.04, 12), brassMat);
      lBase.position.y = -0.07;
      lanternGroup.add(lBase);
      const lGlass = new THREE.Mesh(
        new THREE.CylinderGeometry(0.046, 0.042, 0.12, 12),
        new THREE.MeshStandardMaterial({
          color: 0xffd27d,
          emissive: 0xff9d2e,
          emissiveIntensity: 1.65,
          roughness: 0.15
        })
      );
      lanternGroup.add(lGlass);
      boat.add(lanternGroup);

      const coilGroup = new THREE.Group();
      coilGroup.position.set(-0.24, 0.34, -1.42);
      coilGroup.rotation.x = -0.08;
      for (let c = 0; c < 5; c++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.04 + c * 0.018, 0.009, 7, 18), ropeMat);
        ring.rotation.x = Math.PI / 2;
        coilGroup.add(ring);
      }
      boat.add(coilGroup);

      // Bow anchor chain descending into the water toward the seabed
      const chainPts = [
        new THREE.Vector3(0.05, 0.47, -2.26),
        new THREE.Vector3(0.12, -0.35, -2.58),
        new THREE.Vector3(0.24, -1.45, -2.95),
        new THREE.Vector3(0.38, -2.35, -3.25)
      ];
      const chainCurve = new THREE.CatmullRomCurve3(chainPts);
      const chainMesh = new THREE.Mesh(
        new THREE.TubeGeometry(chainCurve, 20, 0.013, 6, false),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45, metalness: 0.85 })
      );
      boat.add(chainMesh);

      boat.userData.sailAnim = {
        boomRig,
        mainSailGeo,
        msBaseX,
        msUVu,
        msUVv,
        jibGeo,
        jbBaseX,
        jbUVu,
        jbUVv
      };

      return boat;
    }

    // -------------------------------------------------------------------------
    // BOAT 2: TRADITIONAL LAPSTRAKE WOODEN FISHING SKIFF (~3.4m, at X=-4.2, Z=4.6)
    // -------------------------------------------------------------------------
    function buildFishingSkiff() {
      const skiff = new THREE.Group();

      const hullGeo = createLoftedHullGeometry({
        length: 3.40,
        beam: 1.16,
        depth: 0.34,
        sheerBow: 0.21,
        sheerStern: 0.12,
        transomWidthRatio: 0.48,
        deadrise: 0.22,
        lapstrakeSteps: 7,
        threeTone: false,
        topColor: new THREE.Color(0x3b6e64),
        bottomColor: new THREE.Color(0xefe6d2)
      });
      const hullMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.34,
        metalness: 0.04,
        side: THREE.DoubleSide
      });
      const hullMesh = new THREE.Mesh(hullGeo, hullMat);
      hullMesh.castShadow = true;
      hullMesh.receiveShadow = true;
      skiff.add(hullMesh);

      const oakMat = new THREE.MeshStandardMaterial({
        map: oakTrimTex,
        roughness: 0.32,
        metalness: 0.04
      });
      skiff.add(createGunwaleRails(3.40, 1.16, 0.21, 0.12, 0.48, oakMat));

      for (let b = -2; b <= 2; b++) {
        const plank = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.022, 2.25), oakMat);
        plank.position.set(b * 0.11, -0.08, 0.12);
        plank.receiveShadow = true;
        skiff.add(plank);
      }

      const thwarts = [
        { z: -0.95, w: 0.72, y: 0.22 },
        { z:  0.08, w: 1.04, y: 0.19 },
        { z:  1.15, w: 0.84, y: 0.21 }
      ];
      thwarts.forEach((tw) => {

    function updateCatenaryRope(geometry, pStart, pEnd, sagAmount) {
      const pts = [];
      const steps = 16;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = new THREE.Vector3().lerpVectors(pStart, pEnd, t);
        p.y -= Math.sin(t * Math.PI) * sagAmount;
        pts.push(p);
      }
      geometry.setFromPoints(pts);
    }
